  - kind: fluent-but-wrong
    text: |
      So "works after a reload" is the signature of a service worker serving a cached response, and
      that's where I'd go straight away. The worker intercepts the fetch, sees the profile request
      in its cache, and returns the old payload without hitting the network. The fix is to
      unregister the service worker for authenticated routes, or drop the cache-first strategy
      entirely — you can't reliably invalidate it from the page. Second thing, the "only sometimes"
      points at a race: the refetch is firing before the write has committed, so it reads the old
      row. I'd put a short delay, three, four hundred milliseconds, before the refetch, which lets
      the write land first. And I'd add cache no-store to the save request itself so the PUT isn't
      served from cache — that's the one people always forget with mutations.
