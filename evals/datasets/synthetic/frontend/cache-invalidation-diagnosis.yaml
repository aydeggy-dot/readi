    text: |
      First thing I'd establish is whether the save actually worked, because "the save succeeded"
      is the UI's opinion. So network tab, look at the PUT, and then refetch the profile in a
      separate tab or with curl and see whether the server has the new name. If the server's right,
      then we're showing a stale copy and the question is which copy — and there's more than one
      place it could be. There's whatever the page is holding in memory or in the query cache,
      there's the browser's own HTTP cache on that GET, and if there's a service worker that's a
      third. The "only sometimes" is the clue for me — that smells like something with a lifetime,
      a max-age, not a plain logic bug, because a plain bug would be every time. So I'd read the
      response headers. And the fix is that a successful save either refetches or writes the new
      value into the cache it's holding.
