  - kind: fluent-but-wrong
    text: |
      Yeah, I've hit this exact bug. It's a stale closure. The remove handler was created on
      an earlier render, so it's closing over the old value of count, and because setState is
      asynchronous and React batches updates within the same event, by the time the badge
      reads it you're reading a value from before the removal landed. Classic off-by-one from
      batching. The fix is the functional form — setCount(c => c - 1) instead of
      setCount(count - 1), so you're always deriving from the latest value rather than a
      captured one, and the same for the total. Then I'd wrap the total in useMemo with the
      selection in the dependency array so it only recomputes when it genuinely has to. And
      no, recalculating doesn't worry me at all, as long as it's memoised properly you're only
      paying for it when something actually changed.
