      I think that sounds like a re-render problem. Like the badge component didn't re-render
      when the item was removed, so it's still showing the old number. What I'd probably do is
      add a useEffect that watches the items array, and inside it set the count again, so any
      time the list changes the count gets refreshed. Or if that still doesn't work you can
      change the key on the component to force it to remount, that usually clears it. And on
      the recalculating — yeah, that would worry me a bit, I'd wrap things in useMemo just to
      be safe, because you don't really want that running on every single render.
