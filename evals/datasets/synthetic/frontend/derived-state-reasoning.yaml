      So what I'd expect to find is three separate pieces of state — the selection, and a
      count, and a total — and every place that changes the selection has to remember to
      update the other two. And somewhere, probably in the remove handler, one of them got
      missed. So the badge isn't broken, it's telling you exactly what it was told, it was
      just told the wrong thing. What I'd actually store is only the selection, like a set of
