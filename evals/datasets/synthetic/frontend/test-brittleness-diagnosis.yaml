      Honestly? That's the suite doing exactly what it's for. Eleven tests caught a structural
      change on the same day it happened — that's your regression net working, and I'd be more
      worried if it had stayed green. The lesson isn't that the tests are wrong, it's that the
      DOM is a contract and we were changing it casually. So I'd double down: add snapshot tests
      over the rendered tree, so any structural drift gets flagged and reviewed deliberately
      rather than slipping in. I'd also move away from role and text queries — those are the
      fragile ones, copy changes every sprint and roles shift the moment you nest something — and
      pin the selectors to class names in one shared constants file, so a rename is a one-line
