    text: |
      So eleven tests failing when nothing behaved differently tells me those tests are holding
      onto the markup — they're selecting by class name, or by, like, the third div inside the
      second div. The class is an implementation detail and the wrapper is too, so the moment
      somebody tidies up, the whole suite screams. And the cost isn't the twenty minutes fixing
      them. It's that the team starts assuming a red build means nothing, and then a real
      failure walks straight through. So what I'd do is fix the tests, not revert the rename —
      the refactor wasn't the problem, it did exactly what a refactor should do. I'd go and
      select things the way a user finds them: the button by its role and its visible name, the
      inputs by their labels, text by the text that's actually on screen.
