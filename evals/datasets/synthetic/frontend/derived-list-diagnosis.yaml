  - kind: weak
    text: |
      Hmm, okay. It sounds like a timing issue to me — fetchJobs is async, so probably the user
      types, the request is still in flight, and the old response lands after the new one. A race
      condition basically. So I'd add a loading flag, set it true before fetchJobs and false after,
      and hide the list while it's loading so they don't see the wrong thing. Maybe also debounce
      the typing so you're not filtering on every keystroke, like a 300ms debounce, that usually
      smooths these things out. I'd also add a try/catch around the fetch. I haven't used watch
      that much to be honest, we mostly just filter inline in the template with v-for, so I'm
      going off the symptom more than the code.
    expected:
