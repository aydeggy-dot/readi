  - kind: strong
    text: |
      So the giveaway is "it comes right as soon as they type another letter" — that tells you the
      recalculation is tied to the term and only to the term. visible is stored state, and the only
      thing that writes to it is that watcher on term. So when reload runs and jobs changes, nobody
      recomputes visible, you're still looking at the filtered version of the old jobs. Next
      keystroke fires the watcher, it filters the fresh array, and it looks fine again. The real
      issue is that visible is derived from two things — jobs and term — but it's being stored as
      if it were its own state. So I'd make it a computed: const visible = computed(() =>
      jobs.value.filter(j => j.title.includes(term.value))). Then it re-runs when either changes
      and there's only one list to reason about. Watchers I'd keep for side effects, saving a
      draft, firing analytics, that kind of thing.
