  - kind: fluent-but-wrong
    text: |
      Right — so this is watcher configuration. Vue's watch on a ref only fires on reassignment at
      the top level, and it doesn't run at all on setup unless you tell it to. Two consequences
      here: first, visible starts empty because the watcher never ran the first time, and second,
      when reload replaces the jobs the watcher doesn't see it because the watch isn't deep, so
      mutations and nested changes inside the array go unnoticed. So the fix is to configure it
      properly: watch(term, handler, { immediate: true, deep: true }). immediate gives you the
      first pass so the list is populated on load, deep makes it track changes inside the jobs
      array so a reload propagates. Once the watcher is set up right the list stays in
      step. I'd keep visible as a ref — computed would
      re-run the filter on every render, which on a big job list is wasted work.
    expected:
      - dimension: "Finds why it goes stale"
        score: 2
        because: "Identifies the watcher, and blames its configuration rather than what it fails to watch — `deep` and `immediate` do not make it watch `jobs`."
      - dimension: "Recognises it as derived"
        score: 1
        because: "Keeps `visible` as a ref and argues against `computed` on invented performance grounds."
      - dimension: "Knows what a watcher is still for"
        score: 1
        because: "The rule given — watchers with the right options — is a restatement of the wrong fix."
  - kind: correct-poorly-explained
