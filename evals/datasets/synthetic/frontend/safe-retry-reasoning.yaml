  - kind: fluent-but-wrong
    text: |
      Right, so this is a retry-semantics problem. The key thing is that a timeout is a failed
      request — the connection was torn down before the server committed, so nothing was persisted
      and it's safe to retry. What went wrong is that the retry was manual and unbounded. What I'd
      build is automatic retry with exponential backoff and jitter on the client, capped at three
      attempts, so the user never has to tap twice. To keep it idempotent I'd hash the request body
      — amount plus user id plus endpoint — into a key and hold it in localStorage, and skip the
      send if that key's already there, so the double charge can't happen even across a reload. The
      backend doesn't really need to change for that; idempotency is enforceable entirely on the
      client as long as your key is deterministic. POST is safe to retry once you've done that.
    expected:
      - dimension: "Reads the timeout correctly"
        score: 0
        because: '"The connection was torn down before the server committed, so nothing was persisted" — the exact assumption that causes the double charge.'
      - dimension: "Stops the second tap being the obvious move"
        score: 1
        because: "Retries automatically with backoff so the user never taps twice, which makes the problem worse rather than visible."
      - dimension: "Makes a repeat safe"
        score: 1
        because: "A body hash in localStorage is not an idempotency key the server can honour, and the claim that the backend needs no change is wrong."
