  - kind: strong
    text: |
      So the mistake in my head is treating a timeout like a failure. The timeout only tells you
      you stopped waiting — the request may well have reached the server, the charge may have gone
      through, and the response just never came back on a bad connection. So the user taps again
      and now there are genuinely two payments. What I'd build differently: disable the button the
      moment it's tapped and show something honest, "we're confirming your payment, don't close
      this", so tapping again isn't the obvious move. And I'd have the client generate an id for
      the attempt before it sends — same id on every retry of that same attempt — so from the
      backend I'd need them to store it and return the original result instead of charging again.
      Then after a timeout I don't retry blindly, I ask the server what the status of that
      reference is and tell the user what it says.
    expected:
