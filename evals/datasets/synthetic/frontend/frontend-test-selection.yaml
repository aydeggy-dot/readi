  - kind: fluent-but-wrong
    text: |
      Sure. So my approach is to test the unit in isolation first, then integrate. I'd
      shallow-render the component and assert on its internal state — that the email state
      updates on change, that the submit handler flips isSubmitting to true, that the validation
      function returns the right shape. That gives you fast, precise failures that point at the
      exact line. For the login call itself I would not stub the network; a mocked fetch is a
      fiction, and you want the test exercising the real auth endpoint so the contract is
      genuinely covered. And I'd deliberately skip the wrong-credentials path — that's the
      server's contract, it belongs in the backend suite, and duplicating it here is just double
      bookkeeping that fails twice for one bug.
    expected:
      - dimension: "Tests behaviour, not internals"
        score: 1
        because: "Shallow-renders and asserts on internal state — that `isSubmitting` flips, that the validation function returns a shape."
      - dimension: "Covers the paths nobody clicks"
        score: 1
        because: "Refuses to stub the network on principle, and deliberately skips the wrong-credentials path."
      - dimension: "Says what they would not test"
        score: 1
        because: 'Excludes the failure path with a reason — "double bookkeeping" — that would exclude most integration testing.'
  - kind: correct-poorly-explained
