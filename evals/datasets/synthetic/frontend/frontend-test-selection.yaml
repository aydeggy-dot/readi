  - kind: strong
    text: |
      Right, so the first thing — I'd test what the user actually does on the screen. So: type
      an email, type a password, click submit, and then check the thing that happens after, you
      know, that we called login and the person got through. Then the wrong-password path,
      because that's the one nobody clicks through by hand, so it's the one that rots quietly. I'd
      stub the network to come back with a 401 and check the error message is really on the
      screen. Same with the empty fields. And I'm stubbing the network in all of them, because
      this test is about this screen, not about the server. What I'd leave out is the styling,
      and, like, the framework's own behaviour — that typing in a box puts the letters in the
      box. React already tests that. And I wouldn't assert on internal state.
    expected:
      - dimension: "Tests behaviour, not internals"
        score: 3
        because: "Types, submits and checks what happens after; does not say how elements would be found."
      - dimension: "Covers the paths nobody clicks"
        score: 4
        because: "Wrong password and empty fields, with the network stubbed so the test is about this screen."
      - dimension: "Says what they would not test"
        score: 3
        because: "Leaves out styling and the framework's own behaviour, with a reason that generalises."
  - kind: weak
    text: |
      Erm, I'd try to get the coverage up, so, like, a test for every function in the file. I'd
      check the email input is there, the password input is there, the button is there, and
      maybe that the class names are right so the design doesn't break. A snapshot test for the
      whole screen, that's quick. For the login itself I'd probably hit the real endpoint with a
      test account so I know it really works. Leave untested — honestly I'd try not to leave
      anything untested, if it's in the file it should have a test. Maybe the error message,
      since that one is really the backend's own thing, not ours.
    expected:
