    text: |
      Okay so the thing confusing them is const. const only means you can't reassign cart —
      you can't say cart equals something else later. It doesn't freeze what's inside it. The
      things in the array are objects, and when you pass the array into the function you're
      passing a reference, so items inside the function and cart outside are the same array,
      pointing at the same objects. So when the loop does item.price equals whatever, it's
      writing into their object. Their data isn't being corrupted exactly, it's being edited,
      they just didn't ask for it. The fix is don't write into what you were handed — I'd use
      items.map and return a new object for each one, spread the item and then override price.
      Then the original stays how it was and they use the thing you returned.
