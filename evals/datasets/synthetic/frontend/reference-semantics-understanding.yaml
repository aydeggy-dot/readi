  - kind: fluent-but-wrong
    text: |
      Right, this is the classic pass-by-value versus pass-by-reference confusion. JavaScript
      is pass-by-value, always — so items inside the function is already a copy of the array
      they handed in. The array isn't the problem. The problem is the for...of loop. const
      item creates a live binding into the original memory, per iteration, so when you assign
      to item.price you're writing straight back through the binding. That's exactly why const
      isn't saving them, it's the loop binding aliasing the source. Two ways out. Either use a
      classic indexed for loop, which doesn't create that binding, or spread the array first —
      const copy = [...items] gives you a deep copy, completely detached from the caller, and
      then you can mutate copy as much as you like. I'd go with the spread, it reads better
      and it's what most codebases do now.
    expected:
      - dimension: "Locates the cause"
        score: 1
        because: "Blames the `for...of` binding, confidently and in detail, rather than the assignment."
      - dimension: "Knows what `const` does"
