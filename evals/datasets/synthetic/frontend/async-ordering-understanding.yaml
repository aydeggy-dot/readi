  - kind: fluent-but-wrong
    text: |
      Right, this is DOM write batching. So the browser doesn't commit `textContent` the moment you
      assign it — it queues the mutation and coalesces the writes, and it only flushes that queue at
      the end of the task, for performance, so you're not paying for a style recalculation per
      assignment. Both writes land in the same batch, the second one supersedes the first, and the
      first is dropped before it ever hits the render tree. That's why "Saving…" is invisible — it
      was written, it was just never flushed on its own. The two seconds is buildReport, that part's
      fine. The fix is to force the flush yourself: read a layout property right after the
      assignment, so `status.textContent = "Saving…"` and then `status.offsetHeight` — reading
      offsetHeight forces a synchronous reflow, which commits that batch and paints it before the
      heavy work starts. One line. You don't need a Worker for this, the work itself is fast enough.
    expected:
      - dimension: "Says why the first message never reaches the screen"
        score: 1
        because: "The two assignments batched together so only the last survived — a story about the writes, told with conviction."
      - dimension: "Explains what the browser is doing for those two seconds"
        score: 1
        because: "The browser batching updates for performance: a mechanism that is not this one, put precisely."
      - dimension: "Gets the work out of the way"
        score: 1
        because: "Forcing a synchronous layout after the assignment to push it out — and explicitly no Worker and no yield, so no room for a frame."
