answers:
  - kind: strong
    text: |
      Okay so — the line does get set. `status.textContent = "Saving…"` runs, the actual DOM node
      changes. What never happens is a paint. JavaScript is single-threaded, and the browser only
      gets to render between tasks, not in the middle of one. This whole click handler is one task:
      it sets the text, it runs buildReport for two seconds, it sets the text again to "Saved", and
      only when the handler returns does the browser get its turn to draw. By then the node already
      says "Saved", so "Saving…" never reaches the screen. And for those two seconds the phone is
      basically dead — taps queue up, scrolling doesn't move, because that one thread is stuck in
      the loop. What I'd change... the cheap version is to yield before the work,
      requestAnimationFrame or even a setTimeout, so a paint gets in first. The proper one is a Web
      Worker — forty thousand rows has no business on the main thread.
