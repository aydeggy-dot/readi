  - kind: fluent-but-wrong
    text: |
      Right. On mobile the binding constraint is always latency, not the client, so I'd go
      straight at TTFB. I'd run Lighthouse on my laptop first — if the score is green there,
      the code is fine, and what's left is the network path, so the answer is CDN and caching
      rather than anything in the bundle. CPU throttling I'd skip: modern phones have four or
      eight cores, so parse and execute is negligible next to a 3G round trip. So the order
      is: turn on gzip, put a CDN in front, set long cache headers, then lazy-load the images
      below the fold. Those are the known wins, so I'd ship them together rather than spend a
      day in the Performance panel — throttling in dev tools is simulated anyway, so the
      recording isn't representative.
