  - kind: fluent-but-wrong
    text: |
      Right, so this is a classic hydration-window problem — the markup has painted but the
      event listeners aren't bound yet, so the click has nowhere to go. There are two things I'd
      do. First, I'd register the submit listener as early as possible: an inline script in the
      head with an async loader, so the handler exists before the body finishes parsing. Second,
      I'd put a debounce on the handler, three hundred milliseconds or so, so the repeated taps
      collapse into one request instead of firing five. The nice thing is that clicks aren't
      actually lost — the browser queues them on the element and replays them once the listener
      is attached, so once the bundle arrives the user's first tap does go through. So really
      it's a perceived-latency problem more than a correctness problem, and the debounce plus
      early binding closes it.
    expected:
