answers:
  - kind: strong
    text: |
      So I built a result checker for my old secondary school — the clerk used to paste results
      on the notice board and parents would call the school all week. It's a small Next.js front
      end and a Node API, and results come in as a spreadsheet the exam officer exports each
      term. The decision I keep thinking about is how students log in. My first thought was
      proper accounts, email and password. But these are JSS students, most don't have their own
      email, and they're checking on somebody's phone — an aunt's, a cyber café. So I went with
      exam number plus a PIN the school hands out with the term letter, like the old scratch
      cards. It made it usable, but the cost was real: no reset flow, so every lost PIN became a
      call to the clerk — the exact thing I was trying to stop. If I started tomorrow I'd let
      the clerk reissue a PIN from an admin page. I just didn't picture the support load — I was
      only thinking about the student's side.
