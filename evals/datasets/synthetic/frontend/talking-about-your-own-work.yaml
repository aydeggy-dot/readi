  - kind: correct-poorly-explained
    text: |
      So there's this attendance thing I did for my church, for the children's church — they
      were marking on paper and the paper gets lost. It's just a form and a list. Um. The thing
      that was hard, and this is what I spent the most time on, was that the teachers mark
      attendance in a hall with no network, so the first version was saving straight to the
      server and failing and they'd lose the whole class. And I was going to do a full sync
      queue, like proper, with retries, but I didn't, I just wrote each mark into localStorage
      first and pushed it up when the network came back, because it was me alone and I had two
      weeks. Which mostly worked, except two teachers can mark the same child on two phones and
      you get doubles, so, yeah — if I did it again I'd put an ID on each mark from the start so
      the server can just drop the duplicate. I didn't think two people would be marking at
      once.
