    text: |
      Sure. The main thing I've built is a POS agent app — the kind an agent uses in a kiosk for
      withdrawals and transfers. React on the front, Node and Postgres behind it, JWT auth,
      offline-first because network here is what it is. The key decision I made was to go with
      React rather than plain JavaScript. I chose it because it's component-based, which makes
      the codebase much more maintainable and scalable, and the ecosystem is strong — you get
      routing, you get state management, you get a normalised cache out of the box, and hiring
      is easier because everyone knows it. It's served the project well; the component model
      really does pay for itself as the app grows. What would I do differently? I'd invest in
      testing earlier. We wrote tests at the end rather than alongside, and I think having that
      discipline from day one would have raised the quality of the whole thing.
