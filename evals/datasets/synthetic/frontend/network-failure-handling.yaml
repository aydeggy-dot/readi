  - kind: fluent-but-wrong
    text: |
      Sure. So the states are loading, success and error, and I'd structure it as a try/catch
      around an async fetch. The nice thing about fetch is it rejects on any non-2xx response,
      so a 404 or a 500 lands straight in your catch — you don't need to inspect response.ok,
      that's really a hangover from the XHR days. So the catch gives you one place to render
      your error UI, which keeps the component clean. An empty array I'd treat as an error
      case too, because if the jobs endpoint returns nothing then something upstream has
      usually failed, so I'd surface "couldn't load jobs". And fetch has a default timeout of
      around thirty seconds, so a dead connection resolves itself into the catch eventually.
      Loading is just a boolean around the whole thing.
    expected:
      - dimension: "Covers the states a screen needs"
        score: 2
        because: "Three states, and empty is deliberately reported as an error — the distinction is inverted."
      - dimension: "Handles HTTP errors correctly"
        score: 1
        because: "Asserts `fetch` rejects on any non-2xx and that `response.ok` is a hangover, which is the single most common mistake in this area."
      - dimension: "Thinks about a bad connection"
        score: 1
        because: "Claims a built-in thirty-second timeout — a mechanism, and one that does not exist."
