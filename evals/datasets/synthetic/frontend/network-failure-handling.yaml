  - kind: strong
    text: |
      So the mistake is thinking there's one state. There's really four. Loading, while the
      request is out — a skeleton or a spinner. The happy path, jobs come back, you render the
      list. Empty, which is not an error — the API worked fine, there just aren't any jobs, so
      that gets its own message like "no jobs yet", because a blank screen makes people think
      the app is broken. And the error state. The bit people get wrong is what the code
      actually checks. fetch doesn't throw on a 404 or a 500, it resolves happily and then you
      try to .json() an error page. So you check response.ok, or the status, before you touch
      the body. The catch block is really only for the network being gone. And the error state
      should give them a retry button, not a dead end.
    expected:
      - dimension: "Covers the states a screen needs"
        score: 4
        because: "All four states, empty distinguished from error, and a retry from the error state."
      - dimension: "Handles HTTP errors correctly"
        score: 3
        because: "Knows `fetch` resolves for a 404 or 500 and checks `response.ok`; does not separate statuses."
      - dimension: "Thinks about a bad connection"
        score: 1
        because: "Says the catch is for the network being gone, but offers no deadline or retry mechanism."
