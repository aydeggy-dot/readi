  - kind: fluent-but-wrong
    text: |
      Yeah, the problem is the dependency array. items is a new array reference on every
      render, so the effect fires, setTotal runs, that triggers a re-render, which produces a
      fresh items reference, which fires the effect again — you've got an infinite render
      loop, and what the user sees is the tab pinning the CPU and the page locking up. The fix
      is to stabilise the dependency: wrap the reduce in a useMemo keyed on items, keep the
      useState and the useEffect, and guard the setTotal so you only call it when the computed
      value differs from what's in state. That breaks the cycle. You could also pull the
      reduce into a useCallback and depend on that. The state itself is right — you want the
      total in state so React knows to re-render when it changes.
