  - kind: fluent-but-wrong
    text: |
      Ah yeah, this is the static versus live collection thing. querySelectorAll returns a static
      NodeList — it's a frozen snapshot taken at call time, so it's detached from the document and
      never learns about new nodes. getElementsByClassName is the other one: it returns a live
      HTMLCollection that stays bound to the DOM, so when "Show more" appends buttons with the save
      class the collection grows to include them automatically. So the one-line fix is to swap
      querySelectorAll(".save") for getElementsByClassName("save") — you'll need Array.from around
      it to keep forEach since HTMLCollection isn't iterable the same way — and the new buttons get
      picked up without you doing anything else. That's the whole reason the live collections are
      still in the platform; this is exactly the case they're for.
    expected:
      - dimension: "Explains why the new buttons are dead"
        score: 2
        because: "Gets the snapshot right and draws the wrong conclusion from it — the problem is the missing listener, not the collection's staleness."
      - dimension: "Fixes it at the container"
        score: 0
        because: "A live `HTMLCollection` grows, and still nobody calls `addEventListener` on the new buttons, so they stay dead."
      - dimension: "Says why that works"
        score: 1
        because: "The mechanism given is true and beside the point."
  - kind: correct-poorly-explained
    text: |
      So the buttons that came with the page have listeners and the new ones don't, which — I mean
      that's basically the answer, because that querySelectorAll line ran once, at load, and it
      only saw what was there at load, and addEventListener attaches to actual elements, one by
      one, it's not a rule that applies to the class going forward, so anything the fetch adds
      later just… isn't in that list, nobody ever wired it up. You could re-run the loop every time
      you load more, that does work, but then you're tracking which ones you've already done so you
      don't double-bind. Better is to put one handler on the parent container, the thing that
      holds all the rows, and ask the event what was clicked — target, closest save — because
      clicks travel up the tree, so the parent sees every click that happened inside it, whenever
      the element was added.
    expected:
