question: vanilla-clicks-on-new-items
# `fluent-but-wrong` here is the most instructive in the whole frontend set: every fact it states
# about `NodeList` and `HTMLCollection` is true, and the fix does not work, because a live collection
# does not attach listeners to anything. The rubric scores it 1.05 against `strong`'s 3.35.
answers:
  - kind: strong
    text: |
      Right, so querySelectorAll runs once, at the moment that script executes, and it gives you
      the buttons that exist right then. You loop over those and attach a listener to each one. The
      buttons that "Show more" injects afterwards were never part of that list, so nobody ever gave
      them a listener — which is why they do literally nothing, no error, no anything. The fix I'd
      reach for is delegation: put one listener on a container that's always there, the list
      wrapper or even document, and inside the handler check what was actually clicked —
      event.target.closest(".save") — and if it matches, run saveJob with that element. That works
      because a click bubbles up through all the ancestors of the thing you clicked, so the
      container hears about it even though it wasn't the target. One listener, works for anything
      added later, nothing to clean up.
    expected:
      - dimension: "Explains why the new buttons are dead"
        score: 3
        because: "`querySelectorAll` ran once and returned what existed then; the new buttons were never given a listener."
      - dimension: "Fixes it at the container"
        score: 4
        because: "One listener on a container that is always there, with `closest` to find what was clicked."
      - dimension: "Says why that works"
        score: 3
        because: "A click travels up through the ancestors of the element that was clicked."
  - kind: weak
    text: |
      Okay so if the old ones work and the new ones don't, then something about the new buttons is
