      maybe the template that "Show more" uses has a typo, or it's save-btn instead of save. If the
      class is right then maybe the script is running before those elements exist, so I'd wrap the
      whole thing in a DOMContentLoaded listener, or move the script tag to the bottom of the body,
      which usually sorts out "element is null" type problems. Failing that I'd put a console.log
      inside saveJob to see if it's firing at all. I don't think I've hit this exact one before.
