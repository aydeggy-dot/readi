      - dimension: "Fixes it at the container"
        score: 4
        because: "One handler on the parent, and notices that re-running the loop means tracking what is already bound."
      - dimension: "Says why that works"
        score: 3
        because: "Clicks travel up the tree, so the parent sees every click inside it."
