  - kind: fluent-but-wrong
    text: |
      Right — so what breaks first here is performance, and it breaks quietly. Assigning to
      `innerHTML` forces a full reflow and repaint of the container, and because `updateTotal`
      then walks every `li` with `querySelectorAll`, you've got an O(n) pass on every single
      add. Ten items is fine, two hundred and the cart visibly stutters on a mid-range Android.
      So the restructure I'd do is three things. Build the new row with `document.createElement`
      into a `DocumentFragment` and append that, so you touch the DOM once. Use event delegation
      on the container instead of per-row listeners, so the node count doesn't cost you. And
      stop recomputing the total from scratch — keep the running total in a `data-total`
      attribute on the container and just add the new price to it. That way adding an item is
      constant time instead of linear, and the DOM stays the single place the cart lives, which
      keeps it simple.
    expected:
      - dimension: "Says what breaks first"
        score: 2
        because: "Objects to `innerHTML` on performance grounds — reflow, an O(n) pass per add — and never says what it destroys."
      - dimension: "Recognises the page as the store"
        score: 0
        because: 'Argues *for* the arrangement: "the DOM stays the single place the cart lives, which keeps it simple".'
      - dimension: "Restructures it"
        score: 1
        because: "Keeps the DOM as the store and caches the running total in a `data-total` attribute on the container."
