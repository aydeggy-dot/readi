    text: |
      So what this is doing is describing four screen sizes instead of describing the cards.
      It says at 480 there are two, at 768 there are three, but nothing in there says how wide
      a card actually wants to be. So at, say, 700 pixels you've got two cards that are each
      about 350 wide, and I doubt anyone's ever looked at that, because 700 isn't one of the
      four numbers in the file. Then the cost going forward is that every change comes back
      here — a new size, someone puts a longer title in a card, the card needs more room — and
      it's another breakpoint each time. What I'd write instead is one line, grid-template-
      columns repeat auto-fit minmax 260px 1fr. You say what a card needs and the grid works
      out how many fit, at every width, including all the ones nobody listed. And I'd check it
      at 360, that's where most of our users are.
