  - kind: fluent-but-wrong
    text: |
      Sure. The cost here is twofold, maintenance and performance. On maintenance, those
      breakpoint values are hard-coded in four separate places, so they're magic numbers
      scattered through the stylesheet and they'll drift from whatever the design system says.
      On performance, each of those media queries is a condition the browser has to evaluate
      on every resize, and each one that flips triggers a fresh layout pass — on a low-end
      Android that's real jank when someone rotates the phone. So what I'd write instead is
      the same four tiers, but with the breakpoints pulled out into custom properties, or a
      Sass mixin if we have one, so the values live in exactly one place, and converted from
      px to em so they respect the user's font size instead of fighting it. Same behaviour,
      one source of truth, and it scales with zoom. That's the version I'd put up for review.
    expected:
      - dimension: "Says what is actually wrong with it"
        score: 2
        because: "Calls them magic numbers that will drift — true, and the performance claim underneath it (media queries re-evaluated on resize causing layout passes) is invented."
      - dimension: "Lets the layout decide for itself"
        score: 1
        because: "Hoists the same four breakpoints into variables and em units; the model is untouched."
      - dimension: "Starts narrow"
        score: 0
        because: "Never reaches the narrow end; the concern is zoom and the design system."
  - kind: correct-poorly-explained
