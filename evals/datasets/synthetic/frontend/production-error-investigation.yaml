    text: |
      Okay, I've seen this one. The give-away is that it's production-only and the file is hashed
      and minified — that's a build artefact problem, not a runtime data problem. The minifier
      mangles identifiers, so a property lookup that was written against a named export gets
      renamed underneath you and the reference resolves to undefined at runtime. Locally you run
      unminified, so it never shows. The fix is in the terser config: turn on keep_classnames and
      keep_fnames, or exclude that module from mangling, then redeploy and watch it drop. I
      wouldn't chase the data angle — if a response were coming back empty you'd see it on every
      device, and this is skewed to Samsung Internet and Android, which is exactly where the
      older parser bites. Source maps would only confirm what we already know.
