    text: |
      Right, so this is a caching and persistence problem. What's almost certainly happening
      is that the friend is being served the cached copy of that route — his browser, or more
      likely the CDN, hands back a version that was generated with no filter applied, so of
      course he sees everything. Two things I'd do. First, cache headers on that route, no-
      store or at least a vary header so a filtered response isn't treated as the same
      document. Second, persist the filter properly — write it to localStorage when it changes
      and read it on mount, so the selection survives a reload and the page comes back up the
      way the user left it. And what would I keep out of the link? Honestly I'd keep
      everything out of the link. Long query strings are hard to read and they leak what the
      user was looking at.
