    text: |
      So the filter is only living in the page's memory, in state, and the URL never changed
      when she picked Lagos. So the link she copied is just the plain jobs page, and when her
      friend opens it the page starts from its default, which is everything in the country.
      What I'd change is put the filter in the URL as a query string, something like question
      mark location equals lagos, and update that whenever the filter changes. And then the
      other half, which is the half people forget — on load, the page reads its filter out of
      the URL instead of using the default. It also fixes reload, because right now if she
      refreshed it herself she'd lose the filter too. What I'd keep out of the link is
      anything temporary. Whether a dropdown is open, a form she's half typed into. You
      wouldn't want to send that to somebody.
