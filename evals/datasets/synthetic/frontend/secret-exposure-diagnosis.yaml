  - kind: fluent-but-wrong
    text: |
      Right, so this is a build-time versus runtime thing. NEXT_PUBLIC_ variables are resolved by
      the compiler during the build, on the server, and what ships to the browser is the resolved
      request — the raw value never lands in the client bundle, that's the whole point of the
      prefix, it's Next telling you "I will handle this one safely for you." The actual bug is the
      boundary: because it's a client component, process.env is undefined at runtime in the
      browser, so the header goes out as "Bearer undefined" and the API 401s. The clean fix is to
      move RATES_KEY into the env block in next.config.js, which Next injects properly, and keep
      the component as is. For whether it leaked, I'd check git history on the .env files — if it
      was never committed, nobody outside the build has seen it.
    expected:
