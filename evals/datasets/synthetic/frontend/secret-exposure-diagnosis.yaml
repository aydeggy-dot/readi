    text: |
      Okay so — the thing that jumps at me is the NEXT_PUBLIC_ prefix. In Next, anything with that
      prefix gets inlined into the bundle at build time, so it's literally sitting in the JavaScript
      the browser downloads. And this is a client component, "use client" at the top, so the fetch
      is happening from the user's browser anyway — you'd see the Authorization header right there
      in the network tab. So it's exposed twice over, really. What I'd do is move the call to the
      server, a route handler or just a server component, and drop the prefix so it's plain
      RATES_KEY. And the key itself — honestly, if it shipped, it's burned. I'd rotate it rather
      than just delete the line, because removing the line doesn't un-ship the old build. Then I'd
      check the provider dashboard for usage I can't account for.
