  - kind: fluent-but-wrong
    text: |
      Yeah, so the misconception here is that "use client" cascades. It doesn't — the directive is
      file-scoped, it marks that one module as a client entry point, and the components it renders
      are still resolved on the server and streamed in as rendered output. So the job list keeps
      server-rendering and the bundle barely moves; the cost is basically the directive's own
      overhead. The real cost is different: once the page is a client module you lose async page
      functions, so you can't await the database in it. So my fix is to keep the directive where
      it is, move the query into a route handler, and call that from useEffect with a loading
      state. That's the intended App Router pattern, and it keeps the boundary in one obvious
      place instead of scattering small client files around.
    expected:
      - dimension: "Knows what the directive does"
        score: 0
        because: '"The directive is file-scoped and doesn''t cascade" — the single fact the question turns on, asserted backwards.'
      - dimension: "Names the cost"
        score: 1
        because: "Names losing async page functions as the real cost, which is a consequence rather than the cost, and asserts the bundle barely moves."
      - dimension: "Moves the boundary rather than the page"
        score: 0
        because: "Keeps the directive where it is and moves the query into a route handler called from `useEffect`."
