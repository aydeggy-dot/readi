  - kind: strong
    text: |
      So putting "use client" at the top of the page file doesn't just mark the button —
      everything the page imports below it becomes part of the client bundle, including the list,
      which does nothing interactive at all. So you're shipping the rendering code for a list of
      jobs down to somebody's phone for no reason, and you've given up rendering that list on the
      server, so the first paint is worse for them. And the data fetching has to move too — it
      can't sit in the page talking to the database any more, it becomes a request the browser
      makes after everything loads, which is another round trip on a bad connection. What I'd do
      instead is leave the page as a server component, pull the filter button and its panel out
      into their own small client component, and push that boundary as far down the tree as the
      interaction actually needs.
    expected:
