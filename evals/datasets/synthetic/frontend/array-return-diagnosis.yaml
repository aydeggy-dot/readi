  - kind: strong
    text: |
      Yeah, so this returns undefined and it's kind of two bugs stacked. The inner one — `return
      job` inside the forEach callback only returns from that callback, the arrow function. It's one
      call per element, so returning just ends that call and forEach moves on to the next one. It's
      basically a `continue`. And forEach throws away whatever the callback gives back; it's built
      for side effects, it always returns undefined by design. Then the outer bug: `openJobs` itself
      has no return statement at all, so even if forEach gave you something, nothing's passing it
      out. Function with no return, you get undefined. What I'd write instead — `return
      jobs.filter(job => job.isOpen)`. filter is exactly this, it keeps the elements where the
      callback is truthy and gives you a new array. If I only wanted one, then `find`. But the name
      says jobs, plural, so filter.
