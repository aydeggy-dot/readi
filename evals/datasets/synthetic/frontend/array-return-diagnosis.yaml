  - kind: fluent-but-wrong
    text: |
      So the mechanism here is that `return` inside a forEach callback behaves as a break — it
      terminates the iteration early. So the loop does stop, correctly, on the first job where
      isOpen is true, and forEach hands that value back as its own result, the same way a reduce
      hands back its accumulator. The bug is purely that nobody catches it. `jobs.forEach(...)` is
      sitting there as a bare expression statement, the value is produced and immediately discarded,
      and since `openJobs` never returns anything, the caller gets undefined. So the fix is to
      capture it: `const result = jobs.forEach(job => { if (job.isOpen) return job; });` and then
      `return result;`. Two words, basically. Now, that gives you the first open job, not all of
      them — if the caller wants every one, you'd swap forEach for filter, but the undefined itself
      is the missing assignment.
    expected:
