question: div-that-should-be-a-button
answers:
  - kind: strong
    text: |
      Right, so anyone who isn't using a mouse can't use this. A div isn't focusable, so if you're
      tabbing through the form you'll go straight past "Send application" — it's just not in the
      tab order — and even if you could land on it, pressing Enter or Space wouldn't fire that
      onclick, because a div has no default activation behaviour. And for a screen reader it
      announces as nothing, it's just a group of text, so there's no clue it does anything at all.
      Someone with a motor impairment on keyboard-only, or anybody using a switch — they simply
      can't submit the application, and that's the whole point of the page. The fix is to make it a
      button element. You get focus, Enter and Space, and the role for free, none of it your code
      to maintain. And people say "buttons can't be styled" — they can, you reset the browser's
      defaults and apply the same class.
    expected:
