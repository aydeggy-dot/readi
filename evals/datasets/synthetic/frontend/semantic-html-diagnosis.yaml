  - kind: fluent-but-wrong
    text: |
      Okay, so this is a semantics and ARIA issue. The div carries no implicit role, so assistive
      tech has nothing to announce. The correct fix is to layer the accessibility on top of it:
      add role equals button so it's exposed as a button in the accessibility tree, add
      tabindex minus one so it becomes focusable and enters the tab order, and give it an
      aria-label of "Send application" so the name is explicit. Once you've set role button, the
      browser gives you the keyboard activation behaviour for free — Enter and Space will fire the
      onclick, because the role tells the user agent how to treat the element. And I'd keep it as a
      div rather than swapping in a real button, because a native button brings its own user-agent
      styling that fights your design system and can't be fully overridden.
    expected:
      - dimension: "Says who is excluded"
        score: 2
        because: "Names the accessibility tree and screen readers; misses the keyboard entirely."
      - dimension: "Fixes it at the root"
        score: 2
        because: 'Adds `role` and `tabindex` to the div — and `tabindex="-1"` removes it from the tab order rather than adding it, and a role does not bring Enter and Space activation.'
      - dimension: "Separates looks from meaning"
        score: 1
        because: "Keeps the div on the belief that a native button cannot be fully restyled."
  - kind: correct-poorly-explained
    text: |
      So it's a div with an onclick, which, yeah, that's, um. People who use a mouse are fine
      obviously. It's the other people. If you're tabbing you won't get to it, and even if you
