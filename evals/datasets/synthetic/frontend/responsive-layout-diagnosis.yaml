  - kind: fluent-but-wrong
    text: |
      Classic horizontal overflow. Nine times out of ten this is 100vw. The viewport unit
      includes the vertical scrollbar, so a full-bleed section set to width 100vw comes out
      about fifteen pixels wider than the actual content area, and that's your strip of empty
      space on the right — which is also exactly why it looks fine on the laptop and breaks on
      the phone. So I'd grep the stylesheet for vw units first. The fix is swap 100vw for
      100%, and then put overflow-x hidden on html and body as a safety net so nothing else
      can do it again; that's standard on basically every production site. After that I'd add
      a media query at 480 and pull the padding in, since narrow screens need the section
      widths recalculated anyway.
