  - kind: correct-poorly-explained
    text: |
      So there was one comment I kept thinking about — sorry, let me back up. It was a signup
      form, and the reviewer was a maintainer on a small open source project I'd contributed
      to, and he left a lot of comments, most of them fine. But there was one where he said
      the validation shouldn't live in the component. And I didn't agree at the time, because
      it was working, and I said so on the thread. And he explained that the same rules
      already existed on the server and the two were drifting apart, and — this is the part I
      didn't get at first — that the component was now a second place somebody would have to
      edit for one rule. Which, okay. Yes. He was right. So that's what actually changed for
      me: before I write a check now, I go and look for whether that rule already exists
      somewhere else in the codebase.
