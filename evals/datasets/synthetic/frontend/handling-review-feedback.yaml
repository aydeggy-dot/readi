  - kind: fluent-but-wrong
    text: |
      Yes, definitely. The most useful feedback I've ever been given came from my team lead at
      my last role, in a mid-year review. Her point was that I was too quiet in planning
      sessions — I'd have a view on an estimate and I wouldn't say it in the room, I'd send it
      to her afterwards in a DM. And she framed it really well, she said silence in planning
      reads as agreement, so the whole sprint gets built on an agreement I never actually
      gave. I took that seriously. I started writing my concerns down before the meeting so I
      had them ready, and I made a rule for myself that I'd say at least one thing in every
      planning session. By the end of the quarter she told me the difference was obvious. It
      genuinely reset how I think about being given feedback.
    expected:
