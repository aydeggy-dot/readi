answers:
  - kind: strong
    text: |
      Yeah — my first proper pull request at my internship. It was a job listing page and I
      got, I want to say, fourteen comments on it. The big ones were that I had the same
      fetch-and-set- loading block copied in three different components, that I was swallowing
      errors in a catch that just console.logged, and my naming, I literally had data and
      data2. The duplication and the naming I just agreed with and fixed. The one I didn't
      understand was, he wrote "this filter runs on every render and you're building a new
      object each time". I genuinely didn't know what that meant, so I asked him on a call,
      and he opened the profiler and showed me the whole thing re-rendering on every keystroke
      in the search box. He was right. So now I read my own diff before I send it, and I look
      for repetition first, because half of those comments I could have caught myself.
