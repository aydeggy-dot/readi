  - kind: weak
    text: |
      Um, yeah, I've had feedback. Mostly it's small things — spacing, or he'd say rename this
      variable, or take out the commented-out code. I just do it, because he's senior and he's
      seen more than me, so arguing doesn't really help anybody. Was there anything I didn't
      agree with? Not really. I feel like if someone takes the time to review your code you
      should just make the change and move on. And nothing I didn't understand either, the
      comments were pretty clear. What do I do differently now... I try to make sure I don't
      leave console.logs in before I push. And I check it runs.
