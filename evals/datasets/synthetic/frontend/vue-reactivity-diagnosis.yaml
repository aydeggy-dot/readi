  - kind: fluent-but-wrong
    text: |
      Yeah, this is a classic reactive() limitation. reactive only works on objects, and what it
      gives you is a Proxy whose property values are still primitives underneath — so when you do
      state.count += 1 you're replacing a primitive on the proxy, and Vue's tracker can't diff a
      primitive reassignment, it only picks up structural changes to the object. That's exactly why
      the docs steer you to ref for primitives: ref boxes the value so the setter can fire the
      trigger. So I'd write const count = ref(0), destructure or not, doesn't matter, and then
      count.value += 1 in add. The template auto-unwraps refs at the top level so {{ count }} keeps
      working unchanged. Rule of thumb I use: reactive for state shapes, ref for anything that is a
      single value — this snippet has them the wrong way round.
    expected:
      - dimension: "Locates the break"
        score: 1
        because: 'A detailed mechanism — "Vue''s tracker can''t diff a primitive reassignment" — that is not what happens, and it explicitly says the destructuring does not matter.'
      - dimension: "Fixes it"
        score: 1
        because: '`ref` plus "destructure or not, doesn''t matter": the copied-value bug survives the fix intact.'
      - dimension: "Generalises the rule"
        score: 1
        because: '"reactive for state shapes, ref for single values" sounds like a rule and does not cover this case at all.'
