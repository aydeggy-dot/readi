  - kind: strong
    text: |
      So the click is definitely running, they said that, so it's not the handler — it's what the
      template is rendering. The const { count } = state line is the problem. When you destructure
      a reactive object you pull the plain number out of it, so count in the template is just zero,
      a normal number, it's got no connection back to the proxy any more. The object itself is
      updating fine, state.count really does become one, two, three — it's just that nothing is
      watching the copy. So either render state.count directly in the template, or use toRefs so
      you get refs out instead of values and then destructuring is safe. The way I hold it in my
      head is that the reactivity lives in the container, not in the value you take out of it. Same
      thing would happen with a ref if you copied .value into a variable.
