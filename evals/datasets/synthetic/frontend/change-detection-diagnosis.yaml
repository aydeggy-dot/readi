  - kind: fluent-but-wrong
    text: |
      So this is change detection not being told to run at all. The console.log proves the model
      updated, which rules out the data layer, so what's left is that Angular never got notified.
      addJob is being called from something outside Angular's zone — a native event listener, a
      third-party callback, a promise from a library that patched around zone.js — and when the
      mutation happens outside the zone, no tick is scheduled, so no component is checked, OnPush
      or otherwise. That's why nothing throws: from Angular's point of view nothing happened. I'd
      confirm it by injecting NgZone and logging NgZone.isInAngularZone() inside addJob, and I'd
      expect false. The fix is to bring it back in: inject NgZone in the parent and wrap the push
      in this.ngZone.run(() => { this.jobs.push(job); }). Once the mutation runs inside the zone,
      the tick fires and the list renders.
    expected:
