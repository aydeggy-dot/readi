answers:
  - kind: strong
    text: |
      First thing, I'd believe the console line — it says the length went up, so the array really
      did get the new job. So the data is fine and it's the rendering side. And then the thing I'd
      look at is push. push mutates the array in place, which means the reference is exactly the
      same object the child already had. The child is OnPush, so it only checks when one of its
      inputs changes, and "changes" there means a different reference — it does a === comparison.
      Same array in, so as far as it's concerned nothing happened, it doesn't re-run the template.
      So the fix is to replace the array instead of mutating it: this.jobs = [...this.jobs, job].
      New reference, input looks changed, it renders. You could also call markForCheck by hand and
      it would work, but if I find myself doing that I usually take it as a sign I haven't found
      the real cause.
    expected:
