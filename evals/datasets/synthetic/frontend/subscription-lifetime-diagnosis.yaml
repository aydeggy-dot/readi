  - kind: fluent-but-wrong
    text: |
      So the tell for me is "a search they ran several pages ago" — that's not a memory thing,
      that's the router reusing the component instance. Angular's default RouteReuseStrategy keeps
      the component alive when you navigate back to the same route, so ngOnInit only ever runs
      once, on the first visit. this.term is captured at that moment and never re-read, so every
      subsequent visit re-renders whatever the first search produced — hence results from pages
      ago. And the slowdown is the router holding detached views in its reuse cache. The fix is to
      stop relying on ngOnInit for anything route-dependent: move it to ngOnChanges, or subscribe
      to the ActivatedRoute params and rebuild jobs$ from those, and set onSameUrlNavigation to
      reload. The subscribe call itself is fine — HttpClient observables complete after one
      emission anyway, so there's nothing left hanging around to unsubscribe from.
    expected:
      - dimension: "Connects the leak to both symptoms"
        score: 1
        because: 'Blames the router reusing the component, and explicitly exonerates the missing unsubscribe — "HttpClient observables complete anyway", which is true of one request and not of a component subscribing on every visit.'
      - dimension: "Ends the work with the component"
        score: 0
        because: "Moves the work to `ngOnChanges` and route params; nothing ends the subscriptions."
      - dimension: "Generalises"
        score: 0
        because: "The rule offered is about routing, not about lifetime."
  - kind: correct-poorly-explained
    text: |
      Yeah so there's a subscribe here and, um, there's no ngOnDestroy, which — I mean the
      component goes away when you navigate, the view is destroyed, but the subscription doesn't
      know that, it's not connected to the component's life at all, so it just stays, and then you
      come back and it does it again, and again, dozens of times they said, and each one is still
      listening, so when anything emits they all run, including ones belonging to components that
      don't exist on screen any more, which is your old search results turning up. And the slowness
      is that none of those components can be collected because the subscription is holding them.
      So — right — the fix is either let the template do it with the async pipe, which unsubscribes
      for you when the view goes, or takeUntilDestroyed. Either way you're binding it to the
      component's lifetime, which is the actual point.
