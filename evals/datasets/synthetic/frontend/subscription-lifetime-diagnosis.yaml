question: angular-subscription-leak
answers:
  - kind: strong
    text: |
      So nothing here ever unsubscribes. ngOnInit subscribes and there's no ngOnDestroy, so every
      time they navigate into the list a new subscription is created and the old ones are still
      alive. That explains both symptoms actually — it gets slower because each dead component is
      still being held in memory by its subscription, the garbage collector can't touch it while
      something holds a reference to the callback, and the stale results are the old subscriptions
      still firing and writing into components from a search they ran pages ago. Fix is to tie the
      subscription to the component's life. Cleanest is to not subscribe manually at all — keep
      jobs$ as the observable and let the async pipe in the template handle subscribe and
      unsubscribe for you. Or takeUntilDestroyed on the pipe if you need it in the class. The rule
      is just: whatever a component subscribes, the component ends.
    expected:
      - dimension: "Connects the leak to both symptoms"
        score: 4
        because: "No `ngOnDestroy`, one subscription per visit, and explains both symptoms — including why the dead components cannot be collected."
      - dimension: "Ends the work with the component"
        score: 4
        because: "Prefers the async pipe precisely because it cannot be forgotten on the next component someone writes."
      - dimension: "Generalises"
        score: 2
        because: "Generalises to subscriptions; does not reach timers or listeners."
  - kind: weak
    text: |
      Okay. So getting slower after a lot of navigation, that sounds like memory. Maybe the job
      service is caching every search it's ever done and the cache is growing? I'd look at the
      service first and see if it's storing results in an array. For the wrong results showing up,
      that might be the browser caching the HTTP response — I'd add a cache-busting param or set
      the headers to no-store. I'd also add a loading state so the old list is cleared while the
      new one comes in, then at least the user doesn't see the stale one. I know unsubscribing is
      a thing in Angular but I've mostly used the async pipe so I've not had to think about it
      much.
