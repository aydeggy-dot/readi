  - kind: fluent-but-wrong
    text: |
      Right, so this is a reconciliation question. The thing people get wrong is blaming the key —
      but keys are only a hint to the diffing algorithm, they're a performance affordance. React
      state is positional: it's keyed by the component's place in the element tree, not by the key
      prop. So swapping index for application.id changes nothing here, the second row is still the
      second row and it still holds that note. The real defect is that ApplicationRow owns
      transient state that outlives the item it describes. So the fix is to lift the note into the
      parent, store it in a map by application id, and make ApplicationRow fully controlled. I'd
      tidy the keys too, but purely for render cost, not for correctness.
    expected:
      - dimension: "Connects the key to the symptom"
