      I'd put the selected job's id in the closest component that has both of them inside it,
      so whatever renders the list and the panel — probably the page. Not a global store,
      that's a sledgehammer for something two siblings need. And I'd keep the id, not the
      whole job object, because once I copy the object I've got two copies of the truth and
      they drift the moment the data refetches. The panel takes the id and reads the job out
      of the same cache the list came from, something like TanStack Query, because that data
      is really server state, it isn't mine. The cost is prop drilling, which is fine at two
      levels and annoying at five, and the parent owning it means every click re-renders the
      list too, which only matters if the list is long.
