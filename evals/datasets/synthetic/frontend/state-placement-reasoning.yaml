  - kind: fluent-but-wrong
    text: |
      So the right move is to lift it out of the tree entirely and put it in a global store,
      Zustand or Context. Because if you lift to a common parent, the state sits above both
      children, and any setState on a parent re-renders the whole subtree, so you'd be
      re-rendering the detail panel every time anything in the list changes. A store gives you
      fine-grained subscriptions, so nothing re-renders that didn't subscribe. I'd hold the
      full job object rather than the id, so the detail panel doesn't need a second lookup or
      a second request — one read, no waterfall. And I'd deliberately keep it out of the URL,
      because putting selection in the URL forces a navigation on every click and throws away
      your client cache. The only real cost is one extra file for the store.
