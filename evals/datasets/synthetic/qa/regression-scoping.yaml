      Okay so, it's one line, but it's money, so I'd start at the function itself. I'd use amounts
      where rounding down and rounding to nearest actually disagree — something landing on point
      five, then point four, point six, and then a very small order where the discount rounds all
      the way down to zero, because that's the one that surprises people. Then I'd go one step out
      and just follow the money: the order total, the amount we hand to the payment gateway, and
      the receipt or invoice the customer sees. Because if the discount moved by a naira and the
      total didn't move with it, somebody finds that later when they're reconciling, not now. I'd
      also check the total still equals the sum of the lines on screen. What I'd deliberately leave
      alone — login, search, profile, anything that never touches an amount. Not worth a run. And
      before I believe nothing else was touched... honestly, I'd want to see the diff myself, and
      I'd want to know whether that rounding lives in a shared helper that other things call,
      because one line in a shared utility isn't one line.
