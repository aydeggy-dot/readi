  - kind: strong
    text: |
      With the file itself I'd start at the edges, because "too large" in their case is
      probably a 20 MB file. Something just under 5, exactly 5, just over. Then an empty
      file — zero bytes, named cv.pdf. That normally goes through and the recruiter opens
      nothing.

      Then a file that lies: take a JPEG, or an .exe, rename it cv.pdf. If the check is
      only on the extension it'll be accepted, and I want to know whether anybody looks at
      the content. Also a password-protected PDF, and a corrupt one — copy a PDF and cut
      it off half way. And the name: very long, spaces, an apostrophe, a double extension
      like cv.pdf.exe.

      While it's uploading — airplane mode when the bar is half way, switch WiFi to data,
      lock the screen and go to WhatsApp and come back. Does it resume, does it tell me
      something I can act on, or does it sit at 99 percent and lose the form I typed?

      Whether it's a defect — I check the requirement first. If nothing says what should
      happen, I write what I saw, what I expected and what it costs the user, and take it
      to the PM. Losing a CV you uploaded on your own data is a defect even if no document
      says so.
    expected:
      - dimension: "Attacks the thing itself"
        score: 3
        because: "Level 3: goes at the file itself — boundaries either side of 5 MB, a zero-byte cv.pdf, a JPEG or .exe renamed, a password-protected and a truncated PDF, a very long name, spaces, an apostrophe, a double extension — but names no innocent real submission such as a photographed CV."
      - dimension: "Attacks the conditions"
