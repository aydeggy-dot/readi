  - kind: fluent-but-wrong
    text: |
      So what they've written is one positive case and two negative ones. What's missing
      is boundary value analysis — exactly 5 MB, just under, just over, and a zero-byte
      file. Now, renaming an .exe to .pdf — people suggest that, but it isn't a valid test
      here, and I'd push back on it. The file picker has an accept filter, so the
      operating system won't even let the user select a non-PDF. That path is unreachable
      from the UI, so it's out of scope. Testing what the user cannot do is wasted effort.
      Same with the connection. Interrupting the upload can't corrupt anything, because
      TCP handles retransmission — that's the whole point of a reliable protocol. If I
      turn off data mid-upload, the connection is held and resumes when the network is
      back, so what lands is either the complete file or nothing. What I'd check there is
      the spinner and the error copy. And how I decide what's a defect: a defect is a
      deviation from a documented requirement. The requirement is PDF or Word, up to 5 MB.
      So if something outside that behaves oddly, it isn't a defect, it's an enhancement
      request, and I'd put it in a suggestions list rather than raise a bug the dev will
      reject.
