      Okay. So I would test with different files. Like a very big one — sorry, they said
      that's covered already. Then maybe a picture, a JPEG, to see if it will reject it.
      And Excel, maybe an Excel file. And I can test with a file that has a long name. For
      the connection, I would off my data in the middle of the upload and see what
      happens. It should show an error message. And maybe press the back button while it
      is uploading, or minimise the app and come back. How I decide if something is a
      defect — if the app crashes, then it's a defect for sure, because crashing is never
      expected behaviour, that one is clear. If it just shows an error message then I
      would say it's working, because it caught the problem and told the user. If I'm not
      sure, I'd check the test cases, and if it's not there I'd ask my team lead whether
      to raise it or not. I wouldn't want to raise something that turns out to be by
      design.
