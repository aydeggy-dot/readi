  - kind: strong
    text: |
      What they've got in common is that none of them says what the button is — they all
      say where it is. The full path down from body is pure position. The two classes are
      styling, and one of them is a generated hash so it changes on every build anyway.
      And counting children to the fourth div, position again. So all three are tied to
      the markup and the CSS, which the developer can change any time, and not to the
      behaviour, which is the thing that didn't change. That's why nothing broke but
      everything failed. I work in Playwright, so I'd go for role plus the accessible name
      — getByRole('button', { name: 'Apply' }). That's what the user actually sees, and it
      survives being moved into a wrapper because it doesn't care about the tree. Where
      the text is dynamic or translated, getByTestId with a data-testid. And I'd keep the
      locator in one page object, so when it changes I fix one line, not forty tests. What
      I'd ask the developers for, that isn't a change to the tests: put data-testid
      attributes on the elements we automate and treat them like an API — don't rename or
      remove them without telling us. And real button elements with real labels, so
      role-based locators work.
