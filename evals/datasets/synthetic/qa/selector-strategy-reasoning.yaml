      Erm, what they have in common is that they are all too long. Like the selector is
      very long, and long selectors are not good practice. The body one especially — if
      you copy XPath from the browser it gives you that kind of thing. So I wouldn't use
      those ones. What I'd use instead is the ID, because ID is unique on the page, so ID
      is the best one and it doesn't change. If there's no ID then I'd use the class name,
