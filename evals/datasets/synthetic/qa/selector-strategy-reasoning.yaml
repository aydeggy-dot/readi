      I'd also put a wait before clicking, because sometimes the test fails because the
      element hasn't loaded yet, so an implicit wait helps with these kind of failures.
      And what I'd ask the developers... I'd ask them to please not be changing the code
      without informing the QA team, because if they tell us before, we can update the
      tests before it breaks and we won't meet forty failures in the morning. Or they
