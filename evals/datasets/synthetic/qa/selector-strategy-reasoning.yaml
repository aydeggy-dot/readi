  - kind: fluent-but-wrong
    text: |
      Okay. What those three have in common is that they're all CSS-style selectors —
      flat, static strings matched against the document as it was written. That's the
      weakness. CSS can't traverse, so the moment the tree shifts it has nothing to fall
      back on. XPath does traverse, it's evaluated against the live DOM at runtime, so it
      adapts. So what I'd write instead is a relative XPath anchored on the structure,
      using the axes — something like //div[contains(@class,'wrapper')]//button[1], or
      find a stable neighbour and go following-sibling::button, or ancestor::div and come
      back down. Structure is the stable thing in a page: developers rename classes
      constantly, cosmetics change every sprint, but the shape of a form — label, input,
      button, in that order — nobody restructures that. So anchoring on the hierarchy is
      exactly what makes a locator survive a class rename, and contains() handles the
      generated hash, because I match the fixed prefix and ignore the random part. On what
      I'd ask the developers for — I wouldn't ask for data-testid. Test attributes are
      test code shipped into production markup, it bloats the DOM and it's our concern
      leaking into theirs. What I'd ask for is a rule that the DOM structure is frozen
      once there are tests against a screen, and any restructuring comes to QA first.
    expected:
      - dimension: Names what the three share
        score: 1
        because: Level 1 — the remedy is three better selectors of the same kind, structural XPath on the axes, because the shared cause is read as CSS versus XPath rather than position versus identity; the shared cause the criterion asks for is missed, and the body path was itself an XPath.
      - dimension: What to use instead
        score: 1
        because: "Level 1 — a more specific selector of the same kind treated as durable: relative XPath anchored on the hierarchy with contains() for the generated hash, and data-testid explicitly refused."
      - dimension: What the tests cannot fix alone
        score: 1
        because: Level 1 — asks for the DOM structure to be frozen once there are tests and restructuring to come to QA first, and refuses to ask for anything to select on.
