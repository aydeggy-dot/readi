question: selenium-stale-element
answers:
  - kind: strong
    text: |
      So the exception is telling me that row points at a DOM node that isn't in the page
      any more. When I called findElement on the first line, Selenium handed me back a
      reference to that specific element — not the selector, the element. Then the filter
      click re-rendered the results table, so the old tr was thrown away and a new one
      built. My reference still points at the dead one. That's exactly why it only fails
      when the filter actually changes the list.

      Waiting longer wouldn't help. A stale reference never becomes fresh — it's not that
      the element isn't ready yet, it's that this one is gone. Wrap it in a wait and I
      spend twenty seconds throwing the same exception.

      What I'd change is: don't hold an element across an action that changes the page.
      Keep the locator, click the filter, wait for the new list, then find the row again
      and click apply — or find it in one go, #results tr:first-child .apply, after that
      wait.

      For the other places, I wouldn't patch thirty files by hand. I'd put a helper in the
      shared layer — click by locator, which re-finds each time — and move the page
      objects onto it, starting with whatever is actually flaking, so nobody writes the
      old way again.
    expected:
      - dimension: "What the exception means"
        score: 3
        because: 'Level 3: findElement returned a handle to that element, the re-render threw the node away, so the reference is detached and waiting cannot help — "a stale reference never becomes fresh"; navigation and frame switching are not named.'
      - dimension: "The fix"
