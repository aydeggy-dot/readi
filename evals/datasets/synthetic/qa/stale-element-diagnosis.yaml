      and a new one put in its place, and the thing I'm holding is pointing at nothing,
      even though on screen the same row looks like it's there. And no, waiting won't
      help, that's the thing people always try — it's not that it's not ready, it's that
      it's dead, and a dead reference doesn't come back, so you just wait and fail. A wait
      is useful before, for the new list, not on the old element. So what I'd do is, after
