  - kind: fluent-but-wrong
    text: |
      Okay, so this is a synchronisation problem, classic one. The clue is right there in
      the question — it only throws when the filter actually changes the list. So when the
      list is re-rendering, the DOM is in flux, and my last line is firing while that's
      still happening. The element isn't fully attached yet at the moment I touch it.
      That's what "not attached to the page document" is literally saying: not attached
      yet. So yes, waiting does help, as long as it's a proper wait and not a sleep. I'd
      wrap it: new WebDriverWait(driver, Duration.ofSeconds(10))
      .until(ExpectedConditions.visibilityOf(row)), and then click. visibilityOf takes the
      WebElement and polls it, so it keeps checking until the element is attached and
      visible again, and once the re-render finishes it comes back and my click goes
      through. Nothing wrong with holding the reference — the reference is fine, it's the
      timing that's off. And for the rest of the suite, the good news is you don't have to
      touch them one by one. Implicit wait covers staleness as well as presence, so I'd
      set the implicit wait in the driver factory to about twenty seconds, and every
      findElement and every interaction in the whole suite inherits the retry. One line,
      and all those other places stop flaking.
    expected:
