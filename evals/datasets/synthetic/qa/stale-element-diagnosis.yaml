        because: "Level 3: keep the locator, click the filter, wait for the new list to be there, then find the row again — but does not say which condition to wait on or that the re-render is the event rather than a delay."
      - dimension: "The pattern across the suite"
        score: 3
        because: "Level 3: a helper in the shared layer that clicks by locator and re-finds each time, with the page objects moved onto it, so no reference outlives an action; says nothing about what a catch-all retry would cost."
