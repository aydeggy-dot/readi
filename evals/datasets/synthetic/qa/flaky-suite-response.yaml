      Okay. So fifteen failing but not the same ones... that sounds like something is not stable.
      I'd rerun them first, to see, because maybe it was just that one time, and then whichever
      ones fail again I'd run them one by one myself and watch what happens. My guess is the tests
      are going too fast for the app, so I'd add waits — like make it wait a few seconds before it
      checks — because sometimes the page hasn't loaded and the test already checked. It could
      also be the network, our internet here is not always stable. Then I'd report it to the lead
      and to the developers so they know. If some test keeps failing and nobody can fix it, maybe
      we remove it, or we mark it to skip, so the suite can be green. On the rerunning... I mean,
      I understand why they're doing it, if you rerun and it passes then it passed. It's not
      ideal, but. What have they lost? Time, mostly, rerunning takes long. And confidence in the
      tests, people stop believing them. That's what I can say.
