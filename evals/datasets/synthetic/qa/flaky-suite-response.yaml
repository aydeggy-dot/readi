        because: "Level 3: taken out of the gating run onto a separate list, each with a name and a date against it, then fixed one at a time at the cause; it does not argue that a blanket retry is the worst option."
      - dimension: "Why the suite lost its credibility"
        score: 3
        because: "Level 3: the lost thing is the ability to notice a real bug, and counting retries in the report is what would keep it honest; nothing it would give up to get the signal back."
