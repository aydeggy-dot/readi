  - kind: fluent-but-wrong
    text: |
      So let's be precise about what intermittent failure tells us. A real product defect is
      deterministic — same input, same code, same result. That's what a defect is. So a test that
      fails on one run and passes on the next, with nothing changed, cannot be reporting a product
      defect. By definition it's reporting itself. Which means all fifteen are test defects, and I
      can say that before opening a single one. That actually simplifies the work a lot. The
      dominant cause is timing — the test moving faster than the application — so I'd raise the
      implicit wait globally, say from two seconds to ten, and put explicit sleeps around the
      slower screens. That one change usually takes most of a flaky set green. On the rerunning, I
      wouldn't stop it, I'd formalise it — automatic retry, capped at two attempts, which is
      standard practice everywhere. And it's safe precisely because of the first point: if a test
      passes on retry, we've proven the application was fine, because a broken application would
      have failed both times. What the team lost is time and morale. The coverage itself is intact.
    expected:
