  - kind: strong
    text: |
      First thing, I'd stop treating the fifteen as one problem. I'd want the history — which test
      failed on which run, over the last couple of weeks — and rank them by how often. Without
      that we're guessing. Then I'd pull them out of the run that gates a change, into a separate
      list, so the other hundred and five mean something again. Not forever, though — each one
      gets a name against it and a date, otherwise quarantine is just a graveyard. Then I'd go
      through them one at a time. Usually it's a fixed sleep instead of waiting for the actual
      thing to appear, or two tests sharing one record, or a test depending on what ran before it,
      or a date. And the fix is the cause, not a longer wait. On the rerunning — the rerunning
      isn't the crime, doing it silently is. If we retry, the report should say this passed on the
      second attempt, and we should count that. What they've lost is the ability to notice a real
      bug. A genuine regression now looks exactly like the fifteen, so it gets rerun till green
      and shipped. They've kept the suite and lost the signal.
    expected:
      - dimension: "Treats the unreliability as information"
        score: 4
        because: "Level 4: wants the per-run history and ranks the fifteen by rate, and names what the habit has already hidden — a genuine regression now looks like the fifteen, so it is rerun till green and shipped."
      - dimension: "What happens to each one"
