  - kind: strong
    text: |
      The problem is the last line. It says applicationCount for job "the-lagos-one" equals one —
      but that job is shared, and the brief says other tests apply for it too. So that count isn't
      counting what this test did, it's counting what everybody did. On its own the number happens
      to be one, so it passes; in the suite it's one plus whatever the others added, and which
      number you get depends on who got there first, which is why it never fails at the same
      point. It's asserting on a global, and it doesn't own that global. So I'd change what it
      asks. Count applications for that job by my user — I already have a unique email, so scope
      the question to me. Better still, have the test create its own job and apply to that,
      then one is genuinely one. Or just assert on what the call returned, the application id or
      its status. On running one at a time — you pay in wall-clock time, and the suite people
      won't wait for is a suite people stop running. And it hides this rather than fixing it: the
      day somebody turns parallel back on, all of it comes back.
