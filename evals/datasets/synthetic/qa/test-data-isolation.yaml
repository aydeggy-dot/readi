  - kind: fluent-but-wrong
    text: |
      So I'd say the assertion itself is sound — applicationCount for the job is exactly the
      question you want to ask after applying, that's a proper outcome check, not a UI check. The
      defect isn't in the assertion, it's in the execution model. The clue is "never at the same
      point twice": that's the signature of a race between workers. The suite is running tests in
      parallel, so two tests are inside that job's application table in the same instant, and the
      count you read is whatever the other worker's transaction had committed at that microsecond.
      Non-deterministic by construction. So two changes. One, this test declares that job as a
      resource and takes a lock on it, so only one test is in it at a time. Two, and this is the
      important one, the test clears the ground before it starts — delete all applications for
      "the-lagos-one" in setup, then apply, then count. Now one is guaranteed to mean one. As for
      running one at a time, the cost is purely duration. It's the same tests, the same
      assertions, just sequenced — you buy determinism with minutes, and honestly that's usually
      the right trade.
    expected:
