  - kind: strong
    text: |
      Right, so on the screen the host is typed into the request, staging dash api dot example dot ng,
      and the token is sitting in the file next to it, in the repo with the tests. Two problems.
      First, the host comes out of the request — it becomes a variable, base URL slash applications, and
      staging and test are just two values for it. And it's not only the host: any id or account number
      baked into a request won't exist in the other environment, so the tests have to create the data
      they need.
      The token shouldn't be in the file at all, and that one is already burnt — it's in the git
      history, so deleting the line doesn't help, it has to be revoked. Going forward the run logs in at
      the start and gets a fresh token for a test service account, and that account's credentials come
      from the runner's secrets, one set per environment. Nobody needs to read them; the pipeline needs
      them. And I'd check they're not printed in the report or the logs.
      Production, no. These are POSTs, they create applications — real records, real people's data, real
      emails. If they want assurance there, that's a separate read-only check with its own account,
      agreed with whoever owns the service.
