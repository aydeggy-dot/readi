  - kind: fluent-but-wrong
    text: |
      Sure. So the clean way is proper environment management. I'd pull the host into a base URL
      variable, then create three environment files — staging, test, and one for prod later —
      checked into the repo beside the collection, each with its own base URL and its own token.
      The runner picks the environment by name, so the same requests go anywhere.
      And keeping the tokens in those files is fine, because the repo is private — repo access is
      the access control. Anybody who can read that token can already read the tests and the test
      data, so a vault or a secrets manager is a moving part for no gain on a non-production
      token. I'd keep them long-lived deliberately, as well: fetching a fresh token inside the
      pipeline is one more call that can fail, and that's exactly how you get flaky runs.
      For production — it isn't automatically wrong, it depends on the verb. I'd tag the requests
      and against production run only the GETs. Read-only can't change anything, so the risk is
      basically zero and you get real coverage of the real system. I'd keep the prod environment
      file in the same place, just with the write requests excluded, and run it by hand rather
      than on every commit.
