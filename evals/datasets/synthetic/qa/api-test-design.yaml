      Right. So I'd take the contract and split it by the four documented responses, and drive it from a Postman collection with an environment so the token and the job id aren't hardcoded. Happy path first, assert 201, then the validation cases straight off the field rules — the uuid format, the two thousand character limit on the cover note. Now, the 409. I'd actually flag that as a bug in the documentation before I write a test for it. This is a REST endpoint, and the rule for REST is that the same request against the same resource is idempotent: if I POST the same job_id twice, the correct behaviour is 201 again with the same application_id, because the server should see the resource already exists and hand me back the one it has. That's the whole point — it's what makes the call safe to retry. If a candidate's network drops on a slow connection and the phone resends the request, a 409 breaks them for something that actually succeeded. So my test is: POST twice, assert both are 201, assert the application_id is identical the second time. If it really returns 409 I'd raise it as a defect, because the endpoint isn't idempotent and it will fail under retry.
