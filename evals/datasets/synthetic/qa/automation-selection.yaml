  - kind: fluent-but-wrong
    text: |
      Okay, so my selection criterion is defect density. Automation earns its place by finding bugs,
      so the thirty should sit wherever the bugs actually live. What I'd do is pull the last six
      months out of the bug tracker, group the defects by module, and whichever three or four modules
      have the most defects, that's where my thirty cases come from. That's where the code is weakest,
      so that's where a script catches the most. The stable modules I'd leave manual — nothing has
      been wrong there in six months, so automating them is spending effort watching something that
      doesn't move. Same for the cases that pass every single time; those are dead weight, they just
      make the run slow. And then the three-month measure is simple and it's a number I can put in
      front of a manager: how many new defects did the automation find that a human didn't find first.
      If the suite has found twenty-five bugs in three months, it paid for itself. If it found two, we
      automated the wrong thirty and I'd go back to the tracker and re-pick. Pass rate on its own
      tells you nothing — a suite that's always green is a suite that isn't working.
