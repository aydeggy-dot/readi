      - dimension: "What stays manual"
        score: 1
        because: "Descriptor 1 — keeps the wrong things manual for a stated reason: the stable modules stay manual because 'nothing has been wrong there in six months', and the cases that always pass are 'dead weight'. Exploratory work and judgement calls are never mentioned."
      - dimension: "How they would know it paid off"
