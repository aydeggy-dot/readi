question: what-to-automate-first
answers:
  - kind: strong
    text: |
      Thirty out of two hundred — so I'm not really picking the important ones, I'm picking the ones
      that pay me back every single release. My filter is: how often does this case get run, what
      breaks if it's broken, and is the feature stable enough that I won't be rewriting the script
      next sprint. So top of the list is the regression set we run for every release — login, sign-up,
      the core money path, checkout, the report the business actually looks at. Somebody runs those by
      hand twenty times a year; a script pays for itself in two releases. Then the boring ones with
      many inputs: one form, fifteen combinations, that's one script and a data table. What I'd leave
      manual — anything where you have to look at it and judge, exploratory sessions, anything on a
      feature they're still designing, and anything needing a real OTP or a real card. And in three
      months, how do I know: is the suite still running on every build or has somebody quietly
      switched it off, out of the failures how many were real bugs versus the script breaking, and did
      the regression round go from two days to half a day. If nobody trusts the results, it didn't
      work, whatever the pass rate says.
    expected:
      - dimension: "What makes a case worth automating"
        score: 4
        because: "Descriptor 4 — the filter is how often it runs, what breaks if it breaks, and 'is the feature stable enough that I won't be rewriting the script next sprint', with 'a script pays for itself in two releases': the cost of keeping it working, not only of writing it."
      - dimension: "What stays manual"
        score: 3
        because: "Descriptor 3 — exploratory sessions and 'anything where you have to look at it and judge' stay with a person, with the judgement itself as the reason. Not 4: nothing named that is automated badly and would be better manual than wrong."
      - dimension: "How they would know it paid off"
        score: 4
        because: "Descriptor 4 — real bugs versus the script breaking, whether the suite is still running on every build, regression time from two days to half a day, and the stop signal: 'If nobody trusts the results, it didn't work, whatever the pass rate says.'"
  - kind: weak
    text: |
      So, two hundred cases and I can do thirty. I'd go through the list and pick the most important
      thirty — the ones on the main features, login, registration, the dashboard, because those are
      what every user touches. I'd probably start with the easy ones actually, the ones that are
      straightforward to write, so I can finish thirty in the time and have something to show. The
      hard ones I'd leave manual, like file upload or payment, those are difficult to automate.
      Anything that changes a lot I'd also wait for it to settle first. To know if it was worth it
      after three months, I would check if the tests are passing. If they're all passing then the
      application is stable, so the automation is doing its job. And the team is not doing those
      thirty by hand anymore, so we've saved that time. I'd also probably count how many we have now —
      if we started with thirty and now it's eighty, that's progress, that shows the automation is
      growing. That's how I'd look at it.
