  - kind: strong
    text: |
      In plain terms — salary used to be a number, 250000, and now it's an object with
      min, max and currency inside. So somebody changed the shape of a field that was
      already live, and shipped it. The app was written to read a number there, so it
      reads nothing and shows empty. And on some versions the parser is strict: it gets an
      object where it expected a number, throws, and the whole list screen goes down with
      it. Different parsing code in different releases, same cause.

      A test could have caught it, but it has to be on the response, not through the UI.
      Something that calls the endpoint and asserts salary is a number — the type, not
      just that the field is there and it returned 200. And it has to run in the backend's
      own pipeline before that build goes out. If it only runs in my suite against
      production, I find it after the users do. And the painful part: you can't fix the
      installed app versions with a deploy. People don't update.

      What I'd ask for: don't change a field's type. Add salary_range next to it, keep
      salary for a release or two, then remove it. Or version the endpoint. And put API
      changes in the release notes, before, not after.
