  - kind: fluent-but-wrong
    text: |
      So what happened is they enriched the salary field into a range object — min, max,
      currency. Technically that's an additive change, and I'd defend that: backwards
      compatibility is about the contract surface — same endpoint, salary is still there,
      nothing removed, nothing renamed. What they put inside the field is an
      implementation detail of that field. So no version bump was needed and they didn't
      do anything wrong by not announcing it. Which makes this a client defect, not an API
      defect. The app is reading the field without checking what it got — no null-safety,
      no type guard — so it blanks, and on the versions with a strict parser it crashes.
      If the app had been written defensively, worst case you see an empty salary, you
      never crash. On catching it — a contract test wouldn't have helped, honestly, and
      I've seen people expect too much from them. A contract test checks the fields in the
      schema are present and the response is valid JSON, and salary is present and it is
      valid JSON, so it passes green. What catches this is UI regression on the app
      against the new build. So what I'd ask for is a proper device regression pass before
      release, and defensive parsing as a coding standard on the mobile side.
