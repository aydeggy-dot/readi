question: cypress-login-in-every-test
answers:
  - kind: strong
    text: |
      So what's on screen is a beforeEach that visits /login, types the email, types the password out
      of Cypress.env, clicks submit and waits for the URL to include /dashboard. 140 times six seconds
      is fourteen of the twenty-two minutes, so yes — but you said beyond the minutes. The real cost
      is that all 140 tests now depend on the login screen. Somebody renames that submit testid, or
      login is slow that morning, and the whole suite goes red — you're staring at 140 failures that
      tell you nothing about what you were actually testing. And a developer who waits twenty-two
      minutes stops running it, and a suite nobody runs isn't a suite. What I'd do instead is log in
      through the API — cy.request to the login endpoint, take the session cookie, and wrap it in
      cy.session() so it's cached and restored instead of re-run every time. That takes login off the
      critical path. What I lose: I'm not exercising the real sign-in anymore, so the login page could
      break and my suite stays green. And I'm coupled to an endpoint that can drift from what the UI
      actually does. So I keep a small set going through the screen — valid login, wrong password, the
      lockout, and where it redirects you afterwards. Five, six tests, not 140.
    expected:
      - dimension: "What it costs besides time"
        score: 4
        because: "Descriptor 4 — '140 times six seconds is fourteen of the twenty-two minutes', and then the coupling: all 140 tests depend on the login screen, so a renamed testid gives '140 failures that tell you nothing about what you were actually testing'."
      - dimension: "What replaces it"
        score: 3
        because: "Descriptor 3 — cy.request to the login endpoint, the session cookie, wrapped in cy.session() so it is cached and restored rather than re-run. Not 4: nothing about a restored session being dead and needing a cheap re-establishing check, nor about per-file caching leaving one sign-in per file."
      - dimension: "What still needs the screen"
        score: 3
        because: "Descriptor 3 — 'valid login, wrong password, the lockout, and where it redirects you afterwards. Five, six tests, not 140.' Not 4: it names endpoint drift as a risk but not what would catch it."
