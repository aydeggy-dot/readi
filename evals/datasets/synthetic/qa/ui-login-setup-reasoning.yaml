  - kind: fluent-but-wrong
    text: |
      Yeah, I've had this exact problem. The mistake here is the hook — that's `beforeEach`, so it's
      paying for a login on every single test, and it doesn't need to. The session lives in a cookie,
      and the cookie lives for the browser session, so once you've signed in you stay signed in for
      the rest of that spec file. So change it to `before` instead of `beforeEach` and you log in once
      per file. Thirty spec files times six seconds is three minutes instead of fourteen — eleven
      minutes back for a one-word change, no API calls, no tokens, nothing extra to maintain. And
      you're still going through the real UI, which is the honest way to do it. What you give up is a
      bit of isolation, in the sense that the tests in a file now share one session, so if one of them
      logs out you have to watch the ordering — I'd just put any logout test in its own file. But the
      login itself is still real, you're not faking anything. Where I'd keep it per test is anywhere
      the account state matters, and obviously the auth specs themselves, wrong password, lockout,
      those have to drive the form.
    expected:
      - dimension: "What it costs besides time"
        score: 1
        because: "Descriptor 1 — the whole cost is minutes: 'three minutes instead of fourteen — eleven minutes back for a one-word change'. That every test depends on sign-in is never raised; the isolation it discusses is tests sharing one session."
      - dimension: "What replaces it"
        score: 1
        because: "Descriptor 1 — keeps the screen route and makes it cheaper, once per spec file, on the wrong belief that the cookie survives between tests; the session is never established without the screen."
      - dimension: "What still needs the screen"
        score: 3
        because: "Descriptor 3 — keeps the auth specs on the form, 'wrong password, lockout, those have to drive the form', plus anywhere account state matters."
