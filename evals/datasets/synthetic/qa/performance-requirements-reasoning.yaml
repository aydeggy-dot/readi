question: performance-what-to-ask-first
answers:
  - kind: strong
    text: |
      "Hold up" doesn't mean anything yet, so first I'd ask what the campaign actually is.
      Radio advert, bulk SMS to fifty thousand people, influencers? Because that decides
      the shape of the traffic — fifty thousand SMS at once means everybody arrives in ten
      minutes; a month-long thing is different. So: how many people, when, over how long,
      and which journeys — signing up, browsing, uploading a CV, paying? Those don't cost
      the same.

      Then today's numbers, from analytics or the logs: current peak hour, current
      response times. And whether the SMS provider or Paystack have rate limits, because
      it's usually a third party that falls over first, not us.

      The pass mark has to be a sentence with numbers: this many people at the same time,
      for this long, sign-in and the job list under so many seconds at the 95th
      percentile, errors under one percent. Not "it should be fast". And it's agreed by
      whoever owns the campaign and the tech lead who'd have to fix it, with me, in
      writing.

      If nobody answers, I don't stop. Take today's peak, scale it by what the campaign
      reaches, write it down as my assumption, and go and find where it breaks. Then
      report that number: it degrades at 300 concurrent, the SMS goes to 50,000 — let them
      decide.
    expected:
