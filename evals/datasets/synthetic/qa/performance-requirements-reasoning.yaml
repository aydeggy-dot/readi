  - kind: weak
    text: |
      Okay, so for a campaign like that, I would need to know how many users are expected.
      That's the main thing. If they can tell me the number of users then I can plan the
      test around it. Then I would do performance testing. I'd use JMeter, create a test
      plan with that number of users, and run it and see whether the system can handle it.
      If the response times are okay then we can say it will hold up. What the pass mark
      should state — it should say the response time should be acceptable, and the system
      shouldn't crash. Users don't like waiting, so if pages are loading fast and nothing
      is breaking, then we pass. And it should be agreed with the manager, or the project
      manager, whoever is in charge. And if there's no answer to any of that... then I'd
      escalate it. I'd send a mail and explain that without the information I can't do the
      testing properly, and let them know the risk is on them. Because if I just guess and
      then it fails during the campaign, they'll come back to me. So I'd rather get it in
      writing before I start.
