  - kind: fluent-but-wrong
    text: |
      Honestly, you can plan this without waiting on anybody. Pull the number of
      registered users from the database — say it's forty thousand — and that's your load.
      Use forty thousand threads in JMeter with a ramp-up, because worst case is everybody
      comes in together, and if it survives the worst case, anything smaller is covered.
      That's the whole point of load testing, you test the ceiling. And you run it against
      production. People are nervous about that, but it's the only environment that's real
      — same database size, same server. You just do it at night, like 1 a.m. when nobody
      is on, so real users aren't affected and your numbers aren't polluted by their
      traffic. For the pass mark, the industry standard is average response time under two
      seconds, and under three for anything heavy like a search. That's well established,
      so I don't really need the business to agree a number with me — they'd just be
      guessing anyway. What I'd take to them is the report afterwards. So if nobody
      answers my questions, it doesn't block me. I run the forty thousand against
      production overnight, check the averages against the two-second standard, and if the
      average is under two seconds, I sign it off and say we're good for the campaign.
