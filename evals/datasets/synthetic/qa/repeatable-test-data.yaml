      every run starts from the same clean state it started from the first time. And I'd
      specifically not go the random-email route, even though people suggest it, for two reasons.
      One, you're generating junk — run it a thousand times in CI and you've got a thousand
      abandoned accounts, and eventually somebody's cleaning that up by hand. Two, and this is the
      real one, you lose reproducibility. With a fixed email I can open the database after a
      failure and look at exactly the row the test touched. With a random one I don't know which
      of a thousand rows was mine. Fixed data plus proper teardown is the disciplined version.
      Emptying the whole database is that same idea taken too far — same benefit, much slower.
