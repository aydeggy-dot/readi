  - kind: strong
    text: |
      So the email is hardcoded — "tester@example.com" — and the first run registered it. Second
      run, createUser tries the same email again and the app correctly says that one is already
      taken, so it fails on line one. Which is right, actually. The app is fine, the test is what's
      wrong. The test only works on a database where that email doesn't exist yet, and after the
      first run, that's no longer true. So the fix is to make the email different every time.
      Something like tester plus a timestamp at example dot com, or a random string, so every run
      has its own user that nothing else has claimed. And the nice thing is the last line still
      works, because it counts by that same email — I'd just pass the generated one through
      instead of the literal. I could also delete the user at the end, but I prefer unique,
      because if the test crashes in the middle, the delete never runs and I'm stuck again.
      Emptying the database before every run — it's slow, and I'd lose the job. "the-lagos-one"
      lives in the database too, so I'd wipe the thing I'm applying to and have to put it back
      every time.
