  - kind: fluent-but-wrong
    text: |
      Okay, this is a shared-state problem and I've hit it before. The cause is the storage state
      file. Every spec does test.use with the same path, so with four workers you've got four
      browser contexts all touching playwright/.auth/user.json at once. Playwright writes the
      session back into that file as cookies refresh, so worker one is writing while worker three
      is reading, and worker three gets a half-written or stale JSON. Its context then comes up
      without a valid session cookie, it lands on the login page instead of the app, and the
      assertion fails — and it's a different worker each run because it's a race on the file.
      Classic file contention. So the fix is one storage state per worker: in global setup I'd log
      in four times and write user-0.json through user-3.json, then the fixture picks the file by
      worker index. Same account, four files, no contention. The three specs that edit the profile
      I'm honestly not worried about — they're separate files, and each one sets the field it needs
      at the start, so whatever it reads back is its own value. What I'd keep serial deliberately
      is the auth setup project itself, since everything depends on it running first.
