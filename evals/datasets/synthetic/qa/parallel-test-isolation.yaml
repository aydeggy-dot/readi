# **Criterion 2 has no rung for the `weak` answer.** Rung 2 is "each test needs its own data, with
# nothing about the account"; this answer is the mirror image — four accounts, one per spec, with
# nothing about the data — and it is offered conditionally ("I'm not sure how you tell Playwright
# which one to use"). Rung 3 requires the worker index, created data and assertions about it, none of
# which is there; rung 0 is "run it serially", which is the answer's first instinct but not all it
# says. 2 is the symmetric number, not a descriptor that fits.
answers:
  - kind: strong
    text: |
      Right — so with one worker the tests run in a line. Test A changes the profile name, it
      finishes, then test B runs and changes it again, and nobody ever sees the middle. With four
      workers they're all in there at the same time, on the same account, so test B reads the name
      while test A is halfway through changing it. That's why it's different ones failing every run
      — it's timing, it's whoever gets there first. The storage state isn't really the problem;
      the problem is that all four workers are signed in as one user and three of the specs are
      writing to that user's profile. So the fix is an account each. Ideally a fresh one per test —
      a fixture that registers a new user over the API, signs it in, and hands that test its own
      storageState. Or at minimum a pool, one account per worker, so worker two never touches
      worker three's row. And each test should create what it needs rather than expecting what's
      already there. What I'd keep serial on purpose is anything genuinely global — a test that
      flips a system-wide setting, or one that needs a clean database. Give those their own file
      with describe.serial instead of trying to isolate something that can't be isolated.
    expected:
      - dimension: Why running in parallel changes the result
