      Right, so I'd separate severity from priority. Severity is technical impact, priority is
      the business call. On severity, B is a one — the application terminates. There's no
      workaround for a crash, the session is gone, and if it's showing up on 2G, that's most of
      our users in Nigeria. So it's two of six today, but that's a third of the testers, which is
      a higher hit rate than people give it credit for.
      A I'd put at two, maybe three, and the reason is the consistency. The charge and the
      receipt agree. When the stored value and the displayed value match, you're looking at a
      presentation-layer issue, not data corruption — that fifty naira is almost certainly a
      rounding rule or a VAT or discount setting, not a code defect, and configuration isn't a
      release blocker, you change it from the back office.
      So B takes tomorrow's slot. For A I'd write it up as a calculation query for the business
      analyst to confirm the expected rule first, because you can't call it a defect until
      somebody tells you what the total is supposed to be. And whichever one misses the release
      gets closed as deferred, and we reopen it if production sees it.
