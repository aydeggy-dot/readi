question: the-pipeline-has-been-red
answers:
  - kind: strong
    text: |
      First thing, I'd stop calling it the usual one. I'd open the runs, actually read the failure, find
      the first run where it started — three days ago — and see what went in around then. Because the
      usual one is a story nobody has checked since day one, and that same message can be sitting on top
      of a second, newer failure.
      Then: is it the test or the product? If the product is genuinely broken, that's an outage waiting.
      If the test is wrong, fix it, and if it can't be fixed today, switch it off openly — a ticket, a
      name, a date — rather than everybody quietly ignoring it.
      What it's costing them that they haven't counted is the signal. For three days nobody can tell a
      new break from the old one, so everything merged in that window is effectively untested, and when
      a bug shows up you can't say which change caused it — you're reading three days of commits instead
      of one. And the habit: once people learn to merge over red, they'll do it when it's real.
      Then a short note — which check, the first failing run, the message, what changed near it, how
      many merges since — in the team channel with the lead tagged, not a DM.
    expected:
      - dimension: "Deals with the failure itself first"
        score: 3
        because: 'Level 3 — reads the failure, finds the first failing run and what went in around it, and separates the two cases: a wrong test (fixed, or switched off openly with a ticket, a name and a date) or a genuinely broken product, "an outage waiting". It does not say which it would assume until shown otherwise.'
      - dimension: "What the team is losing"
        score: 4
        because: 'Level 4 — nothing after the failing step is believed, so three days of merges are effectively untested, and the habit is named as the more expensive loss: "once people learn to merge over red, they''ll do it when it''s real".'
