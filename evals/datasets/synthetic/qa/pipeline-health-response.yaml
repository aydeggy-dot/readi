    text: |
      Three days is too long, that's the first thing. I'd... ehm, I'd rerun the build first,
      because sometimes it's just a network thing and when you run it again it passes. If it
      still fails, then I'd open the log and look at the error.
      Honestly I might not understand the error myself, so I'd ask the developer who owns that
      part, or my lead, and see if they can explain what it means.
      What it's costing — time, I think. People are waiting for the build and the build is
      failing, so that's wasted time. And it doesn't look good, if a client or somebody sees that
      everything is red.
      For writing it down, I'd send a message in the group that the checks have been failing for
      three days and can somebody please look at it. Maybe an email to the lead too. And I'd put
      it in my daily report so it's documented, because if something goes wrong later, at least
      nobody can say I didn't raise it.
