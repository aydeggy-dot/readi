  - kind: fluent-but-wrong
    text: |
      Okay, my rule is the build must be green. A red build everyone ignores is worse than no
      build at all, so job one is getting it green today and investigating at leisure.
      And the clue here is that it's the same failure for three days. A real product defect
      doesn't behave like that — a real defect gets noticed, somebody fixes it, it moves. When a
      failure is stable and identical across three days and across different people's changes,
      it's environmental: the agent, the network, a timeout. So I'd put a retry on it, two
      attempts, because a test that passes on retry was never a real failure. If it still fails,
      I mark that check as allowed to fail, or skip it with a tag, and the pipeline goes green.
      That restores the signal immediately, because now a new failure shows up on its own instead
      of being buried under the old red.
      On cost, the risk is lower than people make out, because nothing ships on the automated
      checks alone — we still do a manual pass before release, so quality is covered. The cost is
      developer time and confidence, mainly.
      And I'd write it up for the DevOps person, since it's their environment, and hand them the
      skipped check to fix when they've got time.
