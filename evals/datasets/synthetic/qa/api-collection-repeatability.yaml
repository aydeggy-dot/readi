  - kind: strong
    text: |
      What stops it running without me is me. Request one, the tester copies the token out and
      pastes it into the next six — that's a person, so nothing can run it at night. Same with the
      job id going into request three and the delete at seven. And then the bigger thing: no
      request checks its response. So even if it ran, it can't tell you it passed. It just... ran.
      To change it — request one saves the token into a variable, and the other requests reference
      that variable in the header instead of a pasted string. Request two captures the id from its
      response into a variable, and three and seven use that. Then I'd add checks on each one:
      status code first, and then something real — that login actually returned a token, that the
      application came back with my job id. And the job it creates should have a unique name each
      run, so yesterday's leftover doesn't collide. Also the password shouldn't sit in the file.
      What I wouldn't automate — whether the error messages actually make sense to a person, and a
      brand-new endpoint the first time. That one I want to poke by hand before I write anything.
