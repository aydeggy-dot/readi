  - kind: fluent-but-wrong
    text: |
      The fragility here is the session, mainly. The token in request one is short-lived — that's
      why it works when a person drives it and dies otherwise, because a person pastes a fresh one
      and a scheduler is running against an hour-old token. So my fix is to take the token out of
      the run entirely: ask the backend team for a long-lived service token, put it in an
      environment variable once, and delete request one. One less moving part. Then the ids. I'd
      stop creating the job at all and point request three at a fixed job that's seeded in the
      test environment — a hardcoded id is far more stable than a captured one, because a captured
      id depends on request two having succeeded, and now nothing depends on anything. Drop
      request seven too, since we're not creating anything to clean up. On the assertions, I'd say
      the collection already has them implicitly: the runner fails the run on any non-2xx. That's
      your check. Writing "expect 200" on top of that is duplicating what the tool does for free.
      What I still wouldn't automate is the response bodies — reading those is a human judgement
      call.
    expected:
