  - kind: fluent-but-wrong
    text: |
      Right, so my approach here is defect probability. Bugs aren't spread evenly, they cluster,
      so I want my twelve where the bugs actually are. And the core flows — login, checkout, the
      happy path — the developers run those constantly, they've got unit tests underneath them,
      and every other test exercises them as a side effect anyway. So spending my twelve there is
      wasted effort. I'd spend them on the edges: boundary values, awkward inputs, error handling,
      the screens nobody looks at, because that's untrodden ground and that's where the defect
      density is. The happy path is honestly the one part of the product I'm confident in without
      testing it. Then for the twenty-eight, I'd check when each one last ran. If a case passed in
      the last release and the code under it didn't change, it's low risk — a regression test
      mostly confirms what it already confirmed. So what I'd tell the release group is: twelve
      executed, twenty-eight previously passing, residual risk low. That's a defensible position,
      and it's the twelve highest-yield cases, not just the twelve easiest.
