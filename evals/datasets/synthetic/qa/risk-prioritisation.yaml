    text: |
      Okay so — twelve out of forty. I wouldn't just take the first twelve on the list. I'd pick by
      what hurts most if it breaks. So sign-in first, because if people can't get in, nothing else
      matters. Then whatever touches money — for us that was checkout and the payment callback.
      Then the thing that actually changed in this release, and the screens around it, because
      that's where new bugs live. And then one or two that broke last time, since those come back.
      What I'd drop is the cosmetic stuff, the admin screens two people use, and anything nobody
      touched. For the twenty-eight I'd be specific — I wouldn't say "we tested everything." I'd
      say: these twelve we ran, they passed, these twenty-eight we didn't run at all, and here's
      what could be sitting inside them. Like, we didn't check the statement export, so if that's
      broken you'll hear it from customers on Monday. Then they decide. That's their call, not
      mine — but they should make it knowing.
