    text: |
      So the diagnosis here is duplication, not speed. Fifty minutes almost always means the pyramid is upside down — too much weight at the top. And the rule of the pyramid is that a behaviour is covered at exactly one level: if a unit test already covers the validation on the application form, then the end-to-end test that fills that form in is exercising the same code path a second time, and the second one is pure cost, no new information. So what I'd do is map every end-to-end test onto the unit tests underneath it, and wherever the path is already covered, I delete the end-to-end one. In practice that's most of them, and that's fine. Once line coverage is over eighty percent, the integration and end-to-end layers aren't telling you anything the unit tests didn't — they're just adding minutes and flake. So the quick check becomes unit only, about four minutes, and the browser suite runs the night before a release. And the failure that lands after the change went in — realistically, most overnight failures are environment or flake rather than real defects, so the process is: rerun it, and if it's still red on the second run, then somebody investigates.
