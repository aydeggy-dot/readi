rubric: exploratory-charter
question: an-hour-with-a-new-feature
answers:
  - kind: strong
    text: |
      First thing, before I touch it, I'd get five minutes with the developer — what does
      this screen do, what's a job alert supposed to do, what's risky, what didn't you
      finish. And I'd work out what the worst thing that could happen is. For job alerts
      the worst things are: somebody gets alerts for jobs they never asked for, somebody
      gets none at all, or they get the same one twenty times. So that's where the hour
      goes. Then I'd split the hour — not one long free-for-all. Four sessions of about
      twelve minutes, each with a mission: create an alert, the happy path; then the
      criteria, empty ones, everything selected, strange ones; then edit and delete, and
      does the old alert stop; then small screen and slow network. And I'd keep the last
      ten minutes for writing, not testing. I'd write as I go, exact steps and
      screenshots, because I won't remember. What I leave behind is one page: what I
      covered, and what I did not cover — that one matters most, because that's the risk
      they're accepting. Then the bugs, with steps and how bad each one is. Then a plain
      recommendation — ship it, ship it with this known issue, or don't ship, and why. So
      they don't need me awake.
    expected:
      - dimension: Goes in with a plan that is not a script
        score: 3
