  - kind: fluent-but-wrong
    text: |
      Right, so this is exploratory testing, and the discipline in exploratory testing is
      that you go in with no preconceptions. That's the whole point of it — it's
      unscripted by definition, so anything I decide before I touch the screen turns it
      back into scripted testing and I lose the one thing that makes it valuable, which is
      finding what nobody thought of. So before touching it I'd deliberately decide
      nothing. I wouldn't read the ticket, I wouldn't talk to the developer, because the
      moment he tells me what it's supposed to do I'm only checking his expectations and
      I'm blind to everything outside them. Fresh eyes, no oracle. During the hour I also
      wouldn't stop to write, because writing breaks the flow and exploration needs flow —
      I'd stay in the screen the whole sixty minutes and write it up afterwards from
      memory, which is fine, you remember the bugs that mattered. And on the decision:
      exploratory testing isn't repeatable and it has no coverage figure, so it can't
      support a go or no-go. I'd say that honestly in my note — I can't sign anything off
      from an exploratory session. Hold the release until I'm back and can write proper
      test cases against it.
