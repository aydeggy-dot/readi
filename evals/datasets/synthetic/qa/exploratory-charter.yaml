  - kind: weak
    text: |
      Okay, one hour. So I'd start testing immediately, because one hour is not much time.
      I'll open the screen and click everything on it — all the buttons, all the dropdowns
      — and try to create the job alert and see if it works. Then I'll put wrong things
      inside and see if it gives error. Then I'd check the design, whether the alignment
      and the spelling are correct, because those ones you can see quickly. Any bug I find
      I'll screenshot it and paste it into a document, and at the end I'll send the
      document to the developer so he can fix them. Before touching anything... erm, I'd
      make sure I have a login and the environment is actually working, that's the main
      thing, because sometimes you waste twenty minutes on that. And what I'd leave behind
      is the bug list, that document. So whoever is deciding will look at the bugs, and if
      the bugs are plenty then they know it's not ready, and if there's no bug then it's
      fine to release. Honestly one hour is small for a whole screen, so I'd tell them the
      proper thing is to give me time to write test cases first, but if it's one hour then
      it's the bug list.
