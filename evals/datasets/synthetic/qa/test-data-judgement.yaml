      So — I'd say no to the copy. Politely, but no. The thing is, once it's in the test database
      it's still real people's money. Real names, real transactions, and now it's on my laptop, in
      a database with a weak password because it's only test, that the whole team can reach, and
      that somebody will dump and send around when they're debugging. If it leaks, that's not a
      test problem, that's a customer whose statement a stranger read. And there's the other side —
      I might trigger something. If the test environment is still pointing at a real email service,
      I've just sent five hundred real customers a statement email at two in the morning. That has
      happened to people. So instead I'd generate it. Five hundred customers is a script, honestly
      — a seed script with a library that makes fake names and account numbers, and then I write
      the transaction histories on purpose: one customer with two hundred transactions so I can see
      the pagination, one with zero, one with a refund, one with a huge amount to see if the
      formatting breaks. That's better than live data anyway, because live data mostly won't have
      my edge cases in it.
