      So I'd look at the driver before I look at the app, because the symptom points at the harness. On the emulator, UiAutomator2 is talking to adb over the loopback interface — it's all on one machine, so the round trip on every command is sub-millisecond. On a real device those same commands leave the laptop and go over USB, or worse over wifi if it's connected that way, so every single find, every tap, every getText now carries real transport latency. Appium issues a lot of commands per step, so that adds up fast, and the session hits newCommandTimeout mid-step and the driver tears down the context. The data screens look worse simply because they have the most elements, so the most commands. So the fix is at the harness level: raise newCommandTimeout, switch to adb over TCP so you're not bottlenecked on the USB stack, and keep the driver session alive between tests instead of a fresh session each time. I wouldn't touch the waits in the tests — the waits are fine, they were never the problem. And to your last question, none of these would be the product's. The app is doing the same work on both; it's the automation channel that changed, so this is our infrastructure to fix, not a defect to raise.
