      So the emulator isn't a phone, it's my laptop pretending. It's my laptop's processor and connection, so a request comes back almost immediately. A real mid-range Android is a slower chip, less RAM, real mobile data with proper latency, a smaller screen at a different density so things sit off-screen and need scrolling, and an OS with its own ideas — battery saver, permission dialogs, other apps eating memory in the background. That's exactly why the data screens are the ones failing: the call that took two hundred milliseconds now takes three or four seconds, and the assertion runs before the list has painted. On the tests: wait for the element or the state, not a sleep, and give the data screens explicit waits; scroll to an element before touching it; use accessibility ids instead of xpath positions; handle the permission popups; reset the app between tests. On where they run: the emulator stays for the quick loop while I'm writing, but the suite has to run on at least one real mid-range phone, the kind our candidates actually carry, and on a throttled connection. And which failures are the product's: fifteen seconds with no loading state, a timeout with no error message, losing what the user typed when a call comes in. Those I raise as defects.
