    text: |
      Okay, so reading it — you click the thing with the apply test id, then cy.wait three thousand, then you get the confirmation and check it contains "Application sent". The problem is the three thousand is waiting on the clock, not on the app. It's not asking "is the confirmation there yet", it's just sleeping for three seconds. On my machine that's plenty, the request comes back fast. On the shared runner the box is busy, the backend is slower, so one time in five the confirmation still isn't rendered when the three seconds is up, and the next command fails. And even when it passes it's wasting three seconds every single run. So — delete the wait. Cypress already retries: the get with the should keeps re-querying until it times out, so the assertion is the wait, and if that flow is genuinely slow I give that one command a longer timeout instead of a sleep. Better still, cy.intercept the POST, alias it, cy.wait on the alias, then assert — now I'm waiting for the actual response. And where a wait still belongs: on an aliased request like that, and as a last resort where there's genuinely no signal to watch — a debounce, an animation, some third-party widget — with a comment saying why it's there.
