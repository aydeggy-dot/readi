      Right, so this is a retry-ability problem, and the mechanism matters. Cypress does retry the assertion, but what it retries against is the element it already found. And what's happening here is that the confirmation node is in the DOM before the app has finished hydrating it. So the element exists — Cypress finds it, so it stops looking — but it isn't interactive yet, and the text is still the placeholder that came down from the server render. The assertion then runs against that stale reference and fails. On my machine hydration finishes well inside the three seconds so you never see it. On the shared runner it takes longer, and that's your one in five. So the fix is two things. One, give it room: I'd take the wait up to eight, maybe ten seconds, because a fixed wait only has to be bigger than the slowest machine you own, and a wait that's long but passing costs you nothing but time. Two, put a should be visible on the element before the contain, so you know it's live before you read its text. I wouldn't remove the fixed wait, though. It's the only thing covering hydration, because hydration isn't something Cypress can see.
