    text: |
      Okay. I wouldn't reopen it with nothing new, because honestly, nobody could
      reproduce this from what's written. So first I'd go and find out: does it happen
      every time, or only on a job you already applied for? That last line about having
      already applied for that job earlier — that's the most useful thing in the report,
      and it's buried at the bottom of Actual. I'd retest it: fresh job, apply once, then
      the same job again. If it only fails the second time, we have a reproducible bug and
      the steps are just written wrong. Then, seen versus guessed. Seen is: tapped Submit,
      nothing happened, after a few seconds I was back on the job list. Guessed is the
      connection to the earlier application — she's assuming that's the cause, and she may
      be right, but that's a theory. And "Expected: it should work" isn't an expectation.
      It should say what should happen — a confirmation screen, the job showing in My
      Applications. What I'd want attached: a screen recording, the exact time so backend
      can find that request in the logs, which account, and whether she was on data or
      WiFi. And the developer should say which device and which build he tried, because
      "my device" isn't information.
    expected:
      - dimension: "Reproducible by someone else"
        score: 4
