  - kind: fluent-but-wrong
    text: |
      Right, so the detail that jumps out at me is "nothing happens, and after a while the
      app goes back to the job list." That's not a failed submit. That's the activity
      being destroyed and the app coming back up on its last screen. That's Android
      killing the process, and on a Tecno Spark that's nearly always HiOS battery
      management — it's very aggressive about anything holding a connection open for a few
      seconds. So the mechanism is clear enough: Submit is a long call, the OS reclaims
      the process, the activity is recreated on Jobs. Which means what I'd go and find out
      is whether it reproduces on any other device — a Samsung, an Infinix. If it's only
      the Tecno, then it's an environment defect, not a product defect, and the right
      thing is to reclassify it as device-specific and bring the severity down from
      Critical to Medium, because severity is about how many users are hit and this is one
      device family. Seen versus guessed — everything in the Actual is seen, that part's
      fine. And what I'd attach is the battery optimisation settings and a memory dump, so
      the developer can see it isn't his code. That note about applying earlier, I'd take
      out. It's noise, and it's what made him stop trusting the report.
