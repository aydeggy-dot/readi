  - kind: strong
    text: |
      One in four isn't random, that's a pattern, so I wouldn't agree to flaky yet — flaky is a
      conclusion, and we haven't done the work for it.
      First, numbers: run it in the pipeline twenty times, write down which ones failed, and run it
      locally twenty times too, because "it passes on my machine" usually means three runs. Then see
      whether the failures cluster — same machine, same time, same tests running alongside — and compare
      a failing run with a passing one, error, screenshot, timestamps.
      What I'm looking for: speed first — that machine is loaded, so anything waiting a fixed amount of
      time loses the race over there and wins on mine. Then shared data: if tests run in parallel and
      two use the same account, they step on each other. Leftover state from whatever ran before, so I'd
      run it on its own as well. And whether that environment is shared.
      And the one people skip — the product might genuinely be intermittent. A race in the app looks
      exactly like a flaky test, and marking it flaky throws away the only thing that noticed.
      To the team: the table of runs, the step it dies on, the difference I found, and either the fix
      or, if we park it, a ticket with an owner.
