  - kind: fluent-but-wrong
    text: |
      Okay, intermittent is nearly always a synchronisation problem, and I can show that. Look at
      the maths — three out of four runs pass. If the application had a genuine defect it would
      fail every time; defects are deterministic, that's what makes them defects. So the variable
      can't be the product, it has to be the test's timing against a slower machine.
      So before I agree it's flaky, I'd prove that properly. I'd add a retry, two attempts, and
      run it fifty times. If it passes on the retry, that's the evidence: a failure that clears
      on retry is by definition a test failure and not a product failure, and then nobody has to
      argue about it.
      The difference between the two places is machine speed, basically. My laptop renders faster
      than a shared runner, so any implicit wait tuned to my machine runs out over there. So the
      fix is explicit waits where I can write them, and where I can't, raise the global timeout —
      ten seconds to thirty — plus a small sleep before the assertion.
      And what I'd put in front of the team is the fifty-run report with zero failures after the
      retry and the timeout change. Then it isn't flaky any more, it's fixed, and we don't
      quarantine anything.
