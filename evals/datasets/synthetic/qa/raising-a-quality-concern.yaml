answers:
  - kind: strong
    text: |
      Okay so — this was a group project at the end of my bootcamp. We built a small e-commerce
      thing and we were demoing it to the cohort and some guests on the Friday. Thursday night I
      was going through it and I found that if you changed the quantity on the cart page to a
      negative number, the total went negative. So the order would go through as a credit. And
      nothing was stopping it, not on the page and not on the server. I messaged the guy who wrote
      the cart, on WhatsApp, and I sent the steps and a screenshot so he could see it himself —
      because the first time I reported something without steps he couldn't reproduce it and it
      just died there. Then I told our team lead and I said it plainly: I don't think we should
      demo checkout with this in it. He asked how long to fix, the guy said an hour, so they fixed
      it that night — a check on the server, not just on the input box, because I asked whether
      hiding it in the UI was enough and it wasn't. We demoed on the Friday. I did feel awkward
      raising it the night before, like I was the one creating problems. But nobody minded — less
      than I expected.
