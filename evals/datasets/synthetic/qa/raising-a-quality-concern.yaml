    text: |
      Yeah, I've got a good one. At my internship we were shipping a payments integration on a
      Friday — the whole thing was built around a partner launch, so the date was fixed. On the
      Wednesday our QA lead, Ifeoma, found that a failed card payment was still marking the order
      as paid. Silent failure, no error shown to the customer, order goes straight to fulfilment.
      She took it to the product manager and she was very clear: she said we are not shipping this,
      if we ship it we're sending out goods for money we never collected. And she put a number on
      it, she worked out roughly how many orders a day that would be. There was a real argument in
      standup, the PM wanted to ship it with a manual reconciliation every morning as a workaround,
      and she said no, manual checks fail on the second day. In the end she won and the launch
      moved to the Tuesday. It made a big impression on me — the way she never made it personal,
      she just made the cost of the bug impossible to ignore. That's how I'd want to handle it.
    expected:
