  - kind: fluent-but-wrong
    text: |
      Yeah, I've seen this exact thing before. The problem is `exists`. An existence check only asks
      whether the element is in the DOM — it doesn't ask whether the user can see it. Modern apps
      render the whole shell up front and then hide the parts you're not entitled to, with display
      none or a zero-height container, so `#app-header` is sitting in the DOM from the moment the
      page loads, whether sign-in worked or not. The assertion passes on a node nobody can see. So
      the fix is a visibility assertion instead of a presence one — assert the header is visible,
      and ideally that it's rendered with an actual size, because that's the difference between
      "the markup is there" and "the user is signed in." That one change turns it into a real test.
      What else I'd change — the three-second sleep obviously, replace it with a wait on that same
      visibility condition, it's really the same fix. And the credentials should come from
      environment variables, not be typed into the spec. But the core bug is presence versus
      visibility. People write `exists` because it's the first thing in the docs.
    expected:
