      The conclusion is the opposite of what the run shows. Ninety-five percent failed —
      it didn't handle a thousand users, it fell over at a thousand. And the 240
      milliseconds is the average of the 920 that survived. That's a survivors' average;
      the seventeen thousand that timed out were slow, they just aren't in it. Then the
      bigger problem: the load came from one laptop on a shared connection. A thousand
      threads from one machine runs out of CPU and sockets before the API breaks a sweat,
      and connection reset and timeout are exactly what a saturated client and a saturated
      uplink look like. So I can't even say the failures were the server's. And two
      minutes, all starting at once, no ramp, no steady state, so you can't see where it
      broke. Before re-running: generate the load from a machine with headroom, more than
      one if we can, and calibrate first against a trivial endpoint to prove the harness
      isn't the bottleneck. Then ramp in steps, hold each step, add think time, and watch
      the server — CPU, memory, DB connections — not just the client. Agree the pass
      criterion first. And report percentiles: p50, p95, p99 and max, plus the error rate,
      the actual throughput, and the highest step where errors stayed near zero. That's
      the capacity.
