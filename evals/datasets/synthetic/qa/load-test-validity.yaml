      reset and timeout aren't server failures — the server accepted those connections and
      is still working on them, they're sitting in the accept queue. What failed is the
      client giving up. The tool's default socket timeout is a few seconds, and under a
      thousand concurrent users the queue is naturally deeper than that, so the tool
      abandons requests the API would have answered. Those are false negatives, not
      errors. So the fix is on the harness: raise the socket timeout to sixty seconds,
      increase the connection pool, and those seventeen thousand become successes with
      long-but-valid response times. Then the average is honest, because it's over the
      full population instead of a subset. Second correction, on capacity: with a 5%
      success rate at a thousand users, supported concurrency is 5% of that, so about
      fifty users. That's the number I'd publish, and it's a straight read of the
      arithmetic. One laptop is fine, by the way — a load generator barely touches CPU,
      it's all waiting on I/O, which is why one machine can drive thousands of virtual
      users. So: same run, longer timeouts, report the average over everything, plus the
      fifty-user figure.
