  - kind: fluent-but-wrong
    text: |
      Sure, let me take the interactions, that's where the design actually is. The one everybody
      misses is Resend against the attempt counter, and I've thought about this one. The rule says
      "after five wrong codes" — wrong codes. So the counter belongs to the code, not to the account.
      The moment you press Resend, the old code is dead, and a dead code can't be wrong anymore, so
      the count starts fresh at zero against the new code. That's the correct behaviour and that's
      what I'd assert: four wrong, Resend, one wrong, and I should still be in. If it locked me there
      I'd raise it as a defect, because I've only been wrong once against the code that's currently
      live — otherwise you're punishing a user whose first SMS came in garbled. Second interaction:
      the ten minutes should be measured on the device, since the SMS lands on the device, so I'd move
      the phone clock forward eleven minutes and expect the code to be rejected. If it still works,
      that's a bug in the expiry. And an expired code I'd expect to count as a wrong attempt, because
      the user did submit something invalid. Those three are my main cases.
