  - kind: strong
    text: |
      Okay — six digits by SMS, dies ten minutes after it's sent, a Resend, and five wrong codes locks
      the account for an hour. The digits are easy: correct code works, wrong fails, five digits,
      seven digits, letters, spaces, empty, pasting it in, and a code starting with zero, that the
      zero isn't eaten. Not about the digits: does the SMS arrive, and is the code in it the one the
      server expects, and how long does it take to land, because on bad network that ten minutes is
      spent waiting. Then time — 9:59 works, 10:01 doesn't, and whose clock is it? If it's the
      phone's, I can change my time and stay valid forever. And a code should work once only, even
      inside the ten minutes. Then where the rules touch each other, that's the interesting part.
      Resend against the ten minutes — does the old code die when the new one is sent, or are two
      codes live at once, and does Resend restart the ten minutes? Resend against the lock — if I've
      got four wrong and I press Resend, is my counter back to zero? Then the lock means nothing. And
      does an expired code count as one of my five? If it does, somebody on slow network gets locked
      for an hour for nothing.
    expected:
      - dimension: "Cases come from the rules"
        score: 3
        because: "Descriptor 3 — a case per class: correct code, wrong code, expired (9:59 / 10:01), not six digits (five, seven, letters, spaces, empty), plus reuse and a leading zero. A code issued for another number is the one class missing, and it never splits what the screen can decide from what only the server can, so not 4."
      - dimension: "The edges the rules create"
        score: 2
        because: Level 2 — brackets the expiry properly at nine fifty-nine and ten oh one, and gives the attempt counter no boundary case.
      - dimension: "Where the rules meet each other"
