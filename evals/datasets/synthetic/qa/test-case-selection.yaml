      too. And on how much is enough: equivalence partitioning says one value from a
      partition is equivalent to all of them, so two values per field is full coverage by
      definition. Three fields, two each, plus the happy path — seven cases, and that's
      mathematically complete. Anything past that is duplicate coverage.
