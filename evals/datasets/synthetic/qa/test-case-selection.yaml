      date picker, and the right design is for the picker to disable every date inside the
      last eighteen years. Once it does that, the under-eighteen partition is unreachable
      through the interface, so there's nothing to test there. I'd mark that case not
      applicable and take it off the list, because a case you cannot execute through the
      UI is not a valid test case. So all my age testing becomes: can I pick the boundary
