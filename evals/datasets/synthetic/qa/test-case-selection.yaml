  - kind: strong
    text: |
      Okay so, first thing, I'd split it into the three fields and then the form as a
      whole. Phone number — a valid Nigerian number, the 0803 one and the +234 version,
      then the ones that should fail: too short, too long, letters inside, spaces, and a
      number that has already registered. Password — I'd actually ask first what the rule
      is, minimum length, does it need a capital letter, because I can't test a rule
      nobody has told me. Then the empty one, one character under the minimum, exactly the
      minimum. Date of birth, that's the risky one, because eighteen is a product rule.
      So: exactly eighteen today, one day short of eighteen, one day over, a date in the
      future, and a leap-year birthday, 29 February. Then the things that aren't about the
      values — submit twice quickly, refresh halfway, press back after submitting, kill
      the data while it's submitting, use it on a small phone, paste into the fields
      instead of typing. And whether the password is showing in plain text. How do I know
      it's enough — every field should have a valid, an invalid and a boundary case, and I
      put the most cases where the risk is, which is the eighteen rule. When new cases
      stop telling me anything new, I stop.
