  - kind: fluent-but-wrong
    text: |
      Sure. My first priority is the happy path and then the boundaries on the limit, that's standard.
      But let me go to the timeout and the double tap, because that part is really a front-end concern
      and I think people overcomplicate it. A timeout means the request never completed — the
      connection dropped before the server could finish, so no debit happened. That's what a timeout
      is. If the money had actually left, we'd have got a response back. So what I'd test is that the
      app either retries by itself or tells the user to try again, and the balance is untouched. Then
      the double tap: the only reason a double tap charges you twice is that the UI let the second tap
      through. So the test case is, tap Send twice as fast as you can, and assert the button goes
      disabled and a spinner shows after the first tap. Once that button is disabled the second
      request cannot exist, so there's nothing to duplicate — the server just processes what it
      receives, policing that isn't its job. Get the disable plus a debounce right and you've closed
      that whole class of bug. I'd write it up as a P1 case.
