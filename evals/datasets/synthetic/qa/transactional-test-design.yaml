  - kind: strong
    text: |
      Okay so — the first thing I'd test is the plain successful transfer, and not because it's the
      easy one. It's because that's where the money is. If the amount that leaves is wrong, or it
      lands in the wrong account, or it debits twice, that's real money and you can't just reverse it
      with a code fix. So: valid account, valid amount, correct PIN, and then I'm checking three
      things — sender debited exactly once and exactly that amount, recipient credited the same, and
      the reference on the receipt matching the record. On the limit, I'd do 199,999, then 200,000
      itself, then 200,001, because "the limit is two hundred thousand" doesn't tell me whether two
      hundred thousand passes. And then the part people forget: it's a daily limit, so it's
      cumulative. 150k, then 60k — the second one should be refused. And when does the day reset,
      midnight on whose clock? And does a failed transfer still eat into it? PIN: wrong PIN, how many
      wrong ones before it locks, and the PIN not turning up in any log. For the timed-out one, or the
      double tap — before I touch anything I'd go to the transaction history and the sender's balance,
      and get the backend reference, so we can see whether one request hit the server or two.
    expected:
