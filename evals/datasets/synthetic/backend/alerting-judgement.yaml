      Um. So the thing you want is, it's a rate, not a number, that's the main thing. Because one
      in twelve of a small number is nothing and one in twelve of a big number is a lot, but the
      ratio is the same either way and the ratio is what's actually broken. So you'd count
      checkouts and count the ones that failed, and I'd split the failures up by where they came
      from, like was it us or was it the payment provider timing out, because that changes who
      you'd wake up. And then the alert — you compare failed over total for some window, ten,
      fifteen minutes, and if it's over a small percentage, one or two, it fires, and this one was
      at eight so it'd have gone off basically in the first hour. The window matters, too short
      and it's noisy, too long and it takes days, which is sort of the failure here. And the
      acting-on-it part — it has to page someone on call, with the endpoint in the title, and it
      has to not be crying wolf, otherwise people mute it.
