      Okay so first thing, monitoring. I'd add logging to the checkout endpoint so every error
      gets logged with the stack trace, and then we can search the logs when something goes wrong.
      I'd also set up Sentry or something like that, because Sentry emails you when there's an
      exception, so we'd have known on day one. For metrics I'd track CPU and memory and response
      time on the server, because usually when something's failing the server's under stress, and
      then you can see the spike on the dashboard. I'd set up a dashboard with those graphs and
      we'd check it, like, in the morning standup. Maybe also an uptime checker that pings the
      site every five minutes and emails us if it's down. For people acting on it — I think it's
      mostly about making sure the right person gets the email, so I'd add the team's email to the
      alert list. And write it down somewhere so people know what to do when it comes.
