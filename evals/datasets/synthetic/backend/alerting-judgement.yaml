  - kind: fluent-but-wrong
    text: |
      I'd frame this as an SLO problem. Set an availability objective on checkout — ninety-nine
      point nine — and alert on the error budget. The key thing people get wrong is the window:
      you want a thirty-day rolling window, because a longer window is more sensitive. A five-
      minute window only sees five minutes of traffic, so an eight percent failure rate is
      statistically indistinguishable from noise at that sample size, so you'd get constant false
      pages; over thirty days the same rate is unmistakable, so that's the window that would have
      caught this. Then I'd put the probe on the health endpoint — a synthetic check hitting
      `/health` every minute from outside — because checkout depends on the same database and
      payment client that `/health` exercises, so a real checkout failure surfaces there first,
      without instrumenting business logic. And for paging I'd use absolute error counts rather
      than a ratio: ratios are unstable at low traffic and page you at three in the morning
      because two of six requests failed. Five hundred errors in a day is a real incident; under
      that is background. Plus a runbook on the alert.
    expected:
