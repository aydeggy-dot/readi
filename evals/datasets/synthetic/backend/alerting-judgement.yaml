# `fluent-but-wrong` frames it as an SLO problem and then gets all three parts backwards: a
# thirty-day window argued to be *more* sensitive than five minutes, a synthetic probe on
# `/health` standing in for real checkout success, and absolute daily error counts preferred to a
# ratio. It is the most professional-sounding answer in the set and it would have caught nothing.
# 1/1/2 against `strong`'s 3/3/4.
answers:
  - kind: strong
    text: |
      The gap isn't that nothing was measured — it's that nothing was measured from the user's
      side. I'd want checkout emitting a count of requests broken down by outcome — success versus
      failure, and failures split by status and by which downstream failed, so payment provider
      timeouts don't look like our own bugs. From that you get a ratio, and the alert I'd write is
      on the ratio, not a count: if more than two percent of checkout attempts fail over a
      fifteen-minute window, page someone. One in twelve is eight percent, so that fires in
      fifteen minutes on day one, not three days later. I'd probably also want a burn-rate thing
      where a severe spike fires in five minutes and a slow leak fires over a few hours. For
      anyone to act on it — it has to go where a human is actually looking, so an on-call rotation
      with a real page, not a Slack channel that's already full of noise. It has to name the
      endpoint and link to the traces. And it has to be believable: if half the pages are nonsense
      people start ignoring it.
    expected:
      - dimension: Measures the right thing
