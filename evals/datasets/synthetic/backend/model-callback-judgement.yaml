question: rails-callback-that-did-too-much
# `fluent-but-wrong` blames row-lock contention — `after_save` running inside the transaction
# while SMTP is open — and prescribes `after_commit` plus one wrapping transaction, claiming Rails
# then batches four thousand deliveries into a single SMTP session. It also counts `after_commit`
# not firing under transactional fixtures as the fix for the slow tests, which is a test suite
# that stops exercising the behaviour. 1/1/1 against `strong`'s 4/4/3.
answers:
  - kind: strong
    text: |
      Right, so all three come from the same line. The after_save fires for every record, and
      deliver_now sends the email there and then, in the middle of the import — so four thousand
      records is four thousand SMTP calls one after another, each one a second or two waiting on
      the mail provider. That's your two hours, and that's also your four thousand emails, because
      an import isn't a sign-up and those vendors never asked us for anything. And the tests are
      slow for the same reason — every factory that creates a vendor is triggering the mailer, so
      a test that just wanted a vendor to exist is now doing mail work. What I'd do is take the
      email out of the model and put it where the sign-up actually happens — the controller, or a
      service object — so the import simply doesn't send. And use deliver_later so it's a
      background job, not the request. A callback is fine for things that belong to the record
      itself, like normalising a field or setting a slug before save. Not for reaching out to the
      world.
