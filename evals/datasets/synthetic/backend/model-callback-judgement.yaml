  - kind: fluent-but-wrong
    text: |
      So the bug is the hook, not the mail. after_save runs inside the wrapping transaction, and
      deliver_now opens its own SMTP connection while that transaction is still open — so every
      record holds a row lock for the full duration of the SMTP handshake. Four thousand records,
      four thousand handshakes, each one serialised behind the lock: that's your two hours. It's
      lock contention, not volume. The fix is one word, after_commit instead of after_save. Once
      it's after_commit, you can wrap the whole import in a single transaction, which means the
      callbacks all fire at the very end, on one connection — Rails batches the deliveries into
      that one SMTP session rather than opening four thousand, and the import drops to a couple of
      minutes. And it fixes the tests for free, which is the elegant part: transactional fixtures
      roll back, so after_commit never fires in the test suite at all, so nothing touches the
      mailer. Same model, same behaviour in production, one word changed.
    expected:
      - dimension: Traces all three symptoms to one cause
        score: 1
        because: All three traced to one mechanism the code does not have — row locks held across the SMTP handshake, "lock contention, not volume".
      - dimension: Gets it out of the save
        score: 1
        because: "`after_commit` instead of `after_save`: when it fires is narrowed, and it still fires for every save."
      - dimension: Says what a callback is for
        score: 1
        because: The rule offered is the fix restated, and the slow tests are "fixed" by the callback never running in them.
