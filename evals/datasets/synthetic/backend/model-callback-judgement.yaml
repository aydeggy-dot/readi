      Okay, so the emails — four thousand emails is too many, so I'd add a check so it doesn't
      send that many. Maybe a condition on the callback, like only send if the vendor is new, or
      add a flag you can set during the import to skip it, like skip_email equals true, and then
      in the import you set it. That would fix the emails. For the two hours, I think it's just a
      lot of records — four thousand records is big, so maybe you do it in batches, like insert
      them in chunks of five hundred so it's not all at once. And for the tests being slow, I'd
      mock the mailer in the tests so it doesn't actually try to send anything, because in tests
      you don't want to hit a real mail server anyway. So yeah, three fixes — a flag, batching,
      and stubbing the mailer in the test setup.
