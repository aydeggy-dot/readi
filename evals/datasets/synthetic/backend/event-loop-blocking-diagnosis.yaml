# `fluent-but-wrong` diagnoses connection-pool starvation — the connection held for the life of
# the handler, a default pool of ten, the health check queueing for one — and dismisses the
# synchronous map and join over eighty thousand rows as "microseconds per row, noise". It
# prescribes a bigger pool, an acquire timeout and a read replica. 1/1/1 against `strong`'s 4/4/4.
answers:
  - kind: strong
    text: |
      So Node runs all your JavaScript on one thread. The `await` on the query isn't the problem —
      that's I/O, it hands control back to the event loop while it waits. The problem is the two
      lines after it. The map over eighty thousand rows and then the join into one giant string,
      that's pure CPU, and it runs on the event loop with no yield in it. While it's running,
      nothing else moves. No other request gets picked up, no timer fires, and the health check
      handler doesn't run either, even though all it does is return okay — it's not slow, it just
      never gets a turn. So the probe times out, the platform decides the pod is dead and restarts
      it. And the restart kills the export too, so the person retries and we do it all again. What
      I'd change: stream it. Query with a cursor, transform row by row, pipe into the response.
      Small chunk, yield, next chunk. That fixes the memory too, because right now the rows and
      the whole CSV string are both in memory at once.
