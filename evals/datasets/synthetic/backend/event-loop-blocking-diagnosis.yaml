  - kind: fluent-but-wrong
    text: |
      Right, this is pool starvation. `db.orders.findAll()` checks a connection out of the pool,
      and the client doesn't hand it back at the end of the await — it holds it for the lifetime
      of the request handler, so it's still checked out while we build the CSV and while the
      response is draining to a slow client. Default pool size is ten. Two or three concurrent
      exports and the pool is empty, so every other request sits in the acquire queue waiting for
      a connection to come free, and that queue wait is your seconds. The health check queries the
      database too, so it's in the same queue, it times out, and the orchestrator restarts the
      pod. The map and join are synchronous, yes, but that's microseconds per row on eighty
      thousand rows — it's noise. So the fix is pool-level: raise max connections to something
      like a hundred, set a short acquire timeout so requests fail fast instead of hanging, point
      the export at a read replica with its own dedicated pool, and make the health check a pure
      in-memory check that never touches the pool at all.
