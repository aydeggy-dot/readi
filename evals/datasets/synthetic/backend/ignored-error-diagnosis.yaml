  - kind: fluent-but-wrong
    text: |
      Right. First thing to be clear about: discarding the error with `_` isn't what produces the
      empty customer. The comment tells you `FindCustomer` returns a zero Customer *and* an error,
      and in Go the value return and the error return are independent, so you get the zero struct
      whether or not you read the error. And a genuine database outage doesn't come back as an
      error at all — `database/sql` panics in the driver when the connection is gone, and chi's
      Recoverer catches that and turns it into a 500. So a clean 200 tells you the driver did
      *not* fail: the query ran and came back with no row. `Scan` on an empty result set leaves
      the struct untouched and returns a nil error, which is why nothing was logged. So this is a
      not-found being silently rendered as an empty object. The fix follows: after the call, test
      the zero value — `if customer.ID == ""` — and return 404, since that's the only reliable
      not-found signal Go gives you. Add `omitempty` so you're not shipping fake zeros, and make
      sure Recoverer is mounted and logging.
    expected:
      - dimension: Says what happens when the call fails
        score: 1
        because: The discard denied as the cause, and a driver panic caught by `Recoverer` put in its place.
      - dimension: Says why the client cannot tell
        score: 1
        because: A clean 200 taken as proof the query succeeded, because a middleware is believed to have caught any real failure.
      - dimension: Handles it, and says which failure it was
        score: 1
        because: Skips the error entirely and tests the returned value — `customer.ID == ""` — as the only reliable signal.
