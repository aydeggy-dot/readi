question: go-the-error-nobody-checked
# `fluent-but-wrong` denies that the discard is what produces the empty customer, claims a
# database outage panics in the driver and is caught by chi's `Recoverer` — so a 200 proves the
# query succeeded — and that `Scan` on an empty result returns a nil error. It therefore detects
# not-found by testing `customer.ID == ""` and never checks the error at all. 1/1/1 against
# `strong`'s 4/4/4.
answers:
  - kind: strong
    text: |
      So the `_` is throwing the error away. `FindCustomer` returns two things and the code says
      "I don't care about the second one." When the database is down it returns a zero Customer
      and an error, and because the error goes in the bin, `customer` is just the zero value —
      empty strings, zero balance — and that gets encoded straight out. And since nobody calls
      `WriteHeader`, the first write to the ResponseWriter sends a 200 automatically. So the
      client gets 200 and a customer that looks real but is empty, which is worse than an error,
      because now you might show somebody a zero balance. How I'd write it: take the error, `if
      err != nil`, log it with the id — server-side, not to the user — and return a 500 with a
      generic message. Not found has to be a different branch: the store gives back its own
      `ErrNotFound`, or a wrapped `sql.ErrNoRows`, and the handler does `errors.Is` and returns
      404. Two different errors, two different statuses, and neither of them 200.
