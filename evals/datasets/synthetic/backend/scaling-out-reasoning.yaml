  - kind: fluent-but-wrong
    text: |
      Sure. The thing that makes this straightforward is sticky sessions — you configure the load
      balancer with IP hash, so a given client always hashes to the same backend for the life of
      their connection to the site. Once you've done that, the two classic problems disappear. In-
      memory sessions are fine, because that user only ever touches the box holding their session.
      Local uploads are fine too, because the person who uploaded the file is the same person who
      requests it back, and they land on the same machine — so you keep the uploads folder local
      and just rsync it across nightly, purely as a backup. Database stays on box one, box two
      dials in over the private network, no change there. What I'd actually measure beforehand is
      DNS: drop the TTL on the record to sixty seconds a day ahead, because that's the real risk —
      clients pinned to the old single-server record while you cut over. Order: lower the TTL,
      build box two, enable IP hash, flip DNS.
