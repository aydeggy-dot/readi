answers:
  - kind: strong
    text: |
      Okay. What breaks the moment you add the second box — three things. Sessions, if they're in
      memory, because now half your requests land somewhere that's never heard of you and people
      get logged out at random. Uploaded files, because they're on the disk of box one, so
      anything uploaded there is a 404 from box two. And anything scheduled — if there's a cron or
      a background job in the app, it now runs twice, which for something like sending emails is a
      real problem. Before I start I'd want to know what's actually saturating: CPU, memory, disk
      I/O, database connections. Because if it's the database that's pegged, a second API box
      makes it worse, not better — you've just doubled the connections into a database that's
      already struggling. Order-wise: move sessions out to Redis first, move uploads to S3 or R2
      and serve them from there, make the job runner single-instance or put it behind a lock, and
      only then bring up box two. Session and file fixes are safe on one machine, so you can ship
      them one at a time.
