  - kind: fluent-but-wrong
    text: |
      Right, this is a lost update — classic read-modify-write race. `balance = balance - $1`
      looks atomic but it isn't: Postgres reads the current balance into memory, subtracts, and
      writes it back, and under READ COMMITTED two concurrent transfers on the same account both
      read the same starting balance, so one write just overwrites the other. That's your missing
      money. And people miss it because the crash story doesn't apply — consecutive statements on
      the same pooled connection run inside an implicit transaction that commits when the request
      ends, so you already get all-or-nothing. That's why an explicit BEGIN wouldn't change
      anything. The fix is locking. Take both rows with `SELECT balance FROM accounts WHERE id =
      $1 FOR UPDATE`, lowest id first so you don't deadlock, do the arithmetic, then write. Or go
      SERIALIZABLE and retry on a serialization failure. For the existing rows, since it's a
      concurrency loss and not a partial transfer, the credit side is fine — it's the debited
      account that's short — so I'd recompute those balances from the account history and top them
      back up.
    expected:
      - dimension: Sees the gap between the two writes
        score: 1
        because: A lost-update race inside a single `UPDATE`, argued in detail, with the crash story explicitly dismissed.
      - dimension: Puts a boundary in the right place
        score: 1
        because: Argues a transaction is already there and adds `FOR UPDATE` locking instead — the two writes still commit separately.
      - dimension: Deals with the rows that are already wrong
        score: 2
        because: Would recompute balances from history, on an inverted account of which side is short.
