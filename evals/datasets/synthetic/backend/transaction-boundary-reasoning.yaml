      Okay so the first thing is there's no transaction here. These are separate awaits, and each
      UPDATE is its own little transaction that commits on its own. So the debit commits, and then
      anything can go wrong before the credit — notify throws because the email provider is down,
      or the pod restarts mid-deploy — and the money's just gone. So, two changes. Wrap both
      updates in one transaction, begin, both updates, commit, so either both land or neither
      does. And move notify after the commit, because you don't want a flaky email service
      deciding whether money moves. Ideally you write a "notify this person" row in the same
      transaction and a worker picks it up. For the rows that are already wrong — honestly the
      problem is you can't find them, there's no record a transfer was even attempted, just two
      balance updates. So I'd add a transfers table, and for the existing damage I'd go to the
      notification logs and match debits that never got a matching credit, then correct them in a
      script that's idempotent, so running it twice doesn't pay somebody twice.
