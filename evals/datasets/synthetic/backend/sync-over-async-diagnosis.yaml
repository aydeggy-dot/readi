# The pairing this rubric had to survive: `fluent-but-wrong` gives the classic
# `SynchronizationContext` deadlock — which is the .NET Framework's failure, not ASP.NET Core's —
# and prescribes `ConfigureAwait(false).GetAwaiter().GetResult()` so the signature can stay
# synchronous. It scores 2 rather than 1 on criterion 1 because it is out of date rather than
# misunderstood, and it is what almost all freely available material still teaches. 2/1/1 against
# `strong`'s 4/3/4.
answers:
  - kind: strong
    text: |
      So `.Result` blocks. The request comes in on a thread-pool thread, that thread calls
      `.Result`, and then it just sits there doing nothing until the HTTP call to the rates
      service comes back — say two hundred milliseconds — and for that whole time the thread is
      parked and can't serve anybody else. Which is why CPU is flat. It's not working, it's
      waiting. Under test there's one request, so who cares. Under load, every concurrent request
      eats a thread, and once you're past the pool's current count, the pool only injects new
      threads slowly, one or two a second, so the queue builds up faster than it can grow, and
      latency goes through the floor for everybody, including the endpoints that were written
      properly. That's the bit people miss, it's not just this action that gets slow, it's the
      whole app, because they share the pool. The fix is to not block: make the action `public
      async Task<IActionResult> GetRates()` and `var rates = await _ratesClient.GetRatesAsync();`.
      Async all the way up, no `.Result`, no `.Wait()`. And I'd add an analyzer so nobody puts it
      back.
    expected:
      - dimension: Says what the thread is doing
        score: 4
        because: The thread is parked and cannot serve anybody else, which is why the CPU is flat — waiting, not working.
      - dimension: Says why it gets worse gradually
        score: 3
        because: The pool injects new threads slowly so the queue builds faster than capacity; does not say what that looks like from outside.
      - dimension: Awaits it properly, all the way down
