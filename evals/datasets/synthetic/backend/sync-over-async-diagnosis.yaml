  - kind: fluent-but-wrong
    text: |
      Classic sync-over-async deadlock. Here's the mechanism: when `GetRatesAsync` hits its first
      `await`, it captures the current SynchronizationContext — the ASP.NET request context — so
      it can resume on it. But the request context allows one thread in at a time, and that one
      thread is the one sitting in `.Result` holding it. So the continuation is queued onto a
      context that will never be free, and the request deadlocks until the HttpClient's hundred-
      second timeout fires and unwinds it. It's traffic-dependent because with light load the
      context is usually free enough that the continuation slips through; past a threshold
      contention on the context is constant and you deadlock most of the time. CPU is idle
      precisely because everyone is parked on the context, not running. The fix is to stop
      capturing it: `_ratesClient.GetRatesAsync().ConfigureAwait(false).GetAwaiter().GetResult()`
      here, and `ConfigureAwait(false)` on every await inside the rates client library. Once the
      continuation is free to resume on any pool thread the deadlock can't form, and you can keep
      the signature synchronous.
    expected:
      - dimension: Says what the thread is doing
        score: 2
        because: The classic deadlock and the captured synchronisation context — ASP.NET Core has none in request handling, so this is the old framework's failure. Out of date rather than misunderstood.
      - dimension: Says why it gets worse gradually
        score: 1
        because: Contention on a context that is not there, offered as why it is traffic-dependent.
      - dimension: Awaits it properly, all the way down
        score: 1
        because: "`ConfigureAwait(false).GetAwaiter().GetResult()` so the signature can stay synchronous — the blocking call kept and worked around."
