  - kind: fluent-but-wrong
    text: |
      Right, so this is file descriptor exhaustion, and it's a really common cascade. When the
      provider slowed down, your outbound HTTPS connections to them stopped closing — each one
      stayed open for thirty seconds instead of half a second, so you went from maybe ten open
      sockets at a time to several thousand. Every socket is a file descriptor, and the process
      has one table for all of them, inbound and outbound together. So once you hit the ulimit — a
      thousand and twenty-four by default on most boxes — accept() starts failing, and the server
      can't take a new inbound connection at all. That's exactly why the unrelated pages died: it
      was never about payments, it was the process being unable to open anything new. So the fix
      is at the socket layer. Raise the descriptor limit to sixty-five thousand, and put the
      payment client behind a keep-alive connection pool with a fixed maximum, so you reuse a
      handful of sockets instead of opening one per call. Timeouts wouldn't have saved you here,
      by the way — the connections were open and healthy, just slow.
    expected:
      - dimension: Says what the waiting requests are holding
        score: 1
        because: File descriptors running out, argued in full — a specific wrong resource, complete with the default ulimit.
      - dimension: Gives the call a deadline
        score: 0
        because: No deadline at all, and timeouts explicitly dismissed as irrelevant here.
      - dimension: Stops asking for a while
        score: 0
        because: A keep-alive pool so the sockets are reused; nothing ever stops calling.
  - kind: correct-poorly-explained
