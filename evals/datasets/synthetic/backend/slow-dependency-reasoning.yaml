    text: |
      Yeah, this one is threads, basically. Your API has a fixed number of workers — say you're
      running a pool of two hundred request threads. Normally a payment call takes half a second,
      so a thread is busy for half a second and goes back. Now each one is held for thirty
      seconds. So at even a handful of payment requests a second, within a minute or two every
      single thread in the pool is sitting there blocked, waiting on a socket. And a thread that's
      blocked can't serve the homepage, it can't serve the health check, it can't serve anything.
      That's why the whole API went, not just payments — they were all queuing for the same pool.
      The first thing I'd put in is an aggressive timeout on that client, like three seconds,
      connect and read, because no timeout means the default is basically forever. Then a circuit
      breaker, so after a run of slow calls we stop calling them for a bit and fail fast. And I'd
      want payments on their own pool or their own queue, so when they drown, they drown alone.
