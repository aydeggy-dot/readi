      left for the other pages, and that's what happened, they were all stuck on payments. Thirty
      seconds each. And if there was no timeout on the HTTP client, which there probably wasn't,
      because the default for a lot of them is no timeout, then the thread just waits, forever
      basically. So it fills up. What you'd want — a timeout, obviously, a couple of seconds, so
      the thread comes back. And then the circuit breaker thing, where if it keeps being slow you
      stop calling it for a minute and just return an error straight away, which is better than
      hanging. And ideally payments shouldn't be able to eat the threads that the rest of the site
      uses, so separate pools.
