# next touched. `fluent-but-wrong` queues the code and **returns success to the client**, so the
# one thing the rubric now scores hardest — not claiming something we do not know — it gets
# exactly backwards. 0/0/1 against `strong`'s 3/4/4.
answers:
  - kind: strong
    text: |
      Right. So first thing, the code should not retry this in the request. The person is standing
      there waiting, and if the provider is erroring for everybody, retrying just makes them wait
      longer and adds load. So: short timeout, one attempt, maybe a second one, and then give up
      fast. Fail closed — we don't let anybody in without the code, that's the whole point of the
      code. But we say so honestly. Not "something went wrong", which makes them think they typed
      their number wrong and try again five times. Something like, we can't send codes right now,
      it's us not you, try again in a few minutes — and if we have their email, offer to send it
      there instead, because a second channel is the real fix for this. Next time, what I'd want
      true: an alert that fires on send failure rate, not on somebody tweeting at us. A circuit
      breaker so we stop hammering a dead provider. And ideally a second SMS provider we can flip
      to with a config change, already tested, not tested for the first time during the outage.
    expected:
      - dimension: Says something we know to be true
        score: 3
        because: Says the codes cannot be sent and does not claim more; does not address whether one might still arrive.
      - dimension: Says whose problem it is
        score: 4
        because: '"It''s us not you" — and names what the vague version costs, because they will retype their number five times.'
      - dimension: Gives them something to do
        score: 4
        because: Try again in a few minutes, email as the other route in, and the sign-in still fails closed.
  - kind: weak
    text: |
      Okay so if the SMS provider is down, then the user can't sign in. I would first put it in a
      try-catch so the server doesn't crash, and log the error so we can see it. Then I'd probably
      retry, because sometimes it's a temporary thing and the second time it works. Maybe retry
      three times. If it still fails then show the user an error message saying please try again
      later. I think the main thing is not to crash. For next time... I'd want to know about it
      sooner, so maybe check the logs more often, or have the error go to Sentry so we get an
      email. Um. Could we maybe let the user in without the code if we know it's our fault? I'm
      not sure, that sounds like it might not be safe. Probably not. I'd ask the senior on the
      team what the policy is for that, honestly, because it's a security thing and I wouldn't
      want to decide it alone.
    expected:
