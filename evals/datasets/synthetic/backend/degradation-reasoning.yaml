question: what-happens-when-it-is-down
# `fluent-but-wrong` treats a one-time code as a delivery guarantee: it retries in-request with
# backoff up to sixty seconds, then queues the code and **returns success to the client**, extends
# the code's lifetime to an hour, and argues explicitly against a circuit breaker. Every one of
# those makes the outage worse, and the last one tells the user something untrue. 1/0/1 against
# `strong`'s 3/4/4.
answers:
  - kind: strong
    text: |
      Right. So first thing, the code should not retry this in the request. The person is standing
      there waiting, and if the provider is erroring for everybody, retrying just makes them wait
      longer and adds load. So: short timeout, one attempt, maybe a second one, and then give up
      fast. Fail closed — we don't let anybody in without the code, that's the whole point of the
      code. But we say so honestly. Not "something went wrong", which makes them think they typed
      their number wrong and try again five times. Something like, we can't send codes right now,
      it's us not you, try again in a few minutes — and if we have their email, offer to send it
      there instead, because a second channel is the real fix for this. Next time, what I'd want
      true: an alert that fires on send failure rate, not on somebody tweeting at us. A circuit
      breaker so we stop hammering a dead provider. And ideally a second SMS provider we can flip
      to with a config change, already tested, not tested for the first time during the outage.
    expected:
      - dimension: Catches it rather than passing it on
        score: 3
        because: One attempt, short timeout, give up fast, fail closed; does not separate the provider being down from one number failing.
      - dimension: Gives the person another way in
        score: 4
        because: Email as the second channel, and a second provider weighed honestly as real money and a real integration rather than assumed.
      - dimension: Says what the person is told
        score: 4
        because: Says it is us and not them so the person does not retype their number five times — and an alert rather than somebody tweeting at us.
