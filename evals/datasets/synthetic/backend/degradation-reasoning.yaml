        score: 2
        because: '"Please try again later" — not untrue, and says nothing about what is known.'
      - dimension: Says whose problem it is
        score: 1
        because: Never says whose problem it is, so the reader is left to assume it was their number.
      - dimension: Gives them something to do
        score: 2
        because: A next step that only works if the provider recovers, with nothing else offered.
  - kind: fluent-but-wrong
    text: |
      Sure. So the principle is that a one-time code is a delivery guarantee — we've committed to
      getting that code to the user, so the code path should be durable, not fail-fast. What I'd
      do is wrap the send in a retry with exponential backoff inside the request: 1s, 2s, 4s, 8s,
      up to about sixty seconds, because provider blips are usually short and the user would much
      rather wait than start over. If we're still failing at sixty, we enqueue the code for
      delivery and return success to the client, so when the provider recovers every queued code
      goes out and everyone can complete their sign-in. The verification window should be extended
      to match — I'd push the code TTL out to an hour during an incident so nothing expires in the
      queue. I'd deliberately not use a circuit breaker here: a breaker refuses requests that
      might have succeeded, which on a partial outage means we reject users the provider could
      still have served. Better to keep trying and let the backoff do the rate limiting for us.
    expected:
      - dimension: Says something we know to be true
        score: 0
        because: Returns success to the client for a code that was never sent.
      - dimension: Says whose problem it is
        score: 0
        because: Not addressed — the failure is hidden, so there is nothing to attribute.
      - dimension: Gives them something to do
        score: 1
        because: '"Try again" against a queue that only helps if the provider comes back, and the code''s lifetime stretched to an hour to cover it.'
  - kind: correct-poorly-explained
    text: |
      So — don't retry. Well, once maybe. But the point is the person is sitting there, so
      retrying in a loop just holds them longer and you're hitting a provider that's already
      dying, so. Timeout short, give up. And you don't let them in. Obviously. Like, no code, no
      session, that's — that's the point of the code, so fail closed. But the message matters more
      than people think, because if you say "something went wrong" they think it's their number,
      they'll retype it, they'll try four more times, now you've got more load from the same
      person. So say it's us. Say try in a few minutes. And email — if we've got an email for
      them, send it there, that's actually the real answer, having a second way. Next time:
      alerting on the failure rate, that's one. A breaker so we're not pounding a dead thing. And
      a second provider, configured, that someone has actually tested, not the first time you test
      it being during the outage.
    expected:
      - dimension: Says something we know to be true
        score: 3
        because: Says it is us and to try in a few minutes, so the message is not untrue.
      - dimension: Says whose problem it is
        score: 4
        because: '"If you say ''something went wrong'' they think it''s their number, they''ll retype it, they''ll try four more times" — the cost named.'
      - dimension: Gives them something to do
        score: 4
        because: Email as the real answer, and no code means no session.
