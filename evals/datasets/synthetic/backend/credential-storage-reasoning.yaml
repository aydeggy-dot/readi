      Right — the first thing I'd raise is MD5. It's a fast hash. A GPU does billions of them a
      second, so the day that table leaks, somebody runs a wordlist through it and they've got
      most of the passwords by the evening. And there's no salt, so two people with the same
      password have the same hash, and each hash can be looked straight up in a rainbow table. The
      other thing is the sign-in does the comparison in SQL, so you're matching on the hash in the
      query rather than loading the user and verifying. What I'd change it to is bcrypt or
      argon2id — argon2id if the library's already there, bcrypt at cost twelve otherwise. They
      salt for you and you tune the cost so one attempt takes a fraction of a second, which is
      nothing for a person signing in and fatal for someone guessing. For existing accounts you
      can't convert them, you don't have the passwords. So at next successful sign-in you check
      the MD5, and while you still have the plaintext in memory you rehash properly and replace
      the row.
