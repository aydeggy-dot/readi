  - kind: fluent-but-wrong
    text: |
      So the problem here is collisions. MD5 is collision-broken — it's been demonstrated since
      2004, you can generate two different inputs that hash to the same digest in seconds on a
      laptop. Look at the sign-in query: it matches on the digest. So an attacker doesn't need
      your password at all. They need any string that collides with your stored digest, they type
      that into the login box, the digest matches, the row comes back and they're in as you.
      That's the vulnerability, and it's live right now. So the fix is a collision-resistant hash
      — SHA-256, and I'd add a per-user salt column so identical passwords don't share a digest.
      SHA-256 has no practical collisions and it's fast, which is actually what you want on the
      sign-in path, you don't want your auth endpoint burning CPU under load. For the existing
      rows, the nice thing is you don't need anyone's password: you take the stored MD5 digest,
      salt it, run it through SHA-256, and store that. The digest is just bytes. Then sign-in does
      MD5 first, then SHA-256 over it, and everyone's migrated in one batch job overnight.
    expected:
