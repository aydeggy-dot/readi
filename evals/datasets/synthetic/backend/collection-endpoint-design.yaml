# `fluent-but-wrong` blames `res.json` buffering, streams the array with chunked encoding, and
# concludes pagination is "a UI concern rather than an API one". Its migration plan is the
# dangerous part: an optional `?page=` whose absence serves page one with a limit of two hundred,
# described as backwards compatible — it silently gives the old Android app two hundred of forty
# thousand jobs. 1/1/1 against `strong`'s 3/3/3.
answers:
  - kind: strong
    text: |
      Okay so — at forty thousand the server is pulling every row, turning all of it into one JSON
      array, and pushing, I don't know, tens of megabytes down the wire. It hurts everybody. The
      database is scanning the whole table, the Node process sits there building that string so
      other requests queue behind it, and then the phone has to download it and parse it, so the
      list screen takes forever on a 3G connection and burns the person's data bundle before
      they've seen anything. What I'd change is paginate it. Cursor-based — you pass back the last
      id, or created_at plus id, and the client asks for the next page with that. Not offset,
      because offset gets slower the deeper you go and it skips rows when something gets inserted.
      And I'd cut the payload down to the fields the list screen actually shows, not the whole job
      object. For the old app — I can't change what `GET /jobs` returns, that's twenty thousand
      phones broken. So the new shape goes on a new version of the route and the old one stays.
