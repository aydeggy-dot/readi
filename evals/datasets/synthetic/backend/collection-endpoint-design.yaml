  - kind: fluent-but-wrong
    text: |
      So the bottleneck isn't the number of jobs, it's the serialisation. `res.json` on a forty-
      thousand-element array buffers the whole thing twice — once as the object graph, once as the
      string — before a single byte goes out, and that buffering is what everyone's waiting on. So
      the fix is to stream it: a streaming JSON serialiser, pipe straight from a database cursor
      into the response with chunked transfer encoding, and the client parses it incrementally as
      it arrives. Time-to-first-byte drops to milliseconds and the endpoint scales to any size,
      because nothing is ever held whole. Pagination is really a UI concern rather than an API one
      once you're streaming. Then I'd turn on gzip — JSON of repeated job objects compresses about
      ten to one. For the old Android app, the nice thing is this is backwards compatible: I add
      an optional `?page=` parameter, and when it's absent we serve page one with a default limit
      of two hundred, which is exactly what those phones were built against. So they keep working
      untouched and we don't need a v2 at all.
    expected:
      - dimension: Names what it costs and who pays
        score: 1
        because: Names serialisation buffering as the bottleneck rather than the size of the answer.
      - dimension: Changes the endpoint, not the size of the answer
        score: 1
        because: Streams and gzips the same forty thousand rows, and says pagination is not an API concern once you stream.
      - dimension: Does not break the callers it already has
        score: 1
