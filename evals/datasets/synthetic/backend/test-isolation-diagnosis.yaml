# `fluent-but-wrong` says the database is clean and the extra vendor is a stale hit in the ORM's
# identity map leaking across files through a shared module registry. It even proposes a check
# that would refute it — dumping the table from psql — which is why it takes a 2 on criterion 2
# rather than a 1. 1/2/1 against `strong`'s 4/4/4.
answers:
  - kind: strong
    text: |
      So the test asserts `toHaveLength(1)`, and that only holds if that vendor is the only row in
      the table. Run the file on its own and it is. Run everything and some other test has already
      inserted a vendor and left it there, so you get two, and it fails. And which test happens to
      leave a row behind depends on the order the files run in, which is exactly why the failures
      move around. CI is worse because it runs the whole suite, usually several workers in
      parallel against one database, all writing the same table. To confirm it — run the one file,
      watch it pass; then run the suite and log a count of the vendors table before each test, and
      you'll see it isn't zero. To fix it, two things. The assertion should be about its own data
      — look for Adaeze Foods by name, not count the world. And the suite needs real isolation:
      wrap each test in a transaction and roll it back, or truncate between tests, and give each
      worker its own database. Then randomise the order in CI so it stays honest.
