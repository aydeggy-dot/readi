  - kind: fluent-but-wrong
    text: |
      This is a cache coherence problem, not a data problem. The ORM keeps a first-level identity
      map — rows it has already materialised in this process — and the runner reuses one module
      registry across files, so that map survives from file to file. `listVendors` checks the
      identity map before it goes to the database, so what you're seeing is a hit on a vendor that
      a previous file materialised, not a real row. The database is clean; connect and select and
      the table's empty. And that's exactly the signature: it moves around because it depends on
      which file warmed the map first, and CI is worse because CI runs single-process for speed,
      so nothing evicts it, whereas locally each file tends to get a fresh process. I'd confirm it
      by dumping the table straight from psql while the failure is live — empty table, failing
      count, proved. The fix is to clear the identity map in `afterEach`, or set `cache: false` on
      the model, and run with `--isolate` so the registry can't leak between files.
