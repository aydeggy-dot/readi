question: node-state-between-requests
# `fluent-but-wrong` rules out shared state on the single thread — "only one thing runs at a time"
# — and substitutes a claim that Express never awaits async middleware, so `next()` fires before
# `loadUser` resolves. It explains the development-versus-production difference as a latency race
# and fixes it with `express-async-handler`, leaving the module-level variable exactly where it is
# and calling it safe. 1/1/1 against `strong`'s 4/3/4.
answers:
  - kind: strong
    text: |
      So `currentUser` is a module-level variable. There's one of it for the whole process, shared
      by every request that process is handling. The middleware awaits `loadUser`, and while
      that's in flight Node goes off and picks up the next request, which runs the same middleware
      and overwrites `currentUser`. So request A comes back from its await, gets into the handler,
      reads `currentUser`, and it's request B's user. That's how you invite somebody using
      somebody else's name. Testing by hand never shows it because by hand you're one person doing
      one request at a time — there's never a second request overlapping, so the variable is
      always yours. You'd need two requests inside the same few milliseconds, which is normal in
      production and basically impossible manually. The fix is to stop storing request state
      outside the request. Put it on `req` — `req.user = await loadUser(...)` — and read
      `req.user` in the handler. If you genuinely need it deeper down without threading it through
      everything, `AsyncLocalStorage` gives you per-request context properly. I'd also note
      there's no error handling, so a bad token crashes on `currentUser.name` rather than
      returning a 401.
    expected:
      - dimension: Finds the shared variable
        score: 4
        because: One variable for the whole process, and names where it goes wrong — the handler reads it after its own `await`, by which time another request has written it.
      - dimension: Says why testing by hand misses it
        score: 3
        because: By hand there is never a second request overlapping; does not name the test that would show it.
      - dimension: Puts the value where the request is
        score: 4
        because: "`req.user` read in the handler, with `AsyncLocalStorage` kept for code too deep to thread it through — and notices there is no error handling either."
  - kind: weak
    text: |
      Right, so this is a caching thing I think. `currentUser` gets set once and then it stays
      set, so if the next request doesn't set it properly you end up using the old one that's
      still hanging around from before. It's like a stale cache. In development you're restarting
      the server all the time so it gets cleared constantly and you never see it, but in
      production it runs for days and the value just sits there. So what I'd do is reset it — set
      `currentUser = null` at the end of the request handler, so the next request has to load it
      fresh, and then if it's null you return a 401. Maybe also add a check in the handler that
      the user matches the token before sending. I could also look at putting it in Redis with a
      short expiry instead of in memory, since that's designed for this kind of thing and it'd
      expire on its own. And I'd add some logging so we can see whose name actually went out.
