  - kind: fluent-but-wrong
    text: |
      Yeah, I've seen this one. It's not shared state — Node is single-threaded, so two requests
      can't be inside the same variable at once, only one thing runs at a time. The bug is that
      Express doesn't await async middleware. `app.use` with an async function returns a promise
      and Express ignores it; it fires `next()` and moves on the moment the function yields at the
      first `await`. So `loadUser` is still pending when the route handler starts, which means
      `currentUser` still holds whatever the previous completed request left there — that's the
      other person's name. In development it looks fine because your local database answers in
      under a millisecond, so `loadUser` resolves before the event loop hands control to the
      route; in production the database is a network hop away and sometimes the resolve lands
      after the handler has read the variable. That's also why it's occasional rather than
      constant — it's a latency race. So make Express actually wait: wrap the middleware in
      `express-async-handler`, or move to Express 5, which awaits promise-returning middleware.
      Once `next()` genuinely runs after the await, the module-level variable is safe.
    expected:
      - dimension: Finds the shared variable
        score: 1
        because: The single thread used to rule it out, and Express not awaiting async middleware put in its place.
      - dimension: Says why testing by hand misses it
        score: 1
        because: A local database answering in under a millisecond, offered as why development looks fine.
      - dimension: Puts the value where the request is
        score: 1
        because: "`express-async-handler` or Express 5, with the module-level variable kept and declared safe."
