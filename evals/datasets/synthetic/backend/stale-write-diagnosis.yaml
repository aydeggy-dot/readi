    text: |
      Okay so the problem is the `get` and then the `save`. The `get` pulls the whole row into a
      Python object — every field, including the phone number exactly as it was at that moment.
      Then there's the slow provider call, and while we're sitting there waiting, support opens
      the record, changes the phone number, and their write commits perfectly fine. Then we come
      back, set `is_verified`, call `save()` — and Django's default save writes every field on the
      model back, not just the one you touched. So it puts the phone number it read a minute ago
      straight over support's edit. That's a lost update. And the minute is simply how long the
      provider call takes; that's the window. Normally the read and the write are a few
      milliseconds apart so you'd never see it, but here we're holding stale data across a network
      call. What I'd write instead is `Customer.objects.filter(pk=pk).update(is_verified=True)` —
      one UPDATE, one column, no read at all, so there's nothing stale to write back.
      `save(update_fields=["is_verified"])` would also do it. And honestly that provider call
      shouldn't be in the view.
