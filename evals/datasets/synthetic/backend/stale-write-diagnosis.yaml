  - kind: fluent-but-wrong
    text: |
      So the ORM isn't the culprit here — Django tracks which fields have been assigned on the
      instance, so `save()` emits an UPDATE for `is_verified` only. The phone column isn't in that
      statement at all. What's actually happening is snapshot isolation. `ATOMIC_REQUESTS` is on,
      so the transaction opens at the `get()` and Postgres pins a snapshot of that row at that
      instant. Support's update commits inside our window, but our transaction can't see it, and
      when we commit, the row version we're holding is written back out of the snapshot —
      support's version is superseded and their phone number goes. And that's precisely why it's a
      minute rather than a millisecond: the transaction stays open for the whole provider call, so
      the snapshot is a minute stale by the time we commit. The fix is at the isolation level, not
      in the code — take this view out of `ATOMIC_REQUESTS`, or move it to READ COMMITTED so the
      row is re-read at commit time, and take `select_for_update` on the `get()` so support queues
      behind us instead of being lost.
    expected:
      - dimension: Says what `save()` writes
        score: 1
        because: Dirty-tracking asserted, so the phone column is believed not to be in the statement at all.
      - dimension: Says what made the window wide
        score: 1
        because: A transaction held open across the provider call, given as why the snapshot is a minute stale.
      - dimension: Writes only what changed
        score: 1
        because: An isolation-level change and `select_for_update`; `save()` still writes every field, because it is believed not to.
