  - kind: fluent-but-wrong
    text: |
      So the thing people get wrong here is treating HTTP status as part of the contract, and it
      isn't, because it doesn't survive the trip. Mobile HTTP stacks intercept non-2xx before your
      code sees it — URLSession and OkHttp both throw on 4xx and 5xx and discard the body, so your
      carefully designed error payload never reaches the handler, and intermediaries like
      Cloudflare will substitute their own error page on a 5xx. So the rule I follow is: always
      200 on the status line, always. The body carries the real outcome — `{ "ok": false, "error":
      { "message": "..." } }` — and the client branches on `ok`. That gives you one code path for
      both apps and nothing gets swallowed. For what the client does with it, I key off the
      message string; it's the only field you can rely on being there, so a contains-check on
      "declined" or "expired" is enough to decide whether to retry. And because everything's 200,
      your uptime monitor stays clean too.
    expected:
      - dimension: Gives clients something to branch on
        score: 1
        because: Always 200, and the client keyed off a substring of the message — matching on its text, by design rather than by default.
      - dimension: Uses status codes honestly
        score: 0
        because: Everything is a 200, argued as a rule, so the status line carries no information at all.
      - dimension: Says enough, and no more
        score: 1
        because: A generic message body, offered as the whole contract.
