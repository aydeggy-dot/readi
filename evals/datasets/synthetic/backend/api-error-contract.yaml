# The pairing this rubric had to survive: `fluent-but-wrong` argues that HTTP status is not part
# of the contract because mobile HTTP stacks swallow non-2xx bodies, so everything should be 200
# with the outcome in the body, and the client should branch on a substring of the message. It is
# coherent, it cites real libraries, and it inverts the whole question — 1/0/1 against `strong`'s
# 3/3/4.
answers:
  - kind: strong
    text: |
      Okay so, the status line is the class of the problem, and the body is the detail. So 400 if
      the request itself is malformed, 401 if you're not signed in, 403 if you are but you're not
      allowed, 404 not there, 409 if it clashes with something — like the email's already taken —
      429 if they're hammering us, and 5xx only when it's actually our fault, not the caller's.
      That last bit matters because ops alert on 5xx, so if I return 500 for a bad phone number
      I've just woken somebody up for nothing. In the body I'd put a stable machine code,
      something like `card_declined`, plus a human message, plus field paths for validation errors
      so the form can put the message under the right input, plus a request id so support can find
      the log line. The client switches on the code, never on the message text — the message is
      English, it's for us, and the app has its own copy in its own language. Um, and nothing
      internal in there. No stack trace, no SQL.
    expected:
      - dimension: Gives clients something to branch on
        score: 3
        because: A stable code per error plus a human message, and the client switches on the code; does not say where the code list is documented.
      - dimension: Uses status codes honestly
        score: 3
        because: Correct categories including 401, 403 and 409, and 5xx reserved for our own fault.
      - dimension: Says enough, and no more
        score: 4
        because: Field paths for validation, nothing internal, and a request id so support can find the log line.
