  - kind: fluent-but-wrong
    text: |
      Right. So what `async def` buys you here is that FastAPI hands the endpoint to Starlette's
      anyio worker thread pool rather than running it inline — so the call itself isn't the
      problem, it's off the main thread. The problem is that pool is capped at forty threads by
      default, and every in-flight rates call occupies one for up to five seconds. Under load you
      saturate the forty, and once it's saturated everything queues behind it, which is exactly
      why endpoints that do no work are also slow — they're waiting for a worker. On top of that,
      `requests` is built on urllib3, which holds the GIL during the socket read, so even the
      threads you do have don't interleave properly. So two changes. First, raise the anyio
      capacity — I'd set the total tokens to two or three hundred, since these threads are I/O
      bound and cheap. Second, use a `requests.Session` at module level so we reuse connections
      and cut the time each thread holds its slot. That takes the pressure off the pool without
      rewriting the endpoint.
