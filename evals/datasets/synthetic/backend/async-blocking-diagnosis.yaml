answers:
  - kind: strong
    text: |
      Okay, so the async here isn't buying anything. Declaring it async means FastAPI runs the
      coroutine on the event loop itself — and there's one event loop, on one thread. Then inside
      it we call `requests.get`, which is synchronous. It doesn't yield. So for however long that
      provider takes, up to the five second timeout, the loop is sitting inside a socket read and
      it cannot run anything else. Every other request is just queued behind it, including the
      ones that do nothing. That's why the whole service slows down — the async is actually making
      it worse than if you'd written it as a plain def, because with a plain def FastAPI would
      have pushed it to a thread pool and the loop would have stayed free. The fix I'd go for is
      httpx — an AsyncClient, created once at startup, `await client.get(...)`, so the await is a
      real await and the loop goes off and serves other requests while we wait. Keep the timeout,
      and I'd cache the rates for a few seconds too, since a rates endpoint doesn't need a live
      call per request.
