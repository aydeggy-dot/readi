  - kind: fluent-but-wrong
    text: |
      So the instinct is to reach for a queue and I think that's over-engineering it — you get a
      job table, a worker fleet, retries, dead letters, and all of it to avoid a problem you don't
      have on an async runtime. Forty seconds is I/O-dominated: you're pulling rows and streaming
      them into the renderer, so every await yields the event loop and the process happily
      interleaves hundreds of these. CPU is barely touched, which is the tell. So I'd do it in-
      request, but stream it: respond immediately with `Transfer-Encoding: chunked` and `Content-
      Disposition: attachment`, and flush each page as the renderer produces it. The browser
      starts the download on the first chunk, so the user sees it saving within a second or two
      and there's no perceived wait at all, and because bytes are flowing the connection never
      goes idle, so no proxy or load-balancer timeout fires. Then the only tuning is raising the
      upstream read timeout to, say, ninety seconds and bumping the worker count so there are
      enough processes to hold the sockets. A hundred concurrent is genuinely fine on that shape.
    expected:
      - dimension: Takes the work out of the request
        score: 1
        because: Keeps it in the request and streams it, presented as the design and as avoiding over-engineering.
      - dimension: Says what the user experiences
        score: 1
        because: A download that starts in a second or two — an experience that does not follow, because the renderer is not producing pages to flush.
      - dimension: Holds up under a hundred at once
        score: 1
        because: Raises the upstream read timeout and adds web processes to hold sockets.
  - kind: correct-poorly-explained
    text: |
      So you wouldn't, um, you wouldn't do it in the request, obviously, because forty seconds,
      the load balancer will cut it off anyway, so — okay, you'd return straight away. With an id.
      And a 202, I think that's the one for accepted. And then there's a worker somewhere that
      actually does it, it takes the job off a queue, Redis or SQS or whatever, and it makes the
      PDF, uploads it, and then flips a flag. And the frontend is polling, like every few seconds,
      asking is it done, is it done, and when it's done it shows the download. Or you email them,
      which is better if it's slow, because they'll have closed the tab. Um. The hundred people —
      the API's fine, it's the workers, because if you only have a few workers and each one takes
      forty seconds then it's just a queue, people wait. So you'd look at the queue length, and
      add workers. And the database gets hammered too, by the workers, all reading history at
      once.
