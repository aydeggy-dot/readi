question: the-feature-that-needs-a-queue
# The pairing this rubric had to survive: `fluent-but-wrong` argues a queue is over-engineering
# because forty seconds is I/O-dominated on an async runtime, and prescribes a chunked in-request
# response with a raised upstream timeout — an answer that sounds like restraint and is the
# failure mode the question is about. 1/1/1 against `strong`'s 3/3/4.
answers:
  - kind: strong
    text: |
      Right, so forty seconds means it can't happen inside the request. The button POSTs to
      something like `/exports`, we write a row — status pending, an id — push a job onto the
      queue, and return 202 with that id straight away. The user sees "we're building it, we'll
      email you when it's ready", and the page polls the status endpoint. A worker picks the job
      up, builds the PDF, puts it in S3, flips the row to ready, and we email a signed link that
      expires — it's everything they've ever done, not a URL you want guessable. Now, a hundred at
      once. The API's fine, it did nothing but write a row. What holds up is the workers — if
      there's four of them and each job is forty seconds, the hundredth person waits about
      seventeen minutes. So the queue depth is the thing to watch and alarm on, and you scale
      workers against it. Also, a hundred workers scanning full histories will hurt the database
      serving the site, so I'd read from a replica. And the job's idempotent, deduped, so a
      double-click doesn't cost two renders.
    expected:
      - dimension: Takes the work out of the request
        score: 3
        because: 202 with an id, a row, a job on the queue, and the work elsewhere; does not say what that buys beyond the timeout.
      - dimension: Says what the user experiences
        score: 3
        because: Polling and an email with a signed expiring link, and the file from S3 rather than through the API; says nothing about failure reaching the user.
      - dimension: Holds up under a hundred at once
        score: 4
        because: The API did nothing but write a row, so the workers are the constraint — queue depth watched and alarmed, a replica for the reads, and deduping the double press.
  - kind: weak
    text: |
      Okay, so I'd have an endpoint that generates the PDF, and when they click the button it
      calls it and the browser downloads it. Forty seconds is long so I'd put a spinner on the
      button and disable it so they don't click twice, and maybe a progress bar. If it times out
      I'd increase the timeout in nginx and in the frontend fetch so it has enough time. For a
      hundred people at once... the server would be doing a lot of work, so I'd add more servers
      behind the load balancer, or upgrade the instance to one with more memory, because PDFs take
      memory. Um, I could also cache the PDF so if they ask again it's instant. I've not really
      built something that takes that long before, most of my endpoints return quickly. I'd
      probably look at how other people do exports and follow that pattern.
