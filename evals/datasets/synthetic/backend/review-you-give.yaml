  - kind: fluent-but-wrong
    text: |
      I'd request changes, and I'd hold the merge. And I would not say "I might be wrong" — that's
      the mistake people make in reviews. The moment you hedge, you've handed them permission to
      dismiss it, and your comment becomes noise. A review comment is either authoritative or it
      shouldn't be on there. So I'd state it as fact: this endpoint will not hold up at production
      volume. Then I'd tell him what it needs before it goes in — Redis in front of it with a
      sensible TTL, and denormalise the order summary onto the customer row so the read is one row
      instead of a scan. And I'd insist that lands in this change, not a follow-up ticket, because
      performance follow-up tickets never get done, everybody knows that. You can't bolt
      performance on afterwards, it's an architectural property of the thing. Measuring is fine,
      but I don't need a number to know that a full read of the orders table per customer is
      wrong. That's just experience.
