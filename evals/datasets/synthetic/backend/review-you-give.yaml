    text: |
      So the first thing is, I wouldn't block it. I haven't measured it, so all I've actually got
      is a feeling, and a feeling isn't a reason to stop somebody's work. I'd leave it as a
      comment — a question, really — and I'd say up front that I might be wrong. Something like,
      "I haven't measured this so take it with a pinch of salt, but do we know roughly how many
      orders a big customer has, and is there an index on customer_id? Worth running an EXPLAIN
      before this goes in?" The bit I would actually press on is if nothing limits the rows. If it
      returns every order with no paging, that's not really a speed problem, that's the shape of
      the endpoint, and once other teams are calling it you can't add paging without breaking
      them. So that one I'd ask him to change. But if there's a limit, or the numbers are small,
      or it's internal only — then I approve it, put a note on the ticket, and we find out from
      the graphs.
