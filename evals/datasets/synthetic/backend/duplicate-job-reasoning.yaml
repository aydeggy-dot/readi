      and the worker never told it, because it died in the middle, so after the timeout it gave it
      to another worker. That's at-least-once, that's normal, you can't really turn it off. So the
      job has to be the thing that's safe to run twice, not the queue. Which is — an id per
      payout, ours, sent to the provider as the idempotency key so their side ignores the second
