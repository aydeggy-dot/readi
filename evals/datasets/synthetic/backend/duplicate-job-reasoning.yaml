question: the-job-that-ran-twice
# `fluent-but-wrong` says the broker acknowledges on receipt and keeps the dedupe window in the
# worker's memory, so the restart lost it. It then buys exactly-once at the broker and concludes
# idempotency keys at the payment provider are unnecessary — and would let the vendor find out at
# month-end reconciliation. 1/0/1 against `strong`'s 3/4/3.
answers:
  - kind: strong
    text: |
      So queues are at-least-once. The worker picks the message up, it doesn't ack or delete it
      until the job finishes, and if the worker dies halfway the broker waits out the visibility
      timeout and hands the same message to somebody else. From its side nothing went wrong — it
      can't tell a crash before the work from a crash after. So assume every job runs twice. Which
      means the fix isn't in the queue, it's in the payout. I'd give every payout its own id in
      our database and send that id to the payment provider as an idempotency key — most of them
      support it, and then the second call just returns the first payout instead of moving money
      again. And on our side, a row per payout with a unique constraint and a status, set to
      "sending" before we call out, so a duplicate can't even start. For the vendor, I'd call them
      the same day, before finance spots it. Say plainly we paid twice, give the date and
      reference, ask whether they'd rather refund it or we net it off the next invoice, and
      confirm in writing.
    expected:
      - dimension: Knows why a queue re-delivers
        score: 3
        because: "At-least-once by design: the message is not deleted until the job finishes, and the broker cannot tell a crash before the work from one after."
      - dimension: Makes the job safe to run twice
        score: 4
        because: The payout's own id sent as the provider's idempotency key, plus a unique constraint and a status set before the call goes out.
      - dimension: Says what happens to the money and the vendor
        score: 3
        because: Called the same day, before finance spots it, with the choice of a refund or a net-off confirmed in writing.
