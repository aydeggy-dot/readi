  - kind: fluent-but-wrong
    text: |
      Right. So the reason a queue does that is that the broker acknowledges on receipt, not on
      completion — the message is marked delivered the moment the worker pulls it, and the dedupe
      window lives in the worker's memory. When the process restarted, that in-memory dedupe
      window went with it, so on the scheduler's next tick the broker had no record that this
      payout id had ever been seen, and handed it out again. That's why the restart is the trigger
      — it's the lost dedupe state, not a missing ack. The fix is exactly-once semantics at the
      broker: enable the idempotent producer, turn on transactional delivery, give each worker a
      stable transactional id, and the broker guarantees the consumer observes each message once,
      across restarts, because the dedupe window moves into the broker's log instead of the
      worker's heap. Once you have that, you don't need idempotency keys down at the payment
      provider — that's belt and braces, and a round trip per payout. For the vendor, I'd let it
      surface at month-end reconciliation and net it off there; raising it before the numbers are
      confirmed just creates noise.
    expected:
      - dimension: Knows why a queue re-delivers
        score: 1
        because: A dedupe record the broker is believed to keep, lost with the worker's memory on restart.
      - dimension: Makes the job safe to run twice
        score: 0
        because: Asks the queue for exactly-once and says the provider needs no key — the job itself is unchanged.
      - dimension: Says what happens to the money and the vendor
        score: 1
        because: Would let it surface at month-end reconciliation and net it off, because raising it earlier "just creates noise".
