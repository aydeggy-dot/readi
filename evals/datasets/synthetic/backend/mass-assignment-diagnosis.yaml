question: laravel-mass-assignment
# `fluent-but-wrong` inverts the fact the question turns on — it reads `$guarded = []` as the
# *strictest* setting — and then invents a mechanism for the hole: that `create()` calls
# `forceCreate()` inside `Model::unguarded()`. Its prescribed fix (`fill()` with `only()`) happens
# to pass three named fields, which is why it reaches a 2 rather than a 1 on criterion 2, and
# **+1.55 is the second-narrowest separation in the bank**. 1/2/3 against `strong`'s 4/3/3.
answers:
  - kind: strong
    text: |
      So `protected $guarded = []` means nothing is protected. The guard list is empty, so every
      single column on the users table can be set through mass assignment. And then
      `User::create($request->all())` takes whatever was in the POST body — not the three fields
      on the form, whatever was posted. The form having three inputs means nothing, that form is
      HTML on their machine, they can add a field in dev tools or just curl the endpoint. So they
      posted `is_admin=1`, or `role=admin`, whatever the column is called, and Eloquent wrote it
      straight in. The fix: validate first and pass only the validated data — `$validated =
      $request->validate([...])` for name, email, password, then `User::create($validated)`. And
      put a real `$fillable` on the model listing exactly the columns a user may set, as defence
      in depth. Afterwards I'd grep the whole codebase for `$guarded = []` on every model, and for
      `->all()` anywhere near a create or an update, because `update($request->all())` is the same
      hole on the edit path. And check the users table for who else is already admin.
    expected:
      - dimension: Says how the extra field arrived
        score: 4
        because: Anyone can post any field — "that form is HTML on their machine" — and an empty guard list means Eloquent wrote it straight in.
      - dimension: Takes only what the action may set
