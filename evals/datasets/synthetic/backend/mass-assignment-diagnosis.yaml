  - kind: fluent-but-wrong
    text: |
      Okay, so the misunderstanding a lot of people have is that `$guarded = []` is permissive. It
      isn't — `$guarded` is the blocklist, and an empty blocklist is read by Eloquent as "there is
      no attribute this model will let through unguarded", which is actually the strictest setting
      on the model. So mass assignment isn't the hole here. The hole is `User::create()`.
      Internally `create()` doesn't fill and save — it calls `forceCreate()` on a fresh instance,
      and `forceCreate` runs the whole thing inside `Model::unguarded()`, which switches guarding
      off for the duration of that call and puts it back afterwards. That's deliberate, it's there
      so seeders and factories can set anything, and it's why the extra `is_admin` field sailed
      through even on a locked-down model. So the fix is to stop calling `create()` on anything
      that takes user input. Do `$user = new User;
      $user->fill($request->only(['name','email','password'])); $user->save();` — `fill()`
      respects the guard, `create()` bypasses it. Afterwards I'd grep for every `::create(` in the
      app and convert the ones fed from a request, and I'd add a test that posts `is_admin=1` and
      asserts it stayed false.
    expected:
      - dimension: Says how the extra field arrived
        score: 1
        because: "`$guarded = []` read as the strictest setting, and the hole invented in `create()` calling `forceCreate()` inside `unguarded()`."
      - dimension: Takes only what the action may set
        score: 2
        because: "`fill()` with `only()` on three named fields — the right shape reached from a false account, with no validation and the guard left empty."
      - dimension: Assumes it is not the only one
        score: 3
        because: Would grep every `::create(` fed from a request and add a test that posts `is_admin=1`.
