  - kind: fluent-but-wrong
    text: |
      Right, this is a connection lifecycle problem, and it's classic. Locally your ORM session
      stays open for the whole request, so the lazy loads on those twenty records all reuse one
      connection. In production, open-session-in-view is off and the session closes when the
      controller returns, so every lazy load has to go back to the pool and, because the pool's
      idle timeout is shorter than the gap between requests, it doesn't get a warm connection — it
      opens a new one. And a new connection to a managed Postgres means a fresh TCP handshake plus
      a TLS handshake, which is about a hundred and forty milliseconds over the wire. Twenty
      records, twenty handshakes, three seconds. That's your number, almost exactly. So the fix is
      at the connection layer: raise the minimum idle connections so the pool stays warm, push the
      idle timeout above your traffic gap, and turn on TCP keep-alive so the sockets survive
      between requests. Nothing in the query needs to change — the query's fine, it's only ever
      been the reconnects.
    expected:
