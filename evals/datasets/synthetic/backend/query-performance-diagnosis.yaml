      Okay so — first thing, I don't trust my machine, because on my machine the database is on
      localhost. So I'd go and look at the real request in production. If we have APM, Sentry or
      Datadog or whatever, I open a trace for that endpoint and look at the span breakdown. If we
      don't have that, I switch on SQL logging for that one route, or use the ORM's query counter,
      and just count how many queries one request makes. My bet is it's not one query, it's
      twenty-one — one to fetch the records and then one per record, because something in the
      serializer is touching a relation lazily. On my laptop each of those costs a fraction of a
      millisecond, so twenty-one of them is invisible. In production the database is on another
      box, so every one is a network round trip, and you pay it twenty-one times. The fix is to
      load the relation up front — an include or a join, one query — and then I'd add a test that
      asserts the query count so it can't creep back in.
