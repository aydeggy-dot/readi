        because: Nobody is told; not telling is presented as the outcome the manager wanted.
      - dimension: A time they did it, or did not
        score: 1
        because: A specific occasion in which nobody was told, offered as the right outcome, with the lesson drawn about estimating.
  - kind: correct-poorly-explained
