answers:
  - kind: strong
    text: |
      Wednesday morning, so I write it Wednesday morning. Not Wednesday evening, not Thursday. The
      person I write to first is whoever committed to Friday on my behalf — usually my lead, and
      if there's someone downstream waiting, like QA or the person doing the launch post, they
      hear the same day. I don't send it only to my lead and hope it travels. The message itself,
      I keep it short and I put the new date in it. Something like: the payments webhook work
      won't be done Friday, I'm expecting Tuesday; the reason is the provider's sandbox doesn't
      fire refund events, so I'm building a fake one; and if Friday is hard, I can ship the charge
      path Friday and refunds the week after. So, the bad news, the new date, the reason, and a
      choice. I had this on the reconciliation job earlier this year, and I'll be honest, I sat on
      it for a day telling myself I'd catch up over the weekend. I didn't. Telling them on the
      Tuesday would have cost nothing; telling them on the Thursday cost someone else a plan.
