  - kind: fluent-but-wrong
    text: |
      Yes, I've been in exactly that position. We were building a bulk upload feature and I'd
      estimated three days. By day two I could see the CSV parsing was going to eat the whole
      budget, so I got specific about it: I sat down Wednesday and cut the scope myself. I dropped
      the progress bar, I dropped the per-row error report, and I shipped the core upload on
      Friday as promised. Then I wrote up what I'd cut and why, and we put it in the next sprint.
      The lesson I took is that a deadline is a commitment and an estimate is a guess, so when the
      guess is wrong the deadline shouldn't move — the scope should. Since then I pad my estimates
      by about forty percent, because the real failure was estimating badly in the first place,
      and I break work into half-day chunks so I can see the slip on day one. I'd rather solve the
      problem than announce it. My manager didn't have to hear about it, which is honestly the
      outcome she wanted.
