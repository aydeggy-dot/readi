      library has already decided it worked, so it doesn't throw, and their normal error path is
      dead for this case, they'd have to write a special check in every single call, which is,
      yeah, fragile. I think 409. Or 400 — no, 409, conflict, because the thing already exists,
      that's the one. And caching, I forgot that, a proxy can cache a 200 and this should never be
      cached. So yeah — send 409, the app gets its normal error handling back, the graphs start
      telling the truth, and the logs too. That's basically it.
