# `fluent-but-wrong` gives the transport-versus-application argument: 200 describes what happened
# to the HTTP request, so it is honest, and the app's error handling is what is broken. It adds an
# `X-Error-Code` header and argues *against* 409 on the grounds that proxies retry 4xx. It names
# the right other readers and draws the opposite conclusion from them. 1/1/1 against `strong`'s
# 4/3/4.
answers:
  - kind: strong
    text: |
      Okay so the problem is the status line. It says 200 OK. Any HTTP client — fetch, axios,
      Retrofit, whatever they're using — looks at that first, and 200 means it goes down the
      success path. So their catch block never runs, their interceptor never fires, and the only
      way the app can detect this failure right now is to open the body and check `success` on
      every single call. Which means every endpoint needs that special-casing, and if they ever
      miss one, the app shows a "welcome" screen for a signup that didn't happen. What I'd send is
      409 Conflict — the request was well formed, it just conflicts with a row that already
      exists. Some people would say 422, I'd take either, but not 200. And who else reads it — the
      load balancer and any cache sitting in front of us, because a 200 is cacheable and caching a
      signup response is frightening. Then monitoring: our error-rate dashboard is counting this
      as healthy traffic, so duplicate signups could run for weeks and nobody would see a spike.
    expected:
      - dimension: Says what the client is forced to do
        score: 4
        because: The client library takes the success path, so every call needs a special check — and a missed one shows a welcome screen for a signup that did not happen.
      - dimension: Sends a status the machine can act on
        score: 3
        because: 409 with a reason, 422 accepted; does not separate the code the client branches on from the message a person reads.
      - dimension: Knows who else reads the status line
        score: 4
        because: A cacheable 200 on a signup response, and the error-rate dashboard counting it as healthy traffic for weeks.
