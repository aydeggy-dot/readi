  - kind: fluent-but-wrong
    text: |
      Right, so this is the classic transport-versus-application layer distinction. The status
      line describes what happened to the HTTP request itself — it reached the server, the server
      parsed it, the server produced a response. So 200 OK is correct and honest. The email being
      taken is an application-level outcome, and application outcomes belong in the body. So the
      app's error handling is what's broken here, not the API. What they should do is stop
      branching on the status code and branch on the envelope — `success` plus a stable
      `error_code` — and I'd add an `X-Error-Code` header so their interceptor can read it without
      deserialising the body. And I'd actively resist 409, because 4xx puts us in the retry class:
      most reverse proxies and mobile networking stacks treat a 4xx as a failed request and retry
      it with backoff, so you'd turn one duplicate signup attempt into three. Who else reads the
      status line? Mainly nginx and the CDN — and that's precisely why we keep business meaning
      out of it.
    expected:
      - dimension: Says what the client is forced to do
        score: 1
        because: "The envelope defended as correct: the status line is transport, the outcome is application, so the app should branch on `success`."
      - dimension: Sends a status the machine can act on
        score: 1
        because: Keeps the 200, adds an `X-Error-Code` header, and argues against 409 on the grounds that proxies retry it.
      - dimension: Knows who else reads the status line
        score: 1
        because: Names nginx and the CDN correctly and takes them as the reason to keep meaning out of the status line.
  - kind: correct-poorly-explained
