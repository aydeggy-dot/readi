  - kind: fluent-but-wrong
    text: |
      Yeah, this is a write-coalescing problem, it's below the application. Both updates are
      UPDATEs to the same row, and in Postgres the same row lives in the same 8K page. Updates are
      applied to the page in the buffer cache, and the commits are batched — group commit gathers
      everything in a short window and flushes the WAL once. When two updates to the same row land
      in the same group-commit window, the second one writes over the first in the page image
      before it's ever flushed, and you get one WAL record, not two. The earlier increment is
      gone. That's why the loss scales with popularity: the window is a fixed few milliseconds, so
      the hotter the row, the more updates fall into each window and get collapsed. It's silent
      because both transactions did commit — they just committed one page. The fixes follow:
      `synchronous_commit = on` for that write so it flushes per transaction and stops coalescing,
      and longer term take the counter off the listings row into its own counts table so the hot
      row isn't sharing a page with anything else.
    expected:
