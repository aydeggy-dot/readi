answers:
  - kind: strong
    text: |
      So it's a read-modify-write, and there's a gap in the middle of it. Two requests both read
      four hundred, both add one, both write four hundred and one. Two views, one counted. Nothing
      errors because both writes succeeded — they just wrote the same number. The reason it gets
      proportionally worse with popularity is the gap is a fixed length, right, it's however long
      the round trip takes, maybe a few milliseconds. What changes is how many other views land
      inside that window. At one view a minute, nobody's ever in your gap. At ten a second,
      there's usually somebody, sometimes three people, and all of them collapse into one
      increment. So the loss isn't a fixed number of views, it's a fraction, and the fraction
      climbs with the rate. The fix is to stop reading it into the app at all — `UPDATE listings
      SET views = views + 1 WHERE id = ?`, one statement, the database does the add while it holds
      the row lock. If it's really hot I'd not write per view at all, I'd count in Redis and flush
      periodically.
