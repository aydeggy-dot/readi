  - kind: fluent-but-wrong
    text: |
      Sure. I'd put a full-page cache in front of this rather than caching queries one by one,
      because you want to stop the request before it ever reaches the application. So, Cloudflare
      or Varnish in front, cache the jobs board page for an hour keyed on the URL. The saved jobs
      are safe in there, because HTTP caching varies on the session cookie by default — same URL,
      different cookie, different cache entry — so each signed-in person gets their own copy and
      nobody sees somebody else's saved jobs. Then for the two shared queries underneath, I'd
      switch on the database's own query cache, because that invalidates itself: the moment anyone
      writes to the jobs table, every cached result that touched that table is dropped
      automatically. That's the part people miss. It means you can set a very generous TTL, a day
      even, and still never serve a stale list, because the write path clears it for you. So: one
      hour at the edge, query cache underneath, and no manual invalidation code to maintain.
    expected:
