        score: 3
        because: Separates them on what actually differs — shared versus per-user, how often each changes — and refuses the shared cache for saved jobs.
      - dimension: Gives each one a way to stop being wrong
        score: 3
        because: A long life for categories busted on edit, thirty to sixty seconds for the jobs list; nothing about what happens when an entry disappears under load.
      - dimension: Knows what the cache is hiding
        score: 4
        because: Would find which query is actually slow first, because caching a bad query means you still pay for it, just less often.
  - kind: weak
    text: |
      Yeah, caching is the answer for sure — if the database is struggling you take the load off
      the database, that's the whole point of caching. So I'd put Redis in, and I'd cache all
      three of them, because all three are running on every page load and that's three queries
      you're not doing anymore. For the time, I'd probably do… an hour? Maybe a day, so it really
      doesn't hit the database much. Actually, an hour sounds safer. And for the stale thing —
      Redis has a TTL so it deletes itself, so you don't really need to do anything else, it
      handles it. If someone complains that something is old you can always clear the cache
      manually, we did that at my last place, there's a command for it. And if it's still slow
      after that then maybe you need a bigger database server, like more RAM, because at some
      point the machine is just the machine.
