      - dimension: Gives each one a way to stop being wrong
        score: 1
        because: Invalidation described as something the database's query cache does for you, so a day-long TTL is safe.
      - dimension: Knows what the cache is hiding
        score: 1
        because: Argues for stopping the request before it reaches the application, so the queries underneath never come up.
