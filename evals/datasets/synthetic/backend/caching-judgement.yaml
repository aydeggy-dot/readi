question: what-to-cache-and-for-how-long
# `fluent-but-wrong` puts a full-page cache at the edge on the belief that HTTP caching varies on
# the session cookie by default — so a per-user saved-jobs list is safe in a shared cache — and
# adds a database query cache that "invalidates itself" on any write. Both are false, and together
# they are a data-exposure design. 1/1/1 against `strong`'s 3/3/4.
answers:
  - kind: strong
    text: |
      Okay, so before I cache anything I want to know which of the three is actually hurting. If
      the database is struggling at peak, I'd look at the slow query log or pg_stat_statements and
      see which one is eating the time. Honestly, the categories query is probably tiny, and if
      the open jobs query is slow it might just be missing an index, and I'd rather fix that than
      cache a bad query — caching a bad query means you still pay for it, just less often. After
      that, yes, I'd cache. Categories I'd cache for a long time, like an hour, because they
      barely change, and I'd bust it when someone edits a category. The open jobs list I'd cache
      for a short time, maybe thirty or sixty seconds, because a new job appearing a minute late
      is fine and that's the one every visitor hits. The saved jobs I would not put in a shared
      cache — that's per user, and the risk of showing one person another person's saved jobs
      isn't worth it. So: key by user if anything, and short.
