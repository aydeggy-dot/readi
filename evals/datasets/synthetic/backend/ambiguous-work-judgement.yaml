      created, plus saved filter views so people can keep their combinations, plus the indexes to
      support it. Then tomorrow it's finished, they open it, and if one field's wrong it's one
      field. Eight hours is plenty of time. I'd much rather over-deliver on the wrong guess than
      sit there half-built waiting on a reply.
