      ambiguity back up the chain. The ticket's vague, fine — resolving that is the job, that's
      what I'm paid for. So I wouldn't write to them at all, honestly, not until I've got
      something to show. A question with no proposal attached is just handing your work to
      somebody else, and it makes you look like you can't operate without hand-holding. What I'd
      do is take the most sensible reading and build it properly and completely. Vendors page,
