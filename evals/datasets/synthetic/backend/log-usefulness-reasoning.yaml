    text: |
      Honestly, from those three lines I know almost nothing. I know something errored twice
      around two, and the duplicated timestamp probably means one line is the catch and one is a
      rethrow of the same thing. But I can't tell you which user, which transfer, what actually
      failed, or even whether this is her transfer at all — there could be twenty failures in that
      window and I've only got three lines. And "something went wrong" isn't the error, that's the
      message we showed the user. What I'd log instead: timestamp, level, a correlation id
      generated at the edge that follows the request through every service, the user id and the
      transfer id — ids, not names — the operation, the exception class and its real message, and
      if a provider was involved, their status code and their reference so I can go and ask them.
      Structured JSON so I can query it instead of grepping. What I'd keep out deliberately:
      account numbers, phone numbers, emails, the whole request body, anything card-related.
