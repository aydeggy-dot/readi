  - kind: fluent-but-wrong
    text: |
      So the root cause of a bare line like that is almost always the logger, not the code. When
      you hand an Error straight to a JSON logger it serialises to an empty object, because
      message and stack are non-enumerable properties — so the line comes out as just the level
      and the timestamp, which is exactly what you're looking at. Two fixes follow from that.
      First, the level: most production apps ship at level error, which suppresses the info lines
      that would have carried the context, so I'd run production at debug and the surrounding
      detail appears with no code change at all. Second, log the full request and response body on
      the error path — that's the highest-value single change, because then support can search the
      phone number or the account number and land straight on her transfer. You don't need a
      correlation id if you're logging bodies; timestamps line up across services well enough to
      reconstruct the sequence. And logs are internal and encrypted at rest, so personal data in
      them is fine — compliance is about what leaves the building.
    expected:
      - dimension: Says what these lines cannot answer
        score: 1
        because: Settles on the logger dropping non-enumerable fields as the finding, and builds the whole answer on it.
      - dimension: Says what to log instead
        score: 1
        because: Production at `debug` and full bodies on the error path, with correlation ids argued to be unnecessary.
      - dimension: Says what to keep out
        score: 1
        because: The wrong boundary drawn outright — personal data in logs is fine because the logs are internal.
