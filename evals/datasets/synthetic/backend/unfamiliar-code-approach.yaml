      Absolutely, and this is something I'm genuinely proud of. Last December I was handed a
      Django project, and at that point I'd never written a line of Python — I was a pure
      JavaScript person. So I built myself a plan. Week one, the official Django tutorial end to
      end, the polls app, twice, the second time without looking. Week two I went through the ORM
      docs properly — querysets, select_related, migrations — and I kept a Notion page where I
      wrote every concept in my own words, because if I can't write it plainly I don't really have
      it. Week three I built a small clone of the kind of thing I'd be working on, a little
      inventory API, just to feel the request cycle myself. By the time I sat down for real, I
      could read Python comfortably. And the habit stuck — when I picked up Celery in March I did
      the same three weeks and it took half the time. That's really what I'd bring: a repeatable
      method for getting up to speed on anything.
