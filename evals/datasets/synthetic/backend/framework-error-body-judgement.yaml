question: spring-default-error-body
# `fluent-but-wrong` identifies the body as RFC 7807 problem details, says `message` is
# MessageSource-localised and stable across versions so the app can display and parse it, and
# concludes that turning the stack trace off makes the response production-ready. It is the most
# plausible wrong answer available and it leaves the client exactly where it started. 1/2/1
# against `strong`'s 4/4/3.
answers:
  - kind: strong
    text: |
      So the first thing is the trace — that shouldn't be leaving the server at all. It tells
      anyone who pokes the endpoint what framework we're on, what version, our package names,
      sometimes the file paths on the box. That's free reconnaissance for somebody who wants to
      find a known CVE. And it's a big payload to a phone on mobile data for one bad email
      address. Then the message — "Validation failed for object signUpRequest, error count one" —
      the client can't do anything with that. It doesn't say which field, it doesn't say what was
      wrong with it, so the app can't highlight the email box, and it's English prose from Spring,
      so you can't show it to a user either. If the app ever did parse it, a Spring upgrade would
      silently break it. What I'd send instead is a stable machine-readable code, like
      validation_failed, and a list of the fields with a reason per field — field email, code
      invalid_format — and let the app map those to its own copy. Keep the stack trace in the logs
      with a correlation id.
    expected:
      - dimension: Says what the client cannot do with it
        score: 4
        because: The client cannot mark the email field, and branching on `message` is not an option either — it is prose, and a Spring upgrade would silently break it.
      - dimension: Sees what is being given away
        score: 4
        because: Names what the trace gives away and where it belongs instead — the log, with a correlation id in the response.
      - dimension: Says what to send instead
        score: 3
        because: A stable code plus a list of fields with a reason each; does not say what stops the next exception escaping as the default again.
  - kind: weak
    text: |
      Yeah, that doesn't look good. The stack trace especially — you don't want to send a stack
      trace to the client, that's a security thing, people always say don't expose your internals.
      So I'd turn that off in the properties file. The rest of it looks okay to me, honestly —
      you've got the status, you've got the timestamp, you've got the path, so the client knows
      the request failed and knows which endpoint. The message tells them validation failed, which
      is true, that is what happened. Maybe I'd make the message nicer so the user can read it,
      like "Please enter a valid email address", so the app can just show the message in a toast
      and that's less work for the mobile team. And a 400 is the right status code for a bad
      request, so that part's fine. I think mainly it's just the stack trace that needs to go.
    expected:
      - dimension: Says what the client cannot do with it
        score: 1
        because: Names the wrong deficiency — that the message is not friendly enough — and would show it to the user.
      - dimension: Sees what is being given away
        score: 2
        because: '"You don''t want to send a stack trace to the client, that''s a security thing", with nothing that follows from it.'
      - dimension: Says what to send instead
        score: 1
        because: Turns the trace off in the properties file and leaves a body the client still cannot branch on.
  - kind: fluent-but-wrong
    text: |
      Okay, so the structure here is actually fine — this is the RFC 7807 problem-details shape,
      which is the standard error contract, so any client library that speaks problem+json already
      knows how to read timestamp, status, error, message and path without us writing anything.
      The one thing that's wrong is the trace, and that's a single property: server.error.include-
      stacktrace set to never. Do that and this response is production-ready. On the client side,
      message is the field to use. Spring builds it through MessageSource, so it's already
      localised to the Accept-Language header the phone sent, and it's stable across Spring
      versions because it comes from the validation annotation's message template, not from the
      exception class. So the mobile app can display it directly, and for field highlighting it
      can read the object name — signUpRequest — and the error count. If we later want per-field
      detail, we don't need a custom body, we just add the messages to messages.properties and
      Spring folds them into that same message string.
    expected:
      - dimension: Says what the client cannot do with it
        score: 1
        because: "`message` offered as the field the app should display and parse, localised and stable — the exact opposite of what it is."
      - dimension: Sees what is being given away
        score: 2
        because: The trace turned off by configuration, with no account of what it was costing.
      - dimension: Says what to send instead
        score: 1
        because: "Configuration alone: nothing is added that a client could branch on, and per-field detail is left to `messages.properties`."
  - kind: correct-poorly-explained
    text: |
      The trace goes, obviously — that's telling the internet what version of Spring we're running
      and, yeah, you don't want that, plus it's huge and the person's on mobile data. But the
