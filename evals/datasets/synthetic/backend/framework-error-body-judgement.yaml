      typed a bad email, and what the app wants to do is put the red outline on the email field,
      and nothing in this tells it that it was the email. "Error count one" is not a field name.
      And you can't show that message to a human either, it's Spring's English, so the app can't
      translate it and it can't display it. So it's a big response that's also useless, which is a
      bad combination. What you'd want is a code, something like validation_failed, that doesn't
      change when we upgrade anything, and then per field — email, invalid_format — and the app
      owns the wording. The trace stays in our logs, with an id in the response so support can
      find it.
    expected:
