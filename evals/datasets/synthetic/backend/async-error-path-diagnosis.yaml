  - kind: fluent-but-wrong
    text: |
      Right. The try/catch is synchronous and the frame is gone by the time the promise rejects —
      everyone gets that part. What people miss is why it's fatal rather than just a swallowed
      rejection, and that's the framework, not your code. Express 4 calls your handler and throws
      away whatever it returns, so a rejection has nowhere to go: it can't reach the error-
      handling middleware, it escapes to the process, and since Node 15 an unhandled rejection is
      a hard exit by default. So the real fix is configuration, not a rewrite. One, upgrade to
      Express 5 — it awaits the value the handler returns and forwards a rejection to next
      automatically, so this exact handler starts returning its 500 with no code change. Two,
      until you can upgrade, register process.on('unhandledRejection') and respond from there;
      that restores Node's pre-15 behaviour, the process stays alive, and the in-flight requests
      survive. The try/catch can stay where it is — it's harmless, it's just never the thing that
      fires.
    expected:
      - dimension: Says where the error goes
        score: 3
        because: Right about the frame being gone before the rejection, and right that Node 15 made it fatal.
      - dimension: Says why it takes the service down
        score: 3
        because: Names the hard exit correctly, and knows the in-flight requests are what is at stake.
      - dimension: Writes it so failures have a path
        score: 1
        because: Express 5 said to fix this handler unchanged — it will not, the handler never returns the promise — and an `unhandledRejection` responder to keep the process alive.
