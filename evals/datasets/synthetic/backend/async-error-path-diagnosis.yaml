# `fluent-but-wrong` gets the diagnosis largely right — the frame is gone before the promise
# rejects, and since Node 15 an unhandled rejection is a hard exit — and then goes wrong on the
# fix: upgrade to Express 5 so this exact handler works unchanged (it will not; the handler never
# returns the promise), and a `process.on('unhandledRejection')` that responds and keeps the
# process alive. **+1.70 is the third-narrowest separation in the bank**, and honestly so: the
# answer is right about where the error goes and wrong about what to do. 3/3/1 against `strong`'s
# 4/4/4.
answers:
  - kind: strong
    text: |
      So createOrder returns a promise, and the try block is finished the moment that promise is
      handed back — the call itself doesn't throw. When the database is down the promise rejects
      later, in a microtask, and by then there's no try around anything. There's no catch on the
      then either, so that's an unhandled rejection, and modern Node treats an unhandled rejection
      as fatal, so the process exits and takes every other in-flight request with it, and the
      supervisor restarts it. The client never sees the 500, the connection just drops. How I'd
      write it: make the handler async, await createOrder inside the try, then the catch genuinely
      covers it, and in the catch either call next(err) or send 500 with a stable code. One thing
      people miss is checking res.headersSent before you send, because if the response already
      went out you'll throw again inside the catch. I'd still keep an unhandledRejection handler,
      but to log and exit cleanly, not to pretend the process is healthy.
