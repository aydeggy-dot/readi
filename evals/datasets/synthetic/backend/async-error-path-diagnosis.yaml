    text: |
      So the catch never runs because — okay, the thing is createOrder doesn't throw, it returns.
      It returns a promise, and the returning is the only synchronous part, so the try is already
      over by the time anything goes wrong, and there's no .catch on the chain, so that rejection
      is just loose, and Node kills the process over a loose rejection these days. Which is why it
      isn't one bad request, it's all of them, plus the restart. On an older Node you'd have got a
      warning and a request that hangs forever, which is arguably worse to find. So — async
      handler, await inside the try, catch sends the 500, or next(err) and let one error
      middleware own the response shape so every route answers the same way. And check headersSent
      before you send in the catch, because if you've already responded you'll throw inside the
      catch and you're back where you started. Keep unhandledRejection wired, but to log and shut
      down properly.
