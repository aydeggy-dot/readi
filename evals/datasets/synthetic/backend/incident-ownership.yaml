    text: |
      Yeah, okay. So last year I shipped the thing that normalises phone numbers on sign-up —
      everything into E.164 before we store it. I tested it with numbers typed the normal way,
      zero-eight-zero and so on, which is how most people type it. What I didn't test was numbers
      already coming in as plus-two-three-four. My code stripped a digit off those anyway, so we
      saved a number that wasn't real. And the OTP goes to that number. So for two days, anybody
      who typed it that way could sign up and then just... never get their code. We found out from
      support — three tickets one morning, same shape. First thing I did was roll back the deploy,
      before I fully understood it, because rollback was cheap. Then I wrote a script to find the
      mangled rows, about two hundred, and repaired them from the raw input we'd logged. What
      actually changed after was the test file — I put in a table of every format people really
      type, pulled from our own data. And we put an alert on the OTP failure rate, because support
      shouldn't be the monitoring.
