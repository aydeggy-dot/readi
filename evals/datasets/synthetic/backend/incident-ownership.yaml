  - kind: fluent-but-wrong
    text: |
      Sure. So the one that stands out — we had an outage on our orders service, Friday evening,
      checkout returning 500s for about forty minutes. I wasn't on call but I saw the channel and
      jumped in. And what I did first was get a timeline: I pulled the deploy log, pulled the
      error rate graph, and lined them up. The errors started eleven minutes after a deploy, which
      everyone was treating as the cause, but the deploy was a copy change, so I said no, this is
      a coincidence, let's keep looking. I went into the database metrics and found connection
      waits climbing from about ten minutes before. It was a migration someone had run manually
      that took an exclusive lock. So I got them to kill it, checkout recovered, and then I ran
      the migration properly overnight in batches. What changed afterwards is that I wrote the
      runbook for that service, and I set up the dashboard that puts deploys and error rate on the
      same axis, which the team still uses. I'm usually the person who stays calm and drives the
      timeline in those situations.
