# `fluent-but-wrong` believes `await` blocks Node's event loop and that an un-awaited promise is
# handed to the libuv thread pool on a real OS thread — so it drops the `await`, raises
# `UV_THREADPOOL_SIZE`, calls a queue "a thread pool you have to operate yourself", and concludes
# delivery is guaranteed. It is the fire-and-forget answer with a mechanism attached. 1/1/1
# against `strong`'s 4/4/3.
answers:
  - kind: strong
    text: |
      Okay, so the problem is the handler is doing two things and only one of them is actually
      sign-up. Creating the user is our work, sending the welcome email is somebody else's server,
      and we're making the person wait for it. That's your four seconds — that's the provider's
      latency, not ours. And worse, if the send throws, the await throws, the whole handler fails,
      so the user gets an error even though we already created them. So they've got an account and
      they're being told they don't. Then they retry and now it's a duplicate email error, which
      is confusing. What I'd do is finish the request as soon as the user row is committed —
      respond 201 there — and push the email onto a queue. Redis, BullMQ, whatever we already use.
      The job retries with backoff, and if it exhausts retries it goes somewhere a human can see.
      For the user, the page should just say the account is created, check your email, and it can
      take a minute — with a resend button that actually works. Don't block sign-in on the email
      either; the account exists.
    expected:
