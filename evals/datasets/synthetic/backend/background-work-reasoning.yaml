  - kind: fluent-but-wrong
    text: |
      Right, so the core issue here is that this is Node, which is single-threaded, and `await`
      blocks the event loop. While that await on sendWelcomeEmail is pending, the process can't
      pick up any other request — so under load you're serialising every sign-up behind the email
      provider. That's the four seconds, and it's four seconds for everybody, not just the one
      person. The fix is to drop the await. If you call sendWelcomeEmail without awaiting, Node
      hands it off to the libuv thread pool and it runs on a real OS thread, in parallel, so the
      main thread goes straight to res.status(201) and the response is instant. You don't need a
      queue for something this small — a queue is just a thread pool you have to operate yourself.
      I'd also bump UV_THREADPOOL_SIZE, since the default four threads is the actual ceiling on
      concurrent sends. For the user, nothing changes in the copy: we return 201 immediately and
      the thread completes the send, so the email is guaranteed to go out. If it never arrives
      it's the provider's spam filter, and that's a support conversation.
    expected:
      - dimension: Says what the user is paying for
        score: 1
        because: The wrong cost named with a mechanism — four seconds for everybody, because `await` is believed to block the loop.
      - dimension: Gets the work out of the request
        score: 1
        because: Drops the `await` and leaves the call in the handler, described as not needing a queue at all.
      - dimension: Says what the user is told
        score: 1
        because: '"Nothing changes in the copy" — a 201 returned and the send assumed to have happened.'
