  - kind: fluent-but-wrong
    text: |
      Right, this is propagation. Spring Data's `SimpleJpaRepository` — the base class every
      repository inherits from — is itself annotated, and its write methods, `save` and `delete`,
      are declared `REQUIRES_NEW`. So each `save` call suspends whatever transaction is running
      and opens its own, commits it at the end of the call, and resumes the outer one. That's why
      the order survives: `orderRepository.save` opened transaction B, committed it, returned, and
      by the time the payment save throws, B is long gone and rolling back A can't touch it. The
      outer `@Transactional` is doing exactly what it says — it's just enclosing two transactions
      that have already committed themselves. The fix is to force participation: annotate the
      service method `@Transactional(propagation = Propagation.REQUIRED)` and override the
      repository methods with `REQUIRED` too, or use the `EntityManager` directly for the two
      writes so no repository proxy is in the path. As for scope — validation and any payment-
      gateway call stay outside; only the two persists belong in the boundary.
    expected:
      - dimension: Says why the annotation did not apply
        score: 1
        because: "`SimpleJpaRepository` declaring its writes `REQUIRES_NEW` — the repositories opening their own transactions, given as the whole story."
      - dimension: Puts the boundary where the work is
        score: 1
        because: "Overrides the repository methods' propagation, or uses the `EntityManager` directly: the proxy is never the thing being fixed."
      - dimension: Knows what a transaction is being asked to cover
        score: 3
        because: "Correct, and reached from a false diagnosis: validation and the gateway call outside, only the two persists inside."
