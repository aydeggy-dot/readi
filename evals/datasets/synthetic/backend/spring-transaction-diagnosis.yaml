question: spring-transaction-did-not-roll-back
# The pairing this rubric had to survive: `fluent-but-wrong` claims `SimpleJpaRepository`'s write
# methods are declared `REQUIRES_NEW`, so each save commits its own transaction before the outer
# one can roll back. It is specific, it names a real class, and it reaches a correct third
# criterion from a false first one — 1/1/3 against `strong`'s 3/4/4.
answers:
  - kind: strong
    text: |
      Yeah, so the annotation is on a method that's being called from inside the same class.
      `@Transactional` is done with a proxy — Spring wraps the bean and starts the transaction
      when the call comes in through the proxy. But `placeOrder` calls `saveOrderAndPayment` on
      `this`, it's a plain Java method call, it never goes out through the proxy, so no
      transaction gets started at all. Each `save` then runs in its own little transaction from
      the repository, so the order is committed and gone before the payment blows up, and there's
      nothing to roll back. The fix is to move the annotation onto `placeOrder` — it's the entry
      point, it's the unit of work. If you needed the split, pull the inner method into its own
      bean and inject it, so the call goes through a proxy. On what belongs inside — the two
      saves, yes. Validation can be outside, it's just CPU. And the payment provider call and the
      confirmation email must be outside, because you don't hold a database connection while you
      wait on somebody else's HTTP, and you can't unsend an email if it rolls back.
    expected:
      - dimension: Says why the annotation did not apply
        score: 3
        because: The annotation is applied by a proxy and `this.saveOrderAndPayment` never reaches it, so no transaction starts.
      - dimension: Puts the boundary where the work is
        score: 4
        because: Moves the boundary to `placeOrder` as the unit of work, and calls self-injection a smell rather than the answer.
      - dimension: Knows what a transaction is being asked to cover
        score: 4
        because: The two saves inside; the provider call and the email outside, because you do not hold a connection across someone else's HTTP and cannot un-send an email.
  - kind: weak
    text: |
      Okay so it's annotated but it's not rolling back. I think `@Transactional` only rolls back
      on some exceptions, so I'd add `rollbackFor = Exception.class` to make it roll back on
      everything, that's usually the fix for this. It might also be that the exception is being
      caught somewhere and swallowed, so I'd look at whether there's a try-catch around it. Um, or
      the database table isn't InnoDB — I've seen that with MySQL, if it's MyISAM transactions
      just don't work at all, so I'd check the engine. I'd also add some logging to confirm the
      payment save is actually throwing. What goes inside the transaction — I'd put everything in
      it really, the whole method, so that if anything fails nothing is saved, that seems safest.
      I've used `@Transactional` but mostly it just worked, I haven't had to dig into how it
      actually does it.
    expected:
