  - kind: fluent-but-wrong
    text: |
      Okay, so people say "race condition" here but that can't be it — Node's single-threaded, so
      this handler runs to completion on the event loop — check and decrement in the same tick,
      nothing else runs in between. So the interleaving story doesn't hold. What's actually
      happening is read replica lag. `findById` is a read, so your data layer routes it to a
      replica, and the decrement is a write, so it goes to the primary. Under normal load
      replication lag is a few milliseconds and you never see it. At peak, the WAL stream backs up
      and lag stretches to two or three hundred milliseconds, so the second customer's `findById`
      hits a replica that hasn't received the first decrement yet and still reports stock as one.
      That's why it's rare and always at peak — the fault is proportional to lag. So the fix is
      read-your-writes: route this read to the primary, or turn on session pinning so every read
      for that item goes to the primary for a few hundred milliseconds after a write. Then the
      second request sees the true stock and gets its 409.
    expected:
      - dimension: Sees the gap between the read and the write
        score: 1
        because: The interleaving ruled out by the single thread, and replica lag put in its place.
      - dimension: Says why it is rare rather than constant
        score: 1
        because: The rarity explained by WAL lag stretching at peak — something that is not there.
      - dimension: Makes it impossible rather than unlikely
        score: 1
        because: "Routes the read to the primary: a staleness removed that was never the cause, with the check and the write still separate."
