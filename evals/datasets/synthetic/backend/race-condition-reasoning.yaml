answers:
  - kind: strong
    text: |
      So the problem is you're checking and then acting, and there's a gap in between. Request A
      reads stock as one, decides fine, and before it gets to the update request B also reads
      stock as one — it hasn't been decremented yet — so B also thinks it's fine. Both then write
      stock minus one from the value they read, and both create an order. It's rare because that
      gap is a few milliseconds and both requests have to land inside it, which only happens when
      there's enough traffic that two people hit the same item at the same moment. That's why it's
      peak-only and why you'll never reproduce it by hand. The fix is to stop reading first and
      let the database decide — one statement, `UPDATE items SET stock = stock - 1 WHERE id = $1
      AND stock >= 1`, then check how many rows it affected. Zero is your out-of-stock, return the
      409. One means you got it. And the order creation should be in the same transaction as the
      decrement, otherwise you can decrement, fail to create the order, and lose a unit.
