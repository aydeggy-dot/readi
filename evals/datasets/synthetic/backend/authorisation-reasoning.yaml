# `fluent-but-wrong` names the bug correctly as IDOR and then fixes the wrong half of it:
# unguessable, HMAC-signed opaque references resolved in middleware, so "the handler stays as it
# is". No ownership comparison is made anywhere, and the middleware is shared — which is why it
# reaches a 2 on criterion 3. 1/1/2 against `strong`'s 4/3/3.
answers:
  - kind: strong
    text: |
      So requireSignIn only answers "is this somebody", not "is this their invoice". It validates
      the session or the token and puts a user on the request, and then the handler goes straight
      to findById on whatever id is in the URL — nothing ever compares the invoice's owner to the
      person asking. So any signed-in user can just walk the ids. What's missing is the ownership
      check: once you've loaded it, if invoice.user_id isn't req.user.id — or in a B2B case if the
      invoice's org isn't one the user belongs to — you don't hand it over. I'd return 404 rather
      than 403 there, so you're not confirming the row exists. Better than checking it in the
      handler, though, is pushing it into the query: findOne where id and owner, so the invoice
      never loads unless it's theirs. And for the next route, I'd make it default deny — a route
      has to declare who may reach it, and the data layer takes the actor, instead of trusting
      every developer to remember.
    expected:
      - dimension: Separates who you are from what you may do
        score: 4
        because: '`requireSignIn` answers "is this somebody", not "is this theirs" — so any signed-in user can walk the ids.'
      - dimension: Writes a check that cannot return the row
        score: 3
        because: Asks by id and owner so the invoice never loads unless it is theirs; does not say what that buys over comparing afterwards.
      - dimension: Puts it where it cannot be forgotten
        score: 3
        because: Default deny at the route and the data layer taking the actor, so it is not left to remembering.
  - kind: weak
    text: |
      Okay so requireSignIn is the login check, it makes sure you're signed in before you can hit
      the endpoint. And the problem is the tester changed the id in the URL and got somebody
      else's invoice. So I think what's missing is validation on the id — you should validate it's
      a proper format, a UUID or whatever, before you use it in the query, otherwise people can
      put anything in there. I'd add a validation middleware for that. Probably rate limiting too,
      because if somebody's going through ids one after another you want to block them, that's
      basically what he was doing. And I'd fix it on the frontend as well, the app should only
      render links to your own invoices so a normal user would never land on somebody else's. For
      where to put it, I'd register the validation middleware in the app file so it runs for every
      route and then the next one gets it automatically.
