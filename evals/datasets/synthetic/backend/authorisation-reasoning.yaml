  - kind: fluent-but-wrong
    text: |
      So there are two layers and only one is present. requireSignIn is authentication — valid
      session, user on the request. What's missing is authorisation, and the specific class of bug
      is IDOR, insecure direct object reference. You're exposing the database's own primary key in
      the URL, so the identifier is enumerable, and the tester just incremented it. The fix is to
      stop handing out direct references at all. Give invoices an external identifier that can't
      be guessed — a v4 UUID, or better, an HMAC-signed opaque token over the id using a server-
      side secret — and have the route resolve by that. Then changing the number in the address
      bar produces a token whose signature doesn't verify, and you 404 before you ever touch the
      database. And to make the next route inherit it, put it in middleware: a resolveReference
      middleware that verifies and decodes the signed reference for any route with an :id
      parameter, so no handler ever sees a raw primary key. Fixed once, for everything, and the
      handler stays as it is.
    expected:
      - dimension: Separates who you are from what you may do
        score: 1
        because: IDOR named, and the cause put in the identifier being enumerable rather than in the missing comparison.
      - dimension: Writes a check that cannot return the row
        score: 1
        because: An HMAC-signed opaque reference so the number cannot be guessed — the row is hidden, not refused.
      - dimension: Puts it where it cannot be forgotten
        score: 2
        because: A shared `resolveReference` middleware for every `:id` route — shared, and not the ownership check.
