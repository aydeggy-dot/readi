    text: |
      So what those tests proved is that our code calls our payment client, and that when
      something hands it back the success shape we invented, we do the right thing with it. That's
      genuinely all. They proved nothing about the provider — not that the field names are right,
      not the error codes, not auth, not timeouts, not what a `pending` status even looks like.
      And because the fake always says yes, every failure path is completely untested, which is
      exactly where a live payment breaks. What I'd change about them: keep them, they're fine as
      unit tests, but build the fake from real captured responses rather than from my head, and
      add cases for a decline, a timeout, a duplicate charge. Then a separate, smaller set of
      tests that actually hit the provider's sandbox — on a schedule, not on every pull request,
      so we hear about it when they change something. And honestly, two days is a monitoring
      failure more than a testing one. I'd alert on payment success rate over a window, and on
      anything stuck pending for more than a few minutes.
