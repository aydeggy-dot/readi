  - kind: fluent-but-wrong
    text: |
      Right, so the key thing is where the fake sits. Ours is generated from the provider's
      OpenAPI spec, so the stub and the real service are conformant to the same contract by
      construction — that is a contract test, it runs offline. So the tests did prove the
      integration: our request satisfies their schema and we handle their response schema. What
      they didn't cover is the transport, and that's where two days of failures actually come from
      — TLS renegotiation, DNS, their edge dropping connections. So what I'd change is to make the
      double strict: assert exact call counts, assert every argument with matchers, and fail the
      test if any unexpected call happens, because a loose mock is what lets a drifted call slip
      past. Then wrap the client in retries with exponential backoff and a circuit breaker, so
      transport blips self-heal. What I would not do is call their sandbox from CI — sandboxes
      drift from production, they go down, and a red build nobody believes is worse than no build.
      Regenerate the stub from their spec on a nightly job instead, and you get the same signal
      deterministically.
