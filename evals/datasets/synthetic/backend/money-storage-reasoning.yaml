  - kind: fluent-but-wrong
    text: |
      Right, so this is a float accumulation ordering problem, not a storage problem. Double
      precision gives you fifteen, sixteen significant decimal digits, and 45200.10 is nowhere
      near that limit, so the value sitting in each row is exact — it round-trips. What isn't
      exact is the addition. Floating point addition isn't associative, so a plus b plus c can
      differ in the last bit depending on the order you add them. And Postgres, once the table is
      big enough to qualify, runs that SUM as a parallel aggregate: each worker sums its own slice
      and the leader combines the partials, and the order the partials come back in isn't
      deterministic. So you get 45200.100000000006 on one run and a clean 45200.1 on the next,
      which is exactly why it's only a handful of invoices. The fix is to make the order
      deterministic — SUM(amount ORDER BY created_at, id), or set max_parallel_workers_per_gather
      to zero for that query. The rows already in the column are fine, the stored values are
      exact, so there's nothing to migrate.
