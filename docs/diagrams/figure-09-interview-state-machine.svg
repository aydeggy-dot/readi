<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="610" viewBox="0 0 1240 610" xmlns="http://www.w3.org/2000/svg"><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"></path></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"></path></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"></path></marker>
  </defs><g transform="translate(0,0)"><text x="0" y="16" font-family="Georgia, " times="" new="" roman",="" serif"="" font-size="17" font-weight="600" fill="#374151">The interview engine — a state machine our code owns (milestone M3)</text><text x="0" y="35" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">The model phrases questions and probes. It never decides how long a session runs, which question comes next, or when to stop. Everything in this diagram is designed and planned; none of it is written yet.</text></g><g transform="translate(0,50)"><rect x="24" y="6" width="1192" height="268" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="36" y="25" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">THE STATE MACHINE — PURE, NO INPUT/OUTPUT INSIDE A TRANSITION</text>
<rect x="48" y="60" width="150" height="58" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="123" y="81" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#6B7280">INTRO</text>
<text x="123" y="97" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">greeting, framing</text>
<rect x="268" y="60" width="170" height="58" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="353" y="81" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#6B7280">QUESTION</text>
<text x="353" y="97" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">asked from the bank</text>
<rect x="268" y="184" width="170" height="58" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="353" y="205" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#6B7280">FOLLOW_UP</text>
<text x="353" y="221" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">0 … 2 per question</text>
<rect x="560" y="60" width="230" height="58" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="675" y="81" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#6B7280">CANDIDATE_QUESTIONS</text>
<text x="675" y="97" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">"any questions for me?"</text>
<rect x="838" y="60" width="150" height="58" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="913" y="81" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#6B7280">WRAP_UP</text>
<text x="913" y="97" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">closing line</text>
<rect x="1036" y="60" width="150" height="58" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="1111" y="81" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#6B7280">ENDED</text>
<text x="1111" y="97" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">transcript sealed</text>
<path d="M 198 89 L 268 89" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 340 118 L 340 184" fill="none" stroke="#C2410C" stroke-width="1.5" marker-end="url(#ap)"></path>
<rect x="391.4" y="127" width="157.2" height="15" rx="3" fill="#FFFFFF" opacity="0.95"></rect>
<text x="470" y="138.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" fill="#C2410C">a criterion the answer</text>
<text x="470" y="162" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" font-weight="400" fill="#C2410C">has not covered</text>
<path d="M 400 242 L 190 242 L 190 89 L 268 89" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<rect x="146" y="142" width="96" height="15" fill="#fff"></rect>
<text x="194" y="153" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" font-weight="400" fill="#6B7280">next question</text>
<path d="M 438 89 L 560 89" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<rect x="453.4" y="72" width="91.19999999999999" height="15" rx="3" fill="#FFFFFF" opacity="0.95"></rect>
<text x="499" y="83.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" fill="#6B7280">budget spent</text>
<path d="M 790 89 L 838 89" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 988 89 L 1036 89" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<text x="632" y="236" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11" font-weight="400" fill="#6B7280">Budgets enforced in code: a time budget (15 or 30 minutes at MVP) and a question budget. Pause, resume and abandon are</text>
<text x="632" y="252" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11" font-weight="400" fill="#6B7280">lifecycle — in_progress / completed / abandoned — not states.</text>
<rect x="24" y="298" width="584" height="246" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="36" y="317" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">OUR CODE DECIDES</text>
<circle cx="50" cy="336" r="3.5" fill="#C2410C"></circle>
<text x="66" y="340" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">which state comes next, and when the session ends</text>
<circle cx="50" cy="369" r="3.5" fill="#C2410C"></circle>
<text x="66" y="373" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">how many questions, and which ones (seeded, reproducible selection)</text>
<circle cx="50" cy="402" r="3.5" fill="#C2410C"></circle>
<text x="66" y="406" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">which criteria a follow-up should probe, from the question’s planned probes</text>
<circle cx="50" cy="435" r="3.5" fill="#C2410C"></circle>
<text x="66" y="439" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">the time and question budget, and the follow-up cap</text>
<circle cx="50" cy="468" r="3.5" fill="#C2410C"></circle>
<text x="66" y="472" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">the exact content used, pinned by version: question, rubric, role, level, stack</text>
<circle cx="50" cy="501" r="3.5" fill="#C2410C"></circle>
<text x="66" y="505" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">every turn written to the database idempotently by (session, sequence)</text>
<rect x="632" y="298" width="584" height="246" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="644" y="317" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">THE MODEL DECIDES</text>
<circle cx="658" cy="336" r="3.5" fill="#4B5563"></circle>
<text x="674" y="340" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">the wording of the question, in the interviewer’s voice</text>
<circle cx="658" cy="369" r="3.5" fill="#4B5563"></circle>
<text x="674" y="373" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">the wording of one follow-up probe from the menu it is given</text>
<circle cx="658" cy="402" r="3.5" fill="#4B5563"></circle>
<text x="674" y="406" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="400" fill="#374151">the closing remarks</text>
<text x="658" y="452" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="700" fill="#C2410C">The rubric never reaches the interviewer model.</text>
<text x="658" y="472" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">A follow-up call is given the probes and the coverage flags — not the criteria, the</text>
<text x="658" y="489" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">weights or the level descriptors. That is cheaper, leaks less, and gives a prompt</text>
<text x="658" y="506" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">injection nothing worth reaching for. Candidate answers are always wrapped as data.</text></g></svg>
