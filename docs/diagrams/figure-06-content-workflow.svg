<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="650" viewBox="0 0 1240 650" xmlns="http://www.w3.org/2000/svg"><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"></path></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"></path></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"></path></marker>
  </defs><g transform="translate(0,0)"><text x="0" y="16" font-family="Georgia, " times="" new="" roman",="" serif"="" font-size="17" font-weight="600" fill="#374151">How content is created, reviewed and published</text><text x="0" y="35" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">Built and in use today. Roles, levels, stacks, tracks, lessons, rubrics and questions all carry the same workflow — which is why adding a new role is a content task, never a migration.</text></g><g transform="translate(0,50)"><rect x="50" y="52" width="180" height="86" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.6"></rect>
<text x="140" y="73" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#374151">/content/seed/*.yaml</text>
<text x="140" y="89" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">written from a blueprint</text>
<text x="140" y="103.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">author: ai_draft | human</text>
<text x="140" y="118" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">linked by slug</text>
<rect x="250" y="52" width="180" height="86" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.6"></rect>
<text x="340" y="73" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#374151">pnpm db:seed</text>
<text x="340" y="89" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">idempotent importer</text>
<text x="340" y="103.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">skips what is unchanged</text>
<text x="340" y="118" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">never publishes or deletes</text>
<rect x="450" y="64" width="160" height="62" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"></rect>
<text x="530" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#374151">draft</text>
<text x="530" y="101" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">the expert writes</text>
<rect x="630" y="64" width="160" height="62" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"></rect>
<text x="710" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#374151">in_review</text>
<text x="710" y="101" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">the expert submits</text>
<rect x="810" y="64" width="160" height="62" rx="5" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"></rect>
<text x="890" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#374151">published</text>
<text x="890" y="101" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">an admin publishes</text>
<rect x="990" y="64" width="160" height="62" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"></rect>
<text x="1070" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="14" font-weight="650" fill="#374151">retired</text>
<text x="1070" y="101" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">an admin retires</text>
<path d="M 230 95 L 250 95" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 430 95 L 450 95" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 610 95 L 630 95" fill="none" stroke="#C2410C" stroke-width="1.5" marker-end="url(#ap)"></path>
<path d="M 790 95 L 810 95" fill="none" stroke="#C2410C" stroke-width="1.5" marker-end="url(#ap)"></path>
<path d="M 970 95 L 990 95" fill="none" stroke="#C2410C" stroke-width="1.5" marker-end="url(#ap)"></path>
<text x="1150" y="150" text-anchor="end" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" font-weight="400" fill="#6B7280" font-style="italic">a transition is not an edit</text>
<rect x="30" y="174" width="1180" height="122" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="42" y="193" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">EVERY MUTATION IS ONE DATABASE TRANSACTION</text>
<rect x="52" y="202" width="360" height="72" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"></rect>
<text x="232" y="223" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#374151">the row itself</text>
<text x="232" y="239" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">the new values</text>
<rect x="438" y="202" width="360" height="72" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"></rect>
<text x="618" y="223" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#374151">content_versions</text>
<text x="618" y="239" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">a snapshot of what it was,</text>
<text x="618" y="253.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">children included</text>
<rect x="824" y="202" width="360" height="72" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"></rect>
<text x="1004" y="223" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#374151">audit_logs</text>
<text x="1004" y="239" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">who, what, which status to which —</text>
<text x="1004" y="253.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">ids and enums, never prose</text>
<rect x="30" y="316" width="1180" height="250" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="42" y="335" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">THE RULES THAT HOLD IT TOGETHER</text>
<circle cx="52" cy="344" r="3.5" fill="#C2410C"></circle>
<text x="68" y="348" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="700" fill="#374151">Only published content reaches a candidate</text>
<text x="68" y="365" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">and dependencies count: a lesson also needs its track published, a question its rubric.</text>
<circle cx="52" cy="388" r="3.5" fill="#C2410C"></circle>
<text x="68" y="392" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="700" fill="#374151">Candidate responses never carry the answer key</text>
<text x="68" y="409" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">a test walks every candidate route in the OpenAPI document and checks the raw JSON for rubrics, criteria, descriptors, ideal points and planned follow-ups.</text>
<circle cx="52" cy="432" r="3.5" fill="#C2410C"></circle>
<text x="68" y="436" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="700" fill="#374151">The files create; the CMS owns</text>
<text x="68" y="453" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">every row carries seed_managed — true while the seed file is its source, false from the first save in the CMS. The importer then leaves it alone and names it in its report.</text>
<circle cx="52" cy="476" r="3.5" fill="#C2410C"></circle>
<text x="68" y="480" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="700" fill="#374151">A model’s draft cannot be published unreviewed in production</text>
<text x="68" y="497" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">the importer marks it; production refuses unless an admin explicitly acknowledges, which the audit entry records. A typo fix is not a review, so saving an edit never clears the mark.</text>
<circle cx="52" cy="520" r="3.5" fill="#C2410C"></circle>
<text x="68" y="524" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="12" font-weight="700" fill="#374151">Publishing a question embeds it</text>
<text x="68" y="541" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">the prompt and context go to the worker and the 1024-dimension vector is stored with the model that made it. A near-duplicate is a warning, never a refusal.</text></g></svg>
