<text x="507" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">LiveKit Agents host</text>
<text x="507" y="99.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF"></text>
<rect x="614" y="48" width="200" height="74" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="714" y="69" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#6B7280">Speech-to-text</text>
<text x="714" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">Deepgram + custom vocabulary</text>
<text x="714" y="99.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF"></text>
<rect x="846" y="48" width="200" height="74" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="946" y="69" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#6B7280">The same engine</text>
<text x="946" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">state machine + LLM turn</text>
<text x="946" y="99.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF"></text>
<rect x="1078" y="48" width="162" height="74" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="1159" y="69" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#6B7280">Text-to-speech</text>
<text x="1159" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">ElevenLabs or Cartesia</text>
<text x="1159" y="99.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF"></text>
<path d="M 210 85 L 236 85" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 396 85 L 422 85" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 592 85 L 614 85" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 814 85 L 846 85" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 1046 85 L 1078 85" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ag)"></path>
<path d="M 1160 122 L 1160 160 L 120 160 L 120 122" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"></path>
<rect x="560" y="152" width="160" height="16" fill="#fff"></rect>
<text x="640" y="164" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11" font-weight="400" fill="#6B7280">the reply, spoken back</text>
<rect x="30" y="206" width="580" height="232" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="42" y="225" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">THE LATENCY BUDGET</text>
<text x="52" y="238" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#374151">Target: the interviewer starts replying under ~1 second after the</text>
<text x="52" y="255" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#374151">candidate stops speaking (p50), and under 2 seconds at p95.</text>
<rect x="52" y="276" width="182" height="26" rx="3" fill="#C2410C" opacity="0.85"></rect>
<text x="143" y="293" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" fill="#fff">speech-to-text final</text>
<rect x="234" y="276" width="182" height="26" rx="3" fill="#EA580C" opacity="0.85"></rect>
<text x="325" y="293" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" fill="#fff">LLM first token</text>
<rect x="416" y="276" width="156" height="26" rx="3" fill="#F97316" opacity="0.85"></rect>
<text x="494" y="293" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" fill="#fff">text-to-speech first byte</text>
<line x1="52" y1="310" x2="572" y2="310" stroke="#4B5563" stroke-width="1"></line>
<text x="52" y="324" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" font-weight="400" fill="#6B7280">0 s</text>
<text x="572" y="324" text-anchor="end" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="10.5" font-weight="400" fill="#6B7280">≈ 1 s</text>
<text x="52" y="352" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">Each stage is logged separately, so a slow session can be attributed rather than guessed at.</text>
<text x="52" y="372" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">Voice minutes are metered against the candidate’s allowance before the session starts and settled after.</text>
<text x="52" y="392" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">If the connection degrades the session falls back to text rather than failing — the engine does not care which</text>
<text x="52" y="409" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">transport it is on.</text>
<text x="52" y="430" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">Captions and the transcript stay visible throughout (accessibility, and low-bandwidth insurance).</text>
<rect x="630" y="206" width="580" height="232" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="6 5"></rect>
<text x="642" y="225" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">WHAT STILL HAS TO BE DECIDED OR COLLECTED</text>
<circle cx="652" cy="236" r="3.5" fill="#B45309"></circle>
<text x="668" y="240" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" fill="#374151">A speech-to-text provider must be benchmarked on Nigerian-accented speech</text>
<text x="668" y="257" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">before it is chosen — word error rate overall and on technical terms.</text>
<circle cx="652" cy="284" r="3.5" fill="#B45309"></circle>
<text x="668" y="288" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" fill="#374151">Consented Nigerian-accented audio samples do not exist yet</text>
<text x="668" y="305" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">collecting them is a task with its own lead time, not a configuration step.</text>
<circle cx="652" cy="332" r="3.5" fill="#B45309"></circle>
<text x="668" y="336" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" fill="#374151">Real voice latency from Nigeria has never been measured</text>
<text x="668" y="353" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">the &lt;1 s target is a target, not an observation.</text>
<circle cx="652" cy="380" r="3.5" fill="#B45309"></circle>
<text x="668" y="384" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="700" fill="#374151">LiveKit Cloud region, Deepgram and a text-to-speech vendor</text>
<text x="668" y="401" text-anchor="start" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" font-weight="400" fill="#6B7280">three accounts, all billed per minute or per character.</text></g></svg>
