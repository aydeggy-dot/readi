  </defs><g transform="translate(0,0)"><text x="0" y="16" font-family="Georgia, " times="" new="" roman",="" serif"="" font-size="17" font-weight="600" fill="#374151">Voice mode and its latency budget (milestone M5)</text><text x="0" y="35" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">The same state machine, a different transport. Nothing in this diagram exists yet: no speech-to-text, text-to-speech or LiveKit code is written, and the local LiveKit server in docker-compose has no consumer.</text></g><g transform="translate(0,50)"><rect x="30" y="48" width="180" height="74" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="120" y="69" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#6B7280">Candidate</text>
<text x="120" y="85" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF">speaks · Opus, low bitrate</text>
<text x="120" y="99.5" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#9CA3AF"></text>
<rect x="236" y="48" width="160" height="74" rx="5" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 4"></rect>
<text x="316" y="69" text-anchor="middle" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="13" font-weight="650" fill="#6B7280">LiveKit room</text>
