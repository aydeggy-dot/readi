  </defs><g transform="translate(0,0)"><text x="0" y="16" font-family="Georgia, " times="" new="" roman",="" serif"="" font-size="17" font-weight="600" fill="#374151">What the owner has to provide, and when</text><text x="0" y="35" font-family="-apple-system, " segoe="" ui",="" roboto,="" helvetica,="" arial,="" sans-serif"="" font-size="11.5" fill="#6B7280">Nothing external is needed to keep building: the default configuration reaches no paid service. The column that matters is the third — those are the items with sign-up, verification or DNS work behind them.</text></g><g transform="translate(0,50)"><rect x="24" y="8" width="268" height="280" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"></rect>
