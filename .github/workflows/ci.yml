name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

# Third-party actions are pinned to commit SHAs (version in the trailing comment).
jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: readi
          POSTGRES_PASSWORD: readi
          POSTGRES_DB: readi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U readi -d readi"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://readi:readi@localhost:5432/readi
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 (pnpm version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turborepo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: turbo-ts-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-ts-${{ runner.os }}-
      - name: Check formatting
        run: pnpm format:check
      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck --filter='!@readi/ai-worker'
      - name: Apply database migrations
        run: pnpm --filter @readi/api db:deploy
      - name: Test and build
        run: pnpm turbo run test build --filter='!@readi/ai-worker'
      - name: Smoke-test the built API
        run: bash scripts/smoke-api.sh
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai-worker
    services:
      redis:
        image: redis:8.8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: apps/ai-worker/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  contracts:
    name: Contract drift (Zod → JSON Schema → Pydantic)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: apps/ai-worker/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: apps/ai-worker
      - name: Regenerate contracts and fail on drift
        run: bash scripts/check-contracts.sh
