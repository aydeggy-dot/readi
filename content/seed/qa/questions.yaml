# The QA question bank: 33 questions for an intern/junior or mid-level interview — 23 general and 10
# written for a particular automation stack. A QA candidate is offered 42, because nine role-general
# questions live in the frontend and backend banks and carry this role too; stack tagging means any
# one candidate actually sees about 34.
#
# **QA is the only role in the catalogue rated a full fit for this engine**, because a QA interview
# is largely "here is a feature — how would you test it?", which is a conversation with follow-ups.
# There is no round we are missing and no tooling we owe it, so for this role the bank is the whole
# product (`content/seed/blueprints/qa.md`). It is weighted accordingly towards `test_design` and
# `scenario`, and nothing in it asks a candidate to write code.
#
# **The level tag does work here** (owner's decision on the backend bank, 2026-09-23): each question
# carries the level it is honestly asked at rather than both by default, and the one resulting
# shortfall — `test-data` at intern-junior — is reported by `check-bank.mjs` every run rather than
# filled with a mid question wearing a junior label.
#
# **Every question here asks one thing, and carries two planned follow-ups** (owner's decision,
# 2026-09-23). The opening prompt asks for one criterion, the way a real interviewer does; the other
# two are asked for in `planned_follow_ups`, each naming the criterion it draws out by its position
# in the rubric. This bank is the pilot for that shape — until 2026-09-23 every prompt here asked for
# all three at once, which two critique passes made their first finding, and the follow-ups are a
# **menu, not a script**: from M3 the engine asks one only for a criterion the answer has not already
# covered, so a candidate who answers completely is asked nothing further and moves on.
#
# One instruction for whoever asks these, which the seed format has nowhere to put: **an answer drawn
# from a personal project, a hypothetical, or "where I worked we did not have that, but I would…" is
# scored on the same terms as one drawn from a job.** Much of this audience is self-taught, and a
# large share of QA candidates in this market arrived through a bootcamp or a manual-testing role
# with no automation, no pipeline and no staging environment.
#
# Draft, written by a model. `reviewer_notes` on each question says what the drafter is unsure
# about — read those first, and see content/seed/REVIEW.md for what we are asking you to check.
version: 1
author: ai_draft
status: draft

questions:
  # -------------------------------------------------------------------------------------------
  # Test design. The role's central round, and the reason `test_design` exists as a question type.

  - slug: test-design-signup-form
    roles: [qa]
    levels: [intern-junior]
    type: test_design
    topic: test-design
    subtopic: boundary and state coverage
    difficulty: 2
    prompt: >-
      A sign-up form takes a phone number, a password and a date of birth, and the product says
      users must be 18 or over. What would you test?
    context: null
    rubric: test-case-selection
    ideal_points:
      - Partition the inputs and take one case from each rather than listing many similar ones.
      - Boundaries on the age rule — 17, 18 and 19 — and on password length.
      - Phone number formats that occur here, including a leading zero and the +234 form.
      - Behaviour as well as input — double submission, back after an error, a dropped connection mid-request.
      - Say what is deliberately out of scope and why.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Where are the edges in those three fields, and which values would you try on either side
          of them?
      - criterion: 2
        probe: >-
          What else would you put that form through, beyond the values typed into it?
      - criterion: 2
        probe: >-
          What would tell you your list is long enough to stop?
    reviewer_notes: >-
      The age boundary gives an objective anchor, which is why the rule is in the prompt. Is a
      sign-up form too easy a subject at this level, and are the phone-number formats the ones you
      would actually expect a Nigerian tester to name? Criterion 3 scores two things at 45% —
      thinking past the happy path, and saying where the list stops — so it carries **two**
      follow-ups, which the owner allowed on 2026-09-23 rather than splitting the criterion and
      invalidating its stress answers. The second is only reached if the first has not already drawn
      the stopping rule out. Is splitting the criterion still the better answer later?

  - slug: test-design-otp-screen
    roles: [qa]
    levels: [intern-junior, mid]
    type: test_design
    topic: test-design
    subtopic: rules and boundaries
    difficulty: 3
    prompt: >-
      On your screen are the rules for a sign-in screen that takes a code sent by SMS. What would
      you test?
    context: |
      ```
      The code is six digits, sent by SMS.
      It stops working ten minutes after it is sent.
      There is a Resend button.
      After five wrong codes the account is locked for an hour.
      ```
    rubric: rule-interaction-test-design
    ideal_points:
      - One case per class rather than many wrong codes — valid, wrong, expired, a code for another number, something that is not six digits.
      - The boundaries the rules create — the fifth wrong attempt and the sixth, and a code used just before and just after ten minutes.
      - Resend — whether the previous code still works, whether the attempt counter resets, and what two codes in flight do.
      - The SMS being slow or never arriving, which on this network is common rather than exceptional.
      - The rule does not say whether the fifth wrong attempt is allowed or is the one that locks, so that is a question rather than an assumption.
      - What is deliberately out of scope — the SMS provider itself — and why.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Three of those rules turn on a number — which values either side of them would you try,
          and is there anywhere the rules do not say which side a value falls on?
      - criterion: 2
        probe: >-
          Your code arrives, you tap Resend, and then you type the first one — what should happen?
    reviewer_notes: >-
      The rules moved from the spoken prompt into the context on 2026-09-23 — four numbers said once,
      with nothing on screen to look back at, was the clearest fairness finding against this question.
      It also gained its own rubric: `test-case-selection` could not be a true claim about both this
      and the sign-up form, because everything this question is really about was landing in one
      criterion. Two things for you. Two of the cases still feel mid to me — two codes in flight, and
      whether Resend resets the counter — so is the junior tag right? The second follow-up walks the
      candidate into one collision rather than asking them to find one, because naming "where the
      rules meet" gave away the whole of a 40% criterion — is walking them in too generous instead?

  - slug: test-design-money-transfer
    roles: [qa]
    levels: [mid]
    type: test_design
    topic: test-design
    subtopic: irreversible actions
    difficulty: 4
    prompt: >-
      A transfer screen takes a recipient account number, an amount and a four-digit PIN, and the
      daily limit is two hundred thousand naira. How would you order the testing, and what puts the
      first thing first?
    context: null
    rubric: transactional-test-design
    ideal_points:
      - Start where a mistake cannot be taken back — the wrong recipient, the wrong amount, a debit with no credit.
      - The limit boundary, and whether the field takes kobo — if it does, the values either side of ₦200,000 are one kobo away rather than one naira.
      - Two transfers on the same day that are each under the limit and together over it.
      - The unknown outcomes — a timeout, the app closed mid-request, the same tap twice — and whether the money moves exactly once.
      - A wrong PIN, the attempt counter, and whether a failed attempt leaves anything behind.
      - Check both balances and the stored record of the transfer, not the success message.
      - Say what is out of reach — the receiving bank — and how you would test up to that line.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Say a transfer times out, or the customer taps Send twice — how would you find out what
          actually happened to the money?
      - criterion: 2
        probe: >-
          What would you test about the daily limit and the PIN rule?
    reviewer_notes: >-
      **Reworked on 2026-09-23.** The prompt used to give away the first criterion, and its other two
      clauses were riddles rather than questions; both are follow-ups now. The rubric gained a
      criterion for the money rules, because the limit boundary, the unit and the PIN counter were in
      the answer key and scored by nothing. **The drafter worried that a mid candidate here may never
      have tested anything transactional; the owner's read is the opposite — this market is
      fintech-heavy, so having tested something that moves money is likelier than it looks from
      outside.** Is that right from where you sit? One critique pass says the second follow-up will
      never fire — nobody asked how they would order the testing of a transfer screen forgets the
      ₦200,000 limit — and would replace it with "what would you try to get a transfer over the limit
      through?", which is narrower than the criterion. Your call.

  # -------------------------------------------------------------------------------------------
  # Risk-based testing. Three questions, because deciding where the time goes is what separates a
  # tester from someone executing a script, and it is asked at every level.

  - slug: what-to-test-when-there-is-no-time
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: risk-based-testing
    subtopic: choosing under a deadline
    difficulty: 3
    prompt: >-
      The release goes out tomorrow morning. There are forty test cases you would normally run and
      time for about twelve. How would you choose?
    context: null
    rubric: risk-prioritisation
    ideal_points:
      - Risk is what it would cost weighed against how likely it is, not the number of cases in an area.
      - Start with what money or account access flows through, and with what a user cannot undo.
      - What changed in this release, and what sits downstream of the change.
      - Cover each path that matters once rather than one area thoroughly.
      - Say plainly what was not run, so the release decision belongs to whoever makes it.
      - Some of the twelve slots are better spent poking at the changed area than on the next scripted case.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Talk me through which twelve, and where the line falls.
      - criterion: 2
        probe: >-
          What would you say about the twenty-eight you did not run — and if giving a view is part
          of your job, what is your view?
    reviewer_notes: >-
      Forty cases and twelve slots is meant to be tight enough that the candidate has to cut
      something they care about. Two things. Is a junior fairly asked to hand the decision back —
      criterion 3 rewards saying what was not covered and stopping there, which assumes the candidate
      is in a position where that is heard? And should the prompt say what changed in this release, or
      is asking for it the point? The opening asks how they would choose rather than which twelve,
      because "which twelve" alone is close to unanswerable with no product on screen, and because it
      put the lightest criterion in the only place guaranteed to be asked.

  - slug: where-the-bugs-have-been
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: risk-based-testing
    subtopic: reading defect history
    difficulty: 3
    prompt: >-
      On your screen is where the defects have been for the last three releases. A new release is
      coming and you have time to cover about half of what you would like to. Where would you spend
      it?
    context: |
      Defects found in the last three releases, by area. The bracketed number is how many of them
      reached users before anyone noticed.

      ```
      Payments              11   (4 reached users)
      Sign-up / sign-in      9   (1 reached users)
      Notifications          7   (5 reached users)
      Job search             3   (0 reached users)
      Profile editing        2   (1 reached users)
      ```
    rubric: risk-prioritisation
    ideal_points:
      - Notifications has the worst record of escaping — five of seven — although payments found more in total.
      - Payments carries the most cost per defect, so volume and impact point the same way there.
      - The table counts defects found, which is a record of where people looked rather than where the bugs are.
      - An area with almost nothing found may be untested rather than sound, and job search is worth asking about.
      - Ask what changed in this release; history is one input and the diff is the other.
      - Say what is being left uncovered and why that is the cheaper risk.
    planned_follow_ups:
      - criterion: 0
        probe: >-
          That table only counts defects somebody found — what might it not be showing you?
      - criterion: 2
        probe: >-
          What would you say about the areas you are not covering, and in what form, so that whoever
          makes the release call has it?
    reviewer_notes: >-
      The table is the point — it lets a junior reason from evidence rather than from experience they
      do not have. The trap I have built in is that the highest count is not the worst escape rate,
      and criterion 1's level 1 is written for a candidate who ranks by the count alone. Is that trap
      fair, or is it a puzzle rather than a testing question? And are these five areas the right
      shape for a job-board product, or should the table be a bank app, which is what more of this
      market's QA work actually is? **One thing the follow-up pass found:** all three of the old
      clauses asked about choosing and about reading the table, so the criterion worth 40% — what you
      say about what you are not covering — was scored and never asked. It is the second follow-up
      now.

  - slug: regression-scope-after-a-small-change
    roles: [qa]
    levels: [mid]
    type: test_design
    topic: risk-based-testing
    subtopic: regression scope
    difficulty: 3
    prompt: >-
      A developer has changed one line — the function that works out a discount now rounds down
      instead of rounding to the nearest naira — and says nothing else was touched. What would you
      re-test?
    context: null
    rubric: regression-scoping
    ideal_points:
      - Follow the number rather than the screens — totals, receipts, refunds, reports, anything that recomputes or compares it.
      - The two ways of rounding agree on most values, so the cases that show anything are the ones with kobo in them rather than every order.
      - Rows already stored were computed the old way and now disagree with a fresh calculation.
      - Leave out what cannot reach the function, and say how you know it cannot.
      - Widen it if the function turns out to be called from somewhere unexpected, or if a failure appears outside the area.
      - Ask why it changed; a rounding rule is usually a finance decision with a date attached.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you deliberately leave alone, and what is the argument for leaving it?
      - criterion: 2
        probe: >-
          What would make you widen that scope once you had started?
    reviewer_notes: >-
      The answer-key point about the two roundings agreeing on most values was a derivation before
      2026-09-23 — it claimed the difference shows only where the fraction is half a naira or more,
      which is true for round-half-up and was scored by no descriptor, so two passes called it a maths
      puzzle rather than a testing question. It now says only that the cases with kobo in them are the
      ones that show anything. Is even that too much to expect aloud? And is a discount the right
      subject, given that a rounding change usually arrives with a finance decision the tester is told
      about?

  # -------------------------------------------------------------------------------------------
  # Defect reporting. Both questions hand the candidate an artefact rather than asking them to recall
  # a workplace, because a large share of this audience has not had one.

  - slug: the-report-that-came-back
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: defect-reporting
    subtopic: rewriting a report
    difficulty: 2
    prompt: >-
      On your screen is a defect report that came back closed as "cannot reproduce". The developer
      could not get to the same screen from it. Why not?
    context: |
      ```
      Title       Application fails
      Severity    Critical
      Device      Tecno Spark 20, Android 14
      Build       4.2.1

      Steps
        1. Open the app and sign in
        2. Go to Jobs
        3. Open the first job in the list
        4. Tap Apply
        5. Fill in the form and tap Submit

      Expected    It should work
      Actual      Nothing happens, and after a while the app goes back to the job list. I noticed
                  it once I had already applied for that one earlier in the day.
      ```

      Developer comment, two days later — "Cannot reproduce on my device. Closing."
    rubric: defect-report-quality
    ideal_points:
      - The steps look complete and are not repeatable — no account, and no job, so the developer cannot reach the same state.
      - The load-bearing fact is buried in the last sentence — they had already applied for that job, so this may be the duplicate path rather than a failure.
      - The expectation, given as "it should work", is not one — what should have happened has to come from somewhere nameable.
      - Two different observations are folded together — nothing happening, and the app returning to the list — and only one of them is the symptom.
      - How often, out of how many attempts, and whether it happens on a job they have not applied for.
      - Roughly when it happened, so the logs can be found — and a recording, or a request id if one can be got.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Which parts of that report are what somebody saw, and which are a guess about the cause?
      - criterion: 2
        probe: >-
          What evidence would you want on that report that is not there now?
    reviewer_notes: >-
      **Rewritten on 2026-09-23.** The first version was conspicuously bad — no steps, no build, "please
      fix urgently" — and two passes said the same thing: everything missing was missing so obviously
      that the question tested whether a candidate can recite the fields of a bug-report template,
      which is the most coachable thing in the bank. It is now complete by template and still
      unactionable: the steps cannot be repeated because there is no account and no job, the
      expectation is "it should work", and the fact that decides the whole thing — that they had
      already applied for that job — is buried in the last clause. Is that now too subtle for
      intern-junior? The opening changed again on 2026-09-23: "what would you go and find out" is a
      different act from what criterion 1 scores at 40% — whether they see the steps cannot be
      repeated — so a candidate could answer it well and score nothing.

  - slug: two-bugs-one-slot
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: defect-reporting
    subtopic: severity and priority
    difficulty: 3
    prompt: >-
      On your screen are two defects, and one fix will make it into tomorrow's release. Which is the
      more serious, and what makes it so?
    context: |
      Both found on the same build.

      ```
      A  The amount charged is ₦50 less than the sum of the items, and the receipt shows the
         same wrong total, so nothing on screen disagrees. Happens on every order.

      B  The app closes itself when a user opens their profile while offline.
         Two testers out of six have seen it; both were on 2G at the time.
      ```
    rubric: severity-judgement
    ideal_points:
      - A undercharges on every order and nothing on screen disagrees, so it reaches everyone and nobody — buyer or seller — has a reason to question it.
      - B closes the app for some users on a bad connection, which is visible and recoverable by trying again.
      - Severity is what it does to a user; which one is fixed first is the release owner's call, and giving a recommendation alongside the severity is not the same as taking that call.
      - Give them what they would need to decide — how many, how often, what the user sees, what it costs.
      - Two of six on 2G is a hint rather than a rate, so B needs more work before it can be judged.
      - The one that waits gets a note in the release, a workaround if there is one, and a ticket that will not be lost.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          So which one gets fixed first, and what would you put behind that — whether or not the
          call is yours?
      - criterion: 2
        probe: >-
          What happens to the one that is left?
    reviewer_notes: >-
      **Changed on 2026-09-23 so the money actually moves.** It used to say the total *shown* was ₦50
      lower, which one pass pointed out reads as a display rounding bug — the exact objection that
      undercuts the intended answer. The amount charged is now wrong and the receipt agrees with it,
      so there is nothing on screen to catch it. The rubric credits either ranking as long as the
      comparison between a quiet failure and a visible one is made; a crash on a slow connection is
      this market's normal condition and ranking B higher with that reason reaches 4. Is that the
      right call, or should the question have a right answer? And is ₦50 too small to be taken
      seriously?

  # -------------------------------------------------------------------------------------------
  # Testing an API. The *skill*, not the tool — nothing here needs Postman or RestAssured, which are
  # the `api-testing` stack further down. The distinction is in `topics.yaml`.

  - slug: testing-an-endpoint-without-a-ui
    roles: [qa]
    levels: [intern-junior, mid]
    type: test_design
    topic: testing-apis
    subtopic: deriving cases from a contract
    difficulty: 3
    prompt: >-
      On your screen is everything you have about an endpoint — the screen that will use it does not
      exist yet. What would you test?
    context: |
      ```
      POST /applications

      Request body
        { "job_id": "<uuid>", "cover_note": "<text, optional, up to 2000 characters>" }

      Responses the team has documented
        201   { "application_id": "<uuid>" }
        400   validation failed
        409   you have already applied for this job
        401   not signed in
      ```
    rubric: api-test-design
    ideal_points:
      - The documented responses are the case list — one request that produces each of 201, 400, 409 and 401.
      - The request's own fields give more — a missing `job_id`, one that is not a uuid, a note at 2000 characters and at 2001.
      - Check the body as well as the status — the shape, the field names, and whether the id returned is a real application.
      - Authorisation as its own case — no token, an expired one, and a job that is not the caller's to apply for.
      - Send the same request twice and check the 409 comes back, and that only one application exists.
      - Check the effect rather than the reply — the application is there afterwards, and nothing else moved.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          You get a 201 back. Are you satisfied?
      - criterion: 2
        probe: >-
          What could you test here that a test driving the screen could never reach?
    reviewer_notes: >-
      Written at both levels because a lot of junior QA work here is Postman against a documented
      endpoint before any screen exists. The part I am unsure of is how much the document should
      leave out — it currently says nothing about what happens to an unknown field or whether the
      note is trimmed, and criterion 1's level 4 rewards raising those as questions. Is that a fair
      thing to reward, or does an incomplete document just make the question ambiguous?

  - slug: the-request-that-came-back-400
    roles: [qa]
    levels: [intern-junior]
    type: technical
    topic: testing-apis
    subtopic: reading a response
    difficulty: 2
    prompt: >-
      On your screen is a request you sent while testing and the response that came back. What does
      the response tell you about what went wrong?
    context: |
      ```
      POST /applications HTTP/1.1
      Authorization: Bearer <a valid token>
      Content-Type: application/json

      { "jobId": "8f2c9e10-...", "coverNote": "I am interested in this role." }
      ```

      ```
      HTTP/1.1 400 Bad Request
      Content-Type: application/json

      { "error": "validation_failed", "fields": ["job_id"] }
      ```
    rubric: api-evidence-reading
    ideal_points:
      - The response names the field it wanted — `job_id` — and the request sent `jobId`, so the spelling is the difference.
      - The API rejected it correctly, so what is wrong is one side's idea of the field name rather than the rejection.
      - Check what the agreed contract says the field is called before deciding anything.
      - Check whether the app, or another endpoint, uses the other spelling — that decides which side moved.
      - Write it as what was sent, what came back and what the contract says, so the disagreement is about a document.
      - If there is no contract to check, the missing agreement is itself the finding and worth reporting as one.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Is there an agreed spec for this endpoint, and what would you check in it before writing
          this up?
      - criterion: 2
        probe: >-
          How would you write it up, and what would you put in it?
    reviewer_notes: >-
      Deliberately junior-only — it is one careful reading of two blocks of text and it does not need
      any experience of a workplace. Two worries. Criterion 2 assumes there is a contract to check,
      which a candidate who has only tested from a screen may never have seen; the answer key allows
      "there is no contract" but the descriptors may still read as assuming one. And is naming the
      side that is wrong the right thing to ask a junior for at all, or does it invite the
      developer-versus-tester framing we would rather not teach?

  - slug: the-field-that-changed-shape
    roles: [qa]
    levels: [mid]
    type: technical
    topic: testing-apis
    subtopic: contract changes
    difficulty: 3
    prompt: >-
      On your screen is the same endpoint a week apart. This went out last night. What would you say
      happened, and what does it mean for the apps already reading that field?
    context: |
      The same endpoint, a week apart.

      ```
      Last week   { "id": "...", "salary": 250000 }

      This week   { "id": "...", "salary": { "min": 250000, "max": 400000, "currency": "NGN" } }
      ```

      Nothing in the release notes mentions it. The Android app now shows an empty salary on every
      job, and on some versions it closes when the list loads.
    rubric: api-contract-reasoning
    ideal_points:
      - A field's type changed under callers that were already reading it, which breaks them by definition.
      - The app was not wrong — it was reading a number that is now an object.
      - A check on the shape of the response — types and required fields — fails the moment this ships.
      - That check has to run against the API, in the API's own pipeline; in the app's suite it fails after the release.
      - A status-code check would have passed, which is why the pipeline said nothing.
      - Ask for a new field or a version rather than a changed one, and ask who else reads it — the app is the caller that shouted.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What kind of test would have caught this before a user did, and what would it be running
          against?
      - criterion: 2
        probe: >-
          How would you find out who else is reading that field, and what would you want agreed
          before the next change?
    reviewer_notes: >-
      I have kept every product name out of this so it cannot go stale. Two judgements I would like
      checked. The question blames nobody, but criterion 1's level 4 rewards saying the app was not
      at fault, which is a political statement in some teams — is that the right thing to reward? And
      is "the test has to live in the API's pipeline" too strong for a QA candidate who has no access
      to that pipeline and would realistically add a check to their own suite?

  # -------------------------------------------------------------------------------------------
  # Automation. Strategy and judgement only — the engine has no code editor, so no question here
  # asks a candidate to write a test (`blueprints/qa.md`, out of scope).

  - slug: what-to-automate-first
    roles: [qa]
    levels: [mid]
    type: scenario
    topic: test-automation
    subtopic: choosing what to automate
    difficulty: 3
    prompt: >-
      A team has two hundred manual test cases and time for you to automate about thirty. Which
      thirty, and what puts a case in that group?
    context: null
    rubric: automation-selection
    ideal_points:
      - Cases that run on every release, on the paths everything else depends on, earn it first.
      - Automate what is stable — a screen being redesigned next month costs more in upkeep than it saves.
      - Prefer cases where the check is unambiguous; anything needing a judgement about how a screen looks is a poor fit.
      - Leave exploratory work, one-off checks and anything that changes weekly with a person.
      - Thirty cases that run on every change beat two hundred that run once a quarter.
      - Judge it on defects caught before release and on whether people still act on a failure, not on the count of tests.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you deliberately leave manual?
      - criterion: 2
        probe: >-
          What would you want to be able to look at, to tell whether it had been worth doing?
    reviewer_notes: >-
      **Moved to mid only on 2026-09-23.** Two passes said the same thing: the third clause carries 40%
      and needs a suite somebody has lived with for three months, so a junior with nothing automated
      cannot earn it. That leaves `test-automation` at one question at intern-junior against a floor of
      two, which the checker reports every run — the honest state rather than this question wearing a
      junior label. The cheaper junior version one pass proposed is "here are five manual cases, which
      would you automate first and why"; is that worth writing, or is
      `the-test-that-always-passes` enough at that level?

  - slug: the-test-that-always-passes
    roles: [qa]
    levels: [intern-junior, mid]
    type: technical
    topic: test-automation
    subtopic: assertions
    difficulty: 2
    prompt: >-
      On your screen is an automated test. Sign-in has been broken since yesterday morning and this
      test passed on every run — you do not need to know the tool to see why. What is it actually
      checking?
    context: |
      An automated browser test, written as pseudocode — the idea is the same in any tool.

      ```
      open("/login")
      type("#email", "tester@example.com")
      type("#password", "correct-password")
      click("#submit")
      wait(3 seconds)
      assert exists("#app-header")
      ```

      `#app-header` is the bar across the top of every page, including the login page.
    rubric: assertion-strength
    ideal_points:
      - The header is on the login page too, so the assertion is true whether or not sign-in worked.
      - A test that cannot fail is worse than no test, because it is counted as coverage.
      - Assert on something only a signed-in user has — their own name, their own data, a page that needs the session.
      - Assert the failure path too — a wrong password should show the error and stay where it is.
      - The three-second wait is a guess; wait for the thing you are about to assert on.
      - The fixed account and the structural selectors are both reasons this test will fail for something other than the product.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would it have to check instead, so that a broken sign-in fails it?
      - criterion: 2
        probe: >-
          Is there anything about the way that test waits that you would change?
    reviewer_notes: >-
      The last line of the context — that the header is on every page — was added because without it
      the premise does not hold and the question is unanswerable. It now gives the first criterion
      away, which I do not like but prefer to an unfair question. Would you take that line out and
      let the candidate ask? And is pseudocode the right call here, or would a real tool's syntax make
      it sharper for the automation candidates and unfair to the manual ones?

  - slug: the-suite-nobody-trusts
    roles: [qa]
    levels: [mid]
    type: scenario
    topic: test-automation
    subtopic: unreliable suites
    difficulty: 4
    prompt: >-
      Fifteen of a hundred and twenty automated tests fail on some runs and pass on others, never
      the same ones. The team reruns until they pass and then puts the change in — which is a
      reasonable response to a signal nobody can trust. What would you want to find out about those
      fifteen?
    context: null
    rubric: flaky-suite-response
    ideal_points:
      - Find out which tests and at what rate before deciding anything about them.
      - Read the failures — a test failing one run in ten may be a real defect that is already shipping.
      - Each one is fixed, or taken out of the run with a ticket and an owner, or deleted for a stated reason.
      - A blanket retry is the worst option — it makes the suite green and keeps whatever is wrong.
      - A suite that fails for no reason teaches people to ignore it, so the cost is the failures they will also ignore.
      - Something has to keep it honest afterwards — a rate somebody watches, or a rule that a new unreliable test is quarantined the day it appears.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          And then what happens to each of the fifteen?
      - criterion: 2
        probe: >-
          What has the team lost by not being able to believe the suite any more?
    reviewer_notes: >-
      Mid only, because the answer turns on having lived with a suite long enough to see the habit
      form. Fifteen of a hundred and twenty is meant to be bad enough that rerunning is rational,
      which is the uncomfortable part — the team is not being lazy, they are responding sensibly to a
      broken signal, and criterion 3's level 1 penalises a candidate who blames them. Is that
      distinction one you would expect a mid candidate to make? The opening now asks what they would
      find out and the first follow-up asks what happens to each test — the other way round, a
      candidate who sensibly investigated first had answered the un-probed criterion and lost the
      probed one.

  # -------------------------------------------------------------------------------------------
  # Tests in a pipeline. One at intern-junior rather than two, deliberately — a junior tester is
  # fairly asked what a failing pipeline means and what they do about it, and is not usually the
  # person who owns it (`blueprints/qa.md`, the one stated deviation from the floor).

  - slug: the-pipeline-has-been-red
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: ci-pipelines
    subtopic: a failing build
    difficulty: 3
    prompt: >-
      The automated checks have been failing for three days. Everybody knows, and people are putting
      their changes in anyway because the failure is "the usual one". What would you do about the
      failure itself?
    context: null
    rubric: pipeline-health-response
    ideal_points:
      - Read the failure before doing anything about the habit — "the usual one" may be a real defect nobody has opened.
      - If the test is wrong, fix it or take it out with a ticket and an owner; muting it with neither is how this started.
      - If the product is wrong, it is a defect with three days of merges sitting on top of it.
      - While it is red, nothing the pipeline runs after that step is being believed, so the cost is the rest of the suite.
      - The more expensive loss is the habit — a team that reads past red will read past the next real failure.
      - Ask for one thing first, owned today, and then for something structural — a fast check people will wait for, and an agreed rule for the next red build.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What else stops being checked while those checks are failing?
      - criterion: 2
        probe: >-
          What would you write down about it, and who would you send it to?
    reviewer_notes: >-
      Asked at junior because it is the pipeline question a junior actually faces — they are told to
      ignore a failure. **Reworked on 2026-09-23**: three passes said the old prompt asked a junior to
      make an argument to a team, which is standing most of them do not have, and one added that three
      days of red across timezones is undone by a message and a record rather than by a conversation.
      What they would write and who they would send it to is now the second follow-up, the criterion
      is weighted down from 35 to 30, and "green"/"red build" is out of the spoken prompt. One pass would go further and
      make the whole team-facing half mid-only, which would empty the junior `ci-pipelines` slot — is
      that the better trade?

  - slug: where-the-tests-run
    roles: [qa]
    levels: [mid]
    type: scenario
    topic: ci-pipelines
    subtopic: splitting a suite
    difficulty: 4
    prompt: >-
      The automated suite takes fifty minutes and runs on every change. The developers have started
      putting changes in without waiting for it, and they have asked you what should stay in the
      quick check. How would you split it?
    context: null
    rubric: test-pipeline-design
    ideal_points:
      - Split it — a short check on every pull request, the rest on the main branch or on a schedule.
      - Draw the line on what each part catches, not on which kind of test it is.
      - What stays is cheap and high-yield, plus a thin path through what matters most, so a merge that breaks sign-in still fails before it lands.
      - What moves out is the slow end — the full browser suite, long data setup, the cross-browser matrix.
      - A failure in the slow run needs an owner and a rule for the branch, or the problem has only moved.
      - Cutting duplicate setup and running in parallel often buys more than deleting tests.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What stays in the quick check?
      - criterion: 2
        probe: >-
          What happens to a failure that now arrives after a change has gone in, rather than before?
    reviewer_notes: >-
      **Reframed on 2026-09-23 so the candidate is advising, not deciding** — one pass said it had never
      asked a tester to split a pipeline and would cut the question, another that it rewarded standing
      a remote hire would not have in month one, and the drafter's own note already doubted it. The
      developers now ask the candidate what should stay in the quick check, which tests the same
      reasoning without assuming authority. Is that enough to keep it, or is this still the weakest
      question in the bank? The opening moved on 2026-09-23 from "what do you tell them" to "how would
      you split it": an opening that open let a candidate answer sideways and forfeit the criterion no
      follow-up could reach, which is the pilot's main structural finding.

  # -------------------------------------------------------------------------------------------
  # Exploratory testing. Three questions, because the role's own catalogue entry names it core and
  # because it is the one part of testing that no tooling we lack can excuse.

  - slug: an-hour-with-a-new-feature
    roles: [qa]
    levels: [intern-junior, mid]
    type: test_design
    topic: exploratory-testing
    subtopic: charters
    difficulty: 3
    prompt: >-
      A developer has just finished a new job-alerts screen and there are no test cases for it yet.
      You have one hour with it, and the decision about whether it goes out will be made while you
      are asleep. What would you settle on before you start?
    context: null
    rubric: exploratory-charter
    ideal_points:
      - Decide the area and the risk first — an hour spent everywhere covers nothing.
      - Learn what the feature is for before looking for what is wrong with it.
      - Vary things on purpose — the inputs, the order, the timing, the connection — rather than repeating the same path.
      - Follow the surprises; that is the whole advantage over a script.
      - Keep a record as you go, because you will not remember it by the meeting.
      - Leave behind what was covered, what was not, the defects and what another hour would go on — written so it can be acted on without asking you anything.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          And how would you spend the hour itself?
      - criterion: 2
        probe: >-
          What would you leave behind, so that whoever decides can decide without you?
    reviewer_notes: >-
      The feature is named as of 2026-09-23 — without it the honest answer was "it depends what it is",
      which landed on level 2 of a 35% criterion. And the output is now for whoever decides while the
      candidate is asleep rather than for a release meeting, because a distributed hire is not in the
      meeting and this is the best handover question in the bank. Two things. Is one hour the right
      size — short enough to force a choice, but it may make the charter feel like overhead? And is a
      job-alerts screen a rich enough subject, or would something with money in it be better? The
      opening question and the first follow-up swapped places on 2026-09-23: asking how they would
      spend the hour and then probing what they would decide before touching anything asked about the
      plan after they had described executing it. It now runs in the order the hour does.

  - slug: the-upload-nobody-tested
    roles: [qa]
    levels: [intern-junior, mid]
    type: test_design
    topic: exploratory-testing
    subtopic: attacking a feature
    difficulty: 3
    prompt: >-
      A job application form has a CV upload — PDF or Word, up to 5 MB. The written test cases cover
      a valid PDF, a file that is too large and a file of the wrong type. What would you try with
      the file itself that those three do not?
    context: null
    rubric: exploratory-attack-ideas
    ideal_points:
      - Go at the file — an empty file, a file at exactly 5 MB, a name with spaces or another alphabet, a PDF renamed to .docx and the reverse.
      - A photograph of a printed CV saved as a PDF — the right type, inside the limit, and unreadable by anything that reads text. A real submission here rather than a hostile one.
      - Drop the connection mid-upload, close the app, upload twice, and check what state the application is left in each time.
      - Upload, go back, change the file, submit — and see which one is attached.
      - Say what the behaviour disagrees with before calling it a defect — the stated limit, the rest of the product, what a user would reasonably expect.
      - Separate the defects from the questions, and raise the questions as questions.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Mid-range phone, Lagos network, end of the day — what else would you try?
      - criterion: 2
        probe: >-
          Say one of those turned something up — how would you decide whether it is a defect?
    reviewer_notes: >-
      The photograph-of-a-printed-CV case is the one I would most like your opinion on. It is the most
      common real upload in this market and it is not a defect in the product — it is a product
      decision nobody has made — so criterion 3 has to reward raising it as a question. Does that read
      as a fair expectation, or as the drafter rewarding one pet example? And is 5 MB the right limit
      to state, given what a phone camera produces?

  - slug: testing-without-a-spec
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: exploratory-testing
    subtopic: oracles
    difficulty: 4
    prompt: >-
      There is no specification for this feature, and nobody who could tell you what it should do is
      reachable today. On your screen is something you noticed. How do you decide whether it is a
      defect?
    context: |
      On the job list, a closing date shows as `03/11/2026`.

      On the job's own page, the same date shows as `11 March 2026`.

      Nothing in the product says which is intended, and no other screen shows a date at all.
    rubric: oracle-reasoning
    ideal_points:
      - With no document, other things stand in — what the rest of the product does, what the previous version did, what a user would reasonably assume.
      - A published standard or a rule the business has to follow can settle it — a date format, currency rounding, an accessibility requirement.
      - Here the two are the same date if the list puts the month first, so the disagreement is about which convention the product means rather than about the data being wrong.
      - Write it as "here is the behaviour, here is what it disagrees with", so the disagreement has something in it besides preference.
      - Some of what you find is a question rather than a defect, and separating the two is the job.
      - Whatever is agreed gets written down, so the next person has the document you did not.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you point at to settle it — something somebody else could check for themselves?
      - criterion: 2
        probe: >-
          Who would you raise it with, and what would you say?
    reviewer_notes: >-
      **Reworked 2026-09-23.** The developer is out of the framing (it turned an unblocking question
      into a conflict question), a concrete case went into the context, and it is now offered at
      intern-junior too — "no spec and nobody reachable" is week one for a junior here. **And one
      correction to my own note, found by the stress test:** I had written that the two dates "cannot
      both be right". They can — `03/11/2026` *is* `11 March 2026` if the list puts the month first,
      and a blind answer took that wrong turn in the other direction, calling them four months apart
      and filing a backend defect. The data does not settle this. What the question tests is which
      convention the product means, which is the better question here, because dd/mm is the local
      convention and mm/dd the imported one. Does it still hold at intern-junior on that reading?

  # -------------------------------------------------------------------------------------------
  # Test data. `test-data` at intern-junior is one question rather than two, and the shortfall is
  # reported rather than filled — the second one is honestly a mid question (owner's decision 1 on
  # the backend bank, 2026-09-23).

  - slug: where-your-test-data-comes-from
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: test-data
    subtopic: personal data in test environments
    difficulty: 3
    prompt: >-
      You need about five hundred customers with realistic transaction histories to test a statement
      screen. The quickest route is a copy of the live database, and someone senior has offered you
      one. What is in that copy, and would you take it?
    context: null
    rubric: test-data-judgement
    ideal_points:
      - A copy of the live database is five hundred real people's records, in a place with fewer controls than the one they came from.
      - It is also the wrong data for a test — it changes under you, it is not repeatable, and nobody can say what the expected result is.
      - Say the obligation plainly — these people did not agree to this, and someone answers if it leaks.
      - Generate it — names, phone numbers and amounts that look real and belong to nobody.
      - Build the cases on purpose — no transactions, one, thousands, a negative balance — rather than hoping a copy contains them.
      - Where the shape of real data genuinely matters, ask for a masked extract taken by whoever is allowed to take it.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Who is harmed if that copy leaks, and who answers for it?
      - criterion: 2
        probe: >-
          Where would the data come from instead?
    reviewer_notes: >-
      This is in the bank because "we use a copy of production" is the honest answer in a lot of
      places here, and I want a candidate to have thought about it before an interviewer asks. The
      risk is that it reads as a compliance quiz. The rubric deliberately scores the alternative more
      heavily than the rule, and penalises an answer that is only the regulation and the fine. Is that
      the right balance? **Three of the four critique passes caught the same thing in the follow-up**:
      it said "without quoting a regulation at them", which is a scoring instruction read out to the
      candidate, and it told the one candidate whose data-protection training is their strongest asset
      not to use it. That constraint belongs in the descriptor, where it already is.

  - slug: the-test-that-cannot-run-twice
    roles: [qa]
    levels: [intern-junior]
    type: technical
    topic: test-data
    subtopic: repeatable setup
    difficulty: 2
    prompt: >-
      On your screen is an automated test. It passed the first time it was run and failed the second
      time, on its very first line. What is happening?
    context: |
      An automated test, as pseudocode — the idea is the same in any tool.

      ```
      createUser(email: "tester@example.com", password: "...")
      signIn("tester@example.com")
      applyForJob(jobId: "the-lagos-one")
      assert applicationCount("tester@example.com") == 1
      ```

      The second run fails at `createUser` — that email is already registered.
    rubric: repeatable-test-data
    ideal_points:
      - The email is written into the test and has to be unique, so the second run collides with the user the first run created.
      - The test was never repeatable; passing once was the misleading part rather than failing twice.
      - Generate the email per run, so the test makes its own data instead of inheriting any.
      - Have the test remove what it created, or a hundred runs leave a hundred users behind.
      - Emptying the database first works and takes everything else running with it, which is a high price for one fixed value.
      - Where the suite has a database of its own, emptying it is a reasonable answer — the question is whether anything is shared.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change, so it can be run as many times as you like?
      - criterion: 2
        probe: >-
          Somebody suggests emptying the database before every run — what do you think?
    reviewer_notes: >-
      **Split out of `the-test-that-only-passes-once` on 2026-09-23.** Two passes said independently
      that the original was two questions — the second-run collision is junior material and the
      in-suite count failure is not — and the drafter's own note had suspected it while warning that
      splitting would conveniently close the `test-data` shortfall at intern-junior. It does close it,
      and the split is right on its own merits, but you should know both facts. Is the last answer-key
      point too generous, given the question asks what emptying the database would cost?

  - slug: the-test-that-only-passes-once
    roles: [qa]
    levels: [mid]
    type: technical
    topic: test-data
    subtopic: isolation in a suite
    difficulty: 3
    prompt: >-
      On your screen is an automated test that passes on its own and fails when the whole suite
      runs, never at the same point twice. What is wrong with the way it decides whether it worked?
    context: |
      An automated test, as pseudocode. Every test in this suite creates its own user, so the sign-up
      line is not the problem.

      ```
      signIn(myGeneratedEmail)
      applyForJob(jobId: "the-lagos-one")
      assert applicationCount(forJob: "the-lagos-one") == 1
      ```

      Several other tests in the suite also apply for that job.
    rubric: test-data-isolation
    ideal_points:
      - The count is over a job other tests also apply for, so what the test asserts on depends on what else happened to be running.
      - Nothing is wrong with the sign-in or the application; the assertion is asking a question the test does not own the answer to.
      - Assert on the application this test just made rather than on a count across everything.
      - Where a count is genuinely what matters, give the test its own job so the count is its own.
      - Running one test at a time makes it pass and gives up the parallelism the suite was built for.
      - A failure that moves between runs is the signature of shared data, so a retry would hide it rather than fix it.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change, so it passes whatever else is running?
      - criterion: 2
        probe: >-
          Somebody suggests running the suite one test at a time — what do you think?
    reviewer_notes: >-
      **Narrowed on 2026-09-23** to the half that is genuinely mid — the fixed-email collision went to
      `the-test-that-cannot-run-twice` at intern-junior. The context now says explicitly that every test
      makes its own user, so the candidate is not re-solving the junior question, and the job is what is
      shared. My own worry — that the remaining question is one move (assert on what you created), with
      the interesting part, when a count is the right assertion at all, sitting in the fourth
      answer-key point and asked nowhere — is answered by the first follow-up, which now asks it. Is
      that the right place for it, or should it be the opening question?

  # -------------------------------------------------------------------------------------------
  # Debugging. The second question at both levels is `it-works-for-me`, which lives in the frontend
  # bank and carries this role as of 2026-09-23 — its own notes asked whether it should.

  - slug: intermittent-failure-triage
    roles: [qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: debugging
    subtopic: intermittent failures
    difficulty: 3
    prompt: >-
      A test that passes on your machine fails in the pipeline about one run in four. The team is
      about to mark it as flaky and move on. What would you want to know about that failure before
      you agreed?
    context: null
    rubric: failure-investigation
    ideal_points:
      - Measure it rather than accept "sometimes" — run it enough times, in both places, and record the rate.
      - Look for what differs — timing, data left behind by another test, parallelism, a clock, a slower machine.
      - Keep the product on the list of suspects; an unreliable test often finds a real race.
      - Keep what a failing run leaves behind — the log, the screenshot, the exact assertion that failed.
      - Put the rate and the evidence in front of the team, so muting it is a decision somebody makes rather than a default.
      - If it is quarantined, it goes with a ticket and an owner, and the team knows what it is accepting.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you compare between your machine and the pipeline, including anything you
          cannot see from where you sit?
      - criterion: 2
        probe: >-
          What would you put in front of the team, or in front of one person, to settle it?
    reviewer_notes: >-
      Moved on 2026-09-23 from `defect-reporting` to `debugging`, and off the `defect-report-quality`
      rubric, which its own notes had called a stretch — the answer is about investigation rather than
      about how a report is written, and it now has `failure-investigation`. Is the last clause fair
      at intern-junior? Putting something in front of the team to overturn their decision assumes
      standing a junior in many workplaces here does not have; the rubric accepts bringing the
      evidence to one person instead. Is that enough?

  # -------------------------------------------------------------------------------------------
  # Behavioural. One question, because a QA candidate is already offered nine role-general judgement
  # and communication questions from the frontend and backend banks — nine of the twelve they see
  # before this bank existed. See Appendix C in the blueprint.

  - slug: pushing-back-on-a-release
    roles: [qa]
    levels: [intern-junior, mid]
    type: behavioral
    topic: collaboration
    subtopic: raising concerns
    difficulty: 3
    prompt: >-
      Tell me about a time you found something close to a release — at work, or on a project of your
      own — that you thought should stop it going out. What was the risk, and how did you know?
    context: null
    rubric: raising-a-quality-concern
    ideal_points:
      - A specific occasion, with what the risk actually was.
      - How they made the case — what it would do to a user, rather than how strongly they felt.
      - What they did with it — who they told, what they wrote down, whether they raised it more than once.
      - How it ended, including being overruled, and including being wrong.
      - What they would do differently, and what they now do routinely.
    planned_follow_ups:
      - criterion: 0
        probe: >-
          What had you actually seen that made you sure it was serious?
      - criterion: 1
        probe: >-
          Who did you take it to, and in what form — or, if there was nobody to tell, what did you
          do with it instead?
      - criterion: 2
        probe: >-
          How did it end, including if it went out anyway?
      - criterion: 2
        probe: >-
          What do you do differently now, because of it?
    reviewer_notes: >-
      **Reworded on 2026-09-23**, and it now has its own rubric. It used to require that "someone more
      senior disagreed" — in many workplaces here disagreeing upward is not done and the candidate has
      no story — and it was scored with the generic `behavioural-answer-quality`, in which "how they
      made the case" landed nowhere. The slug still says "pushing back", which the question no longer
      requires; slugs are permanent. The second follow-up carries criterion 2's fairness promise out
      loud — "if there was nobody to tell" — rather than only in a descriptor the candidate never
      sees. This is the one question with **four** follow-ups: criterion 1 gets one although the
      opening asks it, because a candidate can tell the whole story and never say how they knew it
      was serious, and criterion 3 gets two because "what is different now" is where a nervous
      candidate stops. Enough?

  # -------------------------------------------------------------------------------------------
  # Untagged on 2026-09-23. It was `stacks: [performance-testing]`, and two critique passes and the
  # drafter's own note all said the same thing: it names no tool, it is pure requirements
  # elicitation, and "what do you need to know before you can test this at all" is the same question
  # on a load test, a feature, a migration or a release. Tagged, only performance candidates ever
  # met it. It counts towards `risk-based-testing` now, which is what it is about.

  - slug: performance-what-to-ask-first
    roles: [qa]
    levels: [mid]
    type: scenario
    topic: risk-based-testing
    subtopic: agreeing what to measure
    difficulty: 3
    prompt: >-
      Somebody asks whether the platform will hold up for a campaign at the end of the month. What
      would you need to know before you could plan any of this?
    context: null
    rubric: performance-requirements-reasoning
    ideal_points:
      - What load and in what shape — how many people, over how long, and whether it arrives as a spike.
      - Which journeys matter; signing in and applying, probably not the admin report.
      - Where from and on what — users on mobile data change what the numbers mean.
      - A pass mark has three parts — how long a request may take, how often it may fail, and the load it holds at — and it says which environment.
      - Somebody has to own that pass mark, or it is not one.
      - With no answers, derive it from the traffic that already exists and write the assumption down; with no target at all, report the load at which it degrades.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would the pass mark have to state, and who would agree it with you?
      - criterion: 2
        probe: >-
          Suppose nobody can tell you any of that — what would you do instead?
    reviewer_notes: >-
      Untagged on 2026-09-23 (see the comment above), which leaves `performance-testing` with one
      question against a target of two — the checker reports it every run and the next tagged question
      goes there. Two things. I have written the pass mark as "how long a request may take, how often
      it may fail, and the load it holds at" rather than as a percentile, because a candidate who has
      never done performance work will not have the word and the concept is what matters — is that too
      generous for a mid tester, or right? And now that every QA candidate meets this, is the campaign
      framing the best one, or would "we are about to be on the radio" land better here?

  # =============================================================================================
  # Round two — the stack-tagged set. Ten questions across five automation variants.
  #
  # Two variants have none, for opposite reasons. `manual-exploratory` is the absence of a tool, and
  # its subject matter — test design, exploratory charters, bug reporting — is the general set above;
  # tagging those would hide test design from the automation candidates who most need it
  # (`blueprints/qa.md`). And `performance-testing` has one rather than two, because
  # `performance-what-to-ask-first` was **untagged** on 2026-09-23 after two critique passes and the
  # drafter's own note all said the same thing: it names no tool, it is pure requirements
  # elicitation, and tagging it hid the most portable question in the bank from everyone but
  # performance candidates. The shortfall is reported rather than filled.
  #
  # Every question here names a product, so every one of them can go stale. Each opens its
  # `reviewer_notes` with the version-sensitive marker, and the detail — including the three claims
  # that had moved when this was checked — is in the blueprint's Appendix A.

  - slug: cypress-fixed-wait
    roles: [qa]
    levels: [mid]
    stacks: [cypress]
    type: technical
    topic: test-automation
    subtopic: waits
    difficulty: 3
    prompt: >-
      On your screen is a test that passes on a fast machine and fails on the shared runner about
      one time in five. Why does a fixed wait behave that way?
    context: |
      ```js
      cy.get('[data-testid="apply"]').click()
      cy.wait(3000)
      cy.get('[data-testid="confirmation"]').should('contain', 'Application sent')
      ```
    rubric: wait-strategy-reasoning
    ideal_points:
      - Three seconds is a guess about a duration that varies with the machine, the network and the data, so it is too short somewhere and wasted everywhere else.
      - Every test pays the worst case, so the suite's run time is the sum of the guesses.
      - The `should()` on the confirmation already retries until it passes or the command timeout runs out, so the sleep adds nothing — and three seconds is shorter than that budget anyway.
      - The idiomatic replacement is to wait for the request, not the clock — intercept it, alias it, and wait on the alias.
      - A longer timeout still belongs on a genuinely slow step, set on that step rather than everywhere.
      - A timeout's job is to fail readably, so a slow dependency is not reported as a broken selector.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Do you need a wait there at all?
      - criterion: 2
        probe: >-
          Where would a wait still belong, after you have fixed this one?
    reviewer_notes: >-
      **Version-sensitive: that a Cypress assertion retries until it passes or `defaultCommandTimeout`
      expires, so the preceding fixed wait adds nothing; and that waiting on an intercepted request
      alias is the documented replacement. Checked against docs.cypress.io on 2026-09-23 (Cypress 16),
      which calls `cy.wait(Number)` an anti-pattern in as many words.** Split out of a single
      two-tool question on 2026-09-23 — three critique passes said the two snippets were the longest
      thing in the bank to read aloud, and the fact-check found they could not both match one
      application, because `getByTestId` resolves `data-testid` and the Cypress half used `data-test`.
      Is the fourth answer-key point over-rewarded? Waiting on an intercepted alias is `cy.wait` used
      correctly rather than abandoned, and a candidate who has only read "never use `cy.wait`" would
      lose it.

