  - slug: selectors-that-break
    roles: [qa]
    levels: [intern-junior, mid]
    stacks: [selenium-java, cypress, playwright]
    type: technical
    topic: test-automation
    subtopic: selectors
    difficulty: 2
    prompt: >-
      A developer moved a button inside a wrapper and renamed a class. Nothing about the behaviour
      changed and a lot of tests failed. On your screen are three of the selectors from that suite.
      What do those three have in common?
    context: |
      Three selectors from the suite, described rather than written out — the idea is the same in
      any tool.

      ```
      1  A full path down from the body tag to the button.
      2  Two class names, one of which is a generated hash.
      3  Count to the fourth div, then take the button inside it.
      ```
    rubric: selector-strategy-reasoning
    ideal_points:
      - All three address where the button sits or how it is painted, neither of which is what the button is.
      - A generated class name is not a name — it changes when the styling does.
      - An agreed attribute put there for testing is the documented first answer in Selenium and in Cypress, and it is treated as part of the code rather than something a refactor may remove.
      - In a tool that has role-and-text locators, finding it the way a user does is the documented first answer, and it also fails when the button stops being reachable.
      - A failing test after a rename is the suite's fault rather than the refactor's; reverting the rename is the wrong fix.
      - Some churn is correct — a test should fail when the behaviour really does change.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you select on instead, in the tool you work in?
      - criterion: 2
        probe: >-
          What would have to change in the application itself, and is the rename itself anybody's
          fault?
    reviewer_notes: >-
      **Version-sensitive: which of a test attribute and a role-and-text locator is the vendor's own
      first recommendation, because it differs by tool. Checked on 2026-09-23 — playwright.dev (1.63)
      says to prioritise role locators; docs.cypress.io (16) ships no role or label query at all and
      rates a `data-*` attribute "Always"; selenium.dev (4) has no role locator, only a post-location
      `getAccessibleName()`.** The three snippets became prose on 2026-09-23: three code blocks in
      three languages was the heaviest read in the bank and it landed on the junior candidates. Two
      things for you. The answer key is now tool-conditional, which is honest but harder to score —
      would you rather split this into one question per tool? And it overlaps
      `the-test-that-broke-for-nothing` in the frontend bank, which asks what a brittle suite costs a
      team rather than what to select on; one reviewer thought the overlap was fine and one thought
      one of the two was enough.

  - slug: selenium-stale-element
    roles: [qa]
    levels: [mid]
    stacks: [selenium-java]
    type: technical
    topic: test-automation
    subtopic: element references
    difficulty: 3
    prompt: >-
      On your screen is a test that throws on its last line, and only when the filter actually
      changes the list. What is the exception telling you, and would waiting longer help?
    context: |
      ```java
      WebElement row = driver.findElement(By.cssSelector("#results tr:first-child"));

      driver.findElement(By.id("filter-lagos")).click();   // the results list re-renders

      row.findElement(By.cssSelector(".apply")).click();
      // org.openqa.selenium.StaleElementReferenceException:
      //   stale element reference: element is not attached to the page document
      ```
    ideal_points:
      - The reference points at an element that was in the page and is no longer attached to it — the re-render replaced it.
      - Waiting longer cannot help, because the element the reference names will never come back.
      - A re-render is one of three ways to get here; navigating away, and switching window or frame, are the others.
      - Take the reference after the filter has been applied, and act on the fresh one.
      - Wait for the new list rather than for a duration — the re-render is the event, not the delay.
      - The documented alternative is a wrapper that stores the locator and re-finds on use, so no reference outlives an action.
    rubric: stale-element-diagnosis
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change about how this test holds on to elements?
      - criterion: 2
        probe: >-
          Somebody suggests retrying on that exception everywhere — what would that hide?
    reviewer_notes: >-
      **Version-sensitive: that the exception means the element is no longer attached to the document,
      that relocating it is the documented remedy, and that a locator-storing wrapper is the other
      documented answer rather than a flourish. Checked against selenium.dev on 2026-09-23 (Selenium
      4.49).** One thing to be careful of, which the fact-check turned up — the documentation does not
      say in so many words that waiting cannot help. That is an inference from the remedy, and a sound
      one, but the rubric turns level 3 on it, so it is our claim rather than the vendor's. Is it safe
      to score on? And the docs list three causes where the question gives one; a candidate who names
      navigation and frame switching too is reading the exception properly rather than padding. The
      opening question is the one place in this bank that still asks two things — "would waiting
      longer help" is what criterion 1 turns on at level 3, and it has no follow-up of its own because
      the prompt is its criterion.

  - slug: cypress-login-in-every-test
    roles: [qa]
    levels: [mid]
    stacks: [cypress]
    type: scenario
    topic: test-automation
    subtopic: test setup
    difficulty: 3
    prompt: >-
      On your screen is the block that runs before every test in a suite. What is signing in through
      the screen every time costing, beyond the minutes?
    context: |
      ```js
      beforeEach(() => {
        cy.visit('/login')
        cy.get('[data-testid="email"]').type('tester@example.com')
        cy.get('[data-testid="password"]').type(Cypress.env('PASSWORD'))
        cy.get('[data-testid="submit"]').click()
        cy.url().should('include', '/dashboard')
      })
      ```

      The suite has 140 tests across 30 spec files and takes 22 minutes. Signing in takes about six
      seconds of each test.
    rubric: ui-login-setup-reasoning
    ideal_points:
      - Every test now depends on sign-in, so a sign-in defect produces a hundred and forty failures carrying one fact.
      - Six seconds across a hundred and forty tests is about fourteen of the twenty-two minutes.
      - Establish the session once and restore it for later tests, rather than driving the screen each time.
      - What you lose is certainty that the session is live, which is why a restored session needs a cheap check that re-establishes it when it fails.
      - Caching only within a spec file leaves thirty sign-ins; caching across spec files is where most of the fourteen minutes actually goes.
      - Keep a few real tests on the screen — the success path, a wrong password, whatever the lock is — and nothing else.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you do instead, and what do you lose by doing it?
      - criterion: 2
        probe: >-
          What would you keep signing in through the screen for?
    reviewer_notes: >-
      **Version-sensitive: that Cypress has a first-class, non-experimental way to cache and restore a
      session between tests, that a restored session is re-established when its validation fails, and
      that caching across spec files is off by default. Checked against docs.cypress.io on 2026-09-23
      (Cypress 16; both APIs default-on since 12.0.0).** The per-test timing went into the context on
      2026-09-23 — three passes pointed out that the top band required multiplying by six seconds the
      drafter had never stated. The fourth and fifth answer-key points came from the fact-check and
      are the documented answer to "what do you lose"; they are also the two things a candidate is
      least likely to volunteer. They are now literally follow-up territory — the first probe asks
      what you lose — so: is that enough, or are they still too much to expect at mid?

  - slug: playwright-tests-sharing-an-account
    roles: [qa]
    levels: [mid]
    stacks: [playwright]
    type: scenario
    topic: test-automation
    subtopic: parallel runs
    difficulty: 4
    prompt: >-
      Run one at a time and everything passes. Run with four workers and two or three tests fail,
      never the same ones. Why does running in parallel change the result?
    context: |
      ```ts
      // playwright.config.ts
      export default defineConfig({ workers: 4 })
      ```

      ```ts
      // every spec file
      test.use({ storageState: 'playwright/.auth/user.json' })   // one saved session, one account
      ```

      Three of the specs change the same saved profile — the name, the phone number, the CV.
    rubric: parallel-test-isolation
    ideal_points:
      - Four workers run tests at the same time against one account, so they change the data each other is asserting on.
      - The serial run was not correct either — it passed because the order was fixed, so each test found what the one before it left.
      - The documented answer for tests that change server-side state is one account per worker, established once per worker and keyed on the worker's own index.
      - Assert on data the test created rather than on a count or on "the first row".
      - A failure that moves between runs is the signature — the fix is isolation, not a retry.
      - Where something is genuinely shared — one sandbox at a payment provider, a global setting — keep that group serial rather than the suite.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change, so the suite can run with four workers?
      - criterion: 2
        probe: >-
          What would you keep serial on purpose, rather than fixing?
    reviewer_notes: >-
      **Version-sensitive: that one account per parallel worker, set up in a worker-scoped fixture
      keyed on the worker index, is the documented recommendation for tests that modify server-side
      state. Checked against playwright.dev on 2026-09-23 (Playwright 1.63), where that is the
      section heading.** My open question — per worker or per test — is answered by the vendor, so
      the answer key now names per worker rather than crediting both. Two things left. The saved
      session is a credential in the repository and the documentation says to keep that directory out
      of version control; no criterion scores a candidate who notices, and I am not sure it belongs in
      this question or in `api-testing-three-environments`. And should the key require the fixture by
      name, or is "give each worker its own account" enough at mid?

  - slug: api-collection-that-only-works-in-order
    roles: [qa]
    levels: [intern-junior, mid]
    stacks: [api-testing]
    type: scenario
    topic: testing-apis
    subtopic: repeatable runs
    difficulty: 3
    prompt: >-
      On your screen is a set of requests a team keeps and runs top to bottom, however they keep
      them. It works when a person runs it and fails when anything else does. What stops it running
      without you?
    context: |
      ```
      1  POST /auth/login       the tester copies `token` out of the response and pastes it into the
                                Authorization header of requests 2 to 7
      2  POST /jobs             creates a job; the tester copies its `id` into request 3
      3  POST /applications     body: { "job_id": "<pasted>" }
      ...
      7  DELETE /jobs/<pasted id>
      ```

      The token from request 1 stops working after an hour. No request checks anything about its
      response.
    rubric: api-collection-repeatability
    ideal_points:
      - Every pasted value is a person doing work, and nothing running without them can paste.
      - The token expires, so signing in is the first step of the run rather than something done beforehand.
      - Capture the token and each id out of the response into a variable the next request reads.
      - The run has to be able to start from nothing — it creates the job it applies for, and removes it afterwards.
      - Nothing asserts, so the run currently only proves the requests were sent.
      - A failure has to say which request failed and what came back, or nobody will act on it in the morning.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change, so it can run overnight?
      - criterion: 2
        probe: >-
          What would you still not automate here?
      - criterion: 2
        probe: >-
          If it fails while nobody is watching, what does the failure report need to contain?
    reviewer_notes: >-
      **Version-sensitive: that both Postman and RestAssured can capture a value from one response
      into a variable the next request uses, and that a saved collection runs from a command line
      without a person. Checked on 2026-09-23 against learning.postman.com and rest-assured.io — and
      the command-line tool has moved: Newman no longer reads the collection format Postman v12 uses,
      and the current tool is the Postman CLI. No tool is named here, so "newman" is a version behind
      rather than wrong.** Reworded to "a set of requests a team
      keeps, however they keep them", because "a saved collection" is Postman's shape. Does the
      intern-junior tag survive that? Criterion 3 scores two things — what stays manual, and what a
      failure has to say — so it carries two follow-ups since 2026-09-23. "What stays manual" is
      listed first because a candidate is likelier to have an answer to it; the failure report is the
      more useful signal for a team in another timezone. Right order?

  - slug: api-testing-three-environments
    roles: [qa]
    levels: [mid]
    stacks: [api-testing]
    type: scenario
    topic: testing-apis
    subtopic: environments and secrets
    difficulty: 3
    prompt: >-
      The team wants these same requests run against staging and against a test environment, from
      wherever the tests run rather than from your laptop. What has to change before the same
      requests can go to two places?
    context: |
      Every request has the host typed into it, and the token is saved in the file. The file is in the
      same repository as the tests.

      ```
      POST https://staging-api.example.ng/applications
      Authorization: Bearer eyJhbGciOi...        <- a long-lived token, saved alongside the requests
      ```
    rubric: api-environment-config
    ideal_points:
      - The host becomes a variable with a set of values per environment, and the requests stop naming one.
      - A token saved in a file in the repository is a committed secret — anyone who can read the repository can use it.
      - Whatever runs the tests supplies it at run time, from wherever secrets are kept, and the run does not print it.
      - Better still, the run signs in with a test account's credentials and gets a short-lived token of its own.
      - Anything that creates, changes or deletes does not point at production, whoever asks.
      - A suite that never runs anywhere but staging is testing staging, so there is a case for a read-only check against the real thing — with an account that can do nothing else.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Anything else in that file you would change, before it runs anywhere but your laptop?
      - criterion: 2
        probe: >-
          What would have to be true before these could safely run against production?
    reviewer_notes: >-
      **Version-sensitive: that a host can be held in an environment variable, that a value can be
      marked so it is stored locally and not shared, and that a secret can be injected into a
      command-line run per invocation. Checked against learning.postman.com on 2026-09-23 (v12) —
      the vocabulary has moved: there is no longer a "secret" variable *type*, it is a **secure
      variable**, and vault secrets are now the recommended home for credentials. The docs frame the
      hazard as syncing and team sharing rather than as committing to git, which is the framing this
      question uses.** Narrowed on 2026-09-23 — it was three subjects in one question (hosts, the
      secret, and production) and two passes said the production clause taught a habit we would
      rather not teach. It is now a question about hosts and the secret, with production as something
      to push back on. Is that the right call, or should a read-only check against production be
      credited more warmly than the fifth answer-key point allows?

  - slug: appium-passes-on-the-emulator
    roles: [qa]
    levels: [mid]
    stacks: [appium]
    type: scenario
    topic: test-automation
    subtopic: real devices
    difficulty: 3
    prompt: >-
      A mobile suite passes on the emulator on your machine and fails on a real mid-range Android
      phone, mostly on the screens that load data. What differs between the two that would explain
      that?
    context: null
    rubric: real-device-difference-reasoning
    ideal_points:
      - The emulator runs on whatever the development machine has and the phone does not, which is why the data screens are where it shows.
      - Anything that waited long enough on the emulator is now a race — the data arrives later, or not at all.
      - A real device brings what an emulator has not — permission prompts, a keyboard over the field, an incoming call, low storage.
      - Wait for the state you are about to assert on, rather than for a duration tuned on a fast machine.
      - The script does not change; the capabilities do — a real device is identified differently from an emulator, and explicitly so if runs happen side by side.
      - A screen that never loads on a real phone on a slow connection is a defect at whatever priority that argues for, not an unreliable test.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change about the tests, and what would you want them running on — even if
          it is one real phone?
      - criterion: 2
        probe: >-
          Which of those failures would you treat as the product's, rather than the tests'?
    reviewer_notes: >-
      **Version-sensitive: that the same script drives an emulator and a real device, and that what
      differs is the capability set identifying the device rather than the test. Checked against
      appium.io on 2026-09-23 (Appium 3.7, UiAutomator2 driver), which recommends identifying a real
      device and an emulator by different capabilities rather than by device name.** The fifth
      answer-key point came from the fact-check and sharpens what was a vaguer claim that "the
      difference is the device rather than the tooling". This is still the only `appium` question,
      because the blueprint asked for the variant to be checked with a reviewer before a second was
      written: is it worth keeping at all, and if it is, what should the second question be? It also
      leans harder than anything else here on the product's own position about mid-range phones and
      unreliable data, which may read as us grinding an axe.

  - slug: load-test-that-proved-nothing
    roles: [qa]
    levels: [mid]
    stacks: [performance-testing]
    type: scenario
    topic: test-design
    subtopic: load test validity
    difficulty: 4
    prompt: >-
      On your screen is a load test run and the conclusion somebody drew from it. What in the run
      makes that conclusion unsafe?
    context: |
      ```
      virtual users      1,000, all started at once
      run from           one laptop, on a shared connection
      duration           2 minutes
      requests sent      18,400
      succeeded             920   (5%)
      failed             17,480   (95%)  — "connection reset" and "timeout"
      average response   240 ms          — over the 920 that succeeded
      ```

      The conclusion — "The API handles 1,000 concurrent users with an average response of 240 ms."
    rubric: load-test-validity
    ideal_points:
      - The average describes the twentieth of the traffic that got through, so it says nothing about the API under that load.
      - Connection resets and timeouts at that rate point at something refusing or dropping connections before the API is reached.
      - The one machine and its connection may be the bottleneck, and that has to be ruled out before any result from it is believed.
      - A thousand users starting at one instant is not how traffic arrives; ramp up and hold.
      - Two minutes with no pause between requests measures a burst rather than a sustained load.
      - Report the error rate first, then a median and a high percentile, then the throughput actually achieved — and the load at which it starts to degrade.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change about how the test is set up, before running it again?
      - criterion: 2
        probe: >-
          What would you report instead of an average?
    reviewer_notes: >-
      **Version-sensitive: nothing in it. No tool is named on purpose, so it holds for k6 and JMeter
      alike.** The success rate is now stated in the summary (2026-09-23). It used to be derivable
      only by dividing 17,480 by 18,400, and three passes said the same thing: 40% of the score turned
      on arithmetic done aloud under interview pressure rather than on judgement. "Office wifi" became
      "a shared connection" for the same reason the rest of the bank avoids an imported baseline. What
      I would like your view on is whether stating the rate has made the first criterion too easy —
      the insight left is that the average was taken over the survivors, which is still the thing most
      people miss. Has stating the rate made the first criterion too easy?
