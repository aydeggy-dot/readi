# The ladder a role is hired at (ADR-0015). A level is content, not an enum: adding "senior" is an
# entry in this file and a publish in the CMS, not a migration.
#
# `rank` orders levels against each other, lowest first, and is sparse on purpose — a level can be
# inserted between two others without renumbering the catalogue.
version: 1
author: ai_draft
status: draft

career_levels:
  - slug: intern-junior
    name: Intern / Junior
    summary: First tech job, or up to about a year in one. Interviews test fundamentals and whether you can be taught.
    rank: 10

  - slug: mid
    name: Mid-level
    summary: Roughly two to five years. Interviews test judgement — trade-offs, debugging, and owning a feature end to end.
    rank: 20

  # `senior` exists as a row and **no role offers it** — deliberately. A senior interview turns on
  # system design (a question type we do not have and a surface the spec defers to P2), on rubric
  # dimensions the junior/mid rubrics do not contain (scope, influence, mentoring), and on longer
  # sessions. Offer it from a role, and publish it, when that content exists: an empty level in the
  # picker is worse than no level at all. See `tasks/todo.md` § Carried forward.
  - slug: senior
    name: Senior
    summary: Five years or more. Interviews test system design, the trade-offs behind your decisions, and how you carry other people with you.
    rank: 30
