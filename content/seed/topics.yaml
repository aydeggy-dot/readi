# The topic taxonomy every question, lesson and track hangs from (spec §4.2).
# Shared across roles: a topic is a thing to know, not a thing one role owns.
version: 1
author: ai_draft
status: draft

topics:
  - slug: javascript-fundamentals
    name: JavaScript fundamentals
    description: The language itself — types, scope, closures, asynchrony, and how the runtime schedules work.

  # Named for React until 2026-09-22, when the frontend bank gained general questions on it. The
  # slug stays — slugs are permanent, and renaming one creates a second topic — but the subject is
  # framework-neutral: a Vue, Angular or mobile candidate needs it just as much, and the
  # framework-specific questions hang off it with stack tags.
  - slug: react-state
    name: Component state and data flow
    description: Where state lives, how it moves between components, and what makes a view re-render.

  - slug: browser-rendering
    name: Browser rendering and performance
    description: How a page becomes pixels, what blocks it, and what makes it slow on a real device.

  - slug: css-layout
    name: CSS layout and responsive design
    description: Flow, flexbox and grid; building one layout that works from 360px upward.

  - slug: web-networking
    name: HTTP, APIs and the network
    description: Requests, status codes, caching, and what a slow or failing network does to a page.

  - slug: accessibility
    name: Accessibility
    description: Semantics, keyboard use and assistive technology as part of building, not as an audit.

  - slug: frontend-testing
    name: Testing frontend code
    description: What is worth testing in a UI, and tests that fail for the right reason.

  - slug: debugging
    name: Debugging and diagnosis
    description: Turning a report into a reproduction, a reproduction into a cause, and a cause into a fix.

  - slug: collaboration
    name: Working with a team
    description: Code review, asking for help, disagreement, and saying what you do not know.

  # Added 2026-09-22 after the critique passes. Two gaps they found are not sub-parts of
  # `collaboration`: nothing in the bank asked a candidate to hand context to someone who is not in
  # the room, and nothing asked them to talk about their own work — which is the round a Nigerian
  # interviewer named as the highest-yield hour they have, because a junior CV often outruns what
  # the person actually wrote. Both are shared across every role.
  - slug: written-communication
    name: Saying it in writing
    description: Asking, escalating and handing over to someone who is not there to ask you a follow-up.

  - slug: own-work
    name: Talking about your own work
    description: Describing something you built, the decision behind it, and what you would do differently now.

  - slug: api-design
    name: API design
    description: Resources, status codes, error shapes and the contract a client has to live with.

  - slug: databases
    name: Databases and data modelling
    description: Schemas, indexes, transactions, and the queries an application actually runs.

  - slug: backend-reliability
    name: Reliability and failure handling
    description: Timeouts, retries, idempotency, and what a service does when a dependency is down.

  - slug: test-design
    name: Test design and coverage
    description: Choosing cases worth writing — boundaries, states and the paths users take.

  - slug: defect-reporting
    name: Defect reporting and triage
    description: Reports a developer can act on, and judging severity honestly.

  # Added 2026-09-22 with the backend bank. Seven topics the backend blueprint derived from
  # `docs/role-catalogue.md`; five of the seven are reused by DevOps, data engineering and
  # full-stack when those waves land, which is why they are named for the thing rather than for
  # the role. `indexing and transactions` is deliberately *not* here — a question about an index
  # is a question about the database, so both are subtopics of `databases`.
  - slug: caching
    name: Caching
    description: What is worth holding on to, how long for, and how the held copy is replaced when the truth changes.

  - slug: async-work
    name: Background and queued work
    description: Work taken out of the request — queues, retries, and what happens when a job runs twice.

  - slug: auth
    name: Authentication and authorisation
    description: Proving who someone is, deciding what they may do, and storing credentials safely.

  - slug: concurrency
    name: Concurrency and race conditions
    description: Two requests at once — lost updates, check-then-act, and the guarantees the database offers.

  - slug: backend-testing
    name: Testing backend code
    description: What a test should own, what it should stand in for, and tests that fail for a real reason.

  - slug: observability
    name: Logging, metrics and knowing it broke
    description: Finding out what happened after the fact, and finding out before the user tells you.

  - slug: system-design-basics
    name: Designing something that has to grow
    description: When to add a cache, a queue or a second machine, what each one costs, and what breaks first.
