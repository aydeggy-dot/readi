  # Added 2026-09-22 from the critique passes. Two gaps, each named independently by more than one
  # pass: the bank asked nothing that a candidate answers in writing to someone who is not there,
  # and nothing about work the candidate actually did. Both carry all four wave-1 roles, because
  # neither is a frontend question — the backend and QA passes should reuse them rather than write
  # their own.

  - slug: the-overnight-blocker
    roles: [frontend, backend, qa, fullstack]
    levels: [intern-junior, mid]
    type: scenario
    topic: written-communication
    subtopic: escalating asynchronously
    difficulty: 3
    prompt: >-
      You are working with a team five hours behind you. At four in the afternoon your time you hit
      something you cannot get past, and nobody will be online for another six hours. Tell me what
      you would write.
    context: null
    rubric: async-unblocking
    ideal_points:
      - Writes it down straight away rather than waiting to explain it live.
      - Says what they were trying to do, what they tried, what happened, and what they think is going on.
      - Asks a specific question, so the answer can arrive while they are asleep.
      - Says what it blocks and by when, so the reader knows how urgent it is.
      - Carries on with something useful — the parts not blocked, or narrowing the problem further.
      - Sends it where the team will see it, not to one person who may be on leave.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What exactly are you asking them?
      - criterion: 1
        probe: >-
          What is not moving until they answer?
      - criterion: 2
        probe: >-
          Six hours is most of an evening — what does the blocker not stop you doing?
    reviewer_notes: >-
      Added after a critique pass pointed out that every question in the bank is answered by talking
      to an interviewer who is present and can ask a follow-up — which is exactly the condition
      remote work removes, and remote work is half of what this product is for. Two things I am
      unsure about. It is a hypothetical, so a candidate who has only worked locally has to imagine
      the setup rather than recall it — is that fair, or does it reward people who have already
      worked remotely? And is six hours of waiting the right shape for the Nigerian day, given that
      most remote work here is with Europe rather than the US?

      Criterion 2 scores two things at 30% — one answerable question, and what it holds up — so it
      carries two follow-ups.
  - slug: something-you-built
    roles: [frontend, backend, qa, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: own-work
    subtopic: a decision you made
    difficulty: 3
    prompt: >-
      Take me through something you built — anything, at work or on your own.
    context: null
    rubric: talking-about-your-own-work
    ideal_points:
      - Enough technical detail to be checkable — what it did, what it was built with, what was hard.
      - A real decision with at least two options, not a description of the finished thing.
      - Why they chose as they did, in terms of the situation rather than of what is generally better.
      - What it cost them — the thing that got harder because of the choice.
      - Something they would do differently, and why they did not know that at the time.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Where did you have to pick between two ways of doing it?
      - criterion: 2
        probe: >-
          What would you do differently if you started it again tomorrow?
      - criterion: 2
        probe: >-
          What did you not know then that you know now?
    reviewer_notes: >-
      Added after an interviewer said this is the highest-yield question they have and the bank had
      nothing like it: every other question hands the candidate a supplied scenario, so all 31 could
      be prepared for without the candidate ever describing their own code. It matters more here
      than elsewhere, because junior CVs in this market routinely claim more than the person wrote.
      Two worries. It is the only question whose answer we cannot anticipate at all, so the rubric
      has to score the *shape* of the answer rather than its content — does that hold up? And it
      rewards having built something substantial, which a candidate straight out of a bootcamp with
      three tutorial projects may not have. Is the prompt's "anything, at work or on your own" enough
      to make that fair?

      Criterion 3 scores two things at 30% — something specific they would do differently, and why
      they did not know it then — so it carries two follow-ups.
      Does the second follow-up just re-ask the first?
  - slug: vanilla-dom-as-the-source-of-truth
    roles: [frontend]
    levels: [intern-junior, mid]
    stacks: [vanilla-js]
    type: technical
    topic: react-state
    subtopic: where the data lives
    difficulty: 3
    prompt: >-
      This works today. What breaks first?
    context: |
      ```js
      function addToCart(name, price) {
        cartList.innerHTML += `<li data-price="${price}">${name} — ₦${price}</li>`;
        updateTotal();
      }

      function updateTotal() {
        let total = 0;
        for (const item of cartList.querySelectorAll("li")) {
          total += Number(item.dataset.price);
        }
        totalLabel.textContent = `₦${total}`;
      }
      ```
    rubric: dom-as-state-diagnosis
    ideal_points:
      - The page itself is being used as the store, so the data only exists as markup.
      - Rewriting `innerHTML` throws away and rebuilds every row, losing anything the user had in them.
      - Reading numbers back out of text and attributes puts formatting in the middle of arithmetic.
      - Keep the items in an array, and draw the page from it whenever it changes.
      - The total is then derived from the array rather than gathered from the screen.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Where is the cart actually being kept at the moment?
      - criterion: 2
        probe: >-
          How would you restructure it?
    reviewer_notes: >-
      Written to keep vanilla JS at two questions after `vanilla-form-before-js-loads` was untagged
      and made general. This is the thing a framework hides from a vanilla candidate — that the DOM
      is a view, not a database — and it is a bug shape I would expect to see in real code here.
      The `innerHTML +=` line carries a second problem, injection, if any of that text came from a
      user: I have deliberately left it out of the answer key so the question stays about state, but
      a candidate who raises it is telling you something good. Should it be in the key instead?
