# The frontend question bank: 35 questions for an intern/junior or mid-level interview — 24 general
# and 11 written for a particular stack. (A frontend candidate is offered 36: `incident-you-contributed-to`
# lives in the backend bank and carries this role too.) Built to `content/seed/blueprints/frontend.md`,
# which says how many questions each core topic earns and why.
#
# One instruction for whoever asks these, which the seed format has nowhere to put: **an answer drawn
# from a personal project, or a hypothetical, or "where I worked we did not have that, but I would…",
# is scored on the same terms as one drawn from a job.** Much of this audience is self-taught and has
# never had a code reviewer, a staging environment or a test suite.
#
# Draft, written by a model. `reviewer_notes` on each question says what the drafter is unsure
# about — read those first, and see content/seed/REVIEW.md for what we are asking you to check.
version: 1
author: ai_draft
status: draft

questions:
  - slug: js-async-ordering
    roles: [frontend, fullstack]
    levels: [mid]
    type: technical
    topic: javascript-fundamentals
    subtopic: the main thread
    difficulty: 3
    prompt: >-
      A tester says that when they tap Save on their phone the screen goes dead for about two
      seconds — nothing on it changes at all — and then the "Saved" message appears. They expected
      to see "Saving…" while they waited. Why does that line never show up?
    context: |
      ```js
      saveButton.addEventListener("click", () => {
        status.textContent = "Saving…";

        // Builds the report from about 40,000 rows. Takes ~2 seconds on a mid-range phone.
        const report = buildReport(rows);

        status.textContent = `Saved — ${report.length} lines`;
      });
      ```
    rubric: async-ordering-understanding
    ideal_points:
      - The first line did run; the text was set and the browser never got the chance to paint it.
      - Rendering happens on the same thread as the handler, and only once the handler has returned.
      - By the time a frame could be drawn, `textContent` already said "Saved", so "Saving…" was never on screen.
      - Nothing else works during those two seconds either — taps and scrolling wait behind the loop.
      - Let the browser paint before the work starts, or move the work off the main thread.
      - Check it on a mid-range phone or with the CPU throttled, not on the laptop it was written on.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Two seconds is a long time — what is the phone actually busy with?
      - criterion: 2
        probe: >-
          What would you change so the tester sees that message?
      - criterion: 2
        probe: >-
          How would you know the change had worked?
    reviewer_notes: >-
      **The snippet changed on 2026-09-22 and the question is now mid only** (owner's decision).
      It used to be four `console.log`s and a zero-delay `setTimeout` — the snippet in every "top
      ten JavaScript interview questions" video, which sorted candidates by how much interview prep
      they had watched rather than by what they understood, and three of the four critique passes
      wanted it changed or cut. It asks the same thing about the main thread from a symptom nobody
      can have memorised, and the follow-up ("so where does the work go?") is a real one. What I
      would like checked is whether the fix is still reachable at mid: "let it paint first" is easy
      to say and fiddly to do, so the rubric puts the mechanism at level 3 and the yielding at
      level 4, and a candidate who only says "move it to a worker" still scores 3.

      Criterion 3 scores two things at 30% — the change, and knowing it worked — so it carries two
      follow-ups, the second only reached if the first has not already drawn it out.
  - slug: js-loop-that-returns-nothing
    roles: [frontend, fullstack]
    levels: [intern-junior]
    type: technical
    topic: javascript-fundamentals
    subtopic: array methods and return values
    difficulty: 2
    prompt: >-
      This function is meant to give back the jobs that are still open, and whoever calls it gets
      `undefined` every time. Where is that `undefined` coming from?
    context: |
      ```js
      function openJobs(jobs) {
        jobs.forEach((job) => {
          if (job.isOpen) {
            return job;
          }
        });
      }
      ```
    rubric: array-return-diagnosis
    ideal_points:
      - "`openJobs` has no `return` of its own, so it gives back `undefined` whatever the loop does."
      - The `return` inside belongs to the arrow function and ends that call, not the outer one.
      - "`forEach` throws away whatever its callback returns; it is there for side effects."
      - "`filter` keeps the items that pass a test and gives back a new array, leaving the original alone."
      - "`find` is the one to reach for if only the first match is wanted — a different question."
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Where does the value from that inner `return` end up?
      - criterion: 2
        probe: >-
          How would you write it instead?
    reviewer_notes: >-
      New on 2026-09-22, because `js-async-ordering` became mid only and `javascript-fundamentals`
      would otherwise have had one general question at intern-junior instead of the floor of two.
      It is the cheapest question in the bank and deliberately so: the topic needed something a
      self-taught junior meets in their own code rather than in a video. The risk runs the other
      way — is it too easy to be worth one of the six questions an hour holds, or does the "which
      function is this `return` in" part carry it? The follow-up I have in mind is "and if you only
      wanted the first one?", which is where `find` comes in.

  - slug: fetch-failure-states
    roles: [frontend, fullstack]
    levels: [intern-junior]
    type: technical
    topic: web-networking
    subtopic: error handling
    difficulty: 2
    prompt: >-
      You are building a screen that loads a list of jobs from an API and shows them. Besides the
      jobs arriving, what else does that screen have to be able to show?
    context: null
    rubric: network-failure-handling
    ideal_points:
      - "Four states, not one: loading, empty, error, and data."
      - An empty list is a normal result and needs its own message, not an error.
      - "`fetch` resolves for a 404 or a 500: the status has to be checked, e.g. `response.ok`."
      - A request needs a deadline, because a phone that has lost signal hangs rather than failing.
      - The error state should offer the user something to do — retry, or go back.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          The server answers with a 500 — walk me through what happens in your code from there.
      - criterion: 2
        probe: >-
          Their signal drops halfway through and the request never comes back — what then?
    reviewer_notes: >-
      This is deliberately open rather than a puzzle, so a candidate who has built a real screen
      does well and one who has memorised trivia does not. The risk is that it rewards talkers.
      Does the rubric weight (40% on HTTP error handling) put enough of the score on the one thing
      that is objectively right or wrong? The prompt now says "what the code actually has to check",
      because without it the wording pointed candidates at spinners and empty states and then scored
      them on `response.ok`. A reviewer also suggested this would be stronger as a code review — a
      happy-path component with the missing status check in it — which would make that 40% something
      the candidate finds rather than recalls. Worth doing?
      The 500 follow-up is deliberately open so that it does not hand over that `fetch` resolves —
      is it too open to score criterion 2 cleanly?

  - slug: react-state-placement
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    stacks: [react-typescript, nextjs, react-node]
    type: technical
    topic: react-state
    subtopic: lifting state
    difficulty: 3
    prompt: >-
      Two components on the same page need to know which job the user has selected: a list on the
      left and a detail panel on the right. Where would you keep that selection, and why there?
    context: null
    rubric: state-placement-reasoning
    ideal_points:
      - Lift it to the nearest component that contains both — not to a global store by reflex.
      - Keep the id, not a copy of the job object, so there is one source of truth.
      - The job data itself is server state and belongs in a cache that can refetch, not in `useState`.
      - Consider the URL, so the selection survives a reload and can be shared.
      - Name the cost of the choice — prop drilling, or re-rendering the list when the selection changes.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          The detail panel also needs the selected job's title — where does it get that from?
      - criterion: 2
        probe: >-
          Six months from now, what about that decision is most likely to annoy whoever is working
          on this page?
    reviewer_notes: >-
      **Kept, after a critique pass wanted it cut**, because it is not subsumed by
      `state-that-can-disagree` or `url-as-state`: neither asks where shared state should *live*,
      which is the reflex here — lifting to the nearest component that contains both rather than to
      a global store, and knowing the job data itself is server state belonging in a cache. What
      the critique pass got right stands: this is the only question of the four with nothing
      concrete to reason from, so a weak candidate can stay in "it depends" throughout. Two
      questions for you. Is asking for the cost fair on someone who has only built small apps? And
      **is the React tag right when the prompt reads framework-neutral** — untagging it would give
      Vue, Angular and vanilla candidates a question on state ownership they never see now, at the
      price of taking `react-typescript` below its blueprint target of three.
      The cost probe is the drafter’s least certain in this bank: does "annoy" invite analysis or
      complaint?

  - slug: react-unnecessary-effect
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    stacks: [react-typescript, nextjs, react-node]
    type: technical
    topic: react-state
    subtopic: effects
    difficulty: 3
    prompt: >-
      This component works, but a reviewer has asked you to change it. What is wrong with it?
    context: |
      ```jsx
      function Cart({ items }) {
        const [total, setTotal] = useState(0);

        useEffect(() => {
          setTotal(items.reduce((sum, item) => sum + item.price, 0));
        }, [items]);

        return <p>Total: ₦{total}</p>;
      }
      ```
    rubric: effect-diagnosis
    ideal_points:
      - The total is derived from props, so it is not state at all — compute it during render.
      - The effect runs after render, so the user sees the old total for one frame.
      - It costs an extra render every time `items` changes.
      - It creates a second place for the truth to live, which can disagree with `items`.
      - Effects are for synchronising with things outside React, not for keeping values in step.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What does the user actually see because of that?
      - criterion: 2
        probe: >-
          How would you write it instead?
    reviewer_notes: >-
      This is the clearest "one right answer" question in the bank, which makes it good for
      calibration but weak at separating a solid candidate from an excellent one. The excellence
      descriptors lean on naming the rule and on memoisation — is that the right bar, or would you
      rather see them notice the one-frame-stale UI? The top of criterion 3 no longer rewards
      knowing when to memoise, because rewarding that teaches juniors to reach for `useMemo` in
      interviews, which is the habit an interviewer here said they spend most of their time undoing.
      "What does it actually cost" is now "what does the user actually see", because spoken aloud
      the first version was vague — cost in milliseconds, in money, in maintenance? Tagged React +
      Next.js and React + Node:
      the candidate is shown JSX with `useState` and `useEffect`, so it would be meaningless to
      anyone on Vue, Angular or vanilla JS — but it reads the same for a full-stack candidate
      writing that component as for a frontend one.

  - slug: css-overflow-at-360
    roles: [frontend, fullstack]
    levels: [intern-junior]
    type: technical
    topic: css-layout
    subtopic: responsive debugging
    difficulty: 2
    prompt: >-
      A tester reports that on their phone the page scrolls sideways — there is a strip of empty
      space to the right of everything. It looks fine on your laptop. How do you find what is
      causing it?
    context: null
    rubric: responsive-layout-diagnosis
    ideal_points:
      - Reproduce it first at a narrow width (360px) in the device toolbar, rather than guessing.
      - Narrow down to the element wider than the viewport, e.g. by inspecting or bisecting the DOM.
      - Usual suspects — a fixed width, a flex or grid child that will not shrink below its content, a wide table or image, a long unbroken string, negative margins.
      - "Fix the cause; `overflow-x: hidden` hides the symptom and usually hides a real bug."
      - Prefer a fix that holds at every width over a media query for one size.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you expect the culprit to turn out to be?
      - criterion: 2
        probe: >-
          How would you fix it?
    reviewer_notes: >-
      Listed at difficulty 2 because the method matters more than the knowledge, but juniors who
      have only built desktop-first sites may never have met it. Are the "usual suspects" the right
      list for the sites people here actually build? `100vw` next to a scrollbar has been removed
      from the answer key: the scenario is a phone, where scrollbars are overlaid and `100vw` is the
      viewport, so it cannot be the culprit here and a candidate naming it was being rewarded for
      something that could not be true. It belongs in a follow-up about the laptop, if anywhere.

  - slug: slow-page-on-3g
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: scenario
    topic: browser-rendering
    subtopic: performance investigation
    difficulty: 3
    prompt: >-
      A user writes in: "your site takes forever to load on my phone". You cannot reproduce it — on
      your laptop the page appears instantly. Before you change anything, how would you see what
      they are seeing?
    context: null
    rubric: performance-investigation
    ideal_points:
      - Ask for what the report is missing — which page, which device, on mobile data or wifi, every time or once.
      - Reproduce under the user's conditions — throttle the network to Slow 4G and the CPU 4–6×.
      - Record a load and read it — the waterfall for bytes and round trips, the main thread for long tasks.
      - Decide which budget is blown, network or CPU, before choosing a fix.
      - Make the change the measurement points to, then measure again to see whether it helped.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What tells you where the time is actually going?
      - criterion: 2
        probe: >-
          What would you change on the strength of that?
      - criterion: 2
        probe: >-
          How would you know the change had actually helped?
    reviewer_notes: >-
      The intended shape of a strong answer is "reproduce, measure, then act", and the rubric puts
      40% on that. My worry is that a candidate who has never used the Performance panel but says
      sensible things scores 3s across the board. Is there a follow-up you would always ask here to
      tell those two apart? A reviewer argued this should be mid only, because telling a network
      budget from a CPU budget by reading a recorded load is a mid skill and few juniors here have
      opened the Performance panel — which would also answer the question above. I have left it at
      both levels; your call.

      Criterion 3 scores two things at 30% — the change following from the measurement, and its
      effect being checked — so it carries two follow-ups.
  - slug: stuck-and-asked-for-help
    roles: [frontend, backend, qa, fullstack]
    levels: [intern-junior]
    type: behavioral
    topic: collaboration
    subtopic: asking for help
    difficulty: 2
    prompt: >-
      Tell me about a time you were really stuck on something and ended up asking someone for help.
    context: null
    rubric: help-seeking-judgement
    ideal_points:
      - One specific occasion, with the detail an outsider needs to follow it.
      - What they tried before asking — what each attempt ruled out, not just that they searched.
      - How they asked — what they had tried, what they expected, what happened instead.
      - >-
        Who or what they reached out to. A colleague, a mentor, a community, a Discord or WhatsApp
        group, an issue thread — all of them count, and none of them counts more than another.
      - Whether asking was easy or hard wherever they had to ask, and what they did about that.
      - What they do differently now, stated concretely.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What had you already tried before you asked?
      - criterion: 2
        probe: >-
          What made that the moment you stopped trying on your own?
    reviewer_notes: >-
      Reworked 2026-09-22. It used to ask "how long did you spend before you asked for help" and be
      scored by the shared behavioural rubric, so the judgement the question exists to test had
      nowhere to be scored. It now has its own rubric, and the timing criterion asks what made
      asking easy or hard **where they had to ask** rather than treating three days as a failure.
      Widened 2026-09-24 (owner's decision): criterion 3 used to score the judgement of a candidate
      who had a colleague to turn to, which most candidates here become only once they are hired.
      Asking is now defined in the rubric as reaching outward by whatever route was open — a
      community, a group chat, an issue thread. **The widening is in the rubric, not in the
      opening**, which still says "asking someone for help". Should it say so aloud too, so a
      self-taught candidate does not hear a question about a workplace they have not had? And is
      40% on the timing judgement too much?

  - slug: feedback-on-your-code
    roles: [frontend, backend, qa, fullstack]
    levels: [intern-junior, mid]
    type: behavioral
    topic: collaboration
    subtopic: code review
    difficulty: 2
    prompt: >-
      Tell me about a piece of your work that someone gave you a lot of feedback on — a reviewer, a
      mentor, a maintainer on a pull request, a tutor.
    context: null
    rubric: handling-review-feedback
    ideal_points:
      - A real piece of feedback, described specifically rather than as a general attitude to it.
      - At least one comment they did not at first agree with or understand, and how they got to the bottom of it.
      - What changed in the end — including where the other person turned out to be right.
      - Something they now do earlier, so that comment would not arise again.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What did you actually change as a result?
      - criterion: 2
        probe: >-
          Which of those comments took you longest to accept, and what got you there?
    reviewer_notes: >-
      Reworked 2026-09-22 on two findings. It required an employer with code review — the only
      question in the bank with a hard experience prerequisite — so it now names a mentor, a
      maintainer or a tutor as well. And it asked for a comment they **disagreed with**, which
      rewards standing to push back that not every workplace gives a junior; it now asks for one
      they did not agree with **or did not understand**, which gets at the same engineering
      judgement by a route everyone has. It has its own rubric for the same reason
      `stuck-and-asked-for-help` does. Is "a lot of feedback" still leading them towards a story
      where they were wrong?

  # ---------------------------------------------------------------------------------------------
  # Added 2026-09-22 (the catalogue question-bank pass). General questions first — no `stacks:`, so
  # every frontend candidate is asked them, including one who chose no variant. The stack-tagged set
  # follows below and is round two of the review.

  - slug: js-copy-or-reference
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: javascript-fundamentals
    subtopic: references and copying
    difficulty: 2
    prompt: >-
      A colleague says this function is "corrupting their data" — after they call it, the array they
      passed in has changed. They tell you they declared it with `const`, so they do not see how it
      can have. Walk me through what is actually happening.
    context: |
      ```js
      function withDiscount(items, percent) {
        for (const item of items) {
          item.price = item.price * (1 - percent / 100);
        }
        return items;
      }

      const cart = [{ name: "Airtime", price: 1000 }];
      const discounted = withDiscount(cart, 10);
      // cart[0].price is now 900
      ```
    rubric: reference-semantics-understanding
    ideal_points:
      - Objects and arrays are passed as references, so the function is editing the caller's data.
      - "`const` protects the binding, not the contents — `cart` cannot be reassigned, but its items can change."
      - Build and return new objects instead of writing to the ones passed in.
      - A shallow copy is not enough here — the items inside would still be shared.
      - A function that changes what it was given should say so in its name, or not do it.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          So what is `const` actually protecting there?
      - criterion: 2
        probe: >-
          How would you fix it?
      - criterion: 2
        probe: >-
          Would you write it that way everywhere, or only here?
    reviewer_notes: >-
      I have kept this at intern-junior because the bug shape is common in real work rather than
      because the language rule is easy. The risk is that it reads as a trick question about `const`.
      Does the shallow-copy point (criterion 3's level 4) belong at junior at all, or should it be
      the thing that separates junior from mid here?

      Criterion 3 scores two things at 40% — a fix that does not write to what it was given, and why
      that is the better default — so it carries two follow-ups.
  - slug: state-that-can-disagree
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: react-state
    subtopic: derived state
    difficulty: 3
    prompt: >-
      A page shows a list of items, a badge saying how many are selected, and a running total. A
      tester says that after you remove an item, the badge sometimes says three when only two rows
      are highlighted. How do you think the badge ended up saying three?
    context: null
    rubric: derived-state-reasoning
    ideal_points:
      - Only the selection is state; the count and the total are calculated from it when rendering.
      - Storing all three creates three places for one fact, which can disagree after a bug.
      - "Every change would otherwise have to update three things: the failure is silent and looks like a display bug."
      - Recalculating on render is cheap here, and it is measured before being optimised.
      - The same reasoning applies to anything filtered or sorted from a list already held.
    planned_follow_ups:
      - criterion: 0
        probe: >-
          So what would you actually keep in state on that page?
      - criterion: 2
        probe: >-
          What does it cost to work that total out again on every render?
      - criterion: 2
        probe: >-
          What would you look at to settle it?
    reviewer_notes: >-
      This is the general version of `react-state-placement`, written so that a Vue, Angular or
      vanilla candidate meets the idea too — until now every question on this topic was React-tagged.
      Is "derive rather than store" a fair expectation at intern-junior, or is the honest junior
      answer "I would keep a count variable and update it", which I have put at level 2?

      The opening and the first probe were swapped after the critique passes: the rubric runs
      diagnosis then design, and asking for the design first left the diagnosis being asked about a
      page the candidate had already redesigned. Criterion 3 scores two things at 25% — whether the
      recalculation matters here, and how they would find out — so it carries two follow-ups.
      The swap of opening and first probe is the drafter’s call, not a reviewer’s — is the diagnosis
      the right opening here?
  - slug: url-as-state
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: scenario
    topic: react-state
    subtopic: state in the URL
    difficulty: 2
    prompt: >-
      A user filters a list of jobs down to the ones in Lagos, copies the link and sends it to a
      friend. The friend opens it and sees every job in the country. What has happened?
    context: null
    rubric: url-state-reasoning
    ideal_points:
      - The filter is held in memory in the page, so the link carries no trace of it.
      - Put the filter in the URL — a query string — so the address describes what is on screen.
      - The page then reads its initial filter from the URL rather than from a default.
      - It also fixes reload and the back button, which break for the same reason.
      - Not everything belongs there — an open dropdown or a half-typed form does not.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change so the friend sees the same list?
      - criterion: 2
        probe: >-
          What on that page would you leave out of that link?
    reviewer_notes: >-
      `react-state-placement`'s notes asked whether "put it in the URL" was reasonable to expect at
      intern-junior; this question makes it the subject rather than a bonus point, which I think is
      the fairer way round. The scenario is shareable links, which is how most people here meet the
      problem. Is the back-button point (level 4 of criterion 2) common enough to be worth rewarding,
      or is it a different question?

  - slug: layout-tools-for-a-screen
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: css-layout
    subtopic: choosing a layout tool
    difficulty: 2
    prompt: >-
      This is the CSS for a grid of job cards. It works. What is wrong with writing it this way?
    context: |
      ```css
      .cards { display: grid; grid-template-columns: 1fr; }

      @media (min-width: 480px) { .cards { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 768px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }
      @media (min-width: 1024px) { .cards { grid-template-columns: 1fr 1fr 1fr 1fr; } }
      ```
    rubric: layout-tool-choice
    ideal_points:
      - It describes four screen sizes rather than what the cards need, so any width in between is a guess.
      - Every new size, or a card that gets wider, means another breakpoint.
      - The grid can decide for itself from a minimum card width, and then works at sizes nobody listed.
      - Breakpoints are still right where the design genuinely changes shape, not where the count changes.
      - Check it at 360px, which is where most of this audience is, rather than at the sizes in the file.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          How would you write it instead?
      - criterion: 2
        probe: >-
          The design you were given is a desktop mock-up only — where do you start building?
    reviewer_notes: >-
      Rewritten 2026-09-22. It used to ask which layout tool you would use for a header and a card
      grid, and two critique passes wanted it cut: "flex for the row, grid for the cards" is the
      sentence in every tutorial, everyone who has built one page clears it, and nobody clears it in
      a way that tells you anything. Inverting it — here is the breakpoint-per-size version, what
      does it cost — gives the conversation somewhere to go. Is the new version still fair at
      intern-junior, given the candidate has to read CSS rather than describe an approach, and is
      "let the grid decide" something you would actually expect at that level?

  - slug: content-you-do-not-control
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: css-layout
    subtopic: resilient layout
    difficulty: 3
    prompt: >-
      Here is the data your card layout looks right with, and here is what three of the cards look
      like in production. What breaks?
    context: |
      What you built against:

      - "Frontend Developer" · Paystack · logo present

      What production has:

      - "Senior Frontend Engineer, Payments and Checkout" · logo present
      - "Frontend Developer" · MicrofinanceBankOfTheSouthWestNigeria · logo present
      - "Frontend Developer" · a new employer · **no logo**
    rubric: resilient-layout-reasoning
    ideal_points:
      - Long unbroken text overflows its container or pushes the page wide; wrapping has to be allowed.
      - Cards in a row stop matching height, or the tallest one sets an awkward height for all.
      - A missing image leaves a collapsed or jumping box unless the space is reserved.
      - Test with the worst content you can find, not the sample you built against.
      - Prefer limits the content flows inside — truncation with a full value still available — over fixed sizes.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          How would you build it so that it does not?
      - criterion: 2
        probe: >-
          How would you have caught this before anyone else saw it?
    reviewer_notes: >-
      Written from a real failure shape rather than a CSS property list, and the examples are ones
      this market produces — long company names, missing logos on smaller employers. I am unsure
      about truncation: hiding part of a job title is a product decision as much as a CSS one, and I
      have put it at level 3 rather than 4. Where would you put it?

  - slug: images-on-a-metered-plan
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: scenario
    topic: browser-rendering
    subtopic: image delivery
    difficulty: 2
    prompt: >-
      Six large photographs have been added to the landing page. Users on mobile data are
      complaining that it takes forever and eats their data. How would you find out what is actually
      being sent?
    context: null
    rubric: image-delivery-judgement
    ideal_points:
      - Find out what is actually being sent — the byte size of each image, not how it looks.
      - Serve an image sized for the screen it lands on rather than one desktop file for everyone.
      - A modern format and sensible compression usually take most of the weight out.
      - Load what is below the fold only when it is needed, and reserve its space so nothing jumps.
      - Some of this is a conversation, not a fix — six photographs may be five too many.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change to bring that down?
      - criterion: 2
        probe: >-
          What would you take back to whoever asked for the six photographs?
    reviewer_notes: >-
      The last ideal point is the one I am least sure about scoring: "push back on the requirement"
      is a real senior answer and can also be an excuse not to do the work. I have made it level 4 of
      criterion 3 rather than its own criterion. Also, is data cost something you would expect a
      junior here to raise unprompted, or does the prompt have to mention the bundle as it does now?

  - slug: retry-and-the-double-charge
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: scenario
    topic: web-networking
    subtopic: retries and idempotency
    difficulty: 3
    prompt: >-
      A user taps Pay. The request takes a long time and eventually times out, so they tap again.
      Later they find they were charged twice. Why did that first request still charge them, even
      though it timed out?
    context: null
    rubric: safe-retry-reasoning
    ideal_points:
      - A timeout does not mean the request failed — the server may have completed it.
      - Disable the button and show what is happening, so a second tap is not the obvious move.
      - Send something that identifies the attempt, so the server can recognise a repeat.
      - After a timeout, ask the server what the state is rather than blindly retrying.
      - Not everything is safe to retry automatically — separate reads from actions that charge money.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What should that screen have been doing while they waited?
      - criterion: 1
        probe: >-
          And once it had timed out — what is on screen then?
      - criterion: 2
        probe: >-
          What would make a second attempt safe?
    reviewer_notes: >-
      This needs the server to cooperate, and I have written the ideal points as "what the front end
      does about it" rather than a full idempotency design, which belongs to the backend bank. Is
      that the right split, or would an interviewer here expect a frontend candidate to describe the
      server side too? The scenario is a payment because that is where candidates have felt it.

      Criterion 2 scores two things at 30% — what the interface does in flight, and what it does
      after the timeout, which is the half that caused the second tap — so it carries two follow-
      ups.
  - slug: stale-after-saving
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: web-networking
    subtopic: caching and freshness
    difficulty: 3
    prompt: >-
      A user updates their name in their profile, the save succeeds, and the page still shows the
      old name — but only sometimes, and reloading fixes it. Where would you look first?
    context: null
    rubric: cache-invalidation-diagnosis
    ideal_points:
      - Establish first whether the saved value is right — the server may have the new name already.
      - There are several places a stale copy can live, and the answer names more than one.
      - After a successful save, either refetch or update the copy the page is holding.
      - Check what the response headers say about caching that request.
      - '"Only sometimes" is a clue: it points at something with a lifetime rather than a plain bug.'
      - What reloading does and does not clear narrows the list before anything is tested.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Say the server does have the new name — what could still be putting the old one on screen?
      - criterion: 1
        probe: >-
          How would you tell which of them it is?
      - criterion: 2
        probe: >-
          What would you change so that it stops happening?
    reviewer_notes: >-
      I like this as a debugging question because "it works after a hard refresh" is a phrase every
      candidate has heard, but the honest answer depends on the stack — a service worker, an HTTP
      cache and a client data cache are different things and I have written the rubric to accept any
      of them. Is that too generous, or is naming the layer enough at this level?

      Criterion 2 scores two things at 25% — naming more than one place a copy can live, and a way
      to tell them apart — so it carries two follow-ups.
  - slug: div-that-should-be-a-button
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: accessibility
    subtopic: semantics
    difficulty: 2
    prompt: >-
      This works when you click it. Who cannot use it?
    context: |
      ```html
      <div class="btn" onclick="submitForm()">Send application</div>
      ```
    rubric: semantic-html-diagnosis
    ideal_points:
      - It cannot be reached or activated from the keyboard, so keyboard and screen-reader users are excluded.
      - Assistive technology is told it is a generic container, not something that does anything.
      - The fix is a real `<button>`, which brings focus, Enter and Space, and the role for free.
      - Rebuilding those by hand is possible and is more code that will drift.
      - The visual styling is not the reason to use a div — a button can be styled to look the same.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change?
      - criterion: 2
        probe: >-
          Is "a real button was too hard to style" a good reason?
    reviewer_notes: >-
      The shortest question in the bank and the one I most expect a strong junior to get right, which
      is deliberate — accessibility had no questions at all until this pass and a first question
      should be reachable. Is it too easy to be worth a slot, and if so what would you replace it
      with that is still fair for someone who has never used a screen reader?

  - slug: telling-a-user-the-form-failed
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: accessibility
    subtopic: forms and error feedback
    difficulty: 3
    prompt: >-
      A user submits a sign-up form and two fields are wrong. How do they find out which ones?
    context: null
    rubric: accessible-error-feedback
    ideal_points:
      - Each error sits next to the field it belongs to, not only in a summary at the top.
      - The message is tied to the input so it is read out when that field is reached.
      - Focus moves somewhere useful — the first bad field, or a summary that links to them.
      - Colour alone is not the signal; there is text as well.
      - The message says how to fix it rather than that something is invalid.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Someone is filling that form in with a screen reader — what do they get?
      - criterion: 1
        probe: >-
          After they hit submit, where does the cursor end up?
      - criterion: 2
        probe: >-
          What do those messages actually say?
    reviewer_notes: >-
      I have deliberately not asked for attribute names, because reciting `aria-describedby` is not
      the skill and a candidate who has built accessible forms in a framework may never have typed
      it. The rubric rewards the behaviour and treats naming the mechanism as level 4. Is that the
      right way round for an interview here, where a lot of people learned from framework docs?

      Criterion 2 scores two things at 35% — that colour is not the signal, and that focus goes
      somewhere useful — so it carries two follow-ups.
      Is "how do they find out which ones?" enough of an opening at difficulty 3, or still too thin?
  - slug: what-to-test-on-a-login-screen
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: frontend-testing
    subtopic: choosing what to test
    difficulty: 2
    prompt: >-
      You have built a login screen — email, password, a submit button, and an error message when
      the credentials are wrong. Starting from nothing, take me through the first test you would
      write for that screen.
    context: null
    rubric: frontend-test-selection
    ideal_points:
      - Test what the user does — fill in the form, submit, see the result — rather than internals.
      - Cover the failure paths, because they are the ones nobody clicks through by hand.
      - The network is stubbed, so the test is about this screen and not about the server.
      - Say what is deliberately not tested and why — styling, the framework's own behaviour.
      - One or two tests that would actually catch a regression beat twenty that assert the obvious.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you cover that someone clicking through the screen by hand would never reach?
      - criterion: 2
        probe: >-
          What would you deliberately leave untested, and why is that the right call?
    reviewer_notes: >-
      Asking what they would deliberately leave untested is the part I think separates people. The
      prompt now says "if you were starting this screen's tests from nothing", so a candidate whose
      employer had no test suite is not answering about a world they have never seen. Does that read
      as neutral to you? And should criterion 3, the scoping judgement, outweigh the two coverage
      criteria rather than sit level with them?

  - slug: the-test-that-broke-for-nothing
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: technical
    topic: frontend-testing
    subtopic: brittle tests
    difficulty: 3
    prompt: >-
      A colleague renamed a CSS class and moved a button into a wrapper. Nothing about the behaviour
      changed, and eleven tests failed. What does that tell you about those tests?
    context: null
    rubric: test-brittleness-diagnosis
    ideal_points:
      - The tests are tied to the structure and the styling rather than to what the screen does.
      - A test that fails when nothing broke costs trust, and teams start ignoring the suite.
      - Select elements the way a user finds them — by role, label or visible text.
      - Fix the tests rather than reverting the rename; the refactor was not the problem.
      - Some churn is the point — a test should fail when the behaviour really does change.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What does living with a suite like that cost you?
      - criterion: 2
        probe: >-
          What would you do about it?
    reviewer_notes: >-
      This is the strongest testing question in the bank in my view, but it assumes the candidate has
      lived with a test suite long enough to have felt the cost, which many juniors here will not
      have. Two passes said mid only; one said keep both levels but move criterion 2's weight onto
      the two criteria that test reasoning rather than experience. I have done neither, because both
      are judgements about this market rather than defects. Which would you take?

  - slug: it-works-for-me
    roles: [frontend, fullstack, qa]
    levels: [intern-junior, mid]
    type: scenario
    topic: debugging
    subtopic: reproducing a report
    difficulty: 2
    prompt: >-
      Someone has sent this in about the job board. What would you go and look at before you reply?
    context: |
      > good day. the app is not working. on my Tecno Spark the job list is just blank, but the
      > menu at the top is there. my sister opened it on her iPhone and hers is fine. please fix
      > it, i have been trying since morning.
    rubric: reproducing-a-report
    ideal_points:
      - Ask for what is still missing — which screen, what they tapped, whether it has ever worked.
      - "Use what is already there: one device works and another does not, and the page rendered but its data did not."
      - Check whether anything else says the same thing — error reports, other tickets, a recent release.
      - Try to reproduce under their conditions before changing anything.
      - A report you cannot reproduce is not closed; say what would let you take it further.
    planned_follow_ups:
      - criterion: 0
        probe: >-
          What would you write back to them?
      - criterion: 2
        probe: >-
          How would you go about seeing it for yourself?
    reviewer_notes: >-
      Rewritten 2026-09-22: it used to be "support forwards you a message saying the app is not
      working", with nothing else, and a critique pass called it the lowest-discrimination question
      in the bank — the answer is a script anybody can recite and nobody can be wrong. It now gives a
      real report, so the answer has to contain a hypothesis and not only a list of questions. Is one
      device working and another not too strong a hint? **It now carries `qa` as well** (2026-09-23): its
      own note asked whether one question should serve all three roles, and the answer was yes —
      nothing in it is about the browser, and a QA copy would have been the same question with a
      second slug to keep in step. Its rubric moved to `rubrics.shared.yaml`. Is the answer key
      missing the triage half — how often, how many users, what severity — or does that belong to
      `two-bugs-one-slot` in the QA bank?

      Opening and first probe swapped after the critique passes; nobody has reviewed the swap.
  - slug: error-only-in-production
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: scenario
    topic: debugging
    subtopic: production-only failures
    difficulty: 3
    prompt: >-
      This is what the tool that collects errors from real users is showing you. It never happens on
      your machine. What do you do with that stack trace?
    context: |
      ```
      TypeError: Cannot read properties of undefined (reading 'name')
        at t (main.4f2a1c.js:1:84213)
        at Object.r (main.4f2a1c.js:1:12907)
      ```

      Beside the trace, the tool lists: **page** /jobs/:id · **events** 41 in the last 24 hours ·
      **users affected** 12 · **first seen** 3 days ago · **browsers** Chrome 138 (mostly), Samsung
      Internet · **device** mostly Android, mid-range.
    rubric: production-error-investigation
    ideal_points:
      - The stack trace is minified; source maps are what turn it back into code you can read.
      - Use what the report carries besides the trace — browser, device, page, how many users.
      - Forty a day out of how many sessions is the question that decides how urgent it is.
      - "Reading a property of `undefined` means data that was assumed to be there was not: usually a failed or empty response."
      - Guard the specific case, then fix why the data was missing — and check the rate afterwards.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          How would you work out how urgent this is?
      - criterion: 2
        probe: >-
          You have found the line — what actually needs fixing?
    reviewer_notes: >-
      The trace is realistic but it is also the most common error message in JavaScript, which may
      make the question feel like a quiz about that one message rather than about method. Would you
      rather it were an error the candidate has to reason about from scratch? The fields the tool
      shows are now listed in the question, because 45% of the score was on using them and a
      candidate who has never had such a tool was being scored on their employer rather than on
      their reasoning.
      Opening tightened 2026-09-24 to ask the un-probed criterion and nothing else; criterion 2
      carries 45% and has a follow-up, so answering the prompt literally is not penalised.

  # ---------------------------------------------------------------------------------------------
  # Stack-tagged questions: round two of the review. Each is here because it would be unfair or
  # meaningless to a candidate on another variant — a snippet in one framework's syntax, or a
  # problem that only exists in one of them. Anything that merely mentions a library stayed general.
  #
  # Where a question is one a full-stack interview would also ask, it carries a full-stack variant
  # too, because a candidate's profile holds one stack and `laravel-vue` is not `vue-nuxt`
  # (blueprints/fullstack.md). Angular has no full-stack variant in the catalogue, so the two
  # Angular questions are frontend-only — that is the rule working, not an omission.

  - slug: react-list-key-mixup
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    stacks: [react-typescript, nextjs, react-node]
    type: technical
    topic: react-state
    subtopic: list identity
    difficulty: 3
    prompt: >-
      Have a look at what happened to the tester here. What is going on?
    context: |
      The list on screen, before anything is removed:

      1. Chioma Okafor
      2. **Ibrahim Musa** — the tester types "call back Monday" against this one
      3. Ada Nwosu

      ```jsx
      {applications.map((application, index) => (
        <ApplicationRow key={index} application={application} />
      ))}
      ```

      `ApplicationRow` keeps the note the user is typing in its own `useState`. The tester then
      removes Chioma Okafor, and "call back Monday" is now showing against Ada Nwosu.
    rubric: list-identity-diagnosis
    ideal_points:
      - The key is the position, so after a removal every row's key now points at different data.
      - React reuses the component that had that key, and its internal state comes along with it.
      - Use something that identifies the item itself — the application's id — as the key.
      - The state that went wrong is the state React is holding for that row, not the data.
      - An index key is safe only for a list that never reorders, never filters and never removes.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Is the note wrong in the data now too, or only on screen?
      - criterion: 2
        probe: >-
          How would you fix it?
      - criterion: 2
        probe: >-
          You have changed the key — is there a case where the old one would have been fine?
    reviewer_notes: >-
      **Version-sensitive: React list reconciliation, checked against react.dev on 2026-09-22.**
      This is the bug I would most expect to actually happen to a junior on a real project, which is
      why it is here rather than a rendering-performance question. It needs the candidate to know
      that a child holds state, which the snippet has to state in prose because the component is not
      shown. Does that prose line give too much away, or is it the minimum the question needs?

      Criterion 3 scores two things at 30% — the fix, and an honest account of when an index is
      acceptable — so it carries two follow-ups.
  - slug: nextjs-server-or-client
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    stacks: [nextjs]
    type: technical
    topic: browser-rendering
    subtopic: the server and client boundary
    difficulty: 3
    prompt: >-
      You have a page that lists jobs from a database, and one button on it that opens a filter
      panel. A colleague has put "use client" at the top of the page file to make the button work.
      What does that line actually do?
    context: null
    rubric: client-boundary-reasoning
    ideal_points:
      - Marking the page makes everything under it client code, including the parts that only render data.
      - That ships more JavaScript to a phone and gives up rendering the list on the server.
      - Only the interactive part needs to be a client component; the page can stay on the server.
      - Push the boundary as far down the tree as the interaction allows.
      - Data fetching can then stay on the server, close to the database, rather than becoming a request from the browser.
      - A server component passed to a client component as a child or a prop stays on the server — it is rendered output, not an import.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What happens to the rest of the page because of it?
      - criterion: 2
        probe: >-
          What would you do instead?
    reviewer_notes: >-
      **Version-sensitive: Next.js `"use client"` semantics, checked against nextjs.org on
      2026-09-22.** The App Router's server-and-client split is the thing Next.js candidates most often half-know,
      so I think this is the right question — but it is also the part of the framework that has moved
      most in the last two years, and a candidate who learned on the Pages Router will answer about
      `getServerSideProps` instead. Should the rubric give credit for that, or is being current part
      of what is being tested?

  - slug: nextjs-key-in-the-browser
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    stacks: [nextjs]
    type: technical
    topic: web-networking
    subtopic: secrets and the client boundary
    difficulty: 2
    prompt: >-
      What is wrong with this component?
    context: |
      ```jsx
      "use client";

      export function RatesButton() {
        async function refresh() {
          const response = await fetch("https://api.example.com/rates", {
            headers: { Authorization: `Bearer ${process.env.NEXT_PUBLIC_RATES_KEY}` },
          });
          setRates(await response.json());
        }

        return <button onClick={refresh}>Refresh rates</button>;
      }
      ```
    rubric: secret-exposure-diagnosis
    ideal_points:
      - Anything prefixed `NEXT_PUBLIC_` is written into the bundle the browser downloads.
      - In a client component the request is made by the browser, so the key is in the network tab too.
      - The call belongs on the server — a server component, a route handler — with the key unprefixed.
      - "A key that has shipped is compromised: rotate it, rather than only removing it."
      - Search the deployed bundle to see whether it is there, and check the provider's usage.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          Where should that request be happening instead?
      - criterion: 2
        probe: >-
          That key has been in a deployed build for three weeks — what now?
    reviewer_notes: >-
      **Version-sensitive: Next.js `NEXT_PUBLIC_` inlining, checked against nextjs.org on
      2026-09-22.** This is as much a security question as a framework one, and I have weighted "what do you do
      about a key that has already shipped" at 30% because I think the rotation instinct matters more
      than the framework trivia. Is that the right balance for a frontend interview, or would a
      reviewer here expect the whole score on the `NEXT_PUBLIC_` rule?

  - slug: vue-reactivity-lost
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    stacks: [vue-nuxt, laravel-vue]
    type: technical
    topic: react-state
    subtopic: reactivity
    difficulty: 3
    prompt: >-
      The count on screen never changes, even though clicking the button clearly runs the function.
      Why is the screen not seeing the change?
    context: |
      ```vue
      <script setup>
      import { reactive } from "vue";

      const state = reactive({ count: 0 });
      const { count } = state;

      function add() {
        state.count += 1;
      }
      </script>

      <template>
        <button @click="add">{{ count }}</button>
      </template>
      ```
    rubric: vue-reactivity-diagnosis
    ideal_points:
      - Destructuring takes the value out of the reactive object, so the template holds a plain number.
      - The object still updates; nothing is watching the copy the template rendered.
      - Use the object in the template, or convert the properties to refs before destructuring.
      - A `ref` would have the same problem if its value were copied out in the same way.
      - The rule is that reactivity belongs to the container, not to the value taken out of it.
      - "Props are the exception: since Vue 3.5 the compiler rewrites destructured props, so that one case does keep working."
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change?
      - criterion: 2
        probe: >-
          What would you tell someone else to watch out for?
    reviewer_notes: >-
      **Version-sensitive: Vue reactivity and `<script setup>`, checked against vuejs.org on
      2026-09-22 — needs a reviewer who knows what this audience actually learned Vue on.**
      Checked against vuejs.org on 2026-09-22: destructuring a `reactive()` object still breaks the
      connection, and **Vue 3.5 made destructuring `defineProps` reactive**, which the answer key
      now mentions — a candidate who learned on 3.5 may reasonably expect this to work too, and
      knowing why props are the exception is the best answer available here. What I am less sure of
      is the audience: this is the Composition API with `<script setup>`, and someone who learned on
      the Options API would hit the same bug in unfamiliar syntax. Is that the right default to
      write for, or should one of the two Vue questions use the Options API?

  - slug: vue-list-drifts-from-its-source
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    stacks: [vue-nuxt, laravel-vue]
    type: technical
    topic: react-state
    subtopic: computed values and watchers
    difficulty: 3
    prompt: >-
      Users say the list sometimes shows jobs that do not match what they typed, and it comes right
      as soon as they type another letter. What is going on?
    context: |
      ```vue
      <script setup>
      const jobs = ref([]);
      const term = ref("");
      const visible = ref([]);

      watch(term, (value) => {
        visible.value = jobs.value.filter((job) => job.title.includes(value));
      });

      async function reload() {
        jobs.value = await fetchJobs();
      }
      </script>
      ```
    rubric: derived-list-diagnosis
    ideal_points:
      - The visible list is stored, and it is only recalculated when the term changes.
      - Reloading the jobs leaves the old filtered list on screen until the next keystroke.
      - The filtered list is derived from two things, so it should be computed rather than stored.
      - A computed value recalculates when either of them changes, and there is then only one list.
      - A watcher is still right for something that has to *happen* on a change — sending an analytics event, saving a draft.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          How would you write it instead?
      - criterion: 2
        probe: >-
          Is there anything you would still reach for a watcher for?
    reviewer_notes: >-
      Replaced `vue-computed-or-watch` on 2026-09-22. That question asked which of two things was a
      computed value and which was a watcher, and two critique passes said the same thing my own
      notes had: it was a definitions question in Vue vocabulary, answerable in thirty seconds by
      anyone who has read the docs, and the general set already covers the idea for every candidate.
      This version has the bug in it, so the candidate has to find the drift rather than recite the
      distinction — and the follow-up ("when *is* a watcher right?") gets the rest for free. Is the
      symptom — right after another keystroke — too strong a hint at the watcher? **Both Vue
      questions are written in the Composition API with `<script setup>`**, which the owner has
      kept for now on the condition that a reviewer confirms it: someone who learned on the Options
      API would meet the same bug in unfamiliar syntax, and you will know which of the two this
      audience actually learned on better than we do.

  - slug: angular-subscription-leak
    roles: [frontend]
    levels: [intern-junior, mid]
    stacks: [angular]
    type: technical
    topic: react-state
    subtopic: subscriptions and lifetime
    difficulty: 3
    prompt: >-
      A user moves between the job list and a job's detail page a few dozen times. The app gets
      slower, and the list starts showing results from a search they ran several pages ago. What is
      wrong here?
    context: |
      ```ts
      ngOnInit() {
        this.jobs$ = this.jobService.search(this.term);
        this.jobs$.subscribe((jobs) => (this.jobs = jobs));
      }
      ```
    rubric: subscription-lifetime-diagnosis
    ideal_points:
      - The subscription is never ended, so it survives the component that created it.
      - Each visit adds another, and all of them keep responding — hence the results from a job already left.
      - The component cannot be collected while something still holds a reference to it.
      - Let the template subscribe and unsubscribe instead, or tie the subscription to the component's lifetime.
      - The general rule is that anything subscribed in a component is ended when the component is.
      - Credit a candidate who also notices that assigning to a field from inside `subscribe` notifies a zoneless Angular of nothing, so the list may not render at all.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          What would you change?
      - criterion: 2
        probe: >-
          What else in a component would you check for the same thing?
    reviewer_notes: >-
      **Version-sensitive: the idiomatic Angular cleanup, checked against angular.dev on
      2026-09-22.** The bug and the reasoning are stable across Angular versions, but **the idiomatic fix is not**:
      the async pipe, `takeUntil` with a subject, `takeUntilDestroyed`, and signals are all answers a
      candidate might give depending on when they learned. I have written the rubric to reward any
      fix that ties the subscription to the component's lifetime and not to name a mechanism. Is that
      too lenient for a mid-level Angular interview here? The snippet also has a second problem on a
      current Angular — assigning to a field inside `subscribe` notifies a zoneless application of
      nothing — which I have added as an ideal point rather than rewriting the snippet, because the
      leak is what the question is about. Would you rather the snippet used the async pipe and the
      leak came from somewhere else?

  - slug: angular-view-did-not-update
    roles: [frontend]
    levels: [intern-junior, mid]
    stacks: [angular]
    type: technical
    topic: browser-rendering
    subtopic: change detection
    difficulty: 3
    prompt: >-
      The new job appears in the console, but the list on screen does not change. Nothing throws.
      What would you check first?
    context: |
      ```ts
      @Component({
        selector: "job-list",
        changeDetection: ChangeDetectionStrategy.OnPush,
        template: `@for (job of jobs; track job.id) { <job-row [job]="job" /> }`,
      })
      export class JobListComponent {
        @Input() jobs: Job[] = [];
      }
      ```

      The parent adds a job like this:

      ```ts
      addJob(job: Job) {
        this.jobs.push(job);
        console.log("jobs now", this.jobs.length);
      }
      ```
    rubric: change-detection-diagnosis
    ideal_points:
      - Confirm first that the array really did change, which the console line does show.
      - The array was changed in place, so the reference the child was given is the same one it already had.
      - A component that checks only when its inputs change has, as far as it can tell, been given nothing new.
      - Assign a new array instead of pushing into the existing one, and the change becomes visible.
      - Forcing a check by hand works, and needing to is a sign the real cause has not been found.
      - The same reasoning holds whether the application uses zones or signals — what changed is what does the notifying, not that something has to.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          The property really has changed and the screen still has not — why might that be?
      - criterion: 2
        probe: >-
          How would you fix it?
      - criterion: 2
        probe: >-
          Would reaching for a forced refresh be reasonable here?
    reviewer_notes: >-
      **Version-sensitive: Angular change detection, checked against angular.dev on 2026-09-22 —
      needs an Angular specialist, not a generalist reviewer.** Kept on that condition, and
      rewritten twice the same day: zoneless is the default from v21, so "it happened outside the
      zone" is no longer the first thing to reach for, and three critique passes said a diagnosis
      question with no code invites reciting a blog post. It shows the bug I would expect — a
      parent pushing into an array a child was given — which behaves the same in zone-based,
      signal-based and `OnPush` applications. **What a specialist has to settle: the docs disagree
      about whether `OnPush` is now the default** — the roadmap says it was made so, the zoneless
      guide still calls it recommended. The snippet sets it explicitly rather than depend on the
      answer. Right way out, or does it give the game away?

      Criterion 3 scores two things at 30%, so it carries two follow-ups.
  - slug: vanilla-clicks-on-new-items
    roles: [frontend]
    levels: [intern-junior, mid]
    stacks: [vanilla-js]
    type: technical
    topic: javascript-fundamentals
    subtopic: events and the DOM
    difficulty: 2
    prompt: >-
      The Save buttons work on the jobs that were on the page when it loaded. The ones loaded by
      "Show more" do nothing at all. What is different about them?
    context: |
      ```js
      document.querySelectorAll(".save").forEach((button) => {
        button.addEventListener("click", saveJob);
      });
      ```
    rubric: event-binding-diagnosis
    ideal_points:
      - The handlers were attached once, to the buttons that existed at that moment.
      - Elements added later were never given one, so nothing happens when they are clicked.
      - Listen on a container that is always there and act on the clicked element inside it.
      - "That works because a click travels up through the ancestors of what was clicked."
      - Re-attaching after every load also works and leaves you managing handlers by hand.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          How would you fix it?
      - criterion: 2
        probe: >-
          Why does that work?
    reviewer_notes: >-
      Event delegation is the one thing I would want a vanilla-JS candidate to know that a framework
      would have hidden from them, so it is here rather than in the general set. My worry is the
      level — is this an interview question at all in 2026, or is it assumed knowledge that only
      catches people out in practice?

  - slug: vanilla-form-before-js-loads
    roles: [frontend, fullstack]
    levels: [intern-junior, mid]
    type: scenario
    topic: browser-rendering
    subtopic: what works before the script arrives
    difficulty: 3
    prompt: >-
      On a slow connection, users sometimes tap Submit on your form before the page's JavaScript has
      finished loading, and nothing happens. Some of them tap it repeatedly and then leave. What is
      going on in those few seconds?
    context: null
    rubric: progressive-enhancement-reasoning
    ideal_points:
      - A form that submits to a URL works without JavaScript; the script should improve it, not enable it.
      - If the script is the only way to submit, the page is broken for the seconds before it arrives.
      - Do not show a control as ready before it is — disable it until it works, or make it work first.
      - Keep the script small and load it in a way that does not wait for everything else.
      - The same reasoning covers the user whose script fails to load at all.
    planned_follow_ups:
      - criterion: 1
        probe: >-
          How would you build it so that tapping Submit then still does something?
      - criterion: 2
        probe: >-
          In that first second, what is on screen where that button is?
    reviewer_notes: >-
      Written for this audience deliberately: a phone on a weak connection spends real seconds in
      this state, and a lot of tutorials never mention it. **Untagged 2026-09-22** — it was written
      as a vanilla-JS question, and two critique passes pointed out that the gap between paint and
      hydration is exactly this failure on a React or Next.js app, so the candidates who most need
      it were the ones not being asked. Nothing in the prompt or the rubric is framework-specific.
      One instruction for the interviewer: **do not use the phrase "progressive enhancement" in a
      follow-up** — it is a term from a particular strand of Western web writing and is not reliably
      recognised here. Is the question still on the right side of the line between this and an
      argument for building without frameworks?

