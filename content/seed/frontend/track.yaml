# The frontend programme for interns and juniors: three modules, two lessons each.
# Draft. Every lesson needs an expert's eye before a candidate reads it.
version: 1
author: ai_draft
status: draft

track:
  slug: frontend-intern-junior
  role: frontend
  level: intern-junior
  title: Frontend engineer — intern and junior
  summary: >-
    What an interviewer expects from someone in their first two years of frontend work: the
    language, React that stays predictable, and pages that are fast on the phones people here
    actually use.
  topics:
    - { topic: javascript-fundamentals, core: true }
