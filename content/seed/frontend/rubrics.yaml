# Rubrics for the frontend question bank. One per question; the role-general behavioural and
# communication questions are scored by purpose-built rubrics in ../rubrics.shared.yaml.
#
# House style: three criteria, weights adding to 100, five descriptors each (0 absent … 4
# excellent). The descriptors are what the evaluator scores against, so two people reading the same
# answer should pick the same number — if 2 and 3 are hard to tell apart, that is a defect.
version: 1
author: ai_draft
status: draft

rubrics:
  - slug: async-ordering-understanding
    name: Understanding what the main thread is doing
    criteria:
      - dimension: Says why the first message never reaches the screen
        description: >-
          Not that it was overwritten too quickly to see — that no frame was painted between the two
          assignments, so there was never anything to see.
        weight: 25
        levels:
          "0": Concludes the line did not run, or that the code is wrong.
          "1": A story about the writes rather than about painting — too quick to see, the second line overwriting the first, the two assignments batched together so only the last survived.
          "2": Says the screen did not update, without saying why the update never reached it.
          "3": Says the text was set but the browser never painted between the two assignments.
          "4": As 3, and says what was on screen for those two seconds instead — whatever the tap found there.
      - dimension: Explains what the browser is doing for those two seconds
        description: >-
          One thread runs the handler and draws the page and cannot do both at once, so the frame
          comes after the handler returns.
        weight: 45
        levels:
          "0": Treats drawing the page as something that happens independently of the code.
          "1": A mechanism that is not this one — the browser batching updates for performance, rendering on another thread, `textContent` being asynchronous.
          "2": Says the thread is busy, without connecting that to when the page can be drawn.
          "3": Says the same thread runs the handler and paints, so no frame can be produced until the handler returns.
          "4": As 3, and extends it to the rest of the page — the tap that goes unanswered, the scroll that stalls — because they wanted the same thread.
      - dimension: Gets the work out of the way
        description: What they would change, and how they would know it had worked.
        weight: 30
        levels:
          "0": No change proposed, or only a message put somewhere else on the page.
          "1": A change that leaves no room for a frame — a promise wrapped round the same work, a faster loop, a spinner beside the text, or forcing a synchronous layout after the assignment to push it out.
          "2": Names an approach — yield, a worker, do it on the server — without saying what it changes about the two seconds.
          "3": Lets the browser paint before the work starts, or moves the work off the main thread, and says why that is what fixes it.
          "4": As 3, and says how they would check — a throttled profile, or a real mid-range phone — and what their choice costs against the other one.

  - slug: array-return-diagnosis
    name: Reading what a loop actually gives back
    criteria:
      - dimension: Says where the `undefined` comes from
        description: The outer function never returns anything; the `return` inside belongs to the callback.
        weight: 40
        levels:
          "0": Sees nothing wrong, or blames the data.
          "1": Puts the fault somewhere it is not — the `if`, the property name, an empty array — whether guessed at or worked through.
          "2": Notices that `openJobs` returns nothing, without saying what the inner `return` does instead — or gives that `return` a behaviour it does not have and makes the missing assignment the whole of the bug.
          "3": Says the `return` ends the arrow function and the outer one falls off the end, so the caller gets `undefined`.
          "4": As 3, and says the loop itself runs correctly — nothing is broken except what is done with the result.
      - dimension: Knows what `forEach` is for
        description: That it throws away whatever the callback returns, so no `return` inside it can produce a value.
        weight: 30
        levels:
          "0": Treats `forEach` as interchangeable with any other loop.
          "1": Gives `forEach` a behaviour it does not have — that the `return` skips to the next item and is otherwise fine, that it stops the loop, that it collects what is returned.
          "2": Says `forEach` "does not return anything" without connecting that to the callback's value.
          "3": Says `forEach` ignores what the callback gives back, and is there for side effects.
          "4": As 3, and separates it from the methods whose whole purpose is the value the callback returns.
      - dimension: Writes it the way that says what it means
        description: "`filter` for every match, `find` for the first — chosen, rather than the first thing that works."
        weight: 30
        levels:
          "0": No working alternative.
          "1": A change that does not fix it — moving the inner `return` elsewhere in the callback, or capturing what `jobs.forEach(...)` gives back, which is `undefined`. A correct method named in passing is not the fix they proposed.
          "2": Gets a correct result the long way — a variable, a loop and a `push` — or names `filter` without being able to say what it gives back.
          "3": Uses `filter`, and says it gives back a new array of the items that passed.
          "4": As 3, and says what they would use if only the first open job were wanted, and why that is a different question.

  - slug: network-failure-handling
    name: Handling a network that fails
    criteria:
      - dimension: Covers the states a screen needs
        description: Loading, empty, error and data — with empty treated as normal, not as an error.
        weight: 35
        levels:
          "0": Only the success case.
          "1": Success and a spinner.
          "2": Three of the four states, or all four with empty and error run together — whether they are merged by omission or an empty list is argued to be an error.
          "3": All four states, with empty and error clearly different.
          "4": All four, plus what the user can do from the error state (retry, go back, contact support).
      - dimension: Handles HTTP errors correctly
        description: >-
          Knows that `fetch` resolves for a 404 or a 500 and that the status must be checked — the
          single most common mistake in this area.
        weight: 40
        levels:
          "0": No error handling at all.
          "1": Relies on the request rejecting — a `try`/`catch` only, or the claim that `fetch` throws on a 404 or a 500.
          "2": Checks the status, but treats every failure the same way.
          "3": Checks `response.ok`, and separates "the request failed" from "the server said no".
          "4": As 3, and distinguishes statuses that deserve different handling (401 vs 404 vs 500).
      - dimension: Thinks about a bad connection
        description: Timeouts, a request that never returns, retries, and what is safe to retry.
        weight: 25
        levels:
          "0": Assumes the request either succeeds or fails promptly.
          "1": Mentions slow networks with no mechanism — or names one the platform does not have, such as a timeout `fetch` applies on its own.
          "2": Suggests a timeout or a retry, without saying how or when.
          "3": Gives the request a deadline (e.g. `AbortController`) and retries deliberately.
          "4": As 3, and notes that retrying a non-idempotent request can repeat a side effect.

  - slug: state-placement-reasoning
    name: Deciding where state lives
    criteria:
      - dimension: Chooses a defensible home for the state
        description: Local, lifted to the nearest common parent, in the URL, or in a server cache — and why.
        weight: 40
        levels:
          "0": No decision, or "put it in a global store" with no reasoning.
          "1": Picks a place but cannot say why that one.
          "2": Lifts higher than necessary, or reaches for a global store first — including a case for the store built on a claim about re-renders that this tree does not support.
          "3": Lifts to the nearest component that needs it, and says why there.
          "4": As 3, and recognises the kind of state it is (server data, UI state, or a URL concern).
      - dimension: Avoids duplicating the same fact
        description: Derives what can be derived; does not keep two copies that have to be kept in step.
        weight: 30
        levels:
          "0": Copies the same value into several places — without noticing, or defending it as an optimisation.
          "1": Notices the duplication only when prompted.
          "2": Avoids duplication in the example but cannot generalise the rule.
          "3": States the rule — one source of truth, derive the rest during render.
          "4": As 3, with an example of what goes wrong when it is broken (values drifting apart).
      - dimension: Names the cost of the choice
        description: Prop drilling, re-renders, a store that outlives the screen — no choice is free.
        weight: 30
        levels:
          "0": Presents the choice as obviously correct with no trade-off.
          "1": Acknowledges a trade-off and names the wrong one — an extra file, some boilerplate — rather than what this choice actually costs.
          "2": Names one cost in passing.
          "3": Names the real cost of their choice and when it would push them to a different one.
          "4": As 3, and gives the signal they would watch for to change the decision later.

  - slug: effect-diagnosis
    name: Diagnosing an unnecessary effect
    criteria:
      - dimension: Identifies what is wrong
        description: That the value is derived and does not need to be state, or that the effect duplicates a render.
        weight: 40
        levels:
          "0": Sees nothing wrong.
          "1": Locates the problem somewhere else — the dependency array, a render loop — whatever else is said about it.
          "2": Identifies the effect as suspicious but explains it as a style preference.
          "3": Says that the value can be computed during render, so it is not state.
          "4": "As 3, and states the rule: effects are for synchronising with things outside React."
      - dimension: Explains the consequence
        description: An extra render, a frame of stale UI, and a second place for the value to go wrong.
        weight: 30
        levels:
          "0": No consequence given.
          "1": A consequence that does not follow — "it is slower" with nothing behind it, or an account of a runaway loop this code does not have.
          "2": Mentions an extra render without saying why it happens.
          "3": Explains that the effect runs after render, so the user briefly sees the old value.
          "4": As 3, and notes that the state can now disagree with the props it came from.
      - dimension: Proposes the simpler version
        description: Removes the state and the effect, computing the value where it is used.
        weight: 30
        levels:
          "0": No alternative offered.
          "1": Keeps the state and the effect and adds machinery around them — a new dependency array, a memo, an equality guard.
          "2": Removes the effect but keeps the redundant state.
          "3": Computes during render; the state and the effect both disappear.
          "4": As 3, and says what they would do if the calculation really were expensive — measure it first, rather than assume.

  - slug: responsive-layout-diagnosis
    name: Diagnosing a layout that breaks on a phone
    criteria:
      - dimension: Finds the cause methodically
        description: >-
          Narrows down to the element that is too wide rather than guessing at fixes — for example
          by using the inspector, or by bisecting the page.
        weight: 40
        levels:
          "0": Starts changing CSS at random.
          "1": Applies a fix to a cause they never confirmed, however specific the hunch — searching the stylesheet for one suspect property rather than reproducing the overflow.
          "2": Uses the inspector but stops at the first element that looks wrong.
          "3": Identifies the specific element that exceeds the viewport and says how they found it.
          "4": As 3, with a repeatable method (device toolbar at 360px, then narrowing down the subtree).
      - dimension: Knows the usual suspects
        description: Fixed widths, long unbroken strings, wide tables and images, negative margins, `100vw` with a scrollbar.
        weight: 30
        levels:
          "0": No candidate causes.
          "1": One cause, stated as the usual answer — including `100vw` beside a scrollbar, which is not what happens on a phone.
          "2": Two or three causes, unsorted.
          "3": Several plausible causes, with a reason for checking one first.
          "4": "As 3, including a cause that is easy to miss (overflowing text, or a `min-width: auto` flex item)."
      - dimension: Fixes without breaking wider screens
        description: A fix that holds from 360px upward, rather than a media query patching one width.
        weight: 30
        levels:
          "0": No fix, or one that would break other sizes.
          "1": "Hides the symptom (`overflow-x: hidden` on the page) without addressing the cause — including when it is offered as standard practice."
          "2": A media query for small screens only.
          "3": "A fix that works at every width (fluid sizing, wrapping, `max-width: 100%`)."
          "4": As 3, and says how they would check it stays fixed — a test or a screenshot at 360px.

  - slug: performance-investigation
    name: Investigating a slow page
    criteria:
      - dimension: Measures before changing
        description: Reproduces the complaint under the user's conditions rather than reasoning from the laptop.
        weight: 40
        levels:
          "0": Starts optimising immediately.
          "1": Says "I would profile it" with no method.
          "2": Measures on their own machine and stops — a tool opened, or a score taken as proof — without reproducing the user's conditions.
          "3": Reproduces under the user's conditions — throttling, or a real mid-range phone on mobile data — and records a load.
          "4": As 3, and gathers what the report is missing first — device, page, whether it is every visit.
      - dimension: Separates network from CPU
        description: >-
          Knows that bytes and main-thread time are different budgets that fail differently, and
          works out which one this is.
        weight: 30
        levels:
          "0": Treats "slow" as one undifferentiated thing.
          "1": Settles on one of the two without checking — usually the network, sometimes argued as a rule that it is always the network.
          "2": Mentions both but does not say how to tell them apart.
          "3": Reads the waterfall and the main thread and says which dominates here.
          "4": As 3, and knows a mid-range phone's CPU is often the binding constraint, not bandwidth.
      - dimension: Chooses a proportionate change
        description: The fix follows from the measurement, and its effect is checked.
        weight: 30
        levels:
          "0": No change proposed, or a rewrite.
          "1": General best practices unrelated to the finding, often shipped together — plausible changes, none of them chosen by the measurement.
          "2": A reasonable change, but not clearly the one the measurement pointed to.
          "3": A change that addresses the dominant cost, then re-measures.
          "4": As 3, and weighs effort against benefit, naming what they would not bother with.

  # -----------------------------------------------------------------------------------------------
  # Added 2026-09-22 (the catalogue question-bank pass), one per new question. Same house style:
  # three criteria, weights adding to 100, five descriptors that two readers would land on
  # identically. Level 4 always contains a *thing* level 3 does not — never the same answer said
  # better.

  - slug: reference-semantics-understanding
    name: Understanding references and copying
    criteria:
      - dimension: Locates the cause
        description: That the array holds objects, that the function received the same objects, and that it wrote to them.
        weight: 40
        levels:
          "0": Does not identify what changed the caller's data.
          "1": Blames the loop, the framework or the caller rather than the assignment — including an account of how the loop binding is at fault.
          "2": Says the array was "passed by reference" without saying what that means for the items inside it.
          "3": Says the function is writing to the same objects the caller holds, and points at the assignment.
          "4": As 3, and separates the array from the objects in it — copying the array alone would not have helped.
      - dimension: Knows what `const` does
        description: That it fixes the binding, not the contents — the single most common misreading here.
        weight: 20
        levels:
          "0": Not addressed.
          "1": Gets `const` wrong — that it should have prevented the change, or that it is a live binding into the caller's memory.
          "2": Says `const` is "about reassignment" without applying it to this code.
          "3": States that `const` stops `cart` being pointed elsewhere and nothing else.
          "4": As 3, and names what would actually prevent the change instead.
      - dimension: Fixes it without breaking the caller
        description: Returns new data rather than editing what was passed in, and says why that is the better default.
        weight: 40
        levels:
          "0": No fix, or one that still writes to the caller's objects.
          "1": Copies the array only, so the objects are still shared — including when the spread is described as a deep copy.
          "2": Produces new objects but by a route that would break on nested data, without noticing.
          "3": Builds and returns new items, leaving the input untouched.
          "4": As 3, and says when editing in place is legitimate — and that the name should then say so.

  - slug: derived-state-reasoning
    name: Deciding what is state and what is derived
    criteria:
      - dimension: Separates the one fact from the rest
        description: Recognises that the selection is the state and the count and total follow from it.
        weight: 45
        levels:
          "0": Treats all three as things to store, with no distinction between them.
          "1": Keeps all three — seeing no problem, or diagnosing something else entirely, such as a stale closure, and leaving the three in place.
          "2": Senses that the count is redundant but keeps it "to avoid recalculating".
          "3": Holds the selection alone and calculates the count and total where they are shown.
          "4": As 3, and generalises — anything filtered, sorted or summed from data already held is derived.
      - dimension: Says what goes wrong otherwise
        description: Three copies of one fact can disagree, and the failure looks like a display bug.
        weight: 30
        levels:
          "0": No downside offered — the duplication is never identified as the problem, so nothing is said to follow from it.
          "1": Says it is "bad practice" with nothing behind it.
          "2": Says the values "could get out of sync" without a route by which they would.
          "3": Describes a concrete path to disagreement — a change that updates two of the three.
          "4": As 3, and notes that the bug shows up far from its cause, so it is expensive to find.
      - dimension: Weighs the cost of recalculating
        description: Whether doing the work on every render matters here, and how they would find out.
        weight: 25
        levels:
          "0": Does not consider it, or rejects deriving because it "would be slow".
          "1": Asserts one of the two options is faster with no basis.
          "2": Mentions memoising as something to reach for, before knowing whether it is needed.
          "3": Says the work is small for a cart-sized list and would only be optimised if measured.
          "4": As 3, and names what would change the answer — list size, or the cost per item.

  - slug: url-state-reasoning
    name: Deciding what belongs in the URL
    criteria:
      - dimension: Explains the symptom
        description: That the filter lives only in the page's memory, so the link carries nothing about it.
        weight: 30
        levels:
          "0": Puts the cause outside the page — sharing, the browser, a cache, the server — however specifically it is argued.
          "1": Says the filter "was not saved" without saying where it lived.
          "2": Identifies that the state is in the page, but not why the link is therefore incomplete.
          "3": Says the address never changed, so the friend's page starts from its defaults.
          "4": As 3, and predicts the same failure on reload and on the back button.
      - dimension: Puts it in the address
        description: The filter becomes part of the URL, and the page reads its starting state from there.
        weight: 40
        levels:
          "0": No change proposed, or one that does not make the link carry the filter.
          "1": Suggests saving the filter locally on the user's device, which does not travel.
          "2": Says "put it in the URL" without saying how the page would then start from it.
          "3": Describes both halves — writing the filter to the query string and reading it on load.
          "4": As 3, and keeps the address in step as the filter changes, without adding a history entry per keystroke.
      - dimension: Knows what does not belong there
        description: Ephemeral interface state — an open menu, an unsent draft — is not a URL concern.
        weight: 30
        levels:
          "0": Would put everything in the URL, or nothing.
          "1": Gives no principle for deciding.
          "2": Offers a rule of thumb that does not survive an example.
          "3": Draws the line at what someone else opening the link should see.
          "4": As 3, with an example on each side of the line.

  - slug: layout-tool-choice
    name: Reading what a breakpoint-per-size layout costs
    criteria:
      - dimension: Says what is actually wrong with it
        description: >-
          It describes four screen widths rather than what the cards need, so every width the file
          does not list is a guess — not "too many media queries" as a matter of taste.
        weight: 40
        levels:
          "0": Sees nothing wrong; the CSS works, so it is fine.
          "1": Objects to the number of media queries without saying what goes wrong because of them.
          "2": Says it is hard to maintain — magic numbers, drift, or an invented cost such as media queries forcing layout on resize — without connecting it to the widths in between.
          "3": Says the rules describe devices rather than content, so any width not listed is unhandled.
          "4": As 3, and points out that changing the card itself means revisiting all four numbers.
      - dimension: Lets the layout decide for itself
        description: The number of cards per row follows from the space available and a minimum card width.
        weight: 35
        levels:
          "0": No alternative, or more breakpoints.
          "1": Rearranges the same breakpoints — new units, variables, or one more for a size that was missing — leaving the model untouched.
          "2": Knows the grid can do it but cannot say what it would be told.
          "3": Gives the grid a minimum card width and lets it fit as many as will go.
          "4": As 3, and keeps breakpoints for where the design genuinely changes shape rather than removing them all.
      - dimension: Starts narrow
        description: Building up from the small screen rather than patching a wide layout down.
        weight: 25
        levels:
          "0": Never reaches the narrow end — designs for a laptop, or answers about something else, such as zoom or the design system.
          "1": Mentions mobile as something to check at the end.
          "2": Says "mobile-first" without it affecting the described approach.
          "3": Describes checking at the narrow width first and adding rules as space appears.
          "4": As 3, and names what they would give up by starting narrow — a desktop layout that has to be added rather than assumed.

  - slug: resilient-layout-reasoning
    name: Building for content you do not control
    criteria:
      - dimension: Predicts what breaks
        description: Names the specific failures — overflow from an unbroken string, uneven heights, a missing image.
        weight: 40
        levels:
          "0": Expects nothing to break, or answers about the data instead of the layout.
          "1": Names no failure — "it might look bad", or straight to a fix, with nothing said about what goes wrong.
          "2": Names one failure, usually the long title.
          "3": Names several, including one caused by something missing rather than something long.
          "4": As 3, and separates failures that are ugly from failures that break the page, such as sideways scrolling.
      - dimension: Builds so it holds
        description: Wrapping, space reserved for what may not arrive, and sizes the content can flow inside.
        weight: 35
        levels:
          "0": No technique, or fixed sizes that assume the sample data — including a specific set of them that would clip the content instead.
          "1": Would fix each case as it is reported.
          "2": One technique, applied narrowly.
          "3": Allows long text to wrap or break, reserves space for the image, and lets card heights agree.
          "4": As 3, and prefers a limit the content flows inside to a fixed size that hides it.
      - dimension: Tests with real content
        description: Deliberately trying the worst content available rather than the sample you built against.
        weight: 25
        levels:
          "0": Nothing left to test — the sample data is assumed representative, or the geometry is treated as a guarantee.
          "1": Would wait for a bug report.
          "2":
            Says they would "test with different data" without saying which.
            # Level 3 is the working habit; level 4 is the habit made routine.
          "3": Describes trying the longest, the shortest and the missing, before it ships.
          "4": As 3, and names a case where their own approach would be the wrong call — where truncating hides something the user needed.

  - slug: image-delivery-judgement
    name: Delivering images to a phone on mobile data
    criteria:
      - dimension: Measures before changing
        description: Finding out what is actually being sent, in bytes, rather than reasoning from how it looks.
        weight: 30
        levels:
          "0": Starts changing things without knowing the sizes — including an explicit case for not measuring, because the cause is already obvious.
          "1": Says the images are "too big" with nothing measured.
          "2": Would look in the browser tools without saying what for.
          "3": Reads the transferred size of each image and the total weight of the page.
          "4": As 3, and checks it under a realistic connection rather than the one they happen to develop on.
      - dimension: Sends less
        description: Right-sized images, a sensible format, and loading later what is not yet on screen.
        weight: 45
        levels:
          "0": No technique, or only "compress them".
          "1": One technique applied to all six regardless — or several that do not address this complaint at all, such as compression that does little to a photograph, caching that helps only the second visit, or deferring the image at the top.
          "2": Two techniques, without saying which would save the most here.
          "3": Serves a size suited to the device, a modern format, and defers what is below the fold.
          "4": As 3, and reserves the space so deferring does not make the page jump as it loads.
      - dimension: Knows which part is a conversation
        description: >-
          That six large photographs may be a product decision rather than a delivery problem — and
          what evidence would let whoever asked for them decide. Scored on the evidence, not on
          whether the candidate has ever been in a position to push back.
        weight: 25
        levels:
          "0": Treats it purely as a technical task.
          "1": Says the request was unreasonable, with nothing to put in front of anyone.
          "2": Mentions talking to whoever asked, without saying what they would show them.
          "3": Can say what they would put in front of them — the cost in data per image — and what decision it would let them make.
          "4": As 3, and has done the technical work first, so the conversation is only about what is left.

  - slug: safe-retry-reasoning
    name: Retrying without repeating the action
    criteria:
      - dimension: Reads the timeout correctly
        description: That a timeout says nothing about whether the server acted — the commonest wrong assumption here.
        weight: 35
        levels:
          "0": Assumes a timeout means the payment did not happen — plainly, or from an account of what the connection did.
          "1": Says the request "failed" and moves on to retrying it.
          "2": Notices the uncertainty when prompted but does not build for it.
          "3": Says that the charge may have gone through and that the client has no way to know.
          "4": As 3, and separates a connection that never reached the server from a response that was lost.
      - dimension: Stops the second tap being the obvious move
        description: What the interface does while the request is in flight, and after it times out.
        weight: 30
        levels:
          "0": Leaves the button live and says nothing to the user.
          "1": Addresses the tap and not the uncertainty — a spinner, or an automatic retry so the user never has to tap twice.
          "2": Disables the button while loading, with no answer for what happens after the timeout.
          "3": Disables the button, says what is happening, and offers a deliberate next step rather than a retry.
          "4": As 3, and the next step is to check the state — "let me confirm whether it went through".
      - dimension: Makes a repeat safe
        description: Something that identifies the attempt, so a second send can be recognised as the same one.
        weight: 35
        levels:
          "0": No mechanism; relies on the user not tapping twice.
          "1": A mechanism the server never sees — a retry the client decides on its own, or a value kept in the browser that nothing on the server checks.
          "2": Says the server "should handle duplicates" with nothing the client does to help.
          "3": Does not resend blindly — asks the server what the state is first — and separates reads, which are safe to retry, from actions that move money.
          "4": As 3, and sends a value that identifies the attempt, generated before the first send and reused on a retry, so the server can recognise it.

  - slug: cache-invalidation-diagnosis
    name: Finding where a stale value is coming from
    criteria:
      - dimension: Establishes the truth first
        description: Whether the server has the new name at all, before hunting for a cache.
        weight: 40
        levels:
          "0": Starts changing caching — a setting, a header, a service worker — before establishing what the server holds.
          "1": Assumes the save failed, or assumes it succeeded, without checking.
          "2": Would "check the API" without saying what that would tell them.
          "3": Confirms what the server returns for that user before looking anywhere else.
          "4": As 3, and says what each outcome would rule out.
      - dimension: Names more than one place a copy can live
        description: >-
          More than one thing can be holding the old value — the page's own data, the browser's
          cache, a service worker. Naming two and a way to tell them apart is the bar.
        weight: 25
        levels:
          "0": Treats "cache" as one thing with one fix.
          "1": Names one layer and stops.
          "2": Names two, without a way to tell which is responsible.
          "3": Names two or more and a way to tell them apart — a private window, the network panel, what the response headers say.
          "4": As 3, and uses what reloading does and does not clear to narrow the list before testing anything.
      - dimension: Fixes the write, not just the symptom
        description: After a successful save, the held copy is refreshed or replaced rather than left to expire.
        weight: 35
        levels:
          "0": Not addressed — the answer stops at the diagnosis, or proposes a change aimed at a layer that was never holding the value.
          "1": Would disable caching everywhere, or reload the whole page after saving.
          "2": Refetches, but leaves the other layers that could hold the old value.
          "3": Updates or invalidates the copy the page holds as part of the save.
          "4": As 3, and says what the caching headers for that request should have been in the first place.

  - slug: semantic-html-diagnosis
    name: Recognising an element that is pretending
    criteria:
      - dimension: Says who is excluded
        description: Keyboard users and assistive technology, specifically — not "accessibility" as a word.
        weight: 40
        levels:
          "0": Sees nothing wrong.
          "1": Says it is "not accessible" without saying to whom or why.
          "2": Names one group, usually screen-reader users, without the keyboard.
          "3": Says it cannot be focused or activated from the keyboard, and is announced as nothing in particular.
          "4": As 3, and notes who else this reaches — someone using voice control, or a user whose mouse is unreliable.
      - dimension: Fixes it at the root
        description: A real `<button>`, rather than attributes bolted onto the div.
        weight: 35
        levels:
          "0": No fix, or a visual one.
          "1": Adds a click handler for the Enter key and considers it done.
          "2": Adds `role` and `tabindex` to the div without the key handling that then becomes necessary — or with a `tabindex` value that takes it out of the tab order.
          "3": Replaces it with a `<button>`, and says what that brings without extra code.
          "4": As 3, and says when the attribute route is the right one — an element you cannot change.
      - dimension: Separates looks from meaning
        description: That styling was never the reason to avoid a button.
        weight: 25
        levels:
          "0": Not addressed — the answer says nothing about why a div was used or whether it had to be.
          "1": Believes a button could not have been styled this way, or accepts the div because "the design needed it".
          "2": Says a button can be styled, without addressing why the div was chosen.
          "3": States that the element is chosen for what it means and then styled to match the design.
          "4": As 3, and names the one or two resets that make a button look like anything.

  - slug: accessible-error-feedback
    name: Telling every user what went wrong
    criteria:
      - dimension: Puts the message where it is needed
        description: Beside the field that is wrong, not only in a summary at the top of the form.
        weight: 35
        levels:
          "0": Only a general "something went wrong".
          "1": A summary at the top and nothing at the fields — including when inline messages are argued against as noise.
          "2": Messages at the fields, with no way for a non-visual user to reach them.
          "3": A message at each field, tied to that input so it is read out when the field is reached.
          "4": As 3, plus a summary that links to the fields, for a long form.
      - dimension: Does not rely on sight alone
        description: Colour is not the signal; text is, and focus goes somewhere useful.
        weight: 35
        levels:
          "0": Red borders and nothing else.
          "1": Colour plus an icon, with no text.
          "2": Text present, but nothing reliably reaches a non-visual user — focus left where it was, or moved somewhere that is not the problem, or the message put where it may not be announced.
          "3": Text on every error, and focus moved to the first field that needs attention.
          "4": As 3, and the failure is announced rather than silently appearing on screen.
      - dimension: Says how to fix it
        description: The message describes what to do, not that the input is invalid.
        weight: 30
        levels:
          "0": No message, or a code.
          "1": '"Invalid input" or similar, which tells the user nothing.'
          "2": Names the problem without saying what would satisfy it.
          "3": Says what is expected — the format, the length, the missing piece.
          "4": As 3, and keeps what the user typed rather than clearing the field.

  - slug: frontend-test-selection
    name: Choosing what to test on a screen
    criteria:
      - dimension: Tests behaviour, not internals
        description: What a user does and sees, rather than component state or implementation detail.
        weight: 35
        levels:
          "0": No tests, or tests of things the user cannot observe.
          "1": Tests that assert on internal state or on the shape of the markup.
          "2": A mix, without a principle separating them.
          "3": Fills the form, submits, and asserts on what the user would see.
          "4": As 3, and finds elements the way a user does — by label, role or visible text.
      - dimension: Covers the paths nobody clicks
        description: The failure cases, which are the ones manual testing misses.
        weight: 35
        levels:
          "0": Only the successful login.
          "1": Success, plus an empty form — or a reasoned case for leaving the failure paths out.
          "2": Names failure cases without saying what each would assert.
          "3": Covers wrong credentials and a failing request, with the message each should produce.
          "4": As 3, and stubs the network so the test is about this screen rather than about the server.
      - dimension: Says what they would not test
        description: Styling, framework behaviour, and anything whose test would only restate the code.
        weight: 30
        levels:
          "0": Would test everything, or gives no view.
          "1": No usable line — "test everything important" with no example, or a principle that would exclude most of what is worth testing.
          "2": Excludes something without a reason that would generalise.
          "3": Names what they would leave out and why it is not worth the maintenance.
          "4": As 3, and prefers a few tests that would catch a regression to many that assert the obvious.

  - slug: test-brittleness-diagnosis
    name: Diagnosing tests that break for the wrong reason
    criteria:
      - dimension: Identifies what the tests are coupled to
        description: Class names and structure — the things a refactor changes without changing behaviour.
        weight: 40
        levels:
          "0": Concludes the refactor was wrong — including the argued version, that the markup is a contract and the tests were right to hold it to one.
          "1": Says the tests are "brittle" without saying what they depend on.
          "2": Identifies the selectors as the problem but treats it as a naming issue.
          "3": Says the tests assert on structure and styling rather than on what the screen does.
          "4": As 3, and distinguishes these eleven failures from a failure that would have been real.
      - dimension: Knows what it costs
        description: A suite that cries wolf stops being read, which is worse than having no suite.
        weight: 25
        levels:
          "0": Sees no cost — an inconvenience, or the safety net doing its job.
          "1": Says it "wastes time" and nothing more.
          "2": Mentions that people start ignoring failures.
          "3": Says the team loses trust in the suite and begins skipping or deleting tests.
          "4": As 3, and notes that the refactor itself gets avoided next time, which is the real cost.
      - dimension: Fixes the tests, not the code
        description: Rewriting the selectors rather than reverting a change that was an improvement.
        weight: 35
        levels:
          "0": Reverts the rename, deletes the tests, or tightens the coupling further — snapshots of the tree, or the class names centralised so they are quicker to update.
          "1": Updates the class names in all eleven tests and moves on.
          "2": Rewrites some selectors without a rule for the rest.
          "3": Selects by role, label or visible text, so the next refactor does not break them.
          "4": As 3, and names a change to this screen that *should* break a test, so the fix is not "make the tests never fail".

  - slug: production-error-investigation
    name: Investigating an error only real users see
    criteria:
      - dimension: Makes the trace readable
        description: That minified line numbers mean nothing without source maps.
        weight: 30
        levels:
          "0": Reads the minified trace as if it named real code.
          "1": Sets the trace aside — as useless, or as able only to confirm a cause already decided.
          "2": Knows the code is minified without naming what would undo it.
          "3": Says source maps are needed and that the reporting tool can map the trace back.
          "4": As 3, and notes that the maps must match the deployed build, not the current one.
      - dimension: Uses the rest of the report
        description: >-
          The fields listed beside the trace — page, browser, device, users, first seen. The
          candidate does not need to have used such a tool; the fields are on screen.
        weight: 45
        levels:
          "0": Works from the message alone.
          "1": Mentions that there is other data without using it.
          "2": Looks at one field, usually the browser, and stops — for want of a next step, or because it already agrees with a theory.
          "3": Groups the occurrences — which page, which devices, how many distinct users, since when.
          "4": As 3, and puts forty a day against total sessions before deciding how urgent it is.
      - dimension: Fixes the cause, not the symptom
        description: A missing property means data that was assumed to be there was not.
        weight: 25
        levels:
          "0": No fix proposed.
          "1": Ships a fix the report does not support — a guard on the line, or a build setting — and considers it closed.
          "2": Guards the value and says the data "must be bad" without pursuing it.
          "3": Guards the immediate case and traces why the data was missing — an empty or failed response.
          "4": As 3, and says what would tell them the fix did not work — the rate not moving, or moving for one browser only.

  # Rubrics for the stack-tagged questions.

  - slug: list-identity-diagnosis
    name: Diagnosing a list that mixes up its rows
    criteria:
      - dimension: Connects the key to the symptom
        description: That an index key changes meaning when the list changes, so the wrong row is reused.
        weight: 40
        levels:
          "0": Blames the data, the API or the tester.
          "1": Treats the key as beside the point — the rule against index keys quoted with no account of this bug, or an argument that keys are only a hint and cannot be the cause.
          "2": Identifies the key as the problem but explains it as a warning to be silenced.
          "3": Says removing an item shifts every index, so a row's key now points at different data.
          "4": As 3, and explains that the reused component keeps the state it already had, which is the note.
      - dimension: Knows where the wrong value was living
        description: That the note is state inside the row component, not a field on the application.
        weight: 30
        levels:
          "0": Assumes the note was saved against the wrong record.
          "1": Looks for the bug in the parent's data.
          "2": Locates the state only loosely — "it got confused" — or locates it correctly and then denies the key has anything to do with which row keeps it.
          "3": Says the note is the child's own state and React kept it when it reused the child.
          "4": As 3, and notes that nothing in the data was ever wrong, which is why it looks so strange.
      - dimension: Fixes it and knows the boundary
        description: A key from the item itself, and an honest account of when an index is acceptable.
        weight: 30
        levels:
          "0": No fix, or one that does not change the key.
          "1": Adds a unique value generated during render, which changes every time.
          "2": Uses the id, with no sense of why the index ever worked.
          "3": Uses the application's id, and says it must be stable and unique among siblings.
          "4": As 3, and says an index is only safe for a list that never reorders, filters or removes.

  - slug: client-boundary-reasoning
    name: Deciding what has to run in the browser
    criteria:
      - dimension: Knows what the directive does
        description: That it applies to everything beneath it, not only to the file it is written in.
        weight: 35
        levels:
          "0": Treats it as a per-file setting with no wider effect — unexamined, or asserted as the point of the directive.
          "1": Names no real cost — "it makes the page interactive", or a specific cost that is a side effect, alongside a claim that little more is shipped.
          "2": Knows it affects children without saying what the effect is.
          "3": Says everything imported below becomes client code and ships to the browser.
          "4": As 3, and separates what is rendered on the server once from what must be sent to run again.
      - dimension: Names the cost
        description: More JavaScript on a phone, and server rendering given up for the whole page.
        weight: 35
        levels:
          "0": Sees no cost.
          "1": Says it is "less efficient" with nothing behind it.
          "2": Names bundle size alone.
          "3": Names the extra JavaScript and the loss of server rendering for the list.
          "4": As 3, and ties it to this audience — a mid-range phone parsing a larger bundle on mobile data.
      - dimension: Moves the boundary rather than the page
        description: Only the interactive part becomes a client component; the page stays on the server.
        weight: 30
        levels:
          "0": Keeps the directive on the page — removing the button, or moving the data fetching into the browser instead.
          "1": Suggests splitting the file without saying where the line goes.
          "2": Moves some code but leaves the data fetching in the browser.
          "3": Makes the filter panel the client component and leaves the page and its data on the server.
          "4": As 3, and says how far down the tree the boundary should go as a general habit.

  - slug: secret-exposure-diagnosis
    name: Recognising a secret that ships to the browser
    criteria:
      - dimension: Sees that the key is public
        description: The prefix puts the value in the bundle, and the client request carries it in a header.
        weight: 40
        levels:
          "0": Sees nothing wrong.
          "1": Believes the value stays on the server — because environment variables do, or because the prefix is taken to mean exactly that.
          "2": Knows the prefix means something without saying what.
          "3": Says the prefix inlines the value into the browser bundle, so the key is public.
          "4": As 3, and adds that the request itself exposes it in the network tab regardless of the bundle.
      - dimension: Moves the call
        description: The request belongs on the server, with the key kept out of anything the browser receives.
        weight: 30
        levels:
          "0": No change, or only renaming the variable.
          "1": Moves the value rather than the call — dropping the prefix, or putting it elsewhere in the build — and leaves the request in the browser.
          "2": Says "call it from the server" without saying what the browser then talks to.
          "3": Puts the call in a server component or a route handler and has the client call that.
          "4": As 3, and keeps the response shape the client needs, rather than proxying the provider wholesale.
      - dimension: Treats a leaked key as leaked
        description: Rotating it, and finding out whether it was used, rather than quietly removing it.
        weight: 30
        levels:
          "0": Does not treat the key as out — not considered, or argued to be safe because it was never committed anywhere public.
          "1": Removes it from the code and considers the matter closed.
          "2": Says it "should probably be rotated" with no follow-through.
          "3": Rotates the key, and checks the provider's usage for calls that were not ours.
          "4": As 3, and checks the deployed bundles and the history for how long it was exposed.

  - slug: vue-reactivity-diagnosis
    name: Diagnosing a value that stopped being reactive
    criteria:
      - dimension: Locates the break
        description: That destructuring copied the number out of the reactive object.
        weight: 45
        levels:
          "0": Blames the click handler or the template syntax.
          "1": Puts the break somewhere else — reactivity "not working" with no mechanism, or a named mechanism that rules the destructuring out.
          "2": Suspects the destructuring but describes it as a style problem.
          "3": Says the destructured value is a plain number, so nothing links it to later changes.
          "4": As 3, and confirms the object is still updating — only the template's copy is stale.
      - dimension: Fixes it
        description: Keep the reference, or convert the properties so they stay connected.
        weight: 30
        levels:
          "0": No fix, or one that would not restore reactivity.
          "1": A change the bug survives — forcing a re-render by hand, or swapping the container while still copying the value out of it.
          "2": Removes the destructuring without being able to say why that works.
          "3": Uses the object in the template, or converts its properties to refs before destructuring.
          "4": As 3, and says which they would choose here and why.
      - dimension: Generalises the rule
        description: Reactivity belongs to the container, not to the value taken out of it.
        weight: 25
        levels:
          "0": Treats it as a one-off quirk.
          "1": States a rule that does not cover this case — a restatement of the fix, or a choice between `ref` and `reactive` that leaves the copying untouched.
          "2": Gives a rule that covers this case but not a ref.
          "3": States that copying a value out of any reactive container loses the connection.
          "4": As 3, and applies it to a second case — a prop, or a value passed into a function.

  - slug: derived-list-diagnosis
    name: Diagnosing a stored list that drifts from its source
    criteria:
      - dimension: Finds why it goes stale
        description: The visible list is only rebuilt when the term changes, so a reload leaves it behind.
        weight: 40
        levels:
          "0": Blames the filter logic, the API or the user.
          "1": Says the list is "not reactive" without saying what it fails to react to.
          "2": Identifies the watcher as involved but not what it fails to watch — including blaming its options, which do not add a second source.
          "3": Says the list is rebuilt only on a change of term, so new jobs do not reach it until the next keystroke.
          "4": As 3, and says the symptom itself points there — typing another letter is what fixes it.
      - dimension: Recognises it as derived
        description: The filtered list follows from the jobs and the term, so it should not be stored at all.
        weight: 35
        levels:
          "0": Keeps the stored list and adds a second watcher for the jobs.
          "1": Keeps the stored list — adding the jobs to the existing watcher, or arguing against a computed value on grounds that were never measured.
          "2": Says it "could be computed" without saying what that changes.
          "3": Makes it a computed value that depends on both, so there is one list rather than two.
          "4": As 3, and says why that removes the whole class of bug rather than this instance of it.
      - dimension: Knows what a watcher is still for
        description: Something that has to happen when a value changes, as opposed to a value that follows from one.
        weight: 25
        levels:
          "0": Concludes watchers should not be used.
          "1": States a rule that is a restatement of the fix.
          "2": Says watchers are for side effects without an example.
          "3": Gives an example that has to happen rather than be shown — analytics, saving a draft, a request.
          "4": As 3, and separates it from the filtered list by asking whether anything outside the component has to change.

  - slug: subscription-lifetime-diagnosis
    name: Diagnosing work that outlives its component
    criteria:
      - dimension: Connects the leak to both symptoms
        description: Growing memory and stale results are the same cause — subscriptions that never ended.
        weight: 40
        levels:
          "0": Treats the slowdown and the wrong results as unrelated.
          "1": Blames something else — the service, the server, the router — or argues that the subscriptions end on their own.
          "2": Identifies the subscription as suspicious without explaining either symptom.
          "3": Says each visit adds a subscription that is never ended, and all of them still respond.
          "4": As 3, and explains why the component cannot be collected while something holds it.
      - dimension: Ends the work with the component
        description: Any fix that ties the subscription's lifetime to the component's.
        weight: 35
        levels:
          "0": No fix — a cleanup that runs at the wrong time, or a rearrangement of the code that still leaves nothing ending the subscriptions.
          "1": Suggests a page reload or a cache clear.
          "2": Says it should be unsubscribed without saying when.
          "3": Ties it to the component's destruction, or lets the template own the subscription instead.
          "4": As 3, and prefers the approach that cannot be forgotten on the next component someone writes.
      - dimension: Generalises
        description: Anything started in a component — subscription, timer, listener — is ended with it.
        weight: 25
        levels:
          "0": Draws no rule about lifetime — treats it as specific to this service, or generalises about something else, such as routing.
          "1": States a rule about this one pattern.
          "2": Generalises to subscriptions only.
          "3": Names timers and listeners as the same class of problem.
          "4": As 3, and says how they would catch it in review rather than in production.

  - slug: change-detection-diagnosis
    name: Diagnosing a view that did not re-render
    criteria:
      - dimension: Checks the premise first
        description: That the property on the component really changed, rather than trusting a console line.
        weight: 25
        levels:
          "0": Starts changing configuration.
          "1": Assumes the data is fine because the console shows it.
          "2": Would "add a log" without saying where.
          "3": Confirms the bound property itself holds the new value at the time of the render.
          "4": As 3, and says what each outcome rules out before going further.
      - dimension: Knows why a change can go unnoticed
        description: >-
          Angular re-renders on a short list of notifications; an assignment to a plain field is not
          on it, and neither is an object changed in place, whose reference never differs.
        weight: 45
        levels:
          "0": Treats re-rendering as automatic and unconditional.
          "1": Says "change detection did not run" with no cause.
          "2": Names a cause that does not fit this code, and presents it as the only one.
          "3": Names the shape that applies here — the array was changed in place, so the reference a child compares against never differed.
          "4": As 3, and separates it from the other way a change goes unnoticed — nothing told Angular that anything had happened at all.
      - dimension: Fixes it without papering over it
        description: Replace the value rather than editing it, and treat a forced refresh as a smell.
        weight: 30
        levels:
          "0": Forces a refresh and stops.
          "1": Forces a refresh with no alternative — acknowledged as not ideal, or aimed at a cause this code does not have.
          "2": Replaces the value in this case without a general rule.
          "3": Assigns a new value so the change is visible, and explains why that is enough.
          "4": As 3, and says that needing to force a check usually means the real cause is still there.

  - slug: event-binding-diagnosis
    name: Diagnosing handlers that missed the new elements
    criteria:
      - dimension: Explains why the new buttons are dead
        description: The handlers were attached once, to the elements present at that moment.
        weight: 40
        levels:
          "0": Blames the loading code or the markup of the new rows.
          "1": Says the listeners "did not apply" without saying why.
          "2": Identifies that the code ran once, without connecting it to the missing handlers — including an account that makes the stale collection, rather than the absent listener, the fault.
          "3": Says the selector matched only the buttons that existed then, so later ones were never given a listener.
          "4": As 3, and predicts the same failure for anything else added to the page after load.
      - dimension: Fixes it at the container
        description: One listener on an ancestor that is always present, acting on what was clicked.
        weight: 35
        levels:
          "0": No fix, or one that would not cover future items — a different way of finding the buttons is not a way of giving them a listener.
          "1": Re-runs the same loop after each load, and does not notice the duplicate listeners that follow.
          "2": Describes delegation without saying how the clicked button is identified.
          "3": Listens on a container and checks what was clicked before acting.
          "4": As 3, and says the container must exist for the life of the page for this to hold.
      - dimension: Says why that works
        description: That a click travels up through the ancestors, so a parent can hear it.
        weight: 25
        levels:
          "0": Cannot say why.
          "1": Offers no mechanism for the fix — "that is just how it is done", or a true mechanism that explains something else.
          "2": Uses the word bubbling with no description of it.
          "3": Describes the event travelling up from the element that was clicked.
          "4": As 3, and names a case where it does not help — an event that does not travel that way.

  - slug: progressive-enhancement-reasoning
    name: Building for the seconds before the script arrives
    criteria:
      - dimension: Understands the window
        description: That there is a period where the page is visible and its script is not there yet.
        weight: 35
        levels:
          "0": Treats the report as a bug in the handler.
          "1": Says the connection is "just slow" with nothing to do about it.
          "2": Acknowledges the gap without saying what the user sees during it — including naming it and then setting it aside as a matter of perceived speed.
          "3": Says the form is on screen and looks ready while nothing is listening to it.
          "4": As 3, and adds that the same state is permanent for a user whose script fails to load.
      - dimension: Makes the baseline work
        description: The form submits on its own, and the script improves it rather than enabling it.
        weight: 40
        levels:
          "0": Keeps the script as the only way to submit — including when something else is claimed to cover the gap, such as the browser replaying the click once it loads.
          "1": Adds a spinner or a message and leaves the behaviour unchanged.
          "2": Says the form "should work without JavaScript" without saying what that requires.
          "3": Gives the form a real action so a submission works before the script arrives, then enhances it.
          "4": As 3, and keeps the two paths consistent, so the enhanced version does not behave differently.
      - dimension: Does not show a control that is not ready
        description: If the button cannot work yet, it does not look as though it can.
        weight: 25
        levels:
          "0": Leaves the button live and unexplained.
          "1": Would add a global loading overlay over everything.
          "2": Disables the button with no plan for enabling it.
          "3": Starts the control disabled and enables it when the code that handles it is present.
          "4": As 3, and pairs it with getting that code to the browser sooner rather than later.

  - slug: dom-as-state-diagnosis
    name: Recognising the page being used as the data
    criteria:
      - dimension: Says what breaks first
        description: That rebuilding the markup throws away everything in it, and the data only exists as text.
        weight: 40
        levels:
          "0": Sees nothing wrong; the code works.
          "1": Says it is "not scalable" without naming a failure.
          "2": Objects to `innerHTML` without saying what it destroys — on style grounds, or on a performance argument.
          "3": Says rewriting `innerHTML` rebuilds every row, so anything the user had in one is lost.
          "4": As 3, and adds what else goes with it — listeners, focus, scroll position.
      - dimension: Recognises the page as the store
        description: The cart's contents exist only as list items, and the total is gathered back off the screen.
        weight: 35
        levels:
          "0": Treats the DOM as a reasonable place to keep the data — unexamined, or defended as keeping the cart in one place.
          "1": Says the code is "messy" without locating where the data lives.
          "2": Notices the total is read from the page, without generalising.
          "3": Says the page is being used as the store, and that reading numbers back out of text is the symptom.
          "4": As 3, and notes that formatting and arithmetic are now entangled — a currency symbol would break the sum.
      - dimension: Restructures it
        description: Hold the items, draw the page from them, derive the total.
        weight: 25
        levels:
          "0": No alternative, or the same approach written more carefully.
          "1": Keeps the DOM as the store and holds the total beside it — in a variable, or in an attribute on the markup.
          "2": Keeps an array but still reads the total off the page.
          "3": Keeps the items in an array, redraws from it, and derives the total from the array.
          "4": As 3, and redraws only what changed rather than the whole list, without reaching for a framework to do it.
